<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="學士後中醫入學考國文：每天早晚兩段，字音字形、字詞、國學常識與閱讀題組，錯題自動複習。">
<meta name="app-site" content="pages">
<meta name="theme-color" content="#8E2F2F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>後中國文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
@media (max-width: 480px) { .cloud-btn > span:last-child { display: none; } }   /* 手機：頁首只顯示頭像或雲朵，維持一行 */
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-link:hover { color: var(--accent); }
/* 錯題本：上方的日期格子（今天、明天……之後），點一格列出那天的題目 */
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; margin: 12px 0 20px; }
.dcard { display: grid; gap: 2px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); font: inherit; cursor: pointer; text-decoration: none; min-height: 44px; }
.dcard b { font-size: 14px; font-weight: 500; color: var(--muted); }
.dcard span { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dcard small { font-size: 12px; color: var(--warn); }
.dcard[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--soft, var(--surface)); }
.dcard[aria-pressed="true"] b { color: var(--accent); }
.dnote { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; }

/* 後中國文：沿用後中英文的版面（7 天 × 早晚、選擇題、錯題本），主色改為朱紅；字形題要看清楚標準字形，標題與文章不用楷體（楷體把「為」畫成「爲」） */
:root { --accent: #8E2F2F; --soft: #F6E7E3; --verb: #C98A00; --verb-soft: #FFF1C9; --subj: #0E7C7B; --subj-soft: #DDF2F1; --mod: #8A94A3;
  --en: "Source Serif 4", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #E8A08D; --accent-ink: #2A120E; --soft: #402420; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; } }
:root[data-theme="dark"] { --accent: #E8A08D; --accent-ink: #2A120E; --soft: #402420; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; }
body { margin: 0; }
.top-in .wk { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; }
#main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; }
#main h1 { font-family: var(--body); font-weight: 700; font-size: clamp(26px, 5vw, 36px); margin: 0 0 10px; }
#main h2 { font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#main h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); font-family: var(--mono); }
#main h3 { font-size: 16px; margin: 10px 0 0; }
.lede { font-size: 16px; color: var(--muted); }
.note { color: var(--muted); font-size: 14.5px; margin: 0; }
section.part { margin-top: 36px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.endrow { margin-top: 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.ens { font-family: var(--en); font-size: 17px; line-height: 1.75; }
.enw { font-family: var(--en); font-size: 1.2em; font-weight: 600; }
.pos { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
.zh { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; }
.gap { border-bottom: 2px solid var(--accent); color: var(--accent); }
/* 首頁：7 天 × 早晚 */
.duebar a { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 14px; text-decoration: none; }
.days { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }
.day h2 { font-size: 16px !important; }
.day h2 small { font-family: var(--body) !important; }
.day.now h2 { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.slot { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); text-decoration: none; font-size: 13.5px; min-width: 0; }
.slot:hover { border-color: var(--accent); }
.slot.cur { border: 2px solid var(--accent); }
.slot.fin { background: var(--good-soft); border-color: var(--good); }
.sl-h { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sl-h small { font-weight: 400; color: var(--muted); font-size: 12px; }
.sl-w { color: var(--muted); }
.sl-st { font-size: 12.5px; color: var(--accent); min-height: 1.2em; }
.slot.fin .sl-st { color: var(--good); }
.pbar { display: block; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.slot.fin .pbar i { background: var(--good); }
.pn { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.pn a { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; text-decoration: none; color: var(--ink); background: var(--surface); font-size: 13.5px; }
/* 單字卡 */
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.wcard p { margin: 0; }
.wh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.wz { font-weight: 700; margin-left: auto; }
.root { font-size: 13px; color: var(--accent); }
.wcard .ens { font-size: 15.5px; }
.wcard .unsure { justify-self: start; margin-top: 4px; }
.btn.unsure.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
/* 選擇題 */
.q { border-top: 1px solid var(--line); padding: 14px 0; }
.qnum, .qsrc { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.qt { font-weight: 500; margin: 0 0 8px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 14.5px; min-height: 44px; }
.opt.en-o { font-family: var(--en); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt .ow { font-family: var(--en); font-size: 13px; color: var(--muted); margin-left: 6px; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.why { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 14.5px; }
.why.ok { background: var(--good-soft); } .why.no { background: var(--bad-soft); }
.why.fu { background: var(--soft); border-left: 3px solid var(--accent); } .fu-h { margin: 0 0 4px; } .fu-no { color: var(--bad); font-size: 13.5px; margin: 6px 0 0; }
.why .btn { margin-left: 8px; }
.guide { margin-top: 8px; }
.gbody { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 4px; }
.gq { font-weight: 500; margin: 2px 0 6px; }
.gdone { font-size: 13.5px; color: var(--muted); margin: 0 0 6px; padding-left: 20px; }
.gdone b { color: var(--ink); }
.stepn { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
.rv-q, .rv-sent { margin-bottom: 8px; }
.ctx { margin: 0 0 4px; }
/* 長句 */
.sentc { display: grid; gap: 8px; margin-bottom: 4px; }
.sent { font-family: var(--en); font-size: 19px; line-height: 2.3; }
.ch { padding: 2px 1px; border-radius: 4px; transition: background .2s, color .2s; }
.ch.v { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); font-weight: 600; }
.ch.s { background: var(--subj-soft); outline: 2px solid var(--subj); outline-offset: 1px; }
.ch.m { color: var(--mod); }
.ch.m::before { content: "["; } .ch.m::after { content: "]"; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0; }
.legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: .35em; vertical-align: -.1em; }
.legend .lv::before { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); }
.legend .ls::before { background: var(--subj-soft); outline: 2px solid var(--subj); }
.legend .lm::before { border: 1px dashed var(--mod); }
.core { font-family: var(--en); font-size: 17px; background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 0; }
.core .lbl { display: inline; margin-right: 10px; }
.sbody { display: grid; gap: 6px; }
/* 文法與文章 */
.lesson p { margin: 8px 0; }
.lesson .ex { font-family: var(--en); font-size: 17px; line-height: 2.2; background: var(--sunk); border-radius: 8px; padding: 6px 12px; }
.lesson ul { margin: 6px 0; padding-left: 22px; }
.passage { display: grid; gap: 2px; }
.passage p { margin: 0 0 8px; }
.ptext { font-family: var(--body); font-size: 17px; line-height: 1.9; white-space: pre-line; }
.psrc { font-size: 13px; color: var(--muted); text-align: right; }
/* 解析：四個選項各自說明（✓ 正解、✗ 錯的選項） */
.exl { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
.exl li { font-size: 14px; line-height: 1.6; }
.exl li.ok b { color: var(--good); } .exl li.no b { color: var(--bad); font-weight: 500; }
.exref { margin: 6px 0 0; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 8px; }
.ptitle { font-family: var(--en); font-weight: 600; font-size: 19px; }
.blank { font-family: var(--mono); font-size: 14px; color: var(--accent); background: var(--soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.blank.fill { font-family: var(--en); font-size: 16px; color: var(--good); background: var(--good-soft); }
.pre ol { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.pre .ens { font-size: 15.5px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
/* 週報 */
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lessons a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14px; }
.lessons b { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.lessons .fin a { border-color: var(--good); }
.ck { color: var(--good); font-weight: 700; }
.skg { display: grid; gap: 4px; }
.skg h3 { margin-top: 12px !important; font-size: 14px !important; color: var(--muted); }
.skr { display: grid; grid-template-columns: minmax(0, 11em) minmax(60px, 1fr) 3.5em 6.5em; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.skv { font-family: var(--mono); font-size: 12.5px; text-align: right; }
.sks { font-size: 12.5px; color: var(--muted); }
.st-weak .sks { color: var(--bad); font-weight: 700; } .st-weak .pbar i { background: var(--bad); }
.st-mid .sks { color: var(--warn); } .st-mid .pbar i { background: var(--warn); }
.st-good .sks { color: var(--good); } .st-good .pbar i { background: var(--good); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.tags li { background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
#exTxt { width: 100%; margin-top: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.5; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
#exBox { display: grid; gap: 4px; }
/* 發音：頁首只放一個按鈕，設定在下拉面板 */
.spk { position: relative; font-size: 13px; color: var(--muted); }
.spk-b { font-family: var(--mono); }
.spk-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(280px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 12px 14px; display: grid; gap: 10px; }
.spk label { display: flex; align-items: center; gap: 8px; }
.spk-pop input { flex: 1; width: auto !important; }
.spk-pop select { flex: 1; max-width: none !important; }
/* 回想題的提示、早上單字面板 */
.qrow { display: flex; flex-wrap: wrap; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); font-size: 14px; }
.qrow span { color: var(--muted); min-width: 0; overflow-wrap: anywhere; } .qrow .r-ok { color: var(--good); } .qrow .r-no { color: var(--bad); }
.collapsed > :not(.qrow) { display: none !important; }
.q.skipped, .sentc.skipped { border-left: 4px solid var(--warn); padding-left: 10px; }

    { title: '古文：師說（節錄）', src: '唐‧韓愈〈師說〉',
      text: '古之學者必有師。師者，所以傳道受業解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也，終不解矣。生乎吾前，其聞道也固先乎吾，吾從而師之；生乎吾後，其聞道也亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先後生於吾乎？是故無貴無賤，無長無少，道之所存，師之所存也。',

    { title: '詞：蘇軾〈定風波〉', src: '宋‧蘇軾〈定風波〉',

    { title: '醫古文：大醫精誠（節錄）', src: '唐‧孫思邈《備急千金要方‧大醫精誠》',
      text: '凡大醫治病，必當安神定志，無欲無求，先發大慈惻隱之心，誓願普救含靈之苦。若有疾厄來求救者，不得問其貴賤貧富，長幼妍蚩，怨親善友，華夷愚智，普同一等，皆如至親之想；亦不得瞻前顧後，自慮吉凶，護惜身命。見彼苦惱，若己有之，深心悽愴，勿避嶮巇、晝夜寒暑、飢渴疲勞，一心赴救，無作功夫形迹之心。如此可為蒼生大醫，反此則是含靈巨賊。',

/* ---------- 錯題排程（化學、英文與首頁共用） ----------
   只從練習紀錄推算，不另外存狀態，所以紀錄同步到哪裡，排程就跟到哪裡。
   紀錄每一筆：{ t 時間, c 章, k 題型, h 題目識別碼, ok, n 第幾次作答 }；n === 1 是「一次作答」的開頭。
   規則（2026-11-02 使用者要求加長）：每題每天只算第一次作答。
   - 第一次就答錯 → 進入錯題本，隔 1 天到期（第 1 格）。
   - 到期後（之後任何一天）第一次就答對 → 進到下一格，依序再隔 3、7、14、30 天；五格都過才算掌握，離開錯題本。
   - 在錯題本中又答錯 → 從第 1 格重新開始（隔 1 天）。
   - 考前總複習：FINAL 那天起，所有曾經答錯、已經掌握的題目再到期一次；答對就完成，答錯就重新進錯題本。
   防止「猜對」（2026-11-02 使用者要求，兩個方法一起用）：
   - 追問：第一次就答對時，接著追問這題的一個推理步驟（k: 'fu'，fk 為原題型）。追問第一次就答錯 → 這次作答當成答錯（猜對）。
   - 確認題：第一次就答對的新題目，CHECK 天後再出一次（chk 1），答對後再隔 CHECK2 天做長期確認（chk 2）；兩次都答對才算會，任何一次答錯就進五格複習。
     （2026-11-09 使用者要求加長期確認：3 天還在短期記憶，答對後可能一個月就忘了）
   作廢（2026-11-07 使用者要求）：「重新練習」選「之前的不算」時記一筆 k:'reset'、v 為那一段的題目識別碼；那些題目在這之前的作答全部不算（紀錄本身保留）。 */
const REVIEW = (() => {
  const DAY = 864e5, GAPS = [1, 3, 7, 14, 30], CHECK = 3, CHECK2 = 30, FINAL = new Date(2027, 2, 1).getTime();   // 2027-03-01
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  // 拿掉被「之前的不算」作廢的作答
  function live(log) {
    const rs = log.filter(e => e.k === 'reset' && e.v);
    if (!rs.length) return log;
    const cut = new Map(); rs.forEach(r => r.v.forEach(h => cut.set(h, Math.max(cut.get(h) || 0, r.t))));
    return log.filter(e => !(e.h && e.k !== 'reset' && e.t < (cut.get(e.h) || 0)));
  }
  // 每題每天的第一次作答
  function trials(log) {
    log = live(log);
    const seen = new Set(), out = [], guess = new Set();
    for (const e of log) if (e.k === 'fu' && e.n === 1 && !e.ok) guess.add(`${e.c}|${e.fk}|${e.h}@${dayKey(e.t)}`);   // 追問答錯 → 那天的作答算猜對
    for (const e of log) {
      if (e.n !== 1 || !e.h || e.k === 'fu') continue;
      const key = `${e.c}|${e.k}|${e.h}`, dk = dayKey(e.t);
      if (seen.has(key + '@' + dk)) continue;
      const g = !!e.ok && guess.has(key + '@' + dk);
      seen.add(key + '@' + dk); out.push({ key, t: e.t, ok: !!e.ok && !g, guess: g, c: e.c, k: e.k, h: e.h, i: e.i, qt: e.qt });
    }
    return out;
  }
  // 每題目前的狀態：{ key, c, k, h, i, qt, open, stage（0 起算的格數）, due, wrongs, last, first（第一次作答是否答對） }
  function state(log) {
    const m = new Map();
    for (const tr of trials(log)) {
      let s = m.get(tr.key);
      const fresh = !s;
      if (!s) { s = { key: tr.key, c: tr.c, k: tr.k, h: tr.h, i: tr.i, qt: tr.qt, open: false, chk: false, stage: 0, due: 0, wrongs: 0, guesses: 0, last: 0, first: tr.ok }; m.set(tr.key, s); }
      s.i = tr.i; s.qt = tr.qt || s.qt; if (tr.guess) s.guesses++;
      if (!tr.ok) { s.open = true; s.chk = false; s.stage = 0; s.wrongs++; s.due = dayStart(tr.t) + GAPS[0] * DAY; }
      else if (fresh) { s.open = true; s.chk = 1; s.due = dayStart(tr.t) + CHECK * DAY; }   // 新題目第一次就答對 → 3 天後確認

      else if (s.open && s.chk === 2 && tr.t >= s.due) { s.open = false; s.chk = false; }
      else if (s.open && tr.t >= s.due) {
        s.stage++;
        if (s.stage >= GAPS.length) s.open = false; else s.due = dayStart(tr.t) + GAPS[s.stage] * DAY;
      }
      s.last = tr.t;
    }
    return m;
  }
  // 錯題本：還沒掌握的題目；due 為「今天以前到期」，加上考前總複習（final: true）
  function book(log, now = Date.now()) {
    const st = [...state(log).values()], all = st.filter(s => s.open && !s.chk), checks = st.filter(s => s.open && s.chk);
    const fin = now >= FINAL ? st.filter(s => !s.open && s.wrongs > 0 && s.last < FINAL).map(s => ({ ...s, final: true, due: FINAL })) : [];
    return { open: all, checks, due: all.concat(checks).filter(s => s.due <= now).concat(fin).sort((a, b) => a.due - b.due) };
  }
  // 答對之後的說明：下一次什麼時候回來
  // 選對之後的開頭：第一次就選對才說「答對了」；前面選錯過就照實說（2026-11-07：選錯三次後仍顯示「答對了」很混淆）
  const okHead = tries => (tries > 1 ? `<b>選對了</b>，但前面選錯 ${tries - 1} 次，這次不算答對。` : '<b>答對了。</b>');
  // guess：第一次就選對、但追問理由答錯
  function after(s, firstTry, guess = false) {
    if (!firstTry) return `${guess ? '理由沒選對，算猜對' : '今天第一次沒選對'}，從第 1 格重新開始，明天再考一次。`;
    if (s.final) return '考前總複習完成。';
    if (s.chk === 1) return `確認答對，${CHECK2} 天後還會再確認一次（長期記憶）。`;
    if (s.chk) return '長期確認完成：這題真的會了。';
    if (s.stage + 1 >= GAPS.length) return `五格都過了，這題已經掌握，離開錯題本（2027 年 3 月起的考前總複習還會再出現一次）。`;
    return `${GAPS[s.stage + 1]} 天後再考一次（進到第 ${s.stage + 2} / ${GAPS.length} 格）。`;
  }
  // 「重新練習」的確認：之前的作答照算（隔很久重新複習），或不算（測試、亂按、跳過）
  const resetAsk = what => `<span class="small">讓${what}全部恢復成沒做過的樣子。之前的作答要算嗎？</span><button class="btn sm pri" type="button" data-y>照算（重新複習）</button><button class="btn sm" type="button" data-v>之前的不算（測試／亂按）</button><button class="btn sm" type="button" data-n>取消</button><span class="small">「之前的不算」：${what}的題目在這之前的作答，錯題本和週報都不算。</span>`;
  const label = s => (s.final ? '考前總複習' : s.chk === 2 ? `長期確認（${CHECK2} 天後）` : s.chk ? '確認題（之前第一次就答對）' : `第 ${s.stage + 1} / ${GAPS.length} 格`);
  // 依到期日分組（dayCards 用） [{ key, label, list }]，days 天以後併成一組（2026-11-08 使用者要求：每天到期的分開列）
  function byDay(list, due = x => x.due, now = Date.now(), days = 14) {
    const lim = dayStart(now) + (days + 1) * DAY, m = new Map();
    list.forEach(x => { const k = due(x) >= lim ? '~' : dayKey(due(x)); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`; };
    return [...m.keys()].sort().map(k => {
      const t = k === '~' ? lim : due(m.get(k)[0]);
      return { key: k, label: k === '~' ? `${md(lim)} 及以後` : `${dayKey(t) === dayKey(dayStart(now) + DAY) ? '明天 ' : ''}${md(t)}`, list: m.get(k) };

  // 錯題本頁上方的日期格子：今天（含之前沒做完的，late 是幾題）一定有；之後 days − 1 天有題目的各一格，更晚的併成「之後」（2026-11-09 使用者要求）
  function dayCards(list, due = x => x.due, now = Date.now(), days = 5) {
    const today = list.filter(x => due(x) <= now);
    return [{ key: 'today', label: '今天', list: today, late: today.filter(x => due(x) < dayStart(now)).length }]
      .concat(byDay(list.filter(x => due(x) > now), due, now, days - 1).map(g => (g.key === '~' ? { ...g, label: '之後' } : g)));
  }
  const cardsHTML = (cs, sel, n = g => g.list.length) => cs.map(g => `<button type="button" class="dcard" data-k="${g.key}" aria-pressed="${g.key === sel}"><b>${g.label}</b><span>${n(g)} 題</span>${g.late ? `<small>其中 ${g.late} 題是之前沒做完的</small>` : ''}</button>`).join('');
  // 今天的作答分成「新題目」（今天以前沒做過）與「複習」（以前做過的題目：錯題、確認題、重做），首頁「今天」分開計算（2026-11-10 使用者要求）
  function todaySplit(log, now = Date.now()) {
    const t0 = dayStart(now), tr = trials(log), seen = new Set(tr.filter(x => x.t < t0).map(x => x.key)), td = tr.filter(x => x.t >= t0 && x.t < t0 + DAY);
    return { fresh: td.filter(x => !seen.has(x.key)), review: td.filter(x => seen.has(x.key)) };
  }
  // 題數：英文長句的每一步各算一筆紀錄，但頁面上一個長句是一張卡，所以同一句的步驟只算 1 題（h 為 s:w週:天:句:步；2026-11-10 格子 27 題、頁面 24 題對不上）
  const units = list => new Set(list.map(s => String(s.h).replace(/^(s:w\d+:\d+:\d+):\d+$/, '$1'))).size;
  return { units, todaySplit, live, resetAsk, trials, state, book, after, okHead, label, byDay, dayCards, cardsHTML, dayKey, dayStart, DAY, GAPS, CHECK, CHECK2, FINAL };
})();

/* ---------- 後中國文：每天早上（字音字形、字詞、常識）與晚上（閱讀題組）、錯題本 ----------

const LOG = store.get('log', []);

let NOLOG = false;

const qlog = () => REVIEW.live(LOG).filter(e => e.k === 'z' || e.k === 'fu');

/* ---- 題目索引：每題有固定識別碼 z:w週:id，錯題本靠它找回題目 ---- */

const parts = (w, d, s) => w.days[d][s].map(b => (b.qs ? b : { qs: [b] }));
const slotQs = (w, d, s) => parts(w, d, s).flatMap(b => b.qs.map(q => zq(w, d, s, q)));
let QIX = null;
function qindex() {

const frac = (qs, ok) => (qs.length ? qs.filter(q => ok.has(q.h)).length / qs.length : 0);

/* ---- 選擇題：答錯可以再選；「一步一步來」把題目拆成小判斷 ---- */
function mcq(q, num) {

  const t0 = resetT(c), ok = new Set(LOG.filter(e => e.ok && e.h && e.t > t0).map(e => e.h)), f1 = new Map();

// 已作答的題目收成一行；點一下展開／收起
function collapse(box, first, text) {

}
// 國文不用「一步一步來」與答對後的追問（2026-11-10 使用者要求：國文多半靠記憶與語感，不像英文能用文法推理）
// 每題的 ex 依序說明四個選項（ex[0] 是正解）；閱讀題的 ref 是文中根據。選錯時只顯示那個選項錯在哪，答對後列出全部。
const exHTML = q => `${q.ref ? `<p class="exref">文中根據：${esc(q.ref)}</p>` : ''}<ul class="exl">${q.o.map((o, j) => `<li class="${j ? 'no' : 'ok'}"><b>${j ? '✗' : '✓'} ${esc(o)}</b><br>${esc(q.ex[j])}</li>`).join('')}</ul>`;
function bindMcq(root, list, onDone, restore = true) {

### 內容要求
1. 共 7 天，每天 15 題：早上 8 題（字音、字形、字詞、成語、國學常識、修辭），晚上 7 題（1–2 個閱讀題組，加排序／填空／修辭單題）。題目數量不要增加。
2. **難度照考卷**：題型與難度照中國醫、慈濟、義守近年考卷；字詞與成語用考卷程度的字（例：胼手胝足、痌瘝在抱、淪肌浹髓），國學常識考題辭、時辰、月份別稱、代稱、作家作品等考卷常見的點。
3. **弱項優先**：「待加強」「還不穩」的能力，下週題數要比本週多；「穩定」的能力仍要出現。
4. **錯題回收**：「答錯的題目」考的知識點，下週換一個題目再考一次（不要原題照抄）。
5. **正解唯一**：錯誤選項必須是公認的錯（褒貶用反、用錯對象、望文生義、錯別字、讀音），不靠和句中某個詞矛盾來製造錯誤；古今用法不同、辭典與一般用法不一致的詞不當錯誤選項。
6. **有依據**：成語、字音、字形依教育部《成語典》《重編國語辭典修訂本》；解析寫出釋義。

    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, pushLog, hint, render };
})();
