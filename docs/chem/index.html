/* ===== 9. 紐曼投影：轉動後碳，找反式共平面 ===== */
W.newman = el => {
  let ang = 60;
  el.innerHTML = `<div class="w-row"><label class="rng">轉動後面的碳（H–C–C–Br 二面角）<input type="range" id="nwa" min="0" max="360" step="5" value="60"><output class="mono" id="nwo"></output></label></div><div class="w-row">${[0, 60, 120, 180, 240, 300].map(a => `<button class="btn sm ghost" type="button" data-a="${a}">${a}°</button>`).join('')}</div><div class="ngrid"><div id="nws"></div><p class="note" id="nwn"></p></div>`;
  function draw() {
    const cx = 150, cy = 130, R = 52, L = 98, P = (a, r) => [cx + Math.cos(a * Math.PI / 180) * r, cy - Math.sin(a * Math.PI / 180) * r];
    const front = [[90, 'H', 'hl'], [210, 'H', ''], [330, 'H', '']], back = [[90 - ang, 'Br', 'br'], [210 - ang, 'CH₃', ''], [330 - ang, 'H', '']];
    const vis = a => { const r = ((a - 90) % 120 + 180) % 120 - 60; return Math.abs(r) < 16 ? a - r + (r < 0 ? -16 : 16) : a; };  // 重疊式時後方基團稍微錯開，畫面才看得到
    const bl = ([a0, t, c]) => { const a = vis(a0), [x1, y1] = P(a, R), [x2, y2] = P(a, L); const [tx, ty] = P(a, L + 16); return `<line class="nb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    const fl = ([a, t, c]) => { const [x2, y2] = P(a, L - 10); const [tx, ty] = P(a, L + 6); return `<line class="nb" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    $('#nws', el).innerHTML = `<svg viewBox="0 0 300 260" class="mol" role="img" aria-label="紐曼投影式">${back.map(bl).join('')}<circle class="nc" cx="${cx}" cy="${cy}" r="${R}"/>${front.map(fl).join('')}<circle cx="${cx}" cy="${cy}" r="3" class="lp"/></svg>`;
    const d = ((ang % 360) + 360) % 360, anti = Math.abs(d - 180) <= 10, syn = d <= 10 || d >= 350;
    $('#nwn', el).innerHTML = `前面的碳（β 碳）：紅色的 H；後面的碳：Br。二面角 ${d}°。<br>` + (anti ? '<span class="ok">✓ 反式共平面</span>：H 和 Br 在相反兩側且同一平面，C–H 的電子可以順利推進 C–Br 的反鍵結軌域，<b>E2 可以發生</b>。這也是交錯式構形，能量低。'
      : syn ? '<span class="warn">順式共平面</span>：理論上軌域也平行，但這是重疊式構形，H 和 Br 擠在一起，能量很高，很少經由這個構形反應。'
        : '<span class="bad">✕ 不行</span>：C–H 和 C–Br 沒有平行，電子推不過去。分子要先轉到 180°（反式共平面）才能進行 E2。');
    $('#nwo', el).textContent = `${d}°`; $('#nwa', el).value = d;
  }
  $('#nwa', el).oninput = e => { ang = +e.target.value; draw(); };
  $$('[data-a]', el).forEach(b => { b.onclick = () => { ang = +b.dataset.a; draw(); }; });
  draw();
  return { set(s) { ang = s.ang ?? ang; draw(); } };
};

/* ===== 12. 判斷器 ===== */
W.decide = el => {
  const st = { sub: 'secondary', reag: 'base', solv: 'protic', heat: false };
  const SUB = { methyl: '甲基（CH₃X）', primary: '一級（RCH₂X）', secondary: '二級（R₂CHX）', tertiary: '三級（R₃CX）' };
  const REAG = { nuc: '強親核、弱鹼（I⁻、Br⁻、RS⁻、N₃⁻、CN⁻）', base: '強鹼、強親核（OH⁻、RO⁻）', bulky: '體積大的強鹼（t-BuO⁻）', weak: '弱親核、弱鹼（H₂O、ROH）' };
  const SOLV = { protic: '極性質子性（水、醇）', aprotic: '極性非質子性（丙酮、DMSO、DMF）' };
  el.innerHTML = `<p class="lbl">基質</p>${seg('ds', Object.entries(SUB), st.sub)}<p class="lbl">試劑</p>${seg('dr', Object.entries(REAG), st.reag)}<p class="lbl">溶劑</p>${seg('dv', Object.entries(SOLV), st.solv)}<label class="chk"><input type="checkbox" id="dh"> 加熱</label><div class="verdict" id="dv0"></div><ol class="reason" id="dl"></ol>`;
  function decide({ sub, reag, solv, heat }) {
    const s = [];
    s.push({ methyl: '甲基：背面最空，最適合 SN2；沒有 β-H，不能脫去；甲基碳陽離子極不穩定，不走 SN1／E1。', primary: '一級：背面還算空，SN2 容易；一級碳陽離子很不穩定，不走 SN1／E1。', secondary: '二級：背面有點擠、碳陽離子中等穩定，四條路都有可能，關鍵看試劑。', tertiary: '三級：背面被三個基團擋住，不走 SN2；碳陽離子穩定，可以走 SN1／E1；也有很多 β-H 可以做 E2。' }[sub]);
    s.push({ nuc: '試劑是好的親核基但鹼性弱：傾向去攻擊碳（取代），不太去拿 H（脫去）。', base: '試劑是強鹼，也是強親核基：取代和脫去互相競爭，基質越擠越偏向脫去。', bulky: '試劑是體積很大的強鹼：擠不到碳旁邊做取代，幾乎只拿外側的 β-H 做 E2。', weak: '試劑是弱親核、弱鹼：推不動 SN2，也拿不動 H 做 E2，只能等鹵烷自己解離成碳陽離子（SN1／E1）。' }[reag]);
    let major, minor = '';
    if (sub === 'methyl') { major = reag === 'weak' ? '幾乎不反應' : 'SN2'; if (reag === 'bulky') s.push('沒有 β-H 可以拿，t-BuO⁻ 只能很慢地做 SN2。'); if (reag === 'weak') s.push('弱親核基推不動 SN2，甲基碳陽離子又生不出來。'); }
    else if (sub === 'primary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'SN2'; minor = 'E2'; s.push('一級背面夠空，強鹼大多直接當親核基做 SN2；加熱會讓 E2 比例上升。'); }
      else if (reag === 'bulky') { major = 'E2'; minor = 'SN2'; } else { major = '幾乎不反應'; s.push('一級碳陽離子太不穩定，弱親核基又推不動 SN2。'); }
    } else if (sub === 'secondary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'E2'; minor = 'SN2'; s.push('二級背面有點擠，強鹼拿 β-H 比擠進背面容易，所以 E2 為主。'); }
      else if (reag === 'bulky') major = 'E2';
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; s.push('二級碳陽離子勉強可以生成，反應很慢，而且產物是取代和脫去的混合物。'); }
    } else {
      if (reag === 'nuc') { major = solv === 'protic' ? 'SN1' : 'SN1（很慢）'; minor = 'E1'; s.push(solv === 'protic' ? '背面被擋住只能走 SN1：先解離成碳陽離子，親核基再加上去。' : 'SN1 需要極性質子性溶劑幫忙穩定生成的離子；在非質子性溶劑中解離很慢。'); }
      else if (reag === 'base') { major = 'E2'; s.push('強鹼不必等碳陽離子生成，直接拿 β-H 做 E2，比 SN1 快得多。'); }
      else if (reag === 'bulky') { major = 'E2'; s.push('大體積的鹼拿外側的 H，霍夫曼產物（取代較少的烯）比例較高。'); }
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; }
    }
    if (/SN2/.test(major)) s.push(solv === 'aprotic' ? '溶劑是非質子性：不會用氫鍵包住親核基，親核基更有攻擊力，有利 SN2。' : '溶劑是質子性：會用氫鍵包住親核基，SN2 會變慢一些；換成丙酮、DMSO 會更快。');

    return { major, minor, s };
  }
  function draw() {

  $('#dh', el).onchange = e => { st.heat = e.target.checked; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

W.ester = el => {

};

/* ===== 3. 丙二酸酯與乙醯乙酸酯合成 ===== */
W.malonic = el => {
  // [鹵烷, R, 碳數, 丙二酸酯產物, 乙醯乙酸酯產物, 再加 CH₃ 的丙二酸酯產物, 再加 CH₃ 的乙醯乙酸酯產物]
  const R = [['CH₃Br', 'CH₃', 1, '丙酸', '2-丁酮', '2-甲基丙酸', '3-甲基-2-丁酮'], ['CH₃CH₂Br', 'CH₃CH₂', 2, '丁酸', '2-戊酮', '2-甲基丁酸', '3-甲基-2-戊酮'], ['1-溴丙烷', 'CH₃(CH₂)₂', 3, '戊酸', '2-己酮', '2-甲基戊酸', '3-甲基-2-己酮'],
    ['1-溴丁烷', 'CH₃(CH₂)₃', 4, '己酸', '2-庚酮', '2-甲基己酸', '3-甲基-2-庚酮'], ['1-溴己烷', 'CH₃(CH₂)₅', 6, '辛酸', '2-壬酮', '2-甲基辛酸', '3-甲基-2-壬酮'], ['苄基溴', 'C₆H₅CH₂', 7, '3-苯基丙酸', '4-苯基-2-丁酮', '2-甲基-3-苯基丙酸', '3-甲基-4-苯基-2-丁酮'], ['2-溴-2-甲基丙烷', '(CH₃)₃C', 4, null, null, null, null]];
  const st = { m: 'mal', r: 4, two: 0 };
  el.innerHTML = `${seg('mlS', [['mal', '丙二酸二乙酯 → 羧酸'], ['aca', '乙醯乙酸乙酯 → 甲基酮']], st.m)}<div class="w-row">${R.map(([n], i) => `<button class="btn sm ghost" type="button" data-r="${i}">${n}</button>`).join('')}</div>${seg('mlT', [['0', '烷基化一次'], ['1', '再用 CH₃I 烷基化一次']], '0')}<ol class="cs" id="mlC"></ol><p class="note" id="mlN"></p>`;
  function draw() {
    const r = R[st.r], mal = st.m === 'mal', start = mal ? 'CH₂(COOEt)₂' : 'CH₃COCH₂COOEt', tail = mal ? 'COOEt' : 'COCH₃';
    if (!r[3]) {
      $('#mlC', el).innerHTML = `<li>${start} + NaOEt → 烯醇離子</li><li>烯醇離子 + ${r[0]}：三級鹵烷無法進行 SN2</li>`;
      $('#mlN', el).innerHTML = '<span class="bad">不能用</span>：烷基化是烯醇離子對鹵烷的 <b>SN2</b>，只能用甲基、一級（與苄基、烯丙基）鹵烷。三級鹵烷遇到強鹼只會發生 E2 脫去。';
    } else {
      const sub = st.two ? `CH₃–C(${r[1]})` : `${r[1]}–CH`;
      $('#mlC', el).innerHTML = `<li>${start} + NaOEt → 夾在兩個羰基間的 α-H 被拿走（pKa ${mal ? '13' : '11'}）</li><li>烯醇離子 + ${r[0]}（SN2）→ ${r[1]}–CH(${mal ? 'COOEt' : 'COCH₃'})COOEt</li>${st.two ? `<li>再一次 NaOEt、CH₃I → ${sub}(${tail})COOEt</li>` : ''}<li>H₃O⁺、加熱：酯水解成 β-羰基羧酸，再<b>脫羧</b>（失去 CO₂）</li><li>產物：<b>${mal ? (st.two ? `${r[1]}–CH(CH₃)–COOH` : `${r[1]}–CH₂–COOH`) : (st.two ? `${r[1]}–CH(CH₃)–COCH₃` : `${r[1]}–CH₂–COCH₃`)}</b>　${mal ? r[st.two ? 5 : 3] : r[st.two ? 6 : 4]}</li>`;
      $('#mlN', el).innerHTML = mal ? `丙二酸酯合成＝在 <b>CH₂–COOH</b> 上接 R：產物的碳數 = R 的碳數 + 2。所以要得到辛酸（8 個碳）要用 6 個碳的 1-溴己烷。` : `乙醯乙酸酯合成＝在 <b>CH₂–CO–CH₃</b>（丙酮的一端）上接 R，得到甲基酮：碳數 = R 的碳數 + 3。`;
    }
    pressSeg(el, 'mlS', st.m); pressSeg(el, 'mlT', String(st.two));
    $$('[data-r]', el).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === st.r)));
  }
  bindSeg(el, 'mlS', v => { st.m = v; draw(); });
  bindSeg(el, 'mlT', v => { st.two = +v; draw(); });
  $$('[data-r]', el).forEach(b => { b.onclick = () => { st.r = +b.dataset.r; draw(); }; });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 4. 醛醇反應的機構（兩分子乙醛） ===== */
W.aldolmech = el => {
  const base = () => ({ Ca: { x: 0.4, y: -0.1, t: 'CH₂' }, Ha: { x: 0.4, y: -1.25, t: 'H' }, C1: { x: 1.5, y: 0.55, t: 'CH' }, O1: { x: 2.65, y: -0.05, t: 'O', lp: [60, 300] },
    C2: { x: -1.3, y: 0.75, t: 'CH' }, O2: { x: -1.3, y: 2.0, t: 'O', lp: [45, 135] }, M2: { x: -2.55, y: 0.15, t: 'CH₃' }, B: { x: -0.6, y: -2.3, t: 'HO', c: '−', lp: [20] } });
  const frames = () => {
    const F0 = { atoms: base(), bonds: [['Ca', 'Ha', 's'], ['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['C2', 'O2', 'd'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['B', 20] }, t: { a: 'Ha' }, bend: -0.3 }, { f: { b: ['Ca', 'Ha'] }, t: { m: ['Ca', 'C1'] }, bend: 0.6 }, { f: { b: ['C1', 'O1'] }, t: { a: 'O1' }, bend: -0.6 }], notes: [{ x: 0, y: -3.1, t: '兩分子乙醛 + OH⁻' }] };
    const a1 = base(); Object.assign(a1.O1, { c: '−', lp: [0, 60, 300] }); a1.Ha.hide = 1; Object.assign(a1.B, { t: 'H₂O', c: '', lp: [] });
    const F1 = { atoms: a1, bonds: [['Ca', 'C1', 'd'], ['C1', 'O1', 's'], ['C2', 'O2', 'd'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['O1', 60] }, t: { m: ['O1', 'C1'] }, bend: 0.5 }, { f: { b: ['Ca', 'C1'] }, t: { a: 'C2' }, bend: 0.4 }, { f: { b: ['C2', 'O2'] }, t: { a: 'O2' }, bend: -0.6 }], notes: [{ x: 0, y: -3.1, t: '烯醇離子（親核基）' }] };
    const a2 = base(); a2.Ha.hide = 1; Object.assign(a2.C2, { x: -0.75, y: 0.7 }); Object.assign(a2.O2, { x: -0.75, y: 1.95, c: '−', lp: [0, 90, 180] }); Object.assign(a2.M2, { x: -1.95, y: 0.1 }); Object.assign(a2.B, { t: 'H₂O', c: '', lp: [], x: -2.4, y: 2.3 });
    const F2 = { atoms: a2, bonds: [['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['Ca', 'C2', 's'], ['C2', 'O2', 's'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['O2', 180] }, t: { a: 'B' }, bend: -0.3 }], notes: [{ x: 0, y: -3.1, t: '烷氧離子' }] };
    const a3 = JSON.parse(JSON.stringify(a2)); Object.assign(a3.O2, { t: 'OH', c: '', lp: [] }); Object.assign(a3.B, { t: 'HO', c: '−', lp: [] });
    const F3 = { atoms: a3, bonds: F2.bonds, notes: [{ x: 0, y: -3.1, t: '3-羥基丁醛（醛醇加成產物）' }] };
    const a4 = JSON.parse(JSON.stringify(a3)); Object.assign(a4.Ca, { t: 'CH' }); a4.O2.hide = 1; a4.B.hide = 1;
    const F4 = { atoms: a4, bonds: [['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['Ca', 'C2', 'd'], ['C2', 'M2', 's']], notes: [{ x: 0, y: -3.1, t: '2-丁烯醛（α,β-不飽和醛）+ H₂O' }] };
    return [
      { sc: F0, cap: '<b>1. 形成烯醇離子</b>：OH⁻ 拿走 α-H，C–H 的電子推向 C=C，羰基的 π 電子推到 O 上。' },
      { sc: F1, cap: '<b>2. 烯醇離子是親核基</b>：負電荷大部分在 O 上，但反應時用<b>碳端</b>進攻另一分子乙醛的羰基碳，形成新的 C–C 鍵。' },
      { sc: F2, cap: '<b>3. 烷氧離子</b>：和一般親核加成一樣，得到帶負電的 O。' },
      { sc: F3, cap: '<b>4. 質子化</b>：從水拿回 H⁺，得到 <b>β-羥基醛</b>（醛醇，aldol = ald + ol），OH⁻ 再生，所以鹼只需要催化量。' },
      { sc: F4, cap: '<b>5. 加熱脫水</b>：α-H 仍然有酸性，失去 H 和 β 位的 OH（經由烯醇離子，E1cB），生成和羰基<b>共軛</b>的 C=C。這一步讓反應往右推，稱為<b>醛醇縮合</b>。' }];
  };
  const pl = mechPlayer(el, { frames, w: 460, h: 300, s: 50, cy: 140, label: '醛醇反應機構' });
  return { set(s) { pl.go(s.step || 0, false); } };
};

/* ===== 1. 胺類藥物在不同 pH 的離子化程度 ===== */
W.amineph = el => {
  const st = { pk: 9.5, pH: 7.4 };
  const PRE = [['胃（pH 1.5）', 1.5], ['小腸（pH 6.5）', 6.5], ['血液（pH 7.4）', 7.4]];
  el.innerHTML = `<p class="eq">R–NH₃⁺ ⇌ R–NH₂ + H⁺　　pH = pKaH + log([R–NH₂] ÷ [R–NH₃⁺])</p><div class="w-row"><label class="rng">胺的 pKaH <input type="range" id="amK" min="3" max="12" step="0.1"><output class="mono" id="amKo"></output></label><label class="rng">環境 pH <input type="range" id="amP" min="1" max="10" step="0.1"><output class="mono" id="amPo"></output></label></div><div class="w-row">${PRE.map(([t, v]) => `<button class="btn sm ghost" type="button" data-p="${v}">${t}</button>`).join('')}</div><div id="amB"></div><p class="note" id="amN"></p>`;
  function draw() {
    const fn = 1 / (1 + 10 ** (st.pk - st.pH)), pn = 100 * fn;
    $('#amB', el).innerHTML = `<div class="stack"><i class="ba" style="width:${100 - pn}%">${100 - pn >= 12 ? `R–NH₃⁺ ${fx(100 - pn, 1)}%` : ''}</i><i class="bha" style="width:${pn}%">${pn >= 12 ? `R–NH₂ ${fx(pn, 1)}%` : ''}</i></div><p class="small mut">橘：帶正電（易溶於水，難穿過細胞膜）　藍：中性（可穿過細胞膜）</p>`;
    $('#amN', el).innerHTML = `pH 比 pKaH ${st.pH < st.pk ? '低' : '高'} ${fx(Math.abs(st.pH - st.pk), 1)}，中性胺只佔 <b>${pn < 0.01 ? sci(pn, 1) : fx(pn, 2)}%</b>。這是酸鹼章 Henderson–Hasselbalch 的直接應用：<b>pH 低於 pKaH，胺大多質子化帶正電</b>。許多藥物（嗎啡、利多卡因、抗組織胺）是胺，做成鹽酸鹽（R–NH₃⁺Cl⁻）增加水溶性；但只有中性形式能穿過脂質細胞膜，所以吸收部位與作用都受 pH 影響。`;
    $('#amK', el).value = st.pk; $('#amP', el).value = st.pH; $('#amKo', el).textContent = fx(st.pk, 1); $('#amPo', el).textContent = fx(st.pH, 1);
  }
  $('#amK', el).oninput = e => { st.pk = +e.target.value; draw(); };
  $('#amP', el).oninput = e => { st.pH = +e.target.value; draw(); };
  $$('[data-p]', el).forEach(b => { b.onclick = () => { st.pH = +b.dataset.p; draw(); }; });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

    cot: { n: '環辛四烯', size: 8, pi: 8, planar: false, conj: true, note: '8 個 π 電子（4n），但分子會折成澡盆形避免反芳香性，雙鍵不共軛：非芳香性，行為像一般的烯。' },
    cp: { n: '環戊二烯負離子', size: 5, pi: 6, planar: true, conj: true, note: '帶負電的碳是 sp²，孤對電子在 p 軌域上參與共軛，共 6 個 π 電子。所以環戊二烯（pKa 約 16）對一個 C–H 來說非常酸。' },
    trop: { n: '環庚三烯陽離子', size: 7, pi: 6, planar: true, conj: true, note: '帶正電的碳有空的 p 軌域，讓整個環共軛，6 個 π 電子。' },
    pyrrole: { n: '吡咯', size: 5, pi: 6, planar: true, conj: true, note: 'N 的孤對電子在 p 軌域上參與 π 系統（兩個 C=C 共 4 個 + N 的 2 個）。因此吡咯的 N 幾乎沒有鹼性：孤對電子被用掉了。' },
    pyridine: { n: '吡啶', size: 6, pi: 6, planar: true, conj: true, note: '和苯一樣 6 個 π 電子；N 的孤對電子在 sp² 軌域上、指向環外，不參與 π 系統，所以吡啶有鹼性。' },
  };
  let cur = 'benzene';
  el.innerHTML = `${seg('hkS', Object.entries(R).map(([k, v]) => [k, v.n]), cur)}<div class="bgrid"><div id="hkR"></div><div id="hkF"></div></div><ul class="checks" id="hkC"></ul><p class="note" id="hkN"></p>`;
  function draw() {
    const r = R[cur], n = r.size, aro = r.planar && r.conj && (r.pi - 2) % 4 === 0, anti = r.planar && r.conj && r.pi % 4 === 0;
    // 環
    const atoms = {}, bonds = [];
    for (let k = 0; k < n; k++) { const a = (90 + 360 * k / n) * Math.PI / 180; atoms['a' + k] = { x: Math.cos(a) * 1.1, y: Math.sin(a) * 1.1, t: '' }; }
    if (cur === 'pyrrole') atoms.a0 = { ...atoms.a0, t: 'NH', lp: [90] };
    if (cur === 'pyridine') atoms.a0 = { ...atoms.a0, t: 'N', lp: [90] };
    if (cur === 'cp') atoms.a0 = { ...atoms.a0, c: '−' };
    if (cur === 'trop') atoms.a0 = { ...atoms.a0, c: '+' };
    const dbl = { benzene: [0, 2, 4], cbd: [0, 2], cot: [0, 2, 4, 6], cp: [1, 3], trop: [1, 3, 5], pyrrole: [1, 3], pyridine: [0, 2, 4] }[cur];
    for (let k = 0; k < n; k++) bonds.push(['a' + k, 'a' + ((k + 1) % n), dbl.includes(k) ? 'd' : 's']);
    $('#hkR', el).innerHTML = MOL.svg({ atoms, bonds }, { w: 220, h: 200, s: 62 }) + `<p class="small mut c">${r.n}（${r.pi} 個 π 電子）</p>`;
    // 弗羅斯特圓：正多邊形頂點朝下內接於圓，每個頂點的高度就是一個分子軌域的能量
    const cx = 120, cy = 100, rad = 70, lv = Array.from({ length: n }, (_, k) => cy + rad * Math.cos(2 * Math.PI * k / n));
    const levels = [...new Set(lv.map(v => Math.round(v * 10) / 10))].sort((a, b) => b - a);
    let left = r.pi; const fill = levels.map(y => { const deg = lv.filter(v => Math.round(v * 10) / 10 === y).length, e = Math.min(left, 2 * deg); left -= e; return [y, deg, e]; });
    const pts = Array.from({ length: n }, (_, k) => { const a = 2 * Math.PI * k / n; return [cx + rad * Math.sin(a), cy + rad * Math.cos(a)]; });
    // 洪德定則：同一能階先每個軌域放一個，再成對
    const occ = (e, deg, j) => (e > deg ? (j < e - deg ? 2 : 1) : (j < e ? 1 : 0));
    const lvl = fill.map(([y, deg, e]) => Array.from({ length: deg }, (_, j) => { const x0 = cx + (j - (deg - 1) / 2) * 46, ue = occ(e, deg, j); return `<line class="lvl" x1="${x0 - 16}" x2="${x0 + 16}" y1="${y}" y2="${y}"/>${ue >= 1 ? `<text class="spin" x="${x0 - 12}" y="${y - 3}">↑</text>` : ''}${ue >= 2 ? `<text class="spin" x="${x0 + 3}" y="${y - 3}">↓</text>` : ''}`; }).join('')).join('');
    $('#hkF', el).innerHTML = r.planar ? `<svg viewBox="0 0 260 200" class="ch" role="img" aria-label="弗羅斯特圓"><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--line)"/><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>${lvl}<line class="mk" x1="20" x2="220" y1="${cy}" y2="${cy}"/><text class="tk" x="222" y="${cy + 4}">非鍵</text></svg><p class="small mut c">π 分子軌域能階（弗羅斯特圓）</p>` : '<p class="note">分子不是平面，p 軌域無法連續重疊，不形成環狀 π 系統。</p>';
    $('#hkC', el).innerHTML = [['環狀', true], ['平面', r.planar], ['每個環原子都有 p 軌域（完全共軛）', r.conj], [`π 電子數 ${r.pi} = 4n + 2？`, (r.pi - 2) % 4 === 0]].map(([t, ok]) => `<li class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'} ${t}</li>`).join('');
    $('#hkN', el).innerHTML = `<b>${aro ? '芳香性' : anti ? '反芳香性' : '非芳香性'}</b>。${r.note}${aro ? '弗羅斯特圓上，所有成鍵軌域都剛好填滿成對，沒有電子落在非鍵或反鍵軌域：這就是 4n + 2 特別穩定的原因。' : anti ? '弗羅斯特圓上，最後兩個電子只能分別放進兩個簡併的非鍵軌域，未成對：不穩定。' : ''}`;
    pressSeg(el, 'hkS', cur);
  }
  bindSeg(el, 'hkS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.r || cur; draw(); } };
};

    const F3 = { ...sig([0, 3], 'a2'), atoms: { ...sig([0, 3], 'a2').atoms, B: { x: -0.2, y: 2.3, t: 'FeBr₄', c: '−', lp: [] } }, arrows: [{ f: { b: ['a5', 'H'] }, t: { m: ['a4', 'a5'] }, bend: 0.6 }], notes: [{ x: 0, y: -1.7, t: '鹼拿走 H⁺，電子回到環上' }] };

    return [

      { sc: F1, at: 0.45, cap: '<b>第一步（慢）</b>：π 電子攻擊 Br⁺，接上 Br 的碳變成 sp³，生成帶正電的 <b>σ 錯合物</b>。芳香性被破壞，所以這一步的活化能很高。' },
      { sc: F2, at: 0.45, cap: '正電荷可以共振到三個碳上（相對於 Br 的鄰位與對位）。這一點決定了下一節取代基的定位效應。' },
      { sc: F3, at: 0.45, cap: '<b>第二步（快）</b>：鹼（FeBr₄⁻）拿走接 Br 那個碳上的 H⁺，C–H 的電子回到環上。' },

/* ===== 3. 取代基的活化與定位效應（硝化的產物分布） ===== */

    CH3: { n: '–CH₃', d: [63, 3, 34], k: '弱活化，鄰對位', why: '烷基經誘導與超共軛推電子；鄰、對位進攻時正電荷落在接甲基的碳上（三級碳陽離子），較穩定。' },
    Cl: { n: '–Cl', d: [35, 1, 64], k: '弱鈍化，鄰對位', why: '鹵素的誘導效應（拉電子）讓整個環變慢；但孤對電子仍能共振穩定鄰、對位的正電荷，所以定位在鄰對位。這是唯一「鈍化卻鄰對位」的一類。' },
    COOH: { n: '–COOH', d: [22, 76, 2], k: '鈍化，間位', why: '羰基拉電子。鄰、對位進攻時正電荷會落在接羰基的碳上，緊鄰另一個缺電子的碳，非常不穩定；間位進攻避開了這種情況。' },
    NO2: { n: '–NO₂', d: [7, 91, 2], k: '強鈍化，間位', why: '硝基強烈拉電子（N 帶正電）。鄰、對位進攻會讓兩個正電荷相鄰；只剩間位可行，而且整體反應很慢。' },
  };

  function draw() {

    $('#drN', el).innerHTML = `<b>${s.n}：${s.k}</b>。${s.why}`;
    pressSeg(el, 'drS', cur);
  }
  bindSeg(el, 'drS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.g || cur; draw(); } };
};

  const E = n => -13.6 * Z * Z / (n * n), hc = 1239.84;   // eV·nm；類氫粒子 Eₙ = −13.6 Z²/n²
  const col = l => l < 380 ? '#7a5cff' : l < 450 ? '#6a4cff' : l < 495 ? '#2f8fff' : l < 570 ? '#2fbf5f' : l < 590 ? '#e8d23a' : l < 620 ? '#f29a2e' : l <= 750 ? '#e2403a' : '#a33';
  function draw() {
    if (nf >= ni) nf = Math.max(1, ni - 1);

    $('#hsL', el).innerHTML = `<svg viewBox="0 0 400 240" class="ch" role="img" aria-label="氫原子能階">${[1, 2, 3, 4, 5, 6, 7].map(n => `<line class="lvl${n === ni || n === nf ? ' on' : ''}" x1="40" x2="200" y1="${Y(E(n))}" y2="${Y(E(n))}"/>${n <= 3 ? `<text class="tk" x="206" y="${Y(E(n)) + 4}">n=${n}（${fx(E(n), 2)} eV）</text>` : ''}`).join('')}<text class="tk" x="206" y="${Y(E(5)) - 6}">n=4、5、6…（越來越密，趨近 0）</text><line x1="120" x2="120" y1="${Y(E(ni))}" y2="${Y(E(nf)) - 6}" stroke="${col(lam)}" stroke-width="3" marker-end="url(#hm2)"/><defs><marker id="hm2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col(lam)}"/></marker></defs></svg>`;
    const lines = [3, 4, 5, 6].map(n => hc / (E(n) - E(2))).filter(l => l >= 380 && l <= 750);
    $('#hsS', el).innerHTML = chart({ x: [380, 750], y: [0, 1], xt: [400, 500, 600, 700], yt: [], xlab: '可見光波長（nm）：巴耳末系（掉到 n = 2）', h: 120 }, (X, Y) => `<defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#6a4cff"/><stop offset=".3" stop-color="#2f8fff"/><stop offset=".5" stop-color="#2fbf5f"/><stop offset=".65" stop-color="#e8d23a"/><stop offset=".8" stop-color="#f29a2e"/><stop offset="1" stop-color="#e2403a"/></linearGradient></defs><rect x="${X(380)}" y="${Y(1)}" width="${X(750) - X(380)}" height="${Y(0) - Y(1)}" fill="url(#vis)" opacity=".18"/>${lines.map(l => `<line x1="${X(l)}" x2="${X(l)}" y1="${Y(0)}" y2="${Y(1)}" stroke="${col(l)}" stroke-width="${Math.abs(l - lam) < 1 ? 5 : 2.5}"/>`).join('')}`);
    $('#hsK', el).innerHTML = card('e', 'ΔE', `${fx(dE, 2)} eV`, `${fx(dE * 96.485, 0)} kJ/mol`) + card('l', '光的波長 λ = hc ÷ ΔE', `${fx(lam, 0)} nm`) + card('r', '區域', lam < 380 ? '紫外光' : lam <= 750 ? '可見光' : '紅外光') + card('ie', `游離能（從 n = 1）`, `${fx(13.6 * Z * Z, 1)} eV`, `13.6 × ${Z}²`) + card('rad', `n = ${ni} 的軌道半徑`, `${fx(0.529 * ni * ni / Z, 2)} Å`, `0.529 × ${ni}² ÷ ${Z}`);
    $('#hsN', el).innerHTML = `電子從 n = ${ni} 掉到 n = ${nf}，放出能量 ΔE = 13.6 × ${Z}² × (1/${nf}² − 1/${ni}²) eV = ${fx(dE, 2)} eV 的光子，波長 ${fx(lam, 0)} nm。能階是<b>分立</b>的，所以光譜是一條一條的線，而不是連續的彩虹。掉到 n = 1 的（萊曼系）能量大，在紫外光；掉到 n = 2 的（巴耳末系）落在可見光。${Z > 1 ? ` ${Z === 2 ? 'He⁺' : 'Li²⁺'} 只有一個電子，和氫原子同一套公式，只是原子核電荷 Z = ${Z}：能量乘 Z²、半徑除以 Z。` : ''}`;
    $('#hsI', el).value = ni; $('#hsF', el).value = nf; $('#hsZ', el).value = Z;
  }
  $('#hsI', el).onchange = e => { ni = +e.target.value; draw(); };
  $('#hsZ', el).onchange = e => { Z = +e.target.value; draw(); };
  $('#hsF', el).onchange = e => { nf = +e.target.value; draw(); };
  $$('[data-t]', el).forEach(b => { b.onclick = () => { [ni, nf] = b.dataset.t.split(',').map(Number); draw(); }; });

};

const AUF = [['1s', 2], ['2s', 2], ['2p', 6], ['3s', 2], ['3p', 6], ['4s', 2], ['3d', 10], ['4p', 6], ['5s', 2], ['4d', 10], ['5p', 6], ['6s', 2], ['4f', 14], ['5d', 10], ['6p', 6]];

function econf(Z, q = 0) {   // 回傳依 n、ℓ 排序的 [[軌域, 電子數]]
  const base = q < 0 ? Z - q : Z, m = new Map(); let left = base;
  for (const [o, c] of AUF) { if (left <= 0) break; const k = Math.min(c, left); m.set(o, k); left -= k; }
  if (q >= 0) (EXC[Z] || []).forEach(([o, k]) => m.set(o, k));
  const sorted = () => [...m.entries()].filter(([, k]) => k > 0).sort((x, y) => (+x[0][0] - +y[0][0]) || (LN[x[0][1]] - LN[y[0][1]]));
  for (let i = 0; i < q; i++) { const ls = sorted(), [o] = ls[ls.length - 1]; m.set(o, m.get(o) - 1); }   // 陽離子：先拿 n 最大（同 n 中 ℓ 最大）的電子

    const Y = n => 235 - n * n * 12, x0 = 70, x1 = 330;
    let s = `<line class="ax" x1="${x0}" x2="${x0}" y1="20" y2="240"/><line class="ax" x1="${x1}" x2="${x1}" y1="20" y2="240"/><line class="ax" x1="${x0}" x2="${x1}" y1="240" y2="240"/><text class="tk" x="${(x0 + x1) / 2}" y="256" text-anchor="middle">0 ← L → L</text>`;
    for (let n = 1; n <= 4; n++) {
      const y = Y(n), on = n === a || n === b;
      s += `<line class="lvl${on ? ' on' : ''}" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><path class="tline" d="${path(Array.from({ length: 61 }, (_, i) => [x0 + (x1 - x0) * i / 60, y - 11 * Math.sin(n * Math.PI * i / 60)]))}" opacity="${on ? 1 : 0.35}"/><text class="tk" x="${x1 + 10}" y="${y + 4}">n = ${n}：E = ${n * n} E₁</text>`;
    }
    s += `<line x1="${x1 + 140}" x2="${x1 + 140}" y1="${Y(a)}" y2="${Y(b) + 6}" class="dlt up" marker-end="url(#pbA)"/><defs><marker id="pbA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ahp"/></marker></defs>`;
    $('#pbG', el).innerHTML = `<svg class="en" style="max-width:620px" viewBox="40 0 460 262" role="img" aria-label="箱中粒子能階">${s}</svg>`;
    $('#pbO', el).textContent = `${fx(st.L, 2)} nm`; $('#pbL', el).value = st.L;
    $('#pbF', el).innerHTML = `Eₙ = n²h² / (8mL²)　→　ΔE = (${b}² − ${a}²) × h²/(8mL²) = <b>${b * b - a * a} E₁</b>`;
    $('#pbK', el).innerHTML = card('e1', 'E₁（電子）', `${fx(eV, 3)} eV`) + card('de', 'ΔE', `${fx(dE / 1.602e-19, 3)} eV`) + card('l', '吸收光的波長', `${fx(lam * 1e9, 0)} nm`);
    $('#pbN', el).innerHTML = `粒子被關在長度 L 的箱子裡，波函數兩端必須是 0，只能放整數個半波長，所以能量只能取 n² 倍的 E₁。最小的激發是 n = 1 → 2，需要 <b>3h²/(8mL²)</b>。L 變成兩倍，所有能量變成 1/4：箱子越長，能階越密，吸收波長越長。共軛分子越長、吸收光波長越長，就是這個道理。`;
    pressSeg(el, 'pbS', st.t);
  }
  $('#pbL', el).oninput = e => { st.L = +e.target.value; draw(); };
  bindSeg(el, 'pbS', v => { st.t = v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

  return SIGNED.filter(G => det3(G) < 0).find(G => OD.every((v, i) => p.lab[dirIdx(mv(G, v))] === p.lab[i])
    && p.en.every(([a, b]) => { const A = dirIdx(mv(G, OD[a])), B = dirIdx(mv(G, OD[b])); return p.en.some(([c, d]) => (c === A && d === B) || (c === B && d === A)); })) || null;
}
W.oct3d = el => {
  let cur = 'cisen';
  const V0 = m3(rotA([1, 0, 0], 0.38), rotA([0, 1, 0], -0.55)), S = [[-1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const st = { D: [I3(), I3()], A: I3() };   // D：兩個模型各自被拖動的轉動；A：鏡像模型自己的轉動
  el.innerHTML = `${seg('o3S', Object.entries(OPRE).map(([k, v]) => [k, v.t]), cur)}<div id="o3G" class="o3g"></div><div class="w-row"><button class="btn sm pri" type="button" data-fit>疊疊看：右邊轉得成左邊嗎？</button><button class="btn sm" type="button" data-reset>轉回原位</button></div><p class="note" id="o3N"></p>`;
  const T = m3(m3(V0.map((r, i) => V0.map(q => q[i])), S), V0);   // 模型空間中的鏡射：Vᵀ S V
  function model(k) {   // 回傳畫面座標
    const p = OPRE[cur], M = k ? m3(st.D[1], m3(V0, m3(st.A, T))) : m3(st.D[0], V0), cx = k ? 380 : 140;
    return { pts: OD.map((v, i) => { const [x, y, z] = mv(M, v); return { i, x: cx + x * 78, y: 135 - y * 78, z, l: p.lab[i] }; }), cx };
  }
  function scene(k) {
    const { pts, cx } = model(k), p = OPRE[cur], order = [...pts].sort((a, b) => a.z - b.z);
    let s = '';
    for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) if (OD[i].every((x, q) => x + OD[j][q] !== 0 || x === 0) && dirIdx(OD[i].map(x => -x)) !== j) s += `<line class="oe" x1="${pts[i].x}" y1="${pts[i].y}" x2="${pts[j].x}" y2="${pts[j].y}"/>`;
    const far = order.filter(q => q.z < 0), near = order.filter(q => q.z >= 0);
    const bond = q => `<line class="cb" x1="${cx}" y1="135" x2="${q.x}" y2="${q.y}"/>`;
    const lig = q => { const r = 14 + 3 * q.z; return `<g class="lg lg-${q.l}"><circle cx="${q.x}" cy="${q.y}" r="${r}"/><text x="${q.x}" y="${q.y + 4.5}" text-anchor="middle">${q.l}</text></g>`; };
    const ens = p.en.map(([a, b]) => { const A = pts[a], B = pts[b], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2; return `<path class="enarc" d="M${A.x} ${A.y}Q${mx + (mx - cx) * 0.6} ${my + (my - 135) * 0.6} ${B.x} ${B.y}"/>`; }).join('');
    return s + ens + far.map(bond).join('') + far.map(lig).join('') + `<circle class="mc" cx="${cx}" cy="135" r="12"/><text class="mt" x="${cx}" y="139.5" text-anchor="middle">M</text>` + near.map(bond).join('') + near.map(lig).join('');
  }
  function draw(msg) {
    $('#o3G', el).innerHTML = `<svg class="mol o3" viewBox="20 0 480 270" role="img" aria-label="可轉動的八面體與鏡像"><line class="mirror" x1="260" x2="260" y1="10" y2="245"/><text class="tk" x="260" y="262" text-anchor="middle">鏡子</text>${scene(0)}${scene(1)}</svg>`;
    $('#o3N', el).innerHTML = msg || `用手指或滑鼠<b>拖動</b>左右兩個模型，自己轉轉看。右邊是左邊在鏡子裡的樣子。${OPRE[cur].en.length ? '綠色弧線是一個 en（雙牙配位基），只能跨在相鄰的兩個位置。' : ''} 按「疊疊看」檢查：有沒有一種轉法能讓右邊和左邊完全重合？`;
    pressSeg(el, 'o3S', cur);
  }
  function fit() {
    const G = mirrorMatch(OPRE[cur]);
    st.D = [I3(), I3()];
    if (G) { st.A = m3(G, T); draw(`<span class="ok">疊得起來</span>：把右邊轉一下就和左邊一模一樣（現在兩邊排列相同）。所以它和鏡像是<b>同一個分子</b>，<b>沒有光學異構物</b>（非掌性）。`); }
    else { st.A = I3(); draw(`<span class="bad">疊不起來</span>：八面體一共只有 24 種轉法，全部試過，右邊都無法和左邊重合。左右是一對<b>鏡像異構物</b>（光學異構物），這個錯合物是<b>掌性</b>的。`); }
  }
  let drag = null;
  el.addEventListener('pointerdown', e => { const svg = e.target.closest('svg.o3'); if (!svg) return; const b = svg.getBoundingClientRect(); drag = { k: (e.clientX - b.left) / b.width > 0.5 ? 1 : 0, x: e.clientX, y: e.clientY }; svg.setPointerCapture?.(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    st.D[drag.k] = m3(m3(rotA([0, 1, 0], dx * 0.012), rotA([1, 0, 0], dy * 0.012)), st.D[drag.k]); draw(); });
  el.addEventListener('pointerup', () => { drag = null; });
  bindSeg(el, 'o3S', v => { cur = v; st.D = [I3(), I3()]; st.A = I3(); draw(); });
  $('[data-fit]', el).onclick = fit;
  $('[data-reset]', el).onclick = () => { st.D = [I3(), I3()]; st.A = I3(); draw(); };
  draw();
  return { set(s) { if (s.t) { cur = s.t; st.D = [I3(), I3()]; st.A = I3(); } draw(); if (s.fit) fit(); } };
};

  ma5b: { t: '[MA₅B]（取代統計）', c: { A: 5, B: 1 }, aa: 0 },

const OPP = [1, 0, 3, 2, 5, 4];
function isoEnumerate(f) {
  const perm = (G, i) => dirIdx(mv(G, OD[i])), PROP = SIGNED.filter(G => det3(G) > 0), IMP = SIGNED.filter(G => det3(G) < 0);
  const key = (lab, en) => lab.join('') + '|' + en.map(p => [...p].sort().join('')).sort().join(',');
  const apply = (G, lab, en) => { const L = Array(6); lab.forEach((x, i) => { L[perm(G, i)] = x; }); return [L, en.map(([a, b]) => [perm(G, a), perm(G, b)])]; };
  const canon = (lab, en, ops) => ops.map(G => key(...apply(G, lab, en))).sort()[0];

  const match = (pos) => { if (!pos.length) return [[]]; const [a, ...r] = pos; return r.filter(b => OPP[a] !== b).flatMap(b => match(r.filter(x => x !== b)).map(m => [[a, b], ...m])); };
  const pick = (arr, k) => (k === 0 ? [[]] : arr.flatMap((x, i) => pick(arr.slice(i + 1), k - 1).map(r => [x, ...r])));
  const monoPerms = arr => { const u = [...new Set(arr)]; if (arr.length <= 1) return [arr]; return u.flatMap(x => { const r = [...arr]; r.splice(r.indexOf(x), 1); return monoPerms(r).map(p => [x, ...p]); }); };
  pick([0, 1, 2, 3, 4, 5], 2 * f.aa).forEach(np => match(np).forEach(en => {
    const rest = [0, 1, 2, 3, 4, 5].filter(i => !np.includes(i));
    monoPerms(mono).forEach(mp => { const lab = Array(6).fill('N'); rest.forEach((p, i) => { lab[p] = mp[i]; }); const k = canon(lab, en, PROP); if (!out.has(k)) out.set(k, { lab, en }); });
  }));
  const list = [...out.values()], seen = new Set(), groups = [];
  list.forEach(x => { const k = canon(x.lab, x.en, PROP); if (seen.has(k)) return; seen.add(k);
    const [ml, me] = apply(IMP[0], x.lab, x.en), mk = canon(ml, me, PROP);
    if (mk === k) groups.push([x]); else { const y = list.find(z => canon(z.lab, z.en, PROP) === mk); seen.add(mk); groups.push([x, y]); } });
  return groups;
}

/* ---------- 後中化學：化學平衡的互動圖 ----------
   N₂O₄ ⇌ 2 NO₂：25 °C 時 Kc ≈ 4.6 × 10⁻³（濃度以 M 計），ΔH° ≈ +57.2 kJ/mol（正反應吸熱）。K 隨溫度依 van 't Hoff 式變化。 */
const N2O4 = { K298: 4.6e-3, dH: 57.2e3, R: 8.314 };
const Kat = T => N2O4.K298 * Math.exp(-N2O4.dH / N2O4.R * (1 / T - 1 / 298.15));
// 從 [N₂O₄] = a、[NO₂] = b 出發達到平衡：(b + 2x)² = K(a − x)，取物理上合理的根
function eqSolve(a, b, K) { const B = 4 * b + K, C = b * b - K * a, x = (-B + Math.sqrt(B * B - 16 * C)) / 8; return { a: a - x, b: b + 2 * x, x }; }

/* ===== 1. 動態平衡：A ⇌ B ===== */
W.eqdyn = el => {
  const st = { kf: 0.6, kr: 0.2, t: 2, fromB: false }, T = 12;
  el.innerHTML = `<div class="w-row">${seg('edS', [['A', '從純 A 開始'], ['B', '從純 B 開始']], 'A')}</div>
<div class="w-row"><label class="rng">正反應 k<sub>f</sub> <input type="range" id="edf" min="0.05" max="1.5" step="0.05"><output class="mono" id="edfo"></output></label><label class="rng">逆反應 k<sub>r</sub> <input type="range" id="edr" min="0.05" max="1.5" step="0.05"><output class="mono" id="edro"></output></label></div>
<div class="w-row"><label class="rng">時間 <input type="range" id="edt" min="0" max="${T}" step="0.1"><output class="mono" id="edto"></output></label></div>
<div class="bgrid"><div id="edc"></div><div id="edv"></div></div><div class="cards" id="edk"></div><p class="note" id="edn"></p>`;
  const conc = t => { const s = st.kf + st.kr, Aeq = st.kr / s, A0 = st.fromB ? 0 : 1, A = Aeq + (A0 - Aeq) * Math.exp(-s * t); return [A, 1 - A]; };
  function draw() {

    $('#edc', el).innerHTML = chart({ x: [0, T], y: [0, 1], xt: [0, 3, 6, 9, 12], yt: [0, 0.5, 1], xlab: '時間', ylab: '濃度（M）', h: 220, label: '濃度隨時間' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(1)}"/><circle class="dot2" cx="${X(st.t)}" cy="${Y(A)}" r="5"/><circle class="dot" cx="${X(st.t)}" cy="${Y(B)}" r="5"/><text class="tk lha" x="${X(0.3)}" y="${Y(st.fromB ? 0.06 : 0.93)}">[A]</text><text class="tk la" x="${X(0.3)}" y="${Y(st.fromB ? 0.93 : 0.06)}">[B]</text>`);
    const rmax = Math.max(st.kf, st.kr);
    $('#edv', el).innerHTML = chart({ x: [0, T], y: [0, rmax], xt: [0, 3, 6, 9, 12], yt: [0, +(rmax / 2).toFixed(2), +rmax.toFixed(2)], xlab: '時間', ylab: '反應速率', h: 220, label: '正逆反應速率' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(st.kf * conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(st.kr * conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(rmax)}"/><text class="tk lha" x="${X(T) - 4}" y="${Y(rmax) + 12}" text-anchor="end">藍：正反應 k<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">[A]</tspan></text><text class="tk la" x="${X(T) - 4}" y="${Y(rmax) + 26}" text-anchor="end">橘：逆反應 k<tspan dy="3" font-size="9">r</tspan><tspan dy="-3">[B]</tspan></text>`);
    const Q = A > 1e-9 ? B / A : Infinity, rf = st.kf * A, rr = st.kr * B, eq = Math.abs(rf - rr) < 0.005;
    $('#edk', el).innerHTML = card('q', 'Q = [B] ÷ [A]', Number.isFinite(Q) ? fx(Q) : '∞') + card('k', 'K = k<sub>f</sub> ÷ k<sub>r</sub>', fx(K)) + card('rf', '正反應速率', fx(rf, 3)) + card('rr', '逆反應速率', fx(rr, 3));
    $('#edn', el).innerHTML = eq ? `<b>已達平衡</b>：正逆反應速率相等（都是 ${fx(rf, 3)}），所以濃度不再改變；但兩個反應都還在進行，只是互相抵消。此時 Q = K = ${fx(K)}。`
      : `尚未平衡：${rf > rr ? '正反應比逆反應快，A 持續變成 B' : '逆反應比正反應快，B 持續變回 A'}，Q（${Number.isFinite(Q) ? fx(Q) : '∞'}）${Q < K ? '小於' : '大於'} K（${fx(K)}）。`;
    $('#edfo', el).textContent = fx(st.kf); $('#edro', el).textContent = fx(st.kr); $('#edto', el).textContent = fx(st.t, 1);
    $('#edf', el).value = st.kf; $('#edr', el).value = st.kr; $('#edt', el).value = st.t; pressSeg(el, 'edS', st.fromB ? 'B' : 'A');
  }
  $('#edf', el).oninput = e => { st.kf = +e.target.value; draw(); };
  $('#edr', el).oninput = e => { st.kr = +e.target.value; draw(); };
  $('#edt', el).oninput = e => { st.t = +e.target.value; draw(); };
  bindSeg(el, 'edS', v => { st.fromB = v === 'B'; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 3. 勒沙特列原理：干擾後先看 Q，再看系統怎麼回到平衡 ===== */
W.lechat = el => {
  let st, hist;
  const reset = () => { const r = eqSolve(0.1, 0, Kat(298.15)); st = { T: 298.15, V: 1, nN: r.a, nB: r.b, phase: 'eq', msg: '' }; hist = [{ N: r.a, B: r.b, lab: '起始平衡' }]; };
  reset();
  const ACT = { addN: '加入 N₂O₄', addB: '加入 NO₂', comp: '體積減半（加壓）', exp: '體積加倍（減壓）', heat: '加熱 +30 °C', cool: '冷卻 −30 °C' };
  el.innerHTML = `<div class="w-row">${Object.entries(ACT).map(([k, t]) => `<button class="btn sm" type="button" data-a="${k}">${t}</button>`).join('')}<button class="btn sm ghost" type="button" data-a="reset">⟲ 重來</button></div>
<div class="bgrid"><div id="lcs"></div><div class="cards" id="lck"></div></div><div class="w-row"><button class="btn sm pri" type="button" id="lcgo" disabled>讓系統回到平衡 →</button></div><div id="lch"></div><p class="note" id="lcn" aria-live="polite"></p>`;
  const conc = () => ({ a: st.nN / st.V, b: st.nB / st.V });
  function draw() {
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a, eq = st.phase === 'eq';
    // 針筒：寬度 ∝ 體積，顏色深淺 ∝ [NO₂]（紅棕色）
    const w = 60 + 110 * st.V, op = Math.min(0.95, b / 0.06);
    $('#lcs', el).innerHTML = `<svg viewBox="0 0 280 120" class="bk" role="img" aria-label="裝氣體的針筒"><rect x="20" y="30" width="230" height="60" rx="6" fill="none" stroke="var(--muted)" stroke-width="2"/><rect x="22" y="32" width="${w}" height="56" fill="rgb(150,60,20)" fill-opacity="${op.toFixed(2)}"/><rect x="${22 + w}" y="26" width="8" height="68" fill="var(--muted)"/><rect x="${30 + w}" y="56" width="${230 - w}" height="8" fill="var(--muted)"/><text class="tk" x="24" y="110">顏色越深 = NO₂ 越濃；${fx(st.T - 273.15, 0)} °C、${fx(st.V, 2)} L</text></svg>`;
    $('#lck', el).innerHTML = card('a', '[N₂O₄]', fx(a, 4)) + card('b', '[NO₂]', fx(b, 4)) + card('q', 'Q', sci(Q)) + card('k', `K（${fx(st.T - 273.15, 0)} °C）`, sci(K));
    $('#lcgo', el).disabled = eq;
    const pts = hist, mx = Math.max(...pts.flatMap(p => [p.N, p.B])) * 1.1;
    $('#lch', el).innerHTML = chart({ x: [0, Math.max(4, pts.length - 1)], y: [0, mx], xt: [], yt: [0, +(mx / 2).toFixed(2), +mx.toFixed(2)], xlab: '事件順序（每次干擾 → 回到平衡）', ylab: '濃度（M）', h: 200, label: '濃度變化歷程' }, (X, Y) =>
      `<path class="sha" d="${path(pts.map((p, i) => [X(i), Y(p.N)]))}"/><path class="sa" d="${path(pts.map((p, i) => [X(i), Y(p.B)]))}"/>${pts.map((p, i) => `<circle class="dot3" cx="${X(i)}" cy="${Y(p.N)}" r="3"/><circle class="dot2" cx="${X(i)}" cy="${Y(p.B)}" r="3"/>`).join('')}<text class="tk lha" x="${X(0) + 4}" y="${Y(pts[0].N) - 6}">N₂O₄</text><text class="tk la" x="${X(0) + 4}" y="${Y(pts[0].B) + 14}">NO₂</text>`);
    $('#lcn', el).innerHTML = st.msg || '系統在平衡。選一種干擾，先看 Q 和 K 的關係，再按「讓系統回到平衡」。';
  }
  function act(k) {
    if (k === 'reset') { reset(); draw(); return; }
    if (st.phase !== 'eq') relax();
    const K0 = Kat(st.T);
    if (k === 'addN') st.nN += 0.05; if (k === 'addB') st.nB += 0.02;
    if (k === 'comp') st.V /= 2; if (k === 'exp') st.V *= 2;
    if (k === 'heat') st.T += 30; if (k === 'cool') st.T -= 30;
    st.V = clamp(st.V, 0.125, 2); st.T = clamp(st.T, 238.15, 388.15);
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a;
    hist.push({ N: a, B: b, lab: ACT[k] });
    const why = { addN: '加入反應物 N₂O₄，分母變大，Q 變小', addB: '加入產物 NO₂，分子變大，Q 變大', comp: '體積減半，兩者濃度都加倍；但 [NO₂] 是平方，所以 Q 變成原本的 2 倍', exp: '體積加倍，兩者濃度都減半；Q 變成原本的一半', heat: `Q 沒變，但正反應吸熱，升溫讓 K 從 ${sci(K0)} 變大到 ${sci(K)}`, cool: `Q 沒變，但降溫讓 K 從 ${sci(K0)} 變小到 ${sci(K)}` }[k];
    st.phase = 'pert';
    st.msg = `<b>${ACT[k]}</b>：${why}。現在 Q = ${sci(Q)}，K = ${sci(K)}，<b>Q ${Q < K ? '&lt;' : '&gt;'} K</b> → 系統會<b>${Q < K ? '向右（產生更多 NO₂）' : '向左（產生更多 N₂O₄）'}</b>移動。${k === 'comp' ? '向左可以減少氣體分子數（2 個 NO₂ → 1 個 N₂O₄），部分抵銷加壓。注意顏色：先因為變濃而加深，回到平衡時再稍微變淡。' : k === 'exp' ? '向右可以增加氣體分子數，部分抵銷減壓。' : ''}`;
    draw();
  }
  function relax() {
    const { a, b } = conc(), r = eqSolve(a, b, Kat(st.T));
    st.nN = r.a * st.V; st.nB = r.b * st.V; st.phase = 'eq';
    hist.push({ N: r.a, B: r.b, lab: '回到平衡' });
    st.msg = `回到平衡：[N₂O₄] = ${fx(r.a, 4)}、[NO₂] = ${fx(r.b, 4)} M，Q 又等於 K。系統只能<b>部分抵銷</b>干擾，不會完全回到原來的濃度。`;
  }
  $$('[data-a]', el).forEach(b => { b.onclick = () => act(b.dataset.a); });
  $('#lcgo', el).onclick = () => { relax(); draw(); };
  draw();
  return { set(s) { reset(); if (s.act) act(s.act); draw(); } };
};

W.kdg = el => {

  }

/* ---------- 後中化學：氣體、計量與溶液的互動圖 ---------- */
const RL = 0.08206;   // L·atm/(mol·K)

/* ===== 1. 理想氣體：固定兩個量，看另外兩個 ===== */
W.pvt = el => {
  const st = { law: 'boyle', n: 1, T: 300, V: 24.6, P: 1 };
  const LAW = { boyle: ['波以耳（固定 n、T）', 'V', 'P'], charles: ['查理（固定 n、P）', 'T', 'V'], gay: ['給呂薩克（固定 n、V）', 'T', 'P'], avog: ['亞佛加厥（固定 T、P）', 'n', 'V'] };
  el.innerHTML = `${seg('pvS', Object.entries(LAW).map(([k, v]) => [k, v[0]]), st.law)}<div class="w-row"><label class="rng" id="pvL"></label></div><div class="bgrid"><div id="pvB"></div><div id="pvC"></div></div><div class="cards" id="pvK"></div><p class="note" id="pvN"></p>`;
  const RNG = { V: [5, 50, 0.5, 'V（L）'], T: [100, 600, 5, 'T（K）'], n: [0.2, 3, 0.1, 'n（mol）'] };
  function solve() { const L = st.law; if (L === 'boyle') st.P = st.n * RL * st.T / st.V; if (L === 'charles' || L === 'avog') st.V = st.n * RL * st.T / st.P; if (L === 'gay') st.P = st.n * RL * st.T / st.V; }
  function draw() {
    const [nm, xk, yk] = LAW[st.law], r = RNG[xk]; solve();
    $('#pvL', el).innerHTML = `${r[3]} <input type="range" id="pvX" min="${r[0]}" max="${r[1]}" step="${r[2]}" value="${st[xk]}"><output class="mono">${fx(st[xk], xk === 'n' ? 1 : 0)}</output>`;
    $('#pvX', el).oninput = e => { st[xk] = +e.target.value; draw(); };
    // 活塞：高度 ∝ V，粒子數 ∝ n，粒子顏色亮度 ∝ T
    const h = clamp(st.V / 50, 0.12, 1) * 150, N = Math.round(st.n * 14), heat = clamp((st.T - 100) / 500, 0, 1);
    const dots = Array.from({ length: N }, (_, i) => `<circle cx="${40 + (i * 47 % 140)}" cy="${170 - ((i * 29) % Math.max(10, h - 10)) - 6}" r="4.5" fill="rgb(${Math.round(60 + 190 * heat)},${Math.round(90 - 40 * heat)},${Math.round(200 - 150 * heat)})"/>`).join('');
    $('#pvB', el).innerHTML = `<svg viewBox="0 0 220 200" class="bk" role="img" aria-label="活塞中的氣體"><path d="M30 20L30 180L190 180L190 20" class="glass"/><rect x="31" y="${178 - h - 8}" width="158" height="8" fill="var(--muted)"/><line x1="110" x2="110" y1="${178 - h - 8}" y2="10" stroke="var(--muted)" stroke-width="5"/>${dots}<text class="tk" x="110" y="196" text-anchor="middle">P = ${fx(st.P, 2)} atm</text></svg>`;
    const xs = Array.from({ length: 61 }, (_, i) => r[0] + i * (r[1] - r[0]) / 60);
    const yv = x => { const s = { ...st, [xk]: x }; return yk === 'P' ? s.n * RL * s.T / s.V : s.n * RL * s.T / s.P; };
    const ymax = Math.max(...xs.map(yv)) * 1.05;
    $('#pvC', el).innerHTML = chart({ x: [r[0], r[1]], y: [0, ymax], xt: [r[0], r[1]], yt: [0, +(ymax / 2).toFixed(1), +ymax.toFixed(1)], xlab: r[3], ylab: yk === 'P' ? 'P（atm）' : 'V（L）', h: 220 }, (X, Y) => `<path class="tline" d="${path(xs.map(x => [X(x), Y(yv(x))]))}"/><circle class="dot" cx="${X(st[xk])}" cy="${Y(yv(st[xk]))}" r="7"/>`);
    $('#pvK', el).innerHTML = card('p', 'P', `${fx(st.P, 2)} atm`) + card('v', 'V', `${fx(st.V, 1)} L`) + card('n', 'n', `${fx(st.n, 1)} mol`) + card('t', 'T', `${fx(st.T, 0)} K`);
    $('#pvN', el).innerHTML = { boyle: '<b>P ∝ 1/V</b>：體積變小，同樣的分子撞牆更頻繁，壓力變大（曲線是雙曲線）。', charles: '<b>V ∝ T</b>：溫度升高，分子跑得更快，要維持同樣壓力，體積必須變大。延長直線會通過 0 K，這就是絕對溫標的由來。', gay: '<b>P ∝ T</b>：體積固定時加熱，撞擊更用力、更頻繁，壓力上升（密閉容器加熱很危險）。', avog: '<b>V ∝ n</b>：同溫同壓下，同體積的任何氣體含有相同的分子數。0 °C、1 atm 時 1 mol 理想氣體佔 22.4 L。' }[st.law] + ' 全部合起來就是 <b>PV = nRT</b>（R = 0.08206 L·atm/(mol·K) = 8.314 J/(mol·K)）。溫度一定要用 <b>K</b>。';

/* ===== 2. 分子速率分布與格雷姆定律 ===== */
W.maxwell = el => {
  const G = { He: 4.0, N2: 28.0, O2: 32.0, CO2: 44.0, UF6: 352 }, LAB = { He: 'He', N2: 'N₂', O2: 'O₂', CO2: 'CO₂', UF6: 'UF₆' };
  const st = { a: 'He', b: 'N2', T: 300 };
  el.innerHTML = `<div class="w-row"><label class="sel">氣體 A <select id="mxA">${Object.keys(G).map(k => `<option value="${k}">${LAB[k]}（${G[k]}）</option>`).join('')}</select></label><label class="sel">氣體 B <select id="mxB">${Object.keys(G).map(k => `<option value="${k}">${LAB[k]}（${G[k]}）</option>`).join('')}</select></label><label class="rng">溫度（K）<input type="range" id="mxT" min="100" max="1000" step="10"><output class="mono" id="mxTo"></output></label></div><div id="mxC"></div><div class="cards" id="mxK"></div><p class="note" id="mxN"></p>`;
  const f = (v, M, T) => { const m = M / 1000, a = m / (2 * 8.314 * T); return 4 * Math.PI * (a / Math.PI) ** 1.5 * v * v * Math.exp(-a * v * v); };
  function draw() {
    const vs = Array.from({ length: 151 }, (_, i) => i * 3000 / 150), ua = Math.sqrt(3 * 8.314 * st.T / (G[st.a] / 1000)), ub = Math.sqrt(3 * 8.314 * st.T / (G[st.b] / 1000));
    const ymax = Math.max(...vs.map(v => Math.max(f(v, G[st.a], st.T), f(v, G[st.b], st.T)))) * 1.1;
    $('#mxC', el).innerHTML = chart({ x: [0, 3000], y: [0, ymax], xt: [0, 500, 1000, 1500, 2000, 2500, 3000], yt: [], xlab: '分子速率（m/s）', ylab: '分子比例', h: 220, label: '速率分布' }, (X, Y) => `<path class="sha" d="${path(vs.map(v => [X(v), Y(f(v, G[st.a], st.T))]))}"/><path class="sa" d="${path(vs.map(v => [X(v), Y(f(v, G[st.b], st.T))]))}"/><text class="tk lha" x="${X(Math.min(2900, ua))}" y="${Y(ymax * 0.95)}">${LAB[st.a]}</text><text class="tk la" x="${X(Math.min(2900, ub))}" y="${Y(ymax * 0.85)}">${LAB[st.b]}</text>`);
    $('#mxK', el).innerHTML = card('a', `${LAB[st.a]} 的 u<sub>rms</sub>`, `${fx(ua, 0)} m/s`) + card('b', `${LAB[st.b]} 的 u<sub>rms</sub>`, `${fx(ub, 0)} m/s`) + card('r', '擴散速率比 A : B', `${fx(Math.sqrt(G[st.b] / G[st.a]), 2)} : 1`);
    $('#mxN', el).innerHTML = `同一溫度下，所有氣體的<b>平均動能相同</b>（½mu² = 3/2 kT），所以輕的分子跑得快：u<sub>rms</sub> = √(3RT/M)（M 用 kg/mol）。<b>格雷姆定律</b>：逸散或擴散速率 ∝ 1/√M，${LAB[st.a]} 比 ${LAB[st.b]} 快 √(${G[st.b]} ÷ ${G[st.a]}) = ${fx(Math.sqrt(G[st.b] / G[st.a]), 2)} 倍。曼哈頓計畫就是利用 ²³⁵UF₆ 和 ²³⁸UF₆ 微小的速率差來濃縮鈾。`;
    $('#mxA', el).value = st.a; $('#mxB', el).value = st.b; $('#mxT', el).value = st.T; $('#mxTo', el).textContent = st.T;
  }

  $('#mxB', el).onchange = e => { st.b = e.target.value; draw(); };
  $('#mxT', el).oninput = e => { st.T = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };

/* ===== 3. 限量試劑 ===== */
W.limiting = el => {
  const RX = { nh3: { n: 'N₂ + 3H₂ → 2NH₃', A: 'N₂', B: 'H₂', P: 'NH₃', ca: 1, cb: 3, cp: 2 }, h2o: { n: '2H₂ + O₂ → 2H₂O', A: 'H₂', B: 'O₂', P: 'H₂O', ca: 2, cb: 1, cp: 2 } };
  const st = { rx: 'nh3', a: 3, b: 6 };
  el.innerHTML = `${seg('lmS', Object.entries(RX).map(([k, v]) => [k, v.n]), st.rx)}<div class="w-row"><label class="rng" id="lmA"></label><label class="rng" id="lmB"></label></div><div id="lmV"></div><p class="note" id="lmN"></p>`;
  function draw() {
    const r = RX[st.rx], ext = Math.min(st.a / r.ca, st.b / r.cb), lim = st.a / r.ca < st.b / r.cb ? r.A : st.a / r.ca > st.b / r.cb ? r.B : '剛好';
    const la = st.a - r.ca * ext, lb = st.b - r.cb * ext, p = r.cp * ext;
    $('#lmA', el).innerHTML = `${r.A}（mol） <input type="range" id="lmAi" min="0" max="10" step="1" value="${st.a}"><output class="mono">${st.a}</output>`;
    $('#lmB', el).innerHTML = `${r.B}（mol） <input type="range" id="lmBi" min="0" max="12" step="1" value="${st.b}"><output class="mono">${st.b}</output>`;
    $('#lmAi', el).oninput = e => { st.a = +e.target.value; draw(); }; $('#lmBi', el).oninput = e => { st.b = +e.target.value; draw(); };
    const row = (lab, n, cls, tot) => `<div class="lmrow"><span>${lab}</span><span>${Array.from({ length: Math.round(tot) }, (_, i) => `<i class="${i < n - 1e-9 ? cls : 'used'}"></i>`).join('')}</span><b class="mono">${fx(n, 1)}</b></div>`;
    $('#lmV', el).innerHTML = `<p class="lbl">反應前 → 反應後（每個方塊 1 mol）</p>${row(r.A + ' 剩下', la, 'qa', st.a)}${row(r.B + ' 剩下', lb, 'qb', st.b)}${row(r.P + ' 生成', p, 'qp', Math.max(1, p))}`;
    $('#lmN', el).innerHTML = st.a === 0 || st.b === 0 ? '缺少一種反應物，不會反應。' : `用係數換算：${r.A} 夠反應 ${fx(st.a / r.ca, 2)} 次「一份反應」，${r.B} 夠 ${fx(st.b / r.cb, 2)} 次。<b>次數較少的就是限量試劑</b>：${lim === '剛好' ? '兩者剛好用完' : `<b>${lim}</b>，它用完反應就停止`}。生成 ${r.P} = ${r.cp} × ${fx(ext, 2)} = ${fx(p, 2)} mol。注意：不是直接比莫耳數多寡，而是要除以係數。`;
    pressSeg(el, 'lmS', st.rx);
  }
  bindSeg(el, 'lmS', v => { st.rx = v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 1. 初速率法：自己做實驗找出反應級數 ===== */
W.ratelaw = el => {
  const RX = {
    no: { n: '2NO + O₂ → 2NO₂', A: 'NO', B: 'O₂', m: 2, n2: 1 },
    sn1: { n: '(CH₃)₃CBr + OH⁻ → (CH₃)₃COH + Br⁻', A: '(CH₃)₃CBr', B: 'OH⁻', m: 1, n2: 0 },
    sn2: { n: 'CH₃Br + OH⁻ → CH₃OH + Br⁻', A: 'CH₃Br', B: 'OH⁻', m: 1, n2: 1 },
  };
  let cur = 'no', A = 0.1, B = 0.1, rows = [], gm = null, gn = null;
  el.innerHTML = `${seg('rlS', Object.entries(RX).map(([k, v]) => [k, v.n]), cur)}<div class="w-row" id="rlC"></div><div class="w-row"><button class="btn sm pri" type="button" id="rlGo">做實驗：量初速率</button><button class="btn sm ghost" type="button" id="rlR">清除紀錄</button></div><div id="rlT"></div><div class="w-row" id="rlG"></div><p class="note" id="rlN"></p>`;
  const rate = (a, b) => { const r = RX[cur]; return a ** r.m * b ** r.n2; };
  function draw() {
    const r = RX[cur];
    $('#rlC', el).innerHTML = [['A', r.A, A], ['B', r.B, B]].map(([k, lab, v]) => `<span class="small">[${lab}] = <b class="mono">${fx(v, 2)}</b> M</span><button class="btn sm" type="button" data-c="${k}" data-f="0.5">÷2</button><button class="btn sm" type="button" data-c="${k}" data-f="2">×2</button><span class="sp"></span>`).join('');
    $$('[data-c]', el).forEach(b => { b.onclick = () => { const f = +b.dataset.f; if (b.dataset.c === 'A') A = clamp(A * f, 0.0125, 0.8); else B = clamp(B * f, 0.0125, 0.8); draw(); }; });
    const r0 = rows[0];
    $('#rlT', el).innerHTML = rows.length ? `<table class="tbl"><thead><tr><th>實驗</th><th>[${r.A}]（M）</th><th>[${r.B}]（M）</th><th>初速率（相對）</th></tr></thead><tbody>${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${fx(x.a, 3)}</td><td>${fx(x.b, 3)}</td><td class="mono">${fx(x.r / r0.r, 2)}</td></tr>`).join('')}</tbody></table>` : '<p class="small mut">還沒有實驗紀錄。調整濃度後按「做實驗」。技巧：每次只改變一種反應物的濃度。</p>';
    $('#rlG', el).innerHTML = `<span class="small">你的猜測：rate = k[${r.A}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gm === v ? ' pri' : ''}" type="button" data-gm="${v}">${v}</button>`).join('')}<span class="small">[${r.B}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gn === v ? ' pri' : ''}" type="button" data-gn="${v}">${v}</button>`).join('')}`;
    $$('[data-gm]', el).forEach(b => { b.onclick = () => { gm = +b.dataset.gm; draw(); }; });
    $$('[data-gn]', el).forEach(b => { b.onclick = () => { gn = +b.dataset.gn; draw(); }; });
    let msg = '先做至少三次實驗：一次當基準，一次只把第一種反應物加倍，一次只把第二種加倍。';
    if (gm != null && gn != null) msg = gm === r.m && gn === r.n2 ? `<span class="ok">✓ 正確</span>：rate = k[${r.A}]${r.m > 1 ? `<sup>${r.m}</sup>` : r.m ? '' : '⁰'}[${r.B}]${r.n2 > 1 ? `<sup>${r.n2}</sup>` : r.n2 ? '' : '⁰'}，總級數 ${r.m + r.n2}。${cur === 'sn1' ? '速率和 OH⁻ 無關：這正是 SN1，最慢的一步只有鹵烷參與。' : cur === 'sn2' ? '兩者都是一級：SN2 的過渡狀態同時包含兩者。' : '注意級數不等於方程式的係數也可以；這裡剛好相同，但必須由實驗決定。'}`
      : `<span class="bad">還不對</span>。找兩次「只有 [${r.A}] 不同」的實驗：濃度變 2 倍時速率變幾倍？2¹ = 2 → 一級；2² = 4 → 二級；不變 → 零級。`;
    $('#rlN', el).innerHTML = msg; pressSeg(el, 'rlS', cur);
  }
  bindSeg(el, 'rlS', v => { cur = v; rows = []; gm = gn = null; A = B = 0.1; draw(); });
  $('#rlGo', el).onclick = () => { rows.push({ a: A, b: B, r: rate(A, B) }); if (rows.length > 8) rows.shift(); draw(); };
  $('#rlR', el).onclick = () => { rows = []; draw(); };
  draw();
  return { set(s) { if (s.rx) { cur = s.rx; rows = []; } (s.rows || []).forEach(([a, b]) => rows.push({ a, b, r: rate(a, b) })); gm = s.gm ?? gm; gn = s.gn ?? gn; draw(); } };
};

/* ===== 2. 積分速率式：哪一種圖是直線 ===== */
W.order = el => {
  const st = { n: 1, k: 0.2 }, A0 = 1, T = 20;
  el.innerHTML = `${seg('orS', [['0', '零級'], ['1', '一級'], ['2', '二級']], '1')}<div class="w-row"><label class="rng">速率常數 k <input type="range" id="ork" min="0.02" max="0.5" step="0.01"><output class="mono" id="oro"></output></label></div><div class="og" id="orG"></div><div class="cards" id="orK"></div><p class="note" id="orN"></p>`;
  const Af = t => st.n === 0 ? Math.max(1e-4, A0 - st.k * t * 0.1) : st.n === 1 ? A0 * Math.exp(-st.k * t) : 1 / (1 / A0 + st.k * t);
  function draw() {
    const ts = Array.from({ length: 101 }, (_, i) => i * T / 100), k = st.n === 0 ? st.k * 0.1 : st.k;
    const half = st.n === 0 ? A0 / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * A0);
    const hs = []; let a = A0, t = 0; for (let i = 0; i < 4; i++) { const h = st.n === 0 ? a / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * a); t += h; a /= 2; if (t > T) break; hs.push([t, h]); }
    const plots = [['[A]', v => v, [0, 1], '[A] 對時間'], ['ln[A]', v => Math.log(v), [-5, 0], 'ln[A] 對時間'], ['1/[A]', v => 1 / v, [0, 12], '1/[A] 對時間']];
    $('#orG', el).innerHTML = plots.map(([lab, f, yr, ttl], i) => {
      const straight = i === st.n;
      return `<div class="${straight ? 'og-on' : ''}"><p class="lbl">${ttl}${straight ? '　← 直線' : ''}</p>${chart({ x: [0, T], y: yr, xt: [0, 10, 20], yt: yr, xlab: '時間', ylab: lab, h: 190, w: 300 }, (X, Y) => `<path class="${straight ? 'tline' : 'tline2'}" d="${path(ts.map(t => [X(t), Y(clamp(f(Af(t)), yr[0], yr[1]))]))}"/>${i === 0 ? hs.map(([tt]) => `<line class="mk" x1="${X(tt)}" x2="${X(tt)}" y1="${Y(0)}" y2="${Y(1)}"/>`).join('') : ''}`)}</div>`;
    }).join('');
    $('#orK', el).innerHTML = card('h', '第一個半生期', fx(half, 2)) + card('h2', '連續半生期', hs.map(h => fx(h[1], 1)).join('、') || '—');
    $('#orN', el).innerHTML = [
      `<b>零級</b>：rate = k，速率和濃度無關，[A] 隨時間<b>直線</b>下降：[A] = [A]₀ − kt。半生期 t½ = [A]₀ ÷ 2k，濃度越低半生期越短。常見於酵素飽和、表面催化。`,
      `<b>一級</b>：rate = k[A]，<b>ln[A] 對時間是直線</b>，斜率 −k：ln[A] = ln[A]₀ − kt。半生期 <b>t½ = 0.693 ÷ k</b>，和起始濃度無關，所以連續的半生期都一樣長（左圖的虛線等間隔）。放射性衰變、多數藥物排除都是一級。`,
      `<b>二級</b>：rate = k[A]²，<b>1/[A] 對時間是直線</b>，斜率 k：1/[A] = 1/[A]₀ + kt。半生期 t½ = 1 ÷ (k[A]₀)，濃度越低半生期越長。`][st.n] + ' 判斷級數的方法：把數據畫成三種圖，哪一種是直線，就是幾級。';
    $('#oro', el).textContent = fx(st.k); $('#ork', el).value = st.k; pressSeg(el, 'orS', String(st.n));
  }
  bindSeg(el, 'orS', v => { st.n = +v; draw(); });
  $('#ork', el).oninput = e => { st.k = +e.target.value; draw(); };
  draw();
  return { set(s) { if (s.n != null) st.n = s.n; draw(); } };
};

/* ===== 3. 活化能與溫度：能量分佈的尾巴 ===== */
W.arrh = el => {
  const st = { T: 298, Ea: 50, cat: false };
  el.innerHTML = `<div class="w-row"><label class="rng">溫度（K）<input type="range" id="arT" min="250" max="450" step="1"><output class="mono" id="arTo"></output></label><label class="rng">活化能 Ea（kJ/mol）<input type="range" id="arE" min="10" max="120" step="1"><output class="mono" id="arEo"></output></label></div><label class="chk"><input type="checkbox" id="arC"> 加入催化劑（活化能降低 30 kJ/mol）</label><div class="bgrid"><div id="arD"></div><div id="arP"></div></div><div class="cards" id="arK"></div><p class="note" id="arN"></p>`;
  const R = 8.314e-3, dens = (E, T) => 2 / Math.sqrt(Math.PI) * (R * T) ** -1.5 * Math.sqrt(E) * Math.exp(-E / (R * T));
  function draw() {
    const Ea = Math.max(5, st.Ea - (st.cat ? 30 : 0)), Emax = 140, es = Array.from({ length: 141 }, (_, i) => i * Emax / 140 + 0.01);
    const lg = v => Math.max(-14, Math.log10(v));
    $('#arD', el).innerHTML = chart({ x: [0, Emax], y: [-14, 0], xt: [0, 20, 40, 60, 80, 100, 120, 140], yt: [-12, -8, -4, 0], xlab: '分子的動能（kJ/mol）', ylab: '分子比例（對數刻度）', h: 230, label: '能量分佈' }, (X, Y) =>
      `<path class="area" d="${path([[X(Ea), Y(-14)], ...es.filter(e => e >= Ea).map(e => [X(e), Y(lg(dens(e, st.T)))]), [X(Emax), Y(-14)]])}Z"/><path class="tline2" d="${path(es.map(e => [X(e), Y(lg(dens(e, 298)))]))}"/><path class="tline" d="${path(es.map(e => [X(e), Y(lg(dens(e, st.T)))]))}"/><line class="cur" x1="${X(Ea)}" x2="${X(Ea)}" y1="${Y(-14)}" y2="${Y(0)}"/><text class="tk" x="${X(Ea) + 4}" y="${Y(-1)}">Ea</text><text class="tk" x="${X(Emax) - 4}" y="${Y(-0.6)}" text-anchor="end">藍：${st.T} K　灰虛線：298 K</text>`);
    $('#arP', el).innerHTML = energySVG([[0, 0.3], [0.5, Math.min(0.97, 0.3 + st.Ea / 180)], [1, 0.12]], null, { labels: [[0.5, `Ea = ${st.Ea}${st.cat ? '（綠：有催化劑）' : ''}`]], alt: st.cat ? [[0, 0.3], [0.5, Math.min(0.97, 0.3 + Ea / 180)], [1, 0.12]] : null }) + '<p class="small mut c">反應能量圖</p>';
    const f = Math.exp(-Ea / (R * st.T)), f0 = Math.exp(-st.Ea / (R * 298)), ratio = f / f0, r10 = Math.exp(Ea / R * (1 / st.T - 1 / (st.T + 10)));
    $('#arK', el).innerHTML = card('f', '能越過 Ea 的比例 ≈ e<sup>−Ea/RT</sup>', sci(f)) + card('r', '速率是 298 K 無催化劑的', `${ratio >= 100 ? sci(ratio, 1) : fx(ratio, 2)} 倍`) + card('r10', '再升溫 10 K，速率變為', `${fx(r10, 2)} 倍`);
    $('#arN', el).innerHTML = `阿瑞尼斯方程式 k = A e<sup>−Ea/RT</sup>：只有能量超過 Ea 的碰撞才能反應。這些分子在分佈的<b>尾巴</b>上，所以溫度稍微升高，尾巴就抬高很多（縱軸是對數刻度）。Ea = ${Ea} kJ/mol 時，在 ${st.T} K 每升溫 10 K，速率約變為 ${fx(r10, 1)} 倍。${st.cat ? '催化劑提供另一條活化能較低的路徑，速率大增；但它同時加快正逆反應，<b>不改變平衡常數</b>。' : ''}`;
    $('#arTo', el).textContent = st.T; $('#arEo', el).textContent = st.Ea; $('#arT', el).value = st.T; $('#arE', el).value = st.Ea; $('#arC', el).checked = st.cat;
  }
  $('#arT', el).oninput = e => { st.T = +e.target.value; draw(); };
  $('#arE', el).oninput = e => { st.Ea = +e.target.value; draw(); };
  $('#arC', el).onchange = e => { st.cat = e.target.checked; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 4. 多步驟反應：速率決定步驟 ===== */
W.rds = el => {
  const st = { h1: 0.85, h2: 0.65 };
  el.innerHTML = `<p class="eq">步驟 1：A ⇌ I（中間物）　　步驟 2：I + B → P</p><div class="w-row"><label class="rng">過渡狀態 1 的高度 <input type="range" id="rd1" min="0.62" max="0.95" step="0.01"></label><label class="rng">過渡狀態 2 的高度 <input type="range" id="rd2" min="0.62" max="0.95" step="0.01"></label></div><div class="bgrid"><div id="rdE"></div><div><div class="verdict" id="rdV"></div></div></div><p class="note" id="rdN"></p>`;
  function draw() {
    const one = st.h1 >= st.h2;
    $('#rdE', el).innerHTML = energySVG([[0, 0.3], [0.25, st.h1], [0.5, 0.55], [0.75, st.h2], [1, 0.1]], null, { labels: [[0.25, '過渡狀態 1'], [0.5, '中間物 I', 14], [0.75, '過渡狀態 2']], w: 320, h: 170 });
    $('#rdV', el).innerHTML = `<span class="lbl">速率決定步驟</span><b class="big">步驟 ${one ? 1 : 2}</b><span class="lbl">速率式</span><b>${one ? 'rate = k₁[A]' : 'rate = k₂K₁[A][B]'}</b>`;
    $('#rdN', el).innerHTML = one ? '過渡狀態 1 最高，第一步最慢：中間物一生成就被很快消耗，整體速率由第一步決定，<b>只和 A 有關</b>，B 的濃度不影響速率。SN1 就是這種情況（RX 先解離，親核基再快速加上）。'
      : '過渡狀態 2 最高，第二步最慢：第一步很快達到平衡（[I] = K₁[A]），整體速率 = k₂[I][B] = k₂K₁[A][B]，<b>A 和 B 都出現在速率式中</b>。快速平衡之後的慢步驟，速率式會包含它之前所有步驟的反應物。';
    $('#rd1', el).value = st.h1; $('#rd2', el).value = st.h2;
  }
  $('#rd1', el).oninput = e => { st.h1 = +e.target.value; draw(); };
  $('#rd2', el).oninput = e => { st.h2 = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ---------- 後中化學：溶解度平衡的互動圖 ----------
   Ksp（25 °C，常見教科書數值；不同教科書略有差異） */
const KSP = {
  AgCl: { n: 'AgCl', k: 1.8e-10, x: 1, y: 1, c: 'Ag⁺', a: 'Cl⁻' },
  AgBr: { n: 'AgBr', k: 5.0e-13, x: 1, y: 1, c: 'Ag⁺', a: 'Br⁻' },
  AgI: { n: 'AgI', k: 8.3e-17, x: 1, y: 1, c: 'Ag⁺', a: 'I⁻' },
  BaSO4: { n: 'BaSO₄', k: 1.1e-10, x: 1, y: 1, c: 'Ba²⁺', a: 'SO₄²⁻' },
  CaF2: { n: 'CaF₂', k: 3.9e-11, x: 1, y: 2, c: 'Ca²⁺', a: 'F⁻' },
  Ag2CrO4: { n: 'Ag₂CrO₄', k: 1.1e-12, x: 2, y: 1, c: 'Ag⁺', a: 'CrO₄²⁻' },
};
const solub = d => (d.k / (d.x ** d.x * d.y ** d.y)) ** (1 / (d.x + d.y));

/* ===== 1. Ksp 與莫耳溶解度 ===== */
W.ksp = el => {
  let cur = 'AgCl';
  el.innerHTML = `${seg('kpS', Object.entries(KSP).map(([k, v]) => [k, v.n]), cur)}<ol class="cs" id="kpC"></ol><div class="bars pk" id="kpB"></div><p class="small mut">各鹽類在純水中的莫耳溶解度 s（對數長度）</p><p class="note" id="kpN"></p>`;
  function draw() {
    const d = KSP[cur], s = solub(d), co = d.x === 1 ? 's' : `${d.x}s`, an = d.y === 1 ? 's' : `${d.y}s`;
    $('#kpC', el).innerHTML = `<li>${d.n}(s) ⇌ ${d.x > 1 ? d.x : ''}${d.c} + ${d.y > 1 ? d.y : ''}${d.a}</li><li>設溶解度為 s（M）：[${d.c}] = ${co}、[${d.a}] = ${an}</li><li>Ksp = (${co})${d.x > 1 ? '²' : ''}(${an})${d.y > 1 ? '²' : ''} = ${d.x ** d.x * d.y ** d.y === 1 ? '' : d.x ** d.x * d.y ** d.y}s${d.x + d.y > 2 ? '³' : '²'} = ${sci(d.k)}</li><li>s = <b>${sci(s)} M</b></li>`;
    const ls = Object.values(KSP).map(solub), lo = Math.log10(Math.min(...ls)), hi = Math.log10(Math.max(...ls));
    $('#kpB', el).innerHTML = Object.entries(KSP).map(([k, v]) => { const sv = solub(v); return `<div class="${k === cur ? 'on' : ''}"><span>${v.n}（Ksp ${sci(v.k, 1)}）</span><i class="ba" style="width:${8 + 92 * (Math.log10(sv) - lo) / (hi - lo)}%"></i><b class="mono">${sci(sv, 1)} M</b></div>`; }).join('');
    $('#kpN', el).innerHTML = cur === 'Ag2CrO4' ? '注意：Ag₂CrO₄ 的 Ksp（1.1 × 10⁻¹²）比 AgCl（1.8 × 10⁻¹⁰）小，但溶解度反而<b>比較大</b>。因為 Ksp 的式子次方不同（s³ 對 s²），<b>只有化學式類型相同的鹽才能直接用 Ksp 比較溶解度</b>。'
      : `${d.n}：Ksp 是飽和溶液中離子濃度乘積（各取係數次方），固體不寫入。${d.x + d.y === 2 ? '1:1 型的鹽 s = √Ksp。' : `${d.x}:${d.y} 型的鹽 Ksp = 4s³，s = ∛(Ksp/4)。`} 鹵化銀的溶解度 AgCl > AgBr > AgI，這是用沉澱顏色（白、淡黃、黃）鑑定鹵離子的基礎。`;
    pressSeg(el, 'kpS', cur);
  }
  bindSeg(el, 'kpS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.salt || cur; draw(); } };
};

/* ===== 2. 同離子效應 ===== */
W.commonion = el => {
  let c = 0.01; const K = KSP.AgCl.k;
  el.innerHTML = `<p class="eq">AgCl(s) ⇌ Ag⁺ + Cl⁻　　加入 NaCl（提供額外的 Cl⁻）</p><div class="w-row"><label class="rng">加入的 [Cl⁻]（M）<input type="range" id="ciC" min="-8" max="0" step="0.1"><output class="mono" id="ciO"></output></label></div><div id="ciG"></div><div class="cards" id="ciK"></div><p class="note" id="ciN"></p>`;
  const s = cl => (-cl + Math.sqrt(cl * cl + 4 * K)) / 2;
  function draw() {
    const xs = Array.from({ length: 81 }, (_, i) => -8 + i * 0.1), v = s(c);
    $('#ciG', el).innerHTML = chart({ x: [-8, 0], y: [-11, -4], xt: [-8, -6, -4, -2, 0], yt: [-10, -8, -6, -4], xlab: 'log 加入的 [Cl⁻]', ylab: 'log 溶解度 s', h: 220, label: '同離子效應' }, (X, Y) => `<path class="tline" d="${path(xs.map(x => [X(x), Y(Math.log10(s(10 ** x)))]))}"/><circle class="dot" cx="${X(Math.log10(c))}" cy="${Y(Math.log10(v))}" r="7"/><line class="mk" x1="${X(-8)}" x2="${X(0)}" y1="${Y(Math.log10(Math.sqrt(K)))}" y2="${Y(Math.log10(Math.sqrt(K)))}"/><text class="tk" x="${X(-7.9)}" y="${Y(Math.log10(Math.sqrt(K))) - 6}">純水中 1.3 × 10⁻⁵ M</text>`);
    $('#ciK', el).innerHTML = card('s', 'AgCl 溶解度', `${sci(v)} M`) + card('r', '是純水中的', `${sci(v / Math.sqrt(K), 2)} 倍`);
    $('#ciN', el).innerHTML = `溶液中已經有 Cl⁻，Ksp = [Ag⁺][Cl⁻] 要維持不變，能溶解的 Ag⁺ 就變少：勒沙特列原理。當加入的 Cl⁻ 遠大於 s 時，s ≈ Ksp ÷ [Cl⁻] = ${sci(K / c)} M。這就是為什麼鹵化銀沉澱要用含同離子的溶液清洗，損失較少。`;
    $('#ciC', el).value = Math.log10(c); $('#ciO', el).textContent = sci(c, 1);
  }
  $('#ciC', el).oninput = e => { c = 10 ** +e.target.value; draw(); };
  draw();
  return { set(st) { c = st.c ?? c; draw(); } };
};

/* ===== 3. 會不會沉澱：比較 Q 與 Ksp ===== */
W.precip = el => {
  const st = { ca: 1e-4, va: 50, cb: 1e-4, vb: 50 }, K = KSP.AgCl.k;
  el.innerHTML = `<p class="eq">AgNO₃ 溶液 + NaCl 溶液 → 混合後是否生成 AgCl 沉澱？</p><div class="w-row"><label class="rng">[AgNO₃]（M）<input type="range" id="ppA" min="-7" max="-1" step="0.1"><output class="mono" id="ppAo"></output></label><label class="rng">[NaCl]（M）<input type="range" id="ppB" min="-7" max="-1" step="0.1"><output class="mono" id="ppBo"></output></label></div><ol class="cs" id="ppC"></ol><p class="note" id="ppN"></p>`;
  function draw() {
    const V = st.va + st.vb, ag = st.ca * st.va / V, cl = st.cb * st.vb / V, Q = ag * cl, ppt = Q > K;
    $('#ppC', el).innerHTML = `<li>混合後體積加倍，濃度各減半：[Ag⁺] = ${sci(ag)} M、[Cl⁻] = ${sci(cl)} M</li><li>Q = [Ag⁺][Cl⁻] = ${sci(Q)}</li><li>Ksp(AgCl) = ${sci(K)}　→　Q ${ppt ? '&gt;' : '≤'} Ksp</li>`;
    $('#ppN', el).innerHTML = ppt ? `<span class="bad">會沉澱</span>：離子濃度乘積超過 Ksp，溶液過飽和，AgCl 會析出，直到剩下的離子濃度乘積降回 Ksp。` : `<span class="ok">不會沉澱</span>：Q 還沒達到 Ksp，溶液未飽和，離子都留在溶液中。`;
    $('#ppA', el).value = Math.log10(st.ca); $('#ppB', el).value = Math.log10(st.cb); $('#ppAo', el).textContent = sci(st.ca, 1); $('#ppBo', el).textContent = sci(st.cb, 1);
  }
  $('#ppA', el).oninput = e => { st.ca = 10 ** +e.target.value; draw(); };
  $('#ppB', el).oninput = e => { st.cb = 10 ** +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ---------- 後中化學：有機基礎（形式電荷、混成、共振、有機酸鹼）的互動圖 ---------- */

/* ===== 1. 形式電荷 ===== */
W.fc = el => {
  const EL = { C: 4, N: 5, O: 6, X: 7 }, NAME = { C: '碳', N: '氮', O: '氧', X: '鹵素（F、Cl、Br、I）' };
  const st = { e: 'N', b: 4, lp: 0 };
  el.innerHTML = `<p class="lbl">原子</p>${seg('fcE', Object.entries(NAME), st.e)}<div class="w-row"><span class="small">鍵數（雙鍵算 2）</span>${[1, 2, 3, 4].map(v => `<button class="btn sm" type="button" data-b="${v}">${v}</button>`).join('')}<span class="sp"></span><span class="small">孤對電子對數</span>${[0, 1, 2, 3].map(v => `<button class="btn sm" type="button" data-l="${v}">${v}</button>`).join('')}</div><div class="bgrid"><div id="fcM"></div><div id="fcK"></div></div><p class="note" id="fcN"></p>`;
  function draw() {
    const v = EL[st.e], fc = v - 2 * st.lp - st.b, e = 2 * st.b + 2 * st.lp, lab = st.e === 'X' ? 'X' : st.e;
    const angs = { 1: [0], 2: [0, 180], 3: [90, 210, 330], 4: [90, 0, 180, 270] }[st.b], lps = [45, 135, 225, 315].slice(0, st.lp);
    const atoms = { A: { x: 0, y: 0, t: lab, lp: lps, c: fc > 0 ? '+' : fc < 0 ? '−' : '' } }, bonds = [];
    angs.forEach((a, i) => { atoms['r' + i] = { x: Math.cos(a * Math.PI / 180) * 1.2, y: Math.sin(a * Math.PI / 180) * 1.2, t: 'R' }; bonds.push(['A', 'r' + i, 's']); });
    $('#fcM', el).innerHTML = MOL.svg({ atoms, bonds }, { w: 220, h: 200, s: 56 });
    $('#fcK', el).innerHTML = card('v', '價電子', v) + card('n', '− 非鍵電子', 2 * st.lp) + card('b', '− 鍵數', st.b) + card('f', '形式電荷', fc > 0 ? `+${fc}` : fc < 0 ? `−${-fc}` : '0') + card('o', '周圍電子', `${e}${e === 8 ? '（八隅）' : ''}`);
    const common = { 'C4,0': '中性碳（最常見）', 'C3,0': '碳陽離子（只有 6 個電子，缺電子）', 'C3,1': '碳陰離子', 'N3,1': '中性氮（胺）', 'N4,0': '銨離子型的氮，帶 +1', 'N2,2': '帶 −1 的氮（例如 NH₂⁻）', 'O2,2': '中性氧（醇、醚）', 'O3,1': '鎓離子型的氧（例如 H₃O⁺、質子化的醇），帶 +1', 'O1,3': '帶 −1 的氧（例如 HO⁻、RO⁻）', 'X1,3': '中性鹵素', 'X0,4': '鹵離子' }[st.e + st.b + ',' + st.lp];
    $('#fcN', el).innerHTML = `形式電荷 = 價電子 − 非鍵電子 − 鍵數 = ${v} − ${2 * st.lp} − ${st.b} = <b>${fc}</b>。${common ? `這是<b>${common}</b>。` : ''}${e > 8 && st.e !== 'X' ? '<span class="bad">第二週期元素周圍超過 8 個電子，不可能存在。</span>' : ''}<br>記住常見組合就不用每次算：碳 4 鍵中性、3 鍵帶電；氮 3 鍵中性、4 鍵 +1；氧 2 鍵中性、3 鍵 +1、1 鍵 −1。`;
    pressSeg(el, 'fcE', st.e); $$('[data-b]', el).forEach(b => b.classList.toggle('pri', +b.dataset.b === st.b)); $$('[data-l]', el).forEach(b => b.classList.toggle('pri', +b.dataset.l === st.lp));
  }
  bindSeg(el, 'fcE', v => { st.e = v; draw(); });
  $$('[data-b]', el).forEach(b => { b.onclick = () => { st.b = +b.dataset.b; draw(); }; });
  $$('[data-l]', el).forEach(b => { b.onclick = () => { st.lp = +b.dataset.l; draw(); }; });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ---------- 後中化學：相圖、晶格與核化學的互動圖 ---------- */

/* ===== 1. 相圖：水與二氧化碳 =====
   以實測的特徵點畫邊界（三相點、正常沸點或昇華點、臨界點），氣液線與昇華線在 (1/T, ln P) 上分段線性；熔化線用近似斜率。圖為示意，但特徵點數值正確。 */
W.phase = el => {
  const SUB = {
    water: { n: '水', tp: [273.16, 0.00604], bp: [373.15, 1], cp: [647.1, 217.7], subB: 6146, melt: P => 273.16 - 0.0074 * (P - 0.00604), notes: '熔化線向左傾（負斜率）：加壓會讓冰熔化，因為冰的密度比水小。' },
    co2: { n: '二氧化碳', tp: [216.6, 5.11], bp: null, sp: [194.7, 1], cp: [304.2, 72.9], melt: P => 216.6 + 0.02 * (P - 5.11), notes: '三相點壓力 5.1 atm 高於 1 atm，所以在一大氣壓下 CO₂ 不會變成液體，乾冰直接昇華（−78.5 °C）。熔化線向右傾，和大多數物質一樣。' },
  };
  const st = { s: 'water', T: 298, lp: 0 };
  el.innerHTML = `${seg('phS', Object.entries(SUB).map(([k, v]) => [k, v.n]), st.s)}<div class="w-row"><label class="rng">溫度（°C）<input type="range" id="phT" min="-120" max="420" step="1"><output class="mono" id="phTo"></output></label><label class="rng">壓力（atm，對數）<input type="range" id="phP" min="-3" max="3" step="0.05"><output class="mono" id="phPo"></output></label></div><div id="phG"></div><p class="note" id="phN"></p>`;
  const lin = (a, b, x) => a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  function curves(d) {
    const iT = T => 1 / T, L = (p, q, T) => Math.exp(lin([iT(p[0]), Math.log(p[1])], [iT(q[0]), Math.log(q[1])], iT(T)));
    const lv = T => (d.bp ? (T <= d.bp[0] ? L(d.tp, d.bp, T) : L(d.bp, d.cp, T)) : L(d.tp, d.cp, T));
    const sub = T => (d.sp ? L(d.sp, d.tp, T) : d.tp[1] * Math.exp(-d.subB * (1 / T - 1 / d.tp[0])));
    return { lv, sub, pv: T => (T < d.tp[0] ? sub(T) : lv(T)) };
  }
  function phaseAt(d, T, P) {
    const c = curves(d);
    if (T >= d.cp[0] && P >= d.cp[1]) return '超臨界流體';
    if (T >= d.cp[0]) return '氣體';
    if (P < c.pv(T)) return '氣體';
    return T < d.melt(P) ? '固體' : '液體';
  }
  function draw() {
    const d = SUB[st.s], c = curves(d), P = 10 ** st.lp, T = st.T, ph = phaseAt(d, T, P);

/* ===== 2. 立方晶格 ===== */
W.cell = el => {
  const C = { sc: { n: '簡單立方', z: 1, cn: 6, pf: 52, rel: 'a = 2r', ex: '釙（Po）' }, bcc: { n: '體心立方', z: 2, cn: 8, pf: 68, rel: '體對角線 √3·a = 4r', ex: 'Na、K、Fe（室溫）' }, fcc: { n: '面心立方', z: 4, cn: 12, pf: 74, rel: '面對角線 √2·a = 4r', ex: 'Cu、Ag、Au、Al；NaCl 的 Cl⁻ 排列' } };
  let cur = 'fcc';

  function draw() {
    const c = C[cur], o = [70, 150], s = 110, d = [45, -35], P = (x, y, z) => [o[0] + x * s + z * d[0], o[1] - y * s + z * d[1]];
    const corners = []; for (const x of [0, 1]) for (const y of [0, 1]) for (const z of [0, 1]) corners.push([x, y, z]);
    const edges = corners.flatMap(a => corners.filter(b => (a[0] !== b[0]) + (a[1] !== b[1]) + (a[2] !== b[2]) === 1 && a < b).map(b => [a, b]));
    const pts = [...corners.map(p => [p, '1/8'])];
    if (cur === 'bcc') pts.push([[0.5, 0.5, 0.5], '1']);
    if (cur === 'fcc') [[0.5, 0.5, 0], [0.5, 0.5, 1], [0.5, 0, 0.5], [0.5, 1, 0.5], [0, 0.5, 0.5], [1, 0.5, 0.5]].forEach(p => pts.push([p, '1/2']));

    $('#ceV', el).innerHTML = `<svg viewBox="0 0 240 210" class="bk" role="img" aria-label="${c.n}">${edges.map(([a, b]) => { const p = P(...a), q = P(...b); return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--muted)"/>`; }).join('')}${pts.map(([p, f]) => { const [x, y] = P(...p); return `<circle cx="${x}" cy="${y}" r="${f === '1' ? 15 : 11}" class="${f === '1/8' ? 'atc' : f === '1' ? 'atb' : 'atf'}"/>`; }).join('')}</svg><p class="small mut c">角落（藍）算 1/8、面心（橘）算 1/2、體心（紅）算 1</p>`;

    $('#ceN', el).innerHTML = `<b>${c.n}</b>：${cur === 'sc' ? '8 個角 × 1/8 = 1' : cur === 'bcc' ? '8 × 1/8 + 1（體心）= 2' : '8 × 1/8 + 6 × 1/2（面心）= 4'} 個原子。例子：${c.ex}。晶體密度 = (每晶胞原子數 × 莫耳質量) ÷ (亞佛加厥數 × a³)，是常見計算題。`;

/* ===== 3. 放射性衰變與半衰期 ===== */
W.decay = el => {
  const I = { f18: ['¹⁸F（PET 造影）', 109.8, '分鐘'], tc: ['⁹⁹ᵐTc（核醫造影）', 6.01, '小時'], i131: ['¹³¹I（甲狀腺治療）', 8.02, '天'], c14: ['¹⁴C（定年）', 5730, '年'] };

  el.innerHTML = `${seg('dyS', Object.entries(I).map(([k, v]) => [k, v[0]]), st.i)}<div class="w-row"><label class="rng">經過幾個半衰期 <input type="range" id="dyN" min="0" max="8" step="0.05"><output class="mono" id="dyO"></output></label></div><div id="dyG"></div><div class="cards" id="dyK"></div><p class="note" id="dyN2"></p>`;
  function draw() {
    const [nm, h, u] = I[st.i], f = 0.5 ** st.n, xs = Array.from({ length: 161 }, (_, i) => i / 20);
    $('#dyG', el).innerHTML = chart({ x: [0, 8], y: [0, 1], xt: [0, 1, 2, 3, 4, 5, 6, 7, 8], yt: [0, 0.25, 0.5, 1], xlab: '半衰期數', ylab: '剩下的比例', h: 200 }, (X, Y) => `<path class="tline" d="${path(xs.map(x => [X(x), Y(0.5 ** x)]))}"/>${[1, 2, 3].map(k => `<line class="mk" x1="${X(k)}" x2="${X(k)}" y1="${Y(0)}" y2="${Y(0.5 ** k)}"/>`).join('')}<circle class="dot" cx="${X(st.n)}" cy="${Y(f)}" r="7"/>`);
    $('#dyK', el).innerHTML = card('t', '經過時間', `${fx(st.n * h, h > 100 ? 0 : 1)} ${u}`) + card('f', '剩下', `${fx(100 * f, 2)}%`) + card('k', '衰變常數 k = 0.693 ÷ t½', `${sci(Math.LN2 / h, 3)} /${u}`);
    $('#dyN2', el).innerHTML = `放射性衰變是<b>一級反應</b>：每經過一個半衰期剩下一半，和初始量無關。t = (t½ ÷ 0.693) × ln(N₀/N)。${st.i === 'c14' ? '¹⁴C 定年：活的生物體內 ¹⁴C/¹²C 比例和大氣相同，死亡後 ¹⁴C 開始衰變；測出剩下的比例就能推算年代。' : '醫用同位素要選半衰期適中的：太長會讓病人長時間受輻射，太短則來不及送到醫院使用。'}`;
    $('#dyN', el).value = st.n; $('#dyO', el).textContent = fx(st.n, 2); pressSeg(el, 'dyS', st.i);

  $('#dyN', el).oninput = e => { st.n = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };

/* ---------- 後中化學：立體化學與構形的互動圖 ----------
   掌性中心以四面體的四個位置表示：上（紙面）、右（紙面）、楔形（朝向讀者）、虛楔（遠離讀者）。
   構型一律由三維向量計算：優先順序 1、2、3 的向量 v1·(v2 × v3) < 0 為 R，> 0 為 S（不靠記憶規則，避免畫錯）。 */
const TET = { up: [0, 1, 0], right: [0.94, -0.33, 0], wedge: [-0.47, -0.33, 0.82], dash: [-0.47, -0.33, -0.82] };
const POS2 = { up: [0, 1.1], right: [1.0, -0.38], wedge: [-0.85, -0.52], dash: [-0.22, -1.02] };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const chir = (v1, v2, v3) => (dot3(v1, cross(v2, v3)) < 0 ? 'R' : 'S');
// slots：{ 位置: 基團索引 }；pri：各基團優先順序（1 最高）
function centerScene(labels, slots, mirror = false, hl = {}) {
  const atoms = { C: { x: 0, y: 0, t: 'C' } }, bonds = [];
  for (const [pos, gi] of Object.entries(slots)) {
    const [x, y] = POS2[pos], id = 'g' + gi; atoms[id] = { x: mirror ? -x : x, y, t: labels[gi], hl: hl[gi] ? 1 : 0 };
    bonds.push(['C', id, pos === 'wedge' ? 'w' : pos === 'dash' ? 'h' : 's']);
  }
  return { atoms, bonds };
}

/* ===== 1. 掌性：鏡像能不能疊合 ===== */

};

/* ===== 3. 兩個掌性中心：費雪投影、非鏡像異構物、內消旋 ===== */
const FISH = {
  tart: { n: '酒石酸', top: 'COOH', bot: 'COOH', x: ['OH', 'OH'], sym: true,
    // 各中心的優先順序：[水平基團 X, 上方, 下方]（H 為 4）
    pri: [{ X: 1, up: 2, down: 3 }, { X: 1, up: 3, down: 2 }] },

    pri: [{ X: 1, up: 3, down: 2 }, { X: 1, up: 2, down: 3 }] },
};
const FV = { up: [0, 1, -1], down: [0, -1, -1], left: [-1, 0, 1], right: [1, 0, 1] };
function fConfig(m, sides) { return sides.map((s, i) => { const p = m.pri[i], v = {}; v[p.X] = FV[s]; v[p.up] = FV.up; v[p.down] = FV.down; return chir(v[1], v[2], v[3]); }); }

    return `<svg viewBox="0 0 270 210" class="mol" role="img" aria-label="費雪投影式"><line class="b" x1="120" y1="40" x2="120" y2="170"/><text class="at" x="120" y="30" text-anchor="middle">${m.top}</text><text class="at" x="120" y="192" text-anchor="middle">${m.bot}</text>${row(80, sd[0], m.x[0], `C2 ${cfg[0]}`)}${row(130, sd[1], m.x[1], `C3 ${cfg[1]}`)}</svg>`;
  };
  const key = (m, c) => (m.sym && c[0] !== c[1] ? 'meso' : c.join(''));

    $('#fiB', el).innerHTML = draw1(m, mir, mcfg) + `<p class="small mut c">鏡像 (2${mcfg[0]},3${mcfg[1]})</p>`;

      const rel = k === key(m, cfg) ? '就是它' : (c[0] !== cfg[0] && c[1] !== cfg[1]) || (k === key(m, mcfg)) ? '鏡像異構物' : '非鏡像異構物';
      return `<div class="fcell ${rel === '就是它' ? 'on' : ''}"><b>${k === 'meso' ? '內消旋 (2R,3S)' : `(2${c[0]},3${c[1]})`}</b><span>${rel}</span></div>`; }).join('') +
      `<p class="small mut">兩個掌性中心最多有 2² = 4 個立體異構物；${m.sym ? '酒石酸兩端相同，(2R,3S) 和 (2S,3R) 是同一個內消旋化合物，所以只有 3 個。' : '兩端不同，沒有內消旋，4 個都存在。'}只有部分中心相反的，稱為<b>非鏡像異構物</b>：它們的物理性質（熔點、溶解度）不同。</p>`;

};

/* ===== 4. 丁烷的構形與能量 ===== */
W.butane = el => {
  let ang = 180;
  // 相對能量（kJ/mol，McMurry）：反式 0、間扭式 3.8、CH₃/H 重疊 16、CH₃/CH₃ 重疊 19
  const PTS = [[0, 19], [60, 3.8], [120, 16], [180, 0], [240, 16], [300, 3.8], [360, 19]];
  const E = a => { a = ((a % 360) + 360) % 360; for (let i = 0; i < 6; i++) { const [a0, e0] = PTS[i], [a1, e1] = PTS[i + 1]; if (a <= a1) { const t = (a - a0) / (a1 - a0); return e0 + (e1 - e0) * (1 - Math.cos(Math.PI * t)) / 2; } } return 19; };
  const NAME = a => ({ 0: '全重疊式（CH₃ 與 CH₃ 重疊）', 60: '間扭式（gauche）', 120: '重疊式（CH₃ 與 H 重疊）', 180: '反式（anti）', 240: '重疊式（CH₃ 與 H 重疊）', 300: '間扭式（gauche）', 360: '全重疊式（CH₃ 與 CH₃ 重疊）' }[a]);

    $('#buN', el).innerHTML = `<svg viewBox="0 0 260 245" class="mol" role="img" aria-label="丁烷紐曼投影">${back.map(bl).join('')}<circle class="nc" cx="${cx}" cy="${cy}" r="${R}"/>${front.map(fl).join('')}</svg>`;

  const r = 1.35, h = 0.3, S = 62, cx = 190, cy = 115;
  function geo(fl) {
    return Array.from({ length: 6 }, (_, k) => { const t = k * Math.PI / 3, x = r * Math.cos(t), y = r * Math.sin(t), z = fl * (k % 2 ? -1 : 1) * h; return { x, y, z, t, sx: cx + x * S, sy: cy - (0.32 * y + z) * S }; });
  }
  function draw() {
    const P = geo(f), axUp = f > 0, A = 0.85 * S;

    const p0 = P[0], ax = [p0.sx, p0.sy - Math.sign(f || 1) * A * Math.abs(f)], eq = [p0.sx + A * 0.95, p0.sy - (-0.33 * Math.sign(f || 1)) * A * 0.5];

    $('#chairV', el).innerHTML = `<svg viewBox="0 0 380 230" class="mol" role="img" aria-label="環己烷椅式">${ring}${hs}<line class="b" x1="${p0.sx}" y1="${p0.sy}" x2="${sp[0]}" y2="${sp[1]}"/><text class="at br" x="${sp[0] + (axial ? 0 : 30)}" y="${sp[1] + (axial ? -8 : 6)}" text-anchor="middle">${SUB[sub].t}</text><line class="b" x1="${p0.sx}" y1="${p0.sy}" x2="${hp[0]}" y2="${hp[1]}"/><text class="at" x="${hp[0] + (axial ? 12 : 0)}" y="${hp[1] + (axial ? 6 : -8)}" text-anchor="middle">H</text><text class="tk" x="${cx}" y="222" text-anchor="middle">${Math.abs(f) < 0.99 ? '翻轉中…' : axial ? '取代基在直立鍵（axial）' : '取代基在平伏鍵（equatorial）'}</text></svg>`;
    const d = SUB[sub].dG, ratio = Math.exp(d * 1000 / (8.314 * 298)), pe = 100 * ratio / (1 + ratio);
    $('#chairK', el).innerHTML = card('dg', '直立比平伏高', `${d} kJ/mol`) + card('pe', '平衡時平伏鍵構形', `${pe > 99.9 ? '> 99.9' : fx(pe, 1)}%`);
    $('#chairN', el).innerHTML = axial ? `取代基在<b>直立鍵</b>：它和同一側、隔一個碳的兩個直立 H（C3、C5，紅色）靠得很近，這叫 <b>1,3-雙直立作用</b>。按「環翻轉」，所有直立鍵和平伏鍵互換。`
      : `取代基在<b>平伏鍵</b>，指向環的外側，沒有 1,3-雙直立作用，比較穩定。${sub === 'me' ? '甲基' : '第三丁基'}在直立鍵時多出 ${d} kJ/mol 的能量，所以 25 °C 時約 ${pe > 99.9 ? '超過 99.9' : fx(pe, 0)}% 的分子處在平伏鍵構形。${sub === 'tbu' ? '第三丁基太大，等於把環「鎖」在這個構形。' : ''}`;
    pressSeg(el, 'chairS', sub);

  function flip() {
    cancelAnimationFrame(anim); const f0 = f, f1 = f > 0 ? -1 : 1, t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { f = f1; draw(); return; }
    const tick = now => { const t = Math.min(1, (now - t0) / 900); f = f0 + (f1 - f0) * (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2); draw(); if (t < 1) anim = requestAnimationFrame(tick); else { f = f1; draw(); } };

  $('#chF', el).onclick = flip;

W.fcharge = el => {

  const score = f => { const fc = fcOf(f); return fc.reduce((a, v) => a + Math.abs(v), 0) * 10 - fc.reduce((a, v, i) => a + (v < 0 ? EN[f[0][i][0]] : 0), 0); };
