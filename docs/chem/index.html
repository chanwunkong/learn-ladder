/* ===== 9. 紐曼投影：轉動後碳，找反式共平面 ===== */
W.newman = el => {
  let ang = 60;
  el.innerHTML = `<div class="w-row"><label class="rng">轉動後面的碳（H–C–C–Br 二面角）<input type="range" id="nwa" min="0" max="360" step="5" value="60"><output class="mono" id="nwo"></output></label></div><div class="w-row">${[0, 60, 120, 180, 240, 300].map(a => `<button class="btn sm ghost" type="button" data-a="${a}">${a}°</button>`).join('')}</div><div class="ngrid"><div id="nws"></div><p class="note" id="nwn"></p></div>`;
  function draw() {
    const cx = 150, cy = 130, R = 52, L = 98, P = (a, r) => [cx + Math.cos(a * Math.PI / 180) * r, cy - Math.sin(a * Math.PI / 180) * r];
    const front = [[90, 'H', 'hl'], [210, 'H', ''], [330, 'H', '']], back = [[90 - ang, 'Br', 'br'], [210 - ang, 'CH₃', ''], [330 - ang, 'H', '']];
    const vis = a => { const r = ((a - 90) % 120 + 180) % 120 - 60; return Math.abs(r) < 16 ? a - r + (r < 0 ? -16 : 16) : a; };  // 重疊式時後方基團稍微錯開，畫面才看得到
    const bl = ([a0, t, c]) => { const a = vis(a0), [x1, y1] = P(a, R), [x2, y2] = P(a, L); const [tx, ty] = P(a, L + 16); return `<line class="nb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    const fl = ([a, t, c]) => { const [x2, y2] = P(a, L - 10); const [tx, ty] = P(a, L + 6); return `<line class="nb" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    $('#nws', el).innerHTML = `<svg viewBox="0 0 300 260" class="mol" role="img" aria-label="紐曼投影式">${back.map(bl).join('')}<circle class="nc" cx="${cx}" cy="${cy}" r="${R}"/>${front.map(fl).join('')}<circle cx="${cx}" cy="${cy}" r="3" class="lp"/></svg>`;
    const d = ((ang % 360) + 360) % 360, anti = Math.abs(d - 180) <= 10, syn = d <= 10 || d >= 350;
    $('#nwn', el).innerHTML = `前面的碳（β 碳）：紅色的 H；後面的碳：Br。二面角 ${d}°。<br>` + (anti ? '<span class="ok">✓ 反式共平面</span>：H 和 Br 在相反兩側且同一平面，C–H 的電子可以順利推進 C–Br 的反鍵結軌域，<b>E2 可以發生</b>。這也是交錯式構形，能量低。'
      : syn ? '<span class="warn">順式共平面</span>：理論上軌域也平行，但這是重疊式構形，H 和 Br 擠在一起，能量很高，很少經由這個構形反應。'
        : '<span class="bad">✕ 不行</span>：C–H 和 C–Br 沒有平行，電子推不過去。分子要先轉到 180°（反式共平面）才能進行 E2。');
    $('#nwo', el).textContent = `${d}°`; $('#nwa', el).value = d;
  }
  $('#nwa', el).oninput = e => { ang = +e.target.value; draw(); };
  $$('[data-a]', el).forEach(b => { b.onclick = () => { ang = +b.dataset.a; draw(); }; });
  draw();
  return { set(s) { ang = s.ang ?? ang; draw(); } };
};

  const REAG = { nuc: '強親核、弱鹼（I⁻、Br⁻、RS⁻、N₃⁻、CN⁻）', base: '強鹼、強親核（OH⁻、RO⁻）', bulky: '體積大的強鹼（t-BuO⁻）', weak: '弱親核、弱鹼（H₂O、ROH）' };
  const SOLV = { protic: '極性質子性（水、醇）', aprotic: '極性非質子性（丙酮、DMSO、DMF）' };
  el.innerHTML = `<p class="lbl">基質</p>${seg('ds', Object.entries(SUB), st.sub)}<p class="lbl">試劑</p>${seg('dr', Object.entries(REAG), st.reag)}<p class="lbl">溶劑</p>${seg('dv', Object.entries(SOLV), st.solv)}<label class="chk"><input type="checkbox" id="dh"> 加熱</label><div class="verdict" id="dv0"></div><ol class="reason" id="dl"></ol>`;
  function decide({ sub, reag, solv, heat }) {
    const s = [];
    s.push({ methyl: '甲基：背面最空，最適合 SN2；沒有 β-H，不能脫去；甲基碳陽離子極不穩定，不走 SN1／E1。', primary: '一級：背面還算空，SN2 容易；一級碳陽離子很不穩定，不走 SN1／E1。', secondary: '二級：背面有點擠、碳陽離子中等穩定，四條路都有可能，關鍵看試劑。', tertiary: '三級：背面被三個基團擋住，不走 SN2；碳陽離子穩定，可以走 SN1／E1；也有很多 β-H 可以做 E2。' }[sub]);
    s.push({ nuc: '試劑是好的親核基但鹼性弱：傾向去攻擊碳（取代），不太去拿 H（脫去）。', base: '試劑是強鹼，也是強親核基：取代和脫去互相競爭，基質越擠越偏向脫去。', bulky: '試劑是體積很大的強鹼：擠不到碳旁邊做取代，幾乎只拿外側的 β-H 做 E2。', weak: '試劑是弱親核、弱鹼：推不動 SN2，也拿不動 H 做 E2，只能等鹵烷自己解離成碳陽離子（SN1／E1）。' }[reag]);
    let major, minor = '';
    if (sub === 'methyl') { major = reag === 'weak' ? '幾乎不反應' : 'SN2'; if (reag === 'bulky') s.push('沒有 β-H 可以拿，t-BuO⁻ 只能很慢地做 SN2。'); if (reag === 'weak') s.push('弱親核基推不動 SN2，甲基碳陽離子又生不出來。'); }
    else if (sub === 'primary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'SN2'; minor = 'E2'; s.push('一級背面夠空，強鹼大多直接當親核基做 SN2；加熱會讓 E2 比例上升。'); }
      else if (reag === 'bulky') { major = 'E2'; minor = 'SN2'; } else { major = '幾乎不反應'; s.push('一級碳陽離子太不穩定，弱親核基又推不動 SN2。'); }
    } else if (sub === 'secondary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'E2'; minor = 'SN2'; s.push('二級背面有點擠，強鹼拿 β-H 比擠進背面容易，所以 E2 為主。'); }
      else if (reag === 'bulky') major = 'E2';
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; s.push('二級碳陽離子勉強可以生成，反應很慢，而且產物是取代和脫去的混合物。'); }
    } else {
      if (reag === 'nuc') { major = solv === 'protic' ? 'SN1' : 'SN1（很慢）'; minor = 'E1'; s.push(solv === 'protic' ? '背面被擋住只能走 SN1：先解離成碳陽離子，親核基再加上去。' : 'SN1 需要極性質子性溶劑幫忙穩定生成的離子；在非質子性溶劑中解離很慢。'); }
      else if (reag === 'base') { major = 'E2'; s.push('強鹼不必等碳陽離子生成，直接拿 β-H 做 E2，比 SN1 快得多。'); }
      else if (reag === 'bulky') { major = 'E2'; s.push('大體積的鹼拿外側的 H，霍夫曼產物（取代較少的烯）比例較高。'); }
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; }
    }
    if (/SN2/.test(major)) s.push(solv === 'aprotic' ? '溶劑是非質子性：不會用氫鍵包住親核基，親核基更有攻擊力，有利 SN2。' : '溶劑是質子性：會用氫鍵包住親核基，SN2 會變慢一些；換成丙酮、DMSO 會更快。');
    if (/SN1|E1/.test(major) && solv === 'protic') s.push('溶劑是極性質子性：能穩定碳陽離子和 X⁻，幫助第一步解離。');
    if (heat && /SN1|E1|SN2|E2/.test(major)) s.push(/E1|E2/.test(major) ? '加熱：脫去讓分子數增加（熵增加），高溫更有利於脫去。' : '加熱：會提高脫去產物的比例。');
    return { major, minor, s };
  }
  function draw() {
    const r = decide(st);
    $('#dv0', el).innerHTML = `<span class="lbl">主要</span><b class="big">${r.major}</b>${r.minor ? `<span class="lbl">次要</span><b>${r.minor}</b>` : ''}`;
    $('#dl', el).innerHTML = r.s.map(x => `<li>${x}</li>`).join('');
    pressSeg(el, 'ds', st.sub); pressSeg(el, 'dr', st.reag); pressSeg(el, 'dv', st.solv); $('#dh', el).checked = st.heat;
  }
  bindSeg(el, 'ds', v => { st.sub = v; draw(); }); bindSeg(el, 'dr', v => { st.reag = v; draw(); }); bindSeg(el, 'dv', v => { st.solv = v; draw(); });
  $('#dh', el).onchange = e => { st.heat = e.target.checked; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ---------- 後中化學：酸鹼定義、pH 計算、強度與多質子酸的互動圖 ---------- */

/* ===== 1. 三種酸鹼定義：誰給誰什麼 ===== */
const ABRX = [
  ['HNO₂ + H₂O ⇌ NO₂⁻ + H₃O⁺', [['HNO₂', 'a'], ['H₂O', 'b']], [['NO₂⁻', 'cb'], ['H₃O⁺', 'ca']], 'BL', 'HNO₂ 給 H⁺ 給水：HNO₂/NO₂⁻、H₃O⁺/H₂O 是兩組共軛酸鹼對。'],
  ['NH₃ + H₂O ⇌ NH₄⁺ + OH⁻', [['NH₃', 'b'], ['H₂O', 'a']], [['NH₄⁺', 'ca'], ['OH⁻', 'cb']], 'BL', '這裡水是酸（給 H⁺），在上一題水是鹼：水是兩性物質。NH₃ 不含 OH⁻，卻使溶液產生 OH⁻，所以也算阿瑞尼斯鹼。'],
  ['HCO₃⁻ + OH⁻ ⇌ CO₃²⁻ + H₂O', [['HCO₃⁻', 'a'], ['OH⁻', 'b']], [['CO₃²⁻', 'cb'], ['H₂O', 'ca']], 'BL', 'HCO₃⁻ 遇到鹼時當酸；遇到酸時（HCO₃⁻ + H⁺ → H₂CO₃）當鹼，也是兩性物質。'],
  ['BF₃ + :NH₃ → F₃B–NH₃', [['BF₃', 'la'], ['NH₃', 'lb']], [['F₃B–NH₃', '']], 'L', '沒有 H⁺ 轉移。NH₃ 提供孤對電子（路易斯鹼），B 有空軌域接受（路易斯酸），形成配位共價鍵。'],
  ['CaO + SiO₂ → CaSiO₃', [['CaO', 'lb'], ['SiO₂', 'la']], [['CaSiO₃', '']], 'L', 'O²⁻ 提供電子對給 Si：鹼性氧化物 + 酸性氧化物，屬於路易斯酸鹼反應。'],
  ['Cl₂ + H₂O → HCl + HOCl', [['Cl₂', ''], ['H₂O', '']], [['HCl', ''], ['HOCl', '']], 'R', 'Cl 的氧化數由 0 變成 −1 與 +1，是氧化還原（自身氧化還原），不是酸鹼反應。'],
  ['Fe³⁺ + 6H₂O → Fe(H₂O)₆³⁺', [['Fe³⁺', 'la'], ['H₂O', 'lb']], [['Fe(H₂O)₆³⁺', '']], 'L', '金屬離子接受水分子的孤對電子；高電荷的水合金屬離子還會再釋出 H⁺，所以 FeCl₃、AlCl₃ 溶液呈酸性。'],
];
W.abdef = el => {
  let cur = 0;
  el.innerHTML = `${seg('adS', ABRX.map((r, i) => [String(i), r[0].split(' ')[0] + ' …']), '0')}<p class="eq" id="adE"></p><div class="w-row" id="adC"></div><div class="cards" id="adK"></div><p class="note" id="adN"></p>`;
  const LAB = { a: ['酸', 'qc pos'], b: ['鹼', 'qc neg'], ca: ['共軛酸', 'qc pos'], cb: ['共軛鹼', 'qc neg'], la: ['路易斯酸', 'qc pos'], lb: ['路易斯鹼', 'qc neg'], '': ['', 'qc'] };
  function draw() {
    const [rx, L, R, kind, note] = ABRX[cur];
    $('#adE', el).textContent = rx;
    $('#adC', el).innerHTML = L.concat([['→', null]]).concat(R).map(([t, k]) => (k === null ? '<span class="marr">→</span>' : `<span class="${LAB[k][1]}">${t}${LAB[k][0] ? `<small>${LAB[k][0]}</small>` : ''}</span>`)).join('');
    const yes = t => `<b class="${t ? 'ok' : 'bad'}">${t ? '是' : '否'}</b>`;
    $('#adK', el).innerHTML = card('a', '阿瑞尼斯（水中產生 H⁺／OH⁻）', yes(cur < 2)) + card('b', '布忍斯特–羅瑞（H⁺ 轉移）', yes(kind === 'BL')) + card('l', '路易斯（電子對）', yes(kind !== 'R'));
    $('#adN', el).innerHTML = `${note} 三種定義由窄到寬：所有布忍斯特–羅瑞酸鹼反應也都是路易斯酸鹼反應（鹼用孤對電子接受 H⁺）。`;

  return { set(s) { cur = s.i ?? cur; draw(); } };

/* ===== 2. pH 計算：強、弱、極稀、鹽類 ===== */
const PHT = { sa: ['強酸 HCl', 0, 'a'], wa: ['弱酸 CH₃COOH', 4.74, 'a'], hf: ['弱酸 HF', 3.17, 'a'], sb: ['強鹼 NaOH', 0, 'b'], wb: ['弱鹼 NH₃', 4.75, 'b'], naf: ['鹽 NaF（F⁻ 是弱鹼）', 14 - 3.17, 'b'], nh4: ['鹽 NH₄Cl（NH₄⁺ 是弱酸）', 9.25, 'a'] };
function phSolve(type, C) {   // 回傳 [H⁺]；強酸鹼含水的解離，弱者解二次式
  const Kw = 1e-14, [, pK, ab] = PHT[type];
  let x;
  if (pK === 0) x = (C + Math.sqrt(C * C + 4 * Kw)) / 2;
  else { const K = 10 ** -pK; x = (-K + Math.sqrt(K * K + 4 * K * C)) / 2; x = Math.max(x, Math.sqrt(Kw)); }
  return ab === 'a' ? x : Kw / x;
}
W.phcalc = el => {
  const st = { t: 'wa', lc: -1 };
  el.innerHTML = `${seg('pcT', Object.entries(PHT).map(([k, v]) => [k, v[0]]), st.t)}<div class="w-row"><label class="rng">濃度 C（對數）<input type="range" id="pcC" min="-8" max="0" step="0.05"><output class="mono" id="pcCo"></output></label></div><div id="pcG"></div><ol class="cs" id="pcF"></ol><div class="cards" id="pcK"></div><p class="note" id="pcN"></p>`;
  function draw() {
    const [nm, pK, ab] = PHT[st.t], C = 10 ** st.lc, H = phSolve(st.t, C), pH = -Math.log10(H), xs = Array.from({ length: 81 }, (_, i) => -8 + i * 0.1);
    $('#pcG', el).innerHTML = chart({ w: 560, h: 220, x: [-8, 0], y: [0, 14], xt: [-8, -6, -4, -2, 0], yt: [0, 7, 14], xlab: 'log C', ylab: 'pH', label: 'pH 與濃度' }, (X, Y) =>
      `<line class="mk" x1="${X(-8)}" x2="${X(0)}" y1="${Y(7)}" y2="${Y(7)}"/><path class="tline" d="${path(xs.map(x => [X(x), Y(-Math.log10(phSolve(st.t, 10 ** x)))]))}"/><circle class="dot" cx="${X(st.lc)}" cy="${Y(pH)}" r="7"/>`);
    const ion = ab === 'a' ? H : 1e-14 / H;
    const K = pK ? 10 ** -pK : null;
    $('#pcF', el).innerHTML = pK === 0
      ? `<li>完全解離：[${ab === 'a' ? 'H⁺' : 'OH⁻'}] ≈ C = ${sci(C, 2)} M</li>${C < 1e-6 ? '<li>濃度太低時，水本身解離的 1.0 × 10⁻⁷ M 不能忽略：解 x² − Cx − Kw = 0</li>' : ''}`
      : `<li>${ab === 'a' ? 'Ka' : 'Kb'} = ${sci(K, 2)}${st.t === 'naf' ? '（= Kw ÷ Ka(HF)）' : st.t === 'nh4' ? '（= Kw ÷ Kb(NH₃)）' : ''}</li><li>x² ÷ (C − x) = K → x = ${sci(ion, 2)} M（近似 √(KC) = ${sci(Math.sqrt(K * C), 2)}）</li>`;
    $('#pcK', el).innerHTML = card('h', '[H⁺]', `${sci(H, 2)} M`) + card('p', 'pH', fx(pH, 2)) + card('o', 'pOH', fx(14 - pH, 2)) + card('a', '解離度 α', `${fx(100 * Math.min(1, ion / C), 1)}%`, pK ? '= x ÷ C' : '');
    $('#pcN', el).innerHTML = pK === 0 ? `強${ab === 'a' ? '酸' : '鹼'}完全解離，pH 由濃度直接決定。但濃度低於 10⁻⁶ M 時，pH 不會跨過 7：5 × 10⁻⁸ M 的 HNO₃ pH 約 6.9，而不是 7.3。`
      : `弱${ab === 'a' ? '酸' : '鹼'}只解離一小部分。往左拖（稀釋），解離度 α 反而<b>變大</b>（約和 √(K/C) 成正比，濃度變 4 倍 α 變一半），但 [${ab === 'a' ? 'H⁺' : 'OH⁻'}] 仍然變小。${st.t === 'naf' || st.t === 'nh4' ? ' 鹽類溶液的酸鹼性看離子：強酸強鹼生成的鹽（NaCl、KNO₃）中性；弱酸的陰離子（F⁻、CH₃COO⁻、CN⁻）使溶液偏鹼；弱鹼的陽離子（NH₄⁺）與高電荷的金屬離子（Al³⁺、Fe³⁺）使溶液偏酸。' : ''}`;
    $('#pcC', el).value = st.lc; $('#pcCo', el).textContent = `${sci(C, 1)} M`; pressSeg(el, 'pcT', st.t);
  }
  bindSeg(el, 'pcT', v => { st.t = v; draw(); });
  $('#pcC', el).oninput = e => { st.lc = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 3. 酸的強度階梯：Ka × Kb = Kw =====
   25 °C 的 pKa（教科書常用值） */
const KAL = [['HSO₄⁻', 'SO₄²⁻', 1.99], ['H₃PO₄', 'H₂PO₄⁻', 2.15], ['HClO₂', 'ClO₂⁻', 1.96], ['HF', 'F⁻', 3.17], ['HNO₂', 'NO₂⁻', 3.35], ['CH₃COOH', 'CH₃COO⁻', 4.74], ['C₅H₅NH⁺', 'C₅H₅N', 5.23], ['H₂CO₃', 'HCO₃⁻', 6.35], ['H₂PO₄⁻', 'HPO₄²⁻', 7.20], ['HCN', 'CN⁻', 9.21], ['NH₄⁺', 'NH₃', 9.25], ['HCO₃⁻', 'CO₃²⁻', 10.33], ['HPO₄²⁻', 'PO₄³⁻', 12.35]];
W.kaladder = el => {
  let cur = 3;
  el.innerHTML = `<div id="klG"></div><div class="cards" id="klK"></div><p class="note" id="klN"></p>`;
  function draw() {
    const Y = p => 20 + (p - 1.5) / 11.5 * 400;
    let s = `<line class="axl" x1="280" x2="280" y1="10" y2="430"/><text class="tk" x="200" y="12" text-anchor="middle">酸（越上越強）</text><text class="tk" x="360" y="12" text-anchor="middle">共軛鹼（越下越強）</text>`;
    const used = [];
    KAL.forEach(([a, b, p], i) => { let y = Y(p); while (used.some(u => Math.abs(u - y) < 15)) y += 15; used.push(y);
      s += `<g data-i="${i}" class="klr${i === cur ? ' on' : ''}" role="button"><line x1="270" x2="290" y1="${Y(p)}" y2="${Y(p)}" class="mk"/><text class="tk" x="262" y="${y + 4}" text-anchor="end">${a}</text><text class="tk" x="298" y="${y + 4}">${b}</text><text class="tk sm" x="150" y="${y + 4}" text-anchor="end">${p}</text></g>`; });
    $('#klG', el).innerHTML = `<svg class="ch" style="max-width:520px;margin:auto" viewBox="100 0 380 440" role="img" aria-label="酸鹼強度">${s}</svg>`;
    const [a, b, p] = KAL[cur];
    $('#klK', el).innerHTML = card('ka', `${a} 的 Ka`, sci(10 ** -p, 2), `pKa ${p}`) + card('kb', `${b} 的 Kb`, sci(10 ** (p - 14), 2), `pKb ${fx(14 - p, 2)}`) + card('kw', 'Ka × Kb', '1.0 × 10⁻¹⁴', 'Kw');
    $('#klN', el).innerHTML = `點選任一列。左邊越上面的酸越強（pKa 越小），它的共軛鹼就越弱；兩者的 Ka × Kb 永遠等於 Kw。所以 Ka(HF) &gt; Ka(HCN) 時，鹼性 CN⁻ &gt; F⁻。等濃度的鈉鹽溶液，共軛鹼越強 pH 越高；反過來，由鹽溶液的 pH 也能排出酸的強弱。`;
    $$('[data-i]', el).forEach(g => { g.onclick = () => { cur = +g.dataset.i; draw(); }; });
  }
  draw();
  return { set(s) { cur = s.i ?? cur; draw(); } };
};

/* ===== 4. 多質子酸的物種分布 ===== */
const POLY = { h3po4: ['H₃PO₄', [2.15, 7.20, 12.35], ['H₃PO₄', 'H₂PO₄⁻', 'HPO₄²⁻', 'PO₄³⁻']], ox: ['草酸 H₂C₂O₄', [1.25, 4.27], ['H₂C₂O₄', 'HC₂O₄⁻', 'C₂O₄²⁻']], co3: ['碳酸 H₂CO₃', [6.35, 10.33], ['H₂CO₃', 'HCO₃⁻', 'CO₃²⁻']] };
const PCOL = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];
W.polyprot = el => {
  const st = { a: 'h3po4', pH: 7 };
  el.innerHTML = `${seg('ppS', Object.entries(POLY).map(([k, v]) => [k, v[0]]), st.a)}<div class="w-row"><label class="rng">pH<input type="range" id="ppH" min="0" max="14" step="0.05"><output class="mono" id="ppO"></output></label></div><div id="ppG"></div><div class="cards" id="ppK"></div><p class="note" id="ppN"></p>`;
  const frac = (pKs, pH) => { const H = 10 ** -pH, K = pKs.map(p => 10 ** -p), terms = [1]; K.forEach((k, i) => terms.push(terms[i] * k / H)); const s = terms.reduce((a, b) => a + b, 0); return terms.map(t => t / s); };
  function draw() {
    const [, pKs, sp] = POLY[st.a], xs = Array.from({ length: 141 }, (_, i) => i / 10), f = frac(pKs, st.pH);
    $('#ppG', el).innerHTML = chart({ w: 560, h: 240, x: [0, 14], y: [0, 1], xt: [0, 2, 4, 6, 8, 10, 12, 14], yt: [0, 0.5, 1], xlab: 'pH', ylab: '所佔比例', label: '多質子酸分布' }, (X, Y) =>
      sp.map((_, j) => `<path class="tline" style="stroke:${PCOL[j]}" d="${path(xs.map(x => [X(x), Y(frac(pKs, x)[j])]))}"/>`).join('') + pKs.map(p => `<line class="mk" x1="${X(p)}" x2="${X(p)}" y1="${Y(0)}" y2="${Y(0.5)}"/>`).join('')
      + `<line class="cur" x1="${X(st.pH)}" x2="${X(st.pH)}" y1="${Y(0)}" y2="${Y(1)}"/>`);
    $('#ppK', el).innerHTML = sp.map((t, j) => `<div class="card"><span style="color:${PCOL[j]}">${t}</span><b>${fx(100 * f[j], 1)}%</b></div>`).join('');
    const amph = pKs.slice(0, -1).map((p, i) => `${sp[i + 1]} 溶液 pH ≈ (${p} + ${pKs[i + 1]}) ÷ 2 = ${fx((p + pKs[i + 1]) / 2, 2)}`).join('；');
    $('#ppN', el).innerHTML = `每兩條曲線在 pH = pKa 處交叉（虛線），此時兩種形式各半。兩個 pKa 相差很大時，任何 pH 下最多只有兩種形式同時明顯存在。兩性物質（中間形式）的溶液：${amph}。二質子酸 H₂A 溶液中 [A²⁻] ≈ Ka₂，和濃度無關。`;
    $('#ppH', el).value = st.pH; $('#ppO', el).textContent = fx(st.pH, 2); pressSeg(el, 'ppS', st.a);
  }
  bindSeg(el, 'ppS', v => { st.a = v; draw(); });
  $('#ppH', el).oninput = e => { st.pH = +e.target.value; draw(); };
  draw();

/* ===== 3. 費雪酯化：用過量醇推高產率 ===== */
W.ester = el => {
  let r = 1; const K = 4;
  el.innerHTML = `<p class="eq">CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O　　K ≈ 4（H₂SO₄ 催化）</p><div class="w-row"><label class="rng">乙醇：乙酸 莫耳比 <input type="range" id="esR" min="0" max="2" step="0.02"><output class="mono" id="esO"></output></label></div><div id="esG"></div><p class="note" id="esN"></p>`;
  const yieldOf = r => { const a = K - 1, bq = -K * (1 + r), c = K * r; return (-bq - Math.sqrt(bq * bq - 4 * a * c)) / (2 * a); };   // x² = K(1−x)(r−x)
  function draw() {
    const y = yieldOf(r), xs = Array.from({ length: 101 }, (_, i) => 10 ** (i / 50));
    $('#esG', el).innerHTML = chart({ x: [0, 2], y: [0, 1], xt: [0, 1, 2], yt: [0, 0.5, 0.67, 1], xlab: 'log（乙醇／乙酸）：0 = 1:1、1 = 10:1、2 = 100:1', ylab: '酯的產率', h: 200 }, (X, Y) => `<path class="tline" d="${path(xs.map(v => [X(Math.log10(v)), Y(yieldOf(v))]))}"/><circle class="dot" cx="${X(Math.log10(r))}" cy="${Y(y)}" r="7"/>`);
    $('#esN', el).innerHTML = `乙醇：乙酸 = ${fx(r, 1)} : 1 時，酯的平衡產率（以乙酸計）= <b>${fx(100 * y, 1)}%</b>。K 只有 4，等莫耳時只得到約 67%。用勒沙特列原理推高產率：加入過量的醇（便宜的那一個），或把生成的水移走（迪安–史塔克分水器）。反過來，酯在大量水和酸中會水解回羧酸和醇；在鹼中水解（皂化）則因為生成羧酸根而不可逆。`;
    $('#esR', el).value = Math.log10(r); $('#esO', el).textContent = `${fx(r, 1)} : 1`;
  }
  $('#esR', el).oninput = e => { r = 10 ** +e.target.value; draw(); };
  draw();
  return { set(s) { r = s.r ?? r; draw(); } };
};

W.addmap = el => {
  const st = { i: 6, s: 'ring' };
  el.innerHTML = `${seg('amS', [['prop', '丙烯'], ['ring', '1-甲基環己烯']], st.s)}<label class="sel">試劑 <select id="amR">${ADDR.map((r, i) => `<option value="${i}"${i === st.i ? ' selected' : ''}>${r[0]}（${r[1]}）</option>`).join('')}</select></label><div id="amG"></div><div class="cards" id="amK"></div><p class="note" id="amN"></p>`;
  function ring(r) {
    const [, , X, Y, sto] = r, A = {}, B = [];
    const ang = [150, 90, 30, -30, -90, -150];
    ang.forEach((a, k) => { A['r' + k] = { x: Math.cos(a * Math.PI / 180) * 1.0 - 0.6, y: Math.sin(a * Math.PI / 180) * 1.0, t: '' }; });
    for (let k = 0; k < 6; k++) B.push(['r' + k, 'r' + ((k + 1) % 6), 's']);
    // C1 = r2（右上，接甲基），C2 = r3（右下）
    if (X === 'oz') {
      const z = { c1: [0, 0], c2: [0.87, 0.5], c3: [1.73, 0], c4: [2.6, 0.5], c5: [3.46, 0], c6: [4.33, 0.5], c7: [5.2, 0] }, at = {}, bd = [];
      Object.entries(z).forEach(([k, [x, y]]) => { at[k] = { x: x - 2.6, y, t: '' }; });
      at.o2 = { x: 0.87 - 2.6, y: 1.5, t: 'O' }; at.o7 = { x: 5.2 - 2.6, y: -1, t: 'O' }; at.h7 = { x: 6.07 - 2.6, y: 0.5, t: 'H' };
      ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7'].forEach((k, i, a) => { if (i) bd.push([a[i - 1], k, 's']); });
      bd.push(['c2', 'o2', 'd'], ['c7', 'o7', 'd'], ['c7', 'h7', 's']);
      return { atoms: at, bonds: bd, cap: '6-氧代庚醛 CH₃CO(CH₂)₄CHO：環打開成一條鏈，兩端各一個 C=O' };
    }
    A.me = { x: A.r2.x + 0.95, y: A.r2.y + 0.45, t: 'CH₃' }; B.push(['r2', 'me', X === 'epox' || X === 'cp' || sto === 'mix' || sto === '—' ? 's' : 'h']);
    if (X === 'epox' || X === 'cp') { A.b = { x: A.r2.x + 0.75, y: 0, t: X === 'epox' ? 'O' : '' }; B.push(['r2', 'b', 's'], ['r3', 'b', 's']); A.h2 = { x: A.r3.x + 0.95, y: A.r3.y - 0.45, t: 'H' }; B.push(['r3', 'h2', 's']); return { atoms: A, bonds: B, cap: X === 'epox' ? '1-甲基-1,2-環氧環己烷' : '1-甲基雙環[4.1.0]庚烷' }; }
    A.x = { x: A.r2.x + 0.2, y: A.r2.y + 1.05, t: X === 'H' ? 'H' : X }; B.push(['r2', 'x', sto === 'mix' || sto === '—' ? 's' : 'w']);
    A.y = { x: A.r3.x + 0.2, y: A.r3.y - 1.05, t: Y }; B.push(['r3', 'y', sto === 'syn' ? 'w' : sto === 'anti' ? 'h' : 's']);
    return { atoms: A, bonds: B, cap: sto === 'syn' ? '兩個新基團在環的同一側（都是楔形）' : sto === 'anti' ? '兩個新基團在環的兩側（一個楔形、一個虛楔）' : '兩種立體都會生成（不標楔形）' };
  }
  function chain(r) {
    const [, , X, Y] = r, A = { c1: { x: -0.87, y: -0.25, t: '' }, c2: { x: 0, y: 0.25, t: '' }, c3: { x: 0.87, y: -0.25, t: '' } }, B = [['c1', 'c2', 's'], ['c2', 'c3', 's']];
    if (X === 'oz') return { atoms: { a: { x: -1.6, y: 0, t: 'CH₃CHO' }, b: { x: 0.2, y: 0, t: '+' }, c: { x: 1.6, y: 0, t: 'HCHO' } }, bonds: [], cap: '乙醛 + 甲醛' };
    if (X === 'epox' || X === 'cp') { A.b = { x: -0.45, y: 1.0, t: X === 'epox' ? 'O' : '' }; B.push(['c1', 'b', 's'], ['c2', 'b', 's']); return { atoms: A, bonds: B, cap: X === 'epox' ? '1,2-環氧丙烷' : '甲基環丙烷' }; }
    if (X !== 'H') { A.x = { x: 0, y: 1.25, t: X }; B.push(['c2', 'x', 's']); }
    if (Y !== 'H') { A.y = { x: -1.74, y: 0.25, t: Y }; B.push(['c1', 'y', 's']); }
    const nm = { 'Br|H': '2-溴丙烷', 'OH|H': '2-丙醇', 'Br|Br': '1,2-二溴丙烷', 'OH|Br': '1-溴-2-丙醇', 'H|H': '丙烷', 'H|OH': '1-丙醇', 'H|Br': '1-溴丙烷', 'OH|OH': '1,2-丙二醇' }[`${X}|${Y}`];
    return { atoms: A, bonds: B, cap: nm };
  }
  function draw() {
    const r = ADDR[st.i], sc = st.s === 'ring' ? ring(r) : chain(r);
    $('#amG', el).innerHTML = MOL.svg(sc, { w: 480, h: 230, s: 48, label: r[1] }) + `<p class="small mut" style="text-align:center">${sc.cap}</p>`;
    $('#amK', el).innerHTML = card('r', '區域選擇', r[5]) + card('s', '立體', { syn: '同側（syn）', anti: '反式（anti）', mix: '兩面都有', '—': '—' }[r[4]]) + card('i', '中間物', r[6]);
    $('#amN', el).innerHTML = `<b>${r[1]}</b>：${r[7]}`;
    pressSeg(el, 'amS', st.s);
  }
  bindSeg(el, 'amS', v => { st.s = v; draw(); });
  $('#amR', el).onchange = e => { st.i = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); $('#amR', el).value = st.i; draw(); } };
};

  let cur = 1;

/* ===== 3. 氫化熱：烯的穩定度 =====
   kJ/mol；OpenStax《Organic Chemistry》（McMurry）表 7.2 */
const HHYD = [['CH₂=CH₂ 乙烯', 137, 0], ['CH₃CH=CH₂ 丙烯', 126, 1], ['cis-2-丁烯', 120, 2], ['(CH₃)₂C=CH₂ 2-甲基丙烯', 119, 2], ['trans-2-丁烯', 116, 2], ['(CH₃)₂C=CHCH₃ 2-甲基-2-丁烯', 113, 3], ['(CH₃)₂C=C(CH₃)₂ 2,3-二甲基-2-丁烯', 111, 4]];
W.hhyd = el => {
  let cur = 2;
  el.innerHTML = `<div class="bars pk" id="hhB"></div><p class="small mut">氫化熱（−ΔH°，kJ/mol），OpenStax《Organic Chemistry》表 7.2。點一列看說明。</p><p class="small"><b>歷屆考法</b>：比較放熱多寡或「何者氫化熱最低」：取代越多、反式、共軛的放熱越少。數字不必背。</p><p class="note" id="hhN"></p>`;
  function draw() {
    $('#hhB', el).innerHTML = HHYD.map(([n, v], i) => `<div class="${i === cur ? 'on' : ''}" data-i="${i}" role="button"><span>${n}</span><i class="ba" style="width:${(v - 100) * 2.4}%"></i><b class="mono">${v}</b></div>`).join('');
    $$('#hhB [data-i]', el).forEach(d => { d.onclick = () => { cur = +d.dataset.i; draw(); }; });
    const [n, v, k] = HHYD[cur];
    $('#hhN', el).innerHTML = `<b>${n}</b>：雙鍵上有 ${k} 個烷基，氫化放熱 ${v} kJ/mol。氫化產物相同時，<b>放熱越少表示烯本身越穩定</b>。規律：雙鍵上的烷基越多越穩定（超共軛）；反式比順式穩定約 4 kJ/mol（順式兩個烷基擠在同側）。所以加熱脫去時，生成取代多、反式的烯（查依采夫產物）。`;
  }
  draw();
  return { set(s) { cur = s.i ?? cur; draw(); } };
};

/* ===== 1. 動力學 vs 熱力學烯醇離子：2-甲基環己酮 ===== */
W.enolsel = el => {
  let cur = 'k';
  const ring = { C1: { x: 0, y: 0.5, t: '' }, C2: { x: 0.87, y: 0, t: '' }, C3: { x: 0.87, y: -1, t: '' }, C4: { x: 0, y: -1.5, t: '' }, C5: { x: -0.87, y: -1, t: '' }, C6: { x: -0.87, y: 0, t: '' } };
  const rb = [['C2', 'C3', 's'], ['C3', 'C4', 's'], ['C4', 'C5', 's'], ['C5', 'C6', 's']];
  const sc = (m) => {   // m：'s' 起始、'ek'/'et' 烯醇離子、'pk'/'pt' 甲基化產物
    const atoms = JSON.parse(JSON.stringify(ring)), bonds = [...rb];
    atoms.O = { x: 0, y: 1.75, t: 'O', lp: m[0] === 'e' ? [30, 150, 90] : [30, 150], c: m[0] === 'e' ? '−' : '' };
    atoms.M = { x: 1.9, y: 0.55, t: 'CH₃' };
    bonds.push(['C2', 'M', 's'], ['C1', 'O', m[0] === 'e' ? 's' : 'd']);
    bonds.push(['C1', 'C2', m === 'et' ? 'd' : 's'], ['C1', 'C6', m === 'ek' ? 'd' : 's']);
    if (m === 's') { atoms.C2.halo = cur === 't' ? 0.32 : 0; atoms.C6.halo = cur === 'k' ? 0.32 : 0; }
    if (m === 'pt') atoms.N = { x: 1.9, y: -0.5, t: 'CH₃', hl: 1 }, bonds.push(['C2', 'N', 's']);
    if (m === 'pk') atoms.N = { x: -1.9, y: 0.55, t: 'CH₃', hl: 1 }, bonds.push(['C6', 'N', 's']);
    return { atoms, bonds };
  };
  const C = { k: ['LDA，THF，−78 °C', 'ek', 'pk', '動力學烯醇離子', '2,6-二甲基環己酮'], t: ['NaOEt，EtOH，室溫（可逆、達平衡）', 'et', 'pt', '熱力學烯醇離子', '2,2-二甲基環己酮'] };
  el.innerHTML = `${seg('esS', Object.entries(C).map(([k, v]) => [k, v[0]]), cur)}<div class="mrow" id="esR"></div><p class="note" id="esN"></p>`;
  function draw() {
    const c = C[cur], o = { w: 190, h: 170, s: 32, cy: 80 };
    $('#esR', el).innerHTML = [[sc('s'), '2-甲基環己酮'], [sc(c[1]), c[3]], [sc(c[2]), `加 CH₃I → ${c[4]}`]].map(([s, t], i) => `${i ? '<span class="marr">→</span>' : ''}<figure>${MOL.svg(s, { ...o, label: t })}<figcaption>${t}</figcaption></figure>`).join('');
    $('#esN', el).innerHTML = cur === 'k' ? '<b>LDA</b> 是又強又龐大的鹼（共軛酸 pKa 約 36），在低溫下一次就把 α-H 拿走、不可逆。它拿的是<b>比較容易靠近、H 比較多</b>的那一側（沒有甲基的 C6），生成速度最快的<b>動力學烯醇離子</b>。'
      : '較弱的鹼（NaOEt，共軛酸 pKa 約 16）只拿走少量 α-H，而且可逆，兩種烯醇離子會互相轉換、達到平衡。平衡偏向<b>雙鍵上取代基較多</b>、比較穩定的一側（有甲基的 C2）：<b>熱力學烯醇離子</b>，和查依采夫規則的道理相同。';
    pressSeg(el, 'esS', cur);
  }
  bindSeg(el, 'esS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.c || cur; draw(); } };
};

/* ===== 2. 碘仿試驗：哪些化合物呈陽性 ===== */
W.iodoform = el => {
  const D = [['乙醇', 'CH₃CH₂OH', 1, '先被 I₂ 氧化成乙醛 CH₃CHO，含 CH₃C=O。'], ['甲醇', 'CH₃OH', 0, '只有一個碳，無法形成 CH₃C=O。'], ['2-丙醇', 'CH₃CH(OH)CH₃', 1, '氧化成丙酮。'], ['1-丙醇', 'CH₃CH₂CH₂OH', 0, '氧化成丙醛 CH₃CH₂CHO，羰基旁是 CH₂CH₃ 而不是 CH₃。'],
    ['丙酮', 'CH₃COCH₃', 1, '甲基酮。'], ['3-戊酮', 'CH₃CH₂COCH₂CH₃', 0, '羰基兩側都是乙基。'], ['苯乙酮', 'C₆H₅COCH₃', 1, '甲基酮，產物是苯甲酸根。'], ['乙醛', 'CH₃CHO', 1, '唯一呈陽性的醛。'], ['2-丁醇', 'CH₃CH(OH)CH₂CH₃', 1, '氧化成 2-丁酮。'], ['苯甲醛', 'C₆H₅CHO', 0, '沒有 α-H。'], ['乙酸', 'CH₃COOH', 0, '羧酸的 α-H 酸性太低，而且先被鹼變成羧酸根。']];
  let cur = 4;
  el.innerHTML = `<div class="w-row">${D.map(([n], i) => `<button class="btn sm ghost" type="button" data-i="${i}">${n}</button>`).join('')}</div><ol class="cs" id="ioC"></ol><p class="note" id="ioN"></p>`;
  function draw() {
    const [n, f, ok, why] = D[cur];
    $('#ioC', el).innerHTML = ok ? `<li>${n}　${f}</li><li>I₂、NaOH：CH₃ 上的三個 α-H 依序被 I 取代 → R–CO–CI₃</li><li>OH⁻ 攻擊羰基，CI₃⁻ 是好的離去基 → R–COO⁻ + <b>CHI₃（黃色沉澱）</b></li>` : `<li>${n}　${f}</li><li>沒有 CH₃–C=O（或可被氧化成它的 CH₃–CH(OH)–）</li>`;
    $('#ioN', el).innerHTML = `${ok ? '<span class="ok">陽性</span>' : '<span class="bad">陰性</span>'}：${why} 碘仿試驗檢驗的是 <b>CH₃–CO–</b> 和 <b>CH₃–CH(OH)–</b> 兩種結構。`;
    $$('[data-i]', el).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === cur)));
  }
  $$('[data-i]', el).forEach(b => { b.onclick = () => { cur = +b.dataset.i; draw(); }; });
  draw();
  return { set(s) { cur = s.i ?? cur; draw(); } };
};

/* ===== 3. 丙二酸酯與乙醯乙酸酯合成 ===== */
W.malonic = el => {
  // [鹵烷, R, 碳數, 丙二酸酯產物, 乙醯乙酸酯產物, 再加 CH₃ 的丙二酸酯產物, 再加 CH₃ 的乙醯乙酸酯產物]
  const R = [['CH₃Br', 'CH₃', 1, '丙酸', '2-丁酮', '2-甲基丙酸', '3-甲基-2-丁酮'], ['CH₃CH₂Br', 'CH₃CH₂', 2, '丁酸', '2-戊酮', '2-甲基丁酸', '3-甲基-2-戊酮'], ['1-溴丙烷', 'CH₃(CH₂)₂', 3, '戊酸', '2-己酮', '2-甲基戊酸', '3-甲基-2-己酮'],
    ['1-溴丁烷', 'CH₃(CH₂)₃', 4, '己酸', '2-庚酮', '2-甲基己酸', '3-甲基-2-庚酮'], ['1-溴己烷', 'CH₃(CH₂)₅', 6, '辛酸', '2-壬酮', '2-甲基辛酸', '3-甲基-2-壬酮'], ['苄基溴', 'C₆H₅CH₂', 7, '3-苯基丙酸', '4-苯基-2-丁酮', '2-甲基-3-苯基丙酸', '3-甲基-4-苯基-2-丁酮'], ['2-溴-2-甲基丙烷', '(CH₃)₃C', 4, null, null, null, null]];
  const st = { m: 'mal', r: 4, two: 0 };
  el.innerHTML = `${seg('mlS', [['mal', '丙二酸二乙酯 → 羧酸'], ['aca', '乙醯乙酸乙酯 → 甲基酮']], st.m)}<div class="w-row">${R.map(([n], i) => `<button class="btn sm ghost" type="button" data-r="${i}">${n}</button>`).join('')}</div>${seg('mlT', [['0', '烷基化一次'], ['1', '再用 CH₃I 烷基化一次']], '0')}<ol class="cs" id="mlC"></ol><p class="note" id="mlN"></p>`;
  function draw() {
    const r = R[st.r], mal = st.m === 'mal', start = mal ? 'CH₂(COOEt)₂' : 'CH₃COCH₂COOEt', tail = mal ? 'COOEt' : 'COCH₃';
    if (!r[3]) {
      $('#mlC', el).innerHTML = `<li>${start} + NaOEt → 烯醇離子</li><li>烯醇離子 + ${r[0]}：三級鹵烷無法進行 SN2</li>`;
      $('#mlN', el).innerHTML = '<span class="bad">不能用</span>：烷基化是烯醇離子對鹵烷的 <b>SN2</b>，只能用甲基、一級（與苄基、烯丙基）鹵烷。三級鹵烷遇到強鹼只會發生 E2 脫去。';
    } else {
      const sub = st.two ? `CH₃–C(${r[1]})` : `${r[1]}–CH`;
      $('#mlC', el).innerHTML = `<li>${start} + NaOEt → 夾在兩個羰基間的 α-H 被拿走（pKa ${mal ? '13' : '11'}）</li><li>烯醇離子 + ${r[0]}（SN2）→ ${r[1]}–CH(${mal ? 'COOEt' : 'COCH₃'})COOEt</li>${st.two ? `<li>再一次 NaOEt、CH₃I → ${sub}(${tail})COOEt</li>` : ''}<li>H₃O⁺、加熱：酯水解成 β-羰基羧酸，再<b>脫羧</b>（失去 CO₂）</li><li>產物：<b>${mal ? (st.two ? `${r[1]}–CH(CH₃)–COOH` : `${r[1]}–CH₂–COOH`) : (st.two ? `${r[1]}–CH(CH₃)–COCH₃` : `${r[1]}–CH₂–COCH₃`)}</b>　${mal ? r[st.two ? 5 : 3] : r[st.two ? 6 : 4]}</li>`;
      $('#mlN', el).innerHTML = mal ? `丙二酸酯合成＝在 <b>CH₂–COOH</b> 上接 R：產物的碳數 = R 的碳數 + 2。所以要得到辛酸（8 個碳）要用 6 個碳的 1-溴己烷。` : `乙醯乙酸酯合成＝在 <b>CH₂–CO–CH₃</b>（丙酮的一端）上接 R，得到甲基酮：碳數 = R 的碳數 + 3。`;
    }
    pressSeg(el, 'mlS', st.m); pressSeg(el, 'mlT', String(st.two));
    $$('[data-r]', el).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === st.r)));
  }
  bindSeg(el, 'mlS', v => { st.m = v; draw(); });
  bindSeg(el, 'mlT', v => { st.two = +v; draw(); });
  $$('[data-r]', el).forEach(b => { b.onclick = () => { st.r = +b.dataset.r; draw(); }; });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 4. 醛醇反應的機構（兩分子乙醛） ===== */
W.aldolmech = el => {
  const base = () => ({ Ca: { x: 0.4, y: -0.1, t: 'CH₂' }, Ha: { x: 0.4, y: -1.25, t: 'H' }, C1: { x: 1.5, y: 0.55, t: 'CH' }, O1: { x: 2.65, y: -0.05, t: 'O', lp: [60, 300] },
    C2: { x: -1.3, y: 0.75, t: 'CH' }, O2: { x: -1.3, y: 2.0, t: 'O', lp: [45, 135] }, M2: { x: -2.55, y: 0.15, t: 'CH₃' }, B: { x: -0.6, y: -2.3, t: 'HO', c: '−', lp: [20] } });
  const frames = () => {
    const F0 = { atoms: base(), bonds: [['Ca', 'Ha', 's'], ['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['C2', 'O2', 'd'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['B', 20] }, t: { a: 'Ha' }, bend: -0.3 }, { f: { b: ['Ca', 'Ha'] }, t: { m: ['Ca', 'C1'] }, bend: 0.6 }, { f: { b: ['C1', 'O1'] }, t: { a: 'O1' }, bend: -0.6 }], notes: [{ x: 0, y: -3.1, t: '兩分子乙醛 + OH⁻' }] };
    const a1 = base(); Object.assign(a1.O1, { c: '−', lp: [0, 60, 300] }); a1.Ha.hide = 1; Object.assign(a1.B, { t: 'H₂O', c: '', lp: [] });
    const F1 = { atoms: a1, bonds: [['Ca', 'C1', 'd'], ['C1', 'O1', 's'], ['C2', 'O2', 'd'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['O1', 60] }, t: { m: ['O1', 'C1'] }, bend: 0.5 }, { f: { b: ['Ca', 'C1'] }, t: { a: 'C2' }, bend: 0.4 }, { f: { b: ['C2', 'O2'] }, t: { a: 'O2' }, bend: -0.6 }], notes: [{ x: 0, y: -3.1, t: '烯醇離子（親核基）' }] };
    const a2 = base(); a2.Ha.hide = 1; Object.assign(a2.C2, { x: -0.75, y: 0.7 }); Object.assign(a2.O2, { x: -0.75, y: 1.95, c: '−', lp: [0, 90, 180] }); Object.assign(a2.M2, { x: -1.95, y: 0.1 }); Object.assign(a2.B, { t: 'H₂O', c: '', lp: [], x: -2.4, y: 2.3 });
    const F2 = { atoms: a2, bonds: [['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['Ca', 'C2', 's'], ['C2', 'O2', 's'], ['C2', 'M2', 's']],
      arrows: [{ f: { lp: ['O2', 180] }, t: { a: 'B' }, bend: -0.3 }], notes: [{ x: 0, y: -3.1, t: '烷氧離子' }] };
    const a3 = JSON.parse(JSON.stringify(a2)); Object.assign(a3.O2, { t: 'OH', c: '', lp: [] }); Object.assign(a3.B, { t: 'HO', c: '−', lp: [] });
    const F3 = { atoms: a3, bonds: F2.bonds, notes: [{ x: 0, y: -3.1, t: '3-羥基丁醛（醛醇加成產物）' }] };
    const a4 = JSON.parse(JSON.stringify(a3)); Object.assign(a4.Ca, { t: 'CH' }); a4.O2.hide = 1; a4.B.hide = 1;
    const F4 = { atoms: a4, bonds: [['Ca', 'C1', 's'], ['C1', 'O1', 'd'], ['Ca', 'C2', 'd'], ['C2', 'M2', 's']], notes: [{ x: 0, y: -3.1, t: '2-丁烯醛（α,β-不飽和醛）+ H₂O' }] };
    return [
      { sc: F0, cap: '<b>1. 形成烯醇離子</b>：OH⁻ 拿走 α-H，C–H 的電子推向 C=C，羰基的 π 電子推到 O 上。' },
      { sc: F1, cap: '<b>2. 烯醇離子是親核基</b>：負電荷大部分在 O 上，但反應時用<b>碳端</b>進攻另一分子乙醛的羰基碳，形成新的 C–C 鍵。' },
      { sc: F2, cap: '<b>3. 烷氧離子</b>：和一般親核加成一樣，得到帶負電的 O。' },
      { sc: F3, cap: '<b>4. 質子化</b>：從水拿回 H⁺，得到 <b>β-羥基醛</b>（醛醇，aldol = ald + ol），OH⁻ 再生，所以鹼只需要催化量。' },
      { sc: F4, cap: '<b>5. 加熱脫水</b>：α-H 仍然有酸性，失去 H 和 β 位的 OH（經由烯醇離子，E1cB），生成和羰基<b>共軛</b>的 C=C。這一步讓反應往右推，稱為<b>醛醇縮合</b>。' }];
  };
  const pl = mechPlayer(el, { frames, w: 460, h: 300, s: 50, cy: 140, label: '醛醇反應機構' });
  return { set(s) { pl.go(s.step || 0, false); } };
};

  dcb: ['1,3-二氯苯', [[0, 'Cl', 'h'], [2, 'Cl', 'h']], [3, 5], '4、6 位置對一個 Cl 是鄰位、對另一個是對位；夾在兩個 Cl 中間的 2 號位太擠；5 號位是兩者的間位。所以取代在 4（= 6）號位。'],
  pma: ['4-甲基苯甲醚', [[0, 'OCH₃', 'a'], [3, 'CH₃', 'a']], [1, 5], '兩者方向衝突時，<b>活化力較強的取代基決定位置</b>：OCH₃ 比 CH₃ 強，新基團進入 OCH₃ 的鄰位。'],
  pcp: ['4-氯苯酚', [[0, 'OH', 'a'], [3, 'Cl', 'h']], [1, 5], 'OH 是強活化基，勝過鈍化的 Cl，新基團進入 OH 的鄰位。'],
  ntb: ['間硝基苯甲酸', [[0, 'COOH', 'd'], [2, 'NO₂', 'd']], [4], '兩個都是間位定位基，共同的間位是 5 號位；但環非常鈍化，反應很慢。'],
};
W.multi = el => {
  let cur = 'dcb';
  el.innerHTML = `${seg('muS', Object.entries(MSUB).map(([k, v]) => [k, v[0]]), cur)}<div id="muG"></div><p class="note" id="muN"></p>`;
  function draw() {
    const [, subs, best, why] = MSUB[cur], A = {}, B = [];
    for (let k = 0; k < 6; k++) { const a = (90 - 60 * k) * Math.PI / 180; A['r' + k] = { x: Math.cos(a), y: Math.sin(a), t: '' }; }
    for (let k = 0; k < 6; k++) B.push(['r' + k, 'r' + ((k + 1) % 6), k % 2 ? 's' : 'd']);
    subs.forEach(([k, t]) => { const a = (90 - 60 * k) * Math.PI / 180; A['s' + k] = { x: Math.cos(a) * 2, y: Math.sin(a) * 2, t }; B.push(['r' + k, 's' + k, 's']); });
    best.forEach(k => { const a = (90 - 60 * k) * Math.PI / 180; A['e' + k] = { x: Math.cos(a) * 1.75, y: Math.sin(a) * 1.75, t: 'E', hl: 1, halo: 0.42 }; B.push(['r' + k, 'e' + k, 'p']); });
    $('#muG', el).innerHTML = MOL.svg({ atoms: A, bonds: B }, { w: 420, h: 280, s: 52, label: '新取代基的位置' });
    $('#muN', el).innerHTML = `紅色 E 是新基團最可能進入的位置。${why} 判斷順序：① 先看兩者是否指向同一位置；② 衝突時聽活化力最強的；③ 避開夾在兩個取代基中間（彼此間位）的位置。`;
    pressSeg(el, 'muS', cur);
  }
  bindSeg(el, 'muS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.m || cur; draw(); } };
};

/* ---------- 後中化學：芳香族化合物的互動圖 ---------- */

/* ===== 1. 休克耳規則與弗羅斯特圓 ===== */
W.huckel = el => {
  const R = {
    benzene: { n: '苯', size: 6, pi: 6, planar: true, conj: true, note: '六個 sp² 碳各提供一個 p 電子。' },
    cbd: { n: '環丁二烯', size: 4, pi: 4, planar: true, conj: true, note: '4 個 π 電子（4n，n = 1），有兩個電子落在未成對的軌域上：反芳香性，極不穩定。' },
    cot: { n: '環辛四烯', size: 8, pi: 8, planar: false, conj: true, note: '8 個 π 電子（4n），但分子會折成澡盆形避免反芳香性，雙鍵不共軛：非芳香性，行為像一般的烯。' },
    cp: { n: '環戊二烯負離子', size: 5, pi: 6, planar: true, conj: true, note: '帶負電的碳是 sp²，孤對電子在 p 軌域上參與共軛，共 6 個 π 電子。所以環戊二烯（pKa 約 16）對一個 C–H 來說非常酸。' },
    trop: { n: '環庚三烯陽離子', size: 7, pi: 6, planar: true, conj: true, note: '帶正電的碳有空的 p 軌域，讓整個環共軛，6 個 π 電子。' },
    pyrrole: { n: '吡咯', size: 5, pi: 6, planar: true, conj: true, note: 'N 的孤對電子在 p 軌域上參與 π 系統（兩個 C=C 共 4 個 + N 的 2 個）。因此吡咯的 N 幾乎沒有鹼性：孤對電子被用掉了。' },
    pyridine: { n: '吡啶', size: 6, pi: 6, planar: true, conj: true, note: '和苯一樣 6 個 π 電子；N 的孤對電子在 sp² 軌域上、指向環外，不參與 π 系統，所以吡啶有鹼性。' },
  };
  let cur = 'benzene';
  el.innerHTML = `${seg('hkS', Object.entries(R).map(([k, v]) => [k, v.n]), cur)}<div class="bgrid"><div id="hkR"></div><div id="hkF"></div></div><ul class="checks" id="hkC"></ul><p class="note" id="hkN"></p>`;
  function draw() {
    const r = R[cur], n = r.size, aro = r.planar && r.conj && (r.pi - 2) % 4 === 0, anti = r.planar && r.conj && r.pi % 4 === 0;
    // 環
    const atoms = {}, bonds = [];
    for (let k = 0; k < n; k++) { const a = (90 + 360 * k / n) * Math.PI / 180; atoms['a' + k] = { x: Math.cos(a) * 1.1, y: Math.sin(a) * 1.1, t: '' }; }
    if (cur === 'pyrrole') atoms.a0 = { ...atoms.a0, t: 'NH', lp: [90] };
    if (cur === 'pyridine') atoms.a0 = { ...atoms.a0, t: 'N', lp: [90] };
    if (cur === 'cp') atoms.a0 = { ...atoms.a0, c: '−' };
    if (cur === 'trop') atoms.a0 = { ...atoms.a0, c: '+' };
    const dbl = { benzene: [0, 2, 4], cbd: [0, 2], cot: [0, 2, 4, 6], cp: [1, 3], trop: [1, 3, 5], pyrrole: [1, 3], pyridine: [0, 2, 4] }[cur];
    for (let k = 0; k < n; k++) bonds.push(['a' + k, 'a' + ((k + 1) % n), dbl.includes(k) ? 'd' : 's']);
    $('#hkR', el).innerHTML = MOL.svg({ atoms, bonds }, { w: 220, h: 200, s: 62 }) + `<p class="small mut c">${r.n}（${r.pi} 個 π 電子）</p>`;
    // 弗羅斯特圓：正多邊形頂點朝下內接於圓，每個頂點的高度就是一個分子軌域的能量
    const cx = 120, cy = 100, rad = 70, lv = Array.from({ length: n }, (_, k) => cy + rad * Math.cos(2 * Math.PI * k / n));
    const levels = [...new Set(lv.map(v => Math.round(v * 10) / 10))].sort((a, b) => b - a);
    let left = r.pi; const fill = levels.map(y => { const deg = lv.filter(v => Math.round(v * 10) / 10 === y).length, e = Math.min(left, 2 * deg); left -= e; return [y, deg, e]; });
    const pts = Array.from({ length: n }, (_, k) => { const a = 2 * Math.PI * k / n; return [cx + rad * Math.sin(a), cy + rad * Math.cos(a)]; });
    // 洪德定則：同一能階先每個軌域放一個，再成對
    const occ = (e, deg, j) => (e > deg ? (j < e - deg ? 2 : 1) : (j < e ? 1 : 0));
    const lvl = fill.map(([y, deg, e]) => Array.from({ length: deg }, (_, j) => { const x0 = cx + (j - (deg - 1) / 2) * 46, ue = occ(e, deg, j); return `<line class="lvl" x1="${x0 - 16}" x2="${x0 + 16}" y1="${y}" y2="${y}"/>${ue >= 1 ? `<text class="spin" x="${x0 - 12}" y="${y - 3}">↑</text>` : ''}${ue >= 2 ? `<text class="spin" x="${x0 + 3}" y="${y - 3}">↓</text>` : ''}`; }).join('')).join('');
    $('#hkF', el).innerHTML = r.planar ? `<svg viewBox="0 0 260 200" class="ch" role="img" aria-label="弗羅斯特圓"><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--line)"/><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>${lvl}<line class="mk" x1="20" x2="220" y1="${cy}" y2="${cy}"/><text class="tk" x="222" y="${cy + 4}">非鍵</text></svg><p class="small mut c">π 分子軌域能階（弗羅斯特圓）</p>` : '<p class="note">分子不是平面，p 軌域無法連續重疊，不形成環狀 π 系統。</p>';
    $('#hkC', el).innerHTML = [['環狀', true], ['平面', r.planar], ['每個環原子都有 p 軌域（完全共軛）', r.conj], [`π 電子數 ${r.pi} = 4n + 2？`, (r.pi - 2) % 4 === 0]].map(([t, ok]) => `<li class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'} ${t}</li>`).join('');
    $('#hkN', el).innerHTML = `<b>${aro ? '芳香性' : anti ? '反芳香性' : '非芳香性'}</b>。${r.note}${aro ? '弗羅斯特圓上，所有成鍵軌域都剛好填滿成對，沒有電子落在非鍵或反鍵軌域：這就是 4n + 2 特別穩定的原因。' : anti ? '弗羅斯特圓上，最後兩個電子只能分別放進兩個簡併的非鍵軌域，未成對：不穩定。' : ''}`;
    pressSeg(el, 'hkS', cur);
  }
  bindSeg(el, 'hkS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.r || cur; draw(); } };
};

/* ===== 3. 電子組態 ===== */
const ELEM = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn'.split(' ');
const ENAME = '氫 氦 鋰 鈹 硼 碳 氮 氧 氟 氖 鈉 鎂 鋁 矽 磷 硫 氯 氬 鉀 鈣 鈧 鈦 釩 鉻 錳 鐵 鈷 鎳 銅 鋅 鎵 鍺 砷 硒 溴 氪 銣 鍶 釔 鋯 鈮 鉬 鎝 釕 銠 鈀 銀 鎘 銦 錫 銻 碲 碘 氙 銫 鋇 鑭 鈰 鐠 釹 鉕 釤 銪 釓 鋱 鏑 鈥 鉺 銩 鐿 鎦 鉿 鉭 鎢 錸 鋨 銥 鉑 金 汞 鉈 鉛 鉍 釙 砈 氡'.split(' ');
const AUF = [['1s', 2], ['2s', 2], ['2p', 6], ['3s', 2], ['3p', 6], ['4s', 2], ['3d', 10], ['4p', 6], ['5s', 2], ['4d', 10], ['5p', 6], ['6s', 2], ['4f', 14], ['5d', 10], ['6p', 6]];
// 基態的例外（與構築原理不同）：[軌域, 電子數] 覆寫
const EXC = { 24: [['4s', 1], ['3d', 5]], 29: [['4s', 1], ['3d', 10]], 41: [['5s', 1], ['4d', 4]], 42: [['5s', 1], ['4d', 5]], 44: [['5s', 1], ['4d', 7]], 45: [['5s', 1], ['4d', 8]], 46: [['5s', 0], ['4d', 10]], 47: [['5s', 1], ['4d', 10]],
  57: [['4f', 0], ['5d', 1]], 58: [['4f', 1], ['5d', 1]], 64: [['4f', 7], ['5d', 1]], 78: [['6s', 1], ['5d', 9]], 79: [['6s', 1], ['5d', 10]] };
const LN = { s: 0, p: 1, d: 2, f: 3 };
function econf(Z, q = 0) {   // 回傳依 n、ℓ 排序的 [[軌域, 電子數]]
  const base = q < 0 ? Z - q : Z, m = new Map(); let left = base;
  for (const [o, c] of AUF) { if (left <= 0) break; const k = Math.min(c, left); m.set(o, k); left -= k; }
  if (q >= 0) (EXC[Z] || []).forEach(([o, k]) => m.set(o, k));
  const sorted = () => [...m.entries()].filter(([, k]) => k > 0).sort((x, y) => (+x[0][0] - +y[0][0]) || (LN[x[0][1]] - LN[y[0][1]]));
  for (let i = 0; i < q; i++) { const ls = sorted(), [o] = ls[ls.length - 1]; m.set(o, m.get(o) - 1); }   // 陽離子：先拿 n 最大（同 n 中 ℓ 最大）的電子
  return sorted();
}
const CORES = [[86, 'Rn'], [54, 'Xe'], [36, 'Kr'], [18, 'Ar'], [10, 'Ne'], [2, 'He']];
W.econf = el => {
  const st = { Z: 26, q: 0 };
  const PRE = [[6, 0, 'C'], [7, 0, 'N'], [24, 0, 'Cr'], [29, 0, 'Cu'], [26, 0, 'Fe'], [26, 2, 'Fe²⁺'], [26, 3, 'Fe³⁺'], [42, 0, 'Mo'], [46, 0, 'Pd'], [47, 0, 'Ag'], [74, 0, 'W'], [79, 0, 'Au'], [16, -2, 'S²⁻'], [11, 1, 'Na⁺'], [50, 0, 'Sn']];

    pressSeg(el, 'ecQ', String(q));
    $$('[data-p]', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === `${Z},${q}`)));
  }
  $('#ecZ', el).oninput = e => { st.Z = +e.target.value; st.q = 0; draw(); };

  draw();
  return { set(s2) { st.Z = s2.Z ?? st.Z; st.q = s2.q ?? 0; draw(); } };

  let lg = Math.log10(240e-9);

  function draw() {
    const l = 10 ** lg, nu = 2.998e8 / l, E = 6.626e-34 * nu, Em = E * 6.022e23 / 1000, reg = EMR.find(r => lg >= r[1] && lg < r[2]) || EMR[EMR.length - 1];
    $('#emG', el).innerHTML = chart({ w: 600, h: 150, x: [-14, 3], y: [0, 1], xt: [-12, -9, -6, -3, 0], yt: [], xlab: 'log₁₀ λ（m）　← 波長短、能量高　　波長長、能量低 →', label: '電磁波譜' }, (X, Y) =>
      EMR.map(r => `<rect x="${X(r[1])}" y="${Y(0.62)}" width="${X(r[2]) - X(r[1])}" height="${Y(0) - Y(0.62)}" fill="${r[3]}" opacity="${r === reg ? 0.75 : 0.22}"/><text class="tk${r === reg ? ' hl' : ''}" x="${X((r[1] + r[2]) / 2)}" y="${Y(r[4] ? 0.7 : 0.88)}" text-anchor="middle">${r[0]}</text>`).join('')
      + `<line class="mk" x1="${X(lg)}" x2="${X(lg)}" y1="${Y(0)}" y2="${Y(0.62)}"/><circle class="dot" cx="${X(lg)}" cy="${Y(0.31)}" r="7"/>`);

    $('#emO', el).textContent = ls;

/* ===== 7. 一維箱中粒子 ===== */
W.pbox = el => {
  const st = { L: 1.0, t: '1-2' };
  el.innerHTML = `<div class="w-row"><label class="rng">箱子長度 L<input type="range" id="pbL" min="0.2" max="2" step="0.05"><output class="mono" id="pbO"></output></label></div>${seg('pbS', [['1-2', 'n = 1 → 2'], ['1-3', 'n = 1 → 3'], ['2-3', 'n = 2 → 3']], st.t)}<div id="pbG"></div><p class="eq" id="pbF"></p><div class="cards" id="pbK"></div><p class="note" id="pbN"></p>`;
  function draw() {
    const h = 6.626e-34, m = 9.109e-31, L = st.L * 1e-9, E1 = h * h / (8 * m * L * L), eV = E1 / 1.602e-19, [a, b] = st.t.split('-').map(Number), dE = (b * b - a * a) * E1, lam = h * 2.998e8 / dE;
    const Y = n => 235 - n * n * 12, x0 = 70, x1 = 330;
    let s = `<line class="ax" x1="${x0}" x2="${x0}" y1="20" y2="240"/><line class="ax" x1="${x1}" x2="${x1}" y1="20" y2="240"/><line class="ax" x1="${x0}" x2="${x1}" y1="240" y2="240"/><text class="tk" x="${(x0 + x1) / 2}" y="256" text-anchor="middle">0 ← L → L</text>`;
    for (let n = 1; n <= 4; n++) {
      const y = Y(n), on = n === a || n === b;
      s += `<line class="lvl${on ? ' on' : ''}" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><path class="tline" d="${path(Array.from({ length: 61 }, (_, i) => [x0 + (x1 - x0) * i / 60, y - 11 * Math.sin(n * Math.PI * i / 60)]))}" opacity="${on ? 1 : 0.35}"/><text class="tk" x="${x1 + 10}" y="${y + 4}">n = ${n}：E = ${n * n} E₁</text>`;
    }
    s += `<line x1="${x1 + 140}" x2="${x1 + 140}" y1="${Y(a)}" y2="${Y(b) + 6}" class="dlt up" marker-end="url(#pbA)"/><defs><marker id="pbA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ahp"/></marker></defs>`;
    $('#pbG', el).innerHTML = `<svg class="en" style="max-width:620px" viewBox="40 0 460 262" role="img" aria-label="箱中粒子能階">${s}</svg>`;
    $('#pbO', el).textContent = `${fx(st.L, 2)} nm`; $('#pbL', el).value = st.L;
    $('#pbF', el).innerHTML = `Eₙ = n²h² / (8mL²)　→　ΔE = (${b}² − ${a}²) × h²/(8mL²) = <b>${b * b - a * a} E₁</b>`;
    $('#pbK', el).innerHTML = card('e1', 'E₁（電子）', `${fx(eV, 3)} eV`) + card('de', 'ΔE', `${fx(dE / 1.602e-19, 3)} eV`) + card('l', '吸收光的波長', `${fx(lam * 1e9, 0)} nm`);
    $('#pbN', el).innerHTML = `粒子被關在長度 L 的箱子裡，波函數兩端必須是 0，只能放整數個半波長，所以能量只能取 n² 倍的 E₁。最小的激發是 n = 1 → 2，需要 <b>3h²/(8mL²)</b>。L 變成兩倍，所有能量變成 1/4：箱子越長，能階越密，吸收波長越長。共軛分子越長、吸收光波長越長，就是這個道理。`;
    pressSeg(el, 'pbS', st.t);
  }
  $('#pbL', el).oninput = e => { st.L = +e.target.value; draw(); };
  bindSeg(el, 'pbS', v => { st.t = v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

  const sel = (id, v) => `<select id="${id}">${Object.entries(SUGF).map(([k, x]) => `<option value="${k}"${k === v ? ' selected' : ''}>${x[0]}</option>`).join('')}</select>`;
  el.innerHTML = `<div class="w-row"><label class="sel">醣 1 ${sel('srA', st.a)}</label><label class="sel">醣 2 ${sel('srB', st.b)}</label></div><div id="srG"></div><div class="cards" id="srK"></div><p class="note">比較 C2–C5 每個掌性碳的 OH 在右（R）或左（L）：全部相反是<b>鏡像異構物</b>（D 與 L）；只有一個不同是<b>差向異構物</b>（epimer，一種非鏡像異構物）；其他是一般的非鏡像異構物。環化後 C1 的 α／β 稱為<b>變旋異構物</b>（anomer），也是非鏡像異構物。</p>`;
  function draw() {
    const [na, fa] = SUGF[st.a], [nb, fb] = SUGF[st.b];
    const fis = (f, x, nm) => `<text x="${x}" y="22" text-anchor="middle" style="font-size:14px;fill:var(--ink)">CHO</text>${[...f].map((c, i) => { const y = 50 + i * 30; return `<line x1="${x - 30}" x2="${x + 30}" y1="${y}" y2="${y}" style="stroke:var(--ink)"/><text x="${x + (c === 'R' ? 44 : -44)}" y="${y + 5}" text-anchor="middle" style="font-size:13px;fill:var(--c2)">OH</text><text class="tk" x="${x - 8}" y="${y - 4}">C${i + 2}</text>`; }).join('')}<line x1="${x}" x2="${x}" y1="28" y2="${50 + f.length * 30 - 10}" style="stroke:var(--ink)"/><text x="${x}" y="${50 + f.length * 30 + 8}" text-anchor="middle" style="font-size:13px;fill:var(--ink)">CH₂OH</text><text class="tk" x="${x}" y="${50 + f.length * 30 + 28}" text-anchor="middle">${nm}</text>`;
    $('#srG', el).innerHTML = `<svg class="en" viewBox="0 0 460 215" style="max-width:460px;margin:auto" role="img" aria-label="費雪投影">${fis(fa, 120, na)}${fis(fb, 340, nb)}</svg>`;
    const same = fa.length === fb.length, diff = same ? [...fa].map((c, i) => c !== fb[i] ? i + 2 : 0).filter(Boolean) : [];
    const rel = !same ? '碳數不同（四碳醣與六碳醣），不是異構物' : st.a === st.b ? '同一個化合物' : diff.length === fa.length ? '鏡像異構物' : diff.length === 1 ? `C${diff[0]} 差向異構物（非鏡像異構物）` : '非鏡像異構物';
    $('#srK', el).innerHTML = card('l', 'D 或 L（看最下面的掌性碳）', `${na}：${fa.slice(-1) === 'R' ? 'D' : 'L'}；${nb}：${fb.slice(-1) === 'R' ? 'D' : 'L'}`) + card('d', '不同的掌性碳', !same ? '—' : diff.length ? diff.map(d => 'C' + d).join('、') : '無') + card('r', '關係', rel);
  }
  $('#srA', el).onchange = e => { st.a = e.target.value; draw(); };
  $('#srB', el).onchange = e => { st.b = e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); $('#srA', el).value = st.a; $('#srB', el).value = st.b; draw(); } };
};

/* ===== 3. 變旋：平衡時的旋光度 =====
   [α]D：α-D-葡萄哌喃糖 +112.2°、β +18.7°；平衡 +52.7°（OpenStax《Organic Chemistry》25.5 節） */
W.mutarot = el => {
  let b = 64;
  el.innerHTML = `<div class="w-row"><label class="rng">β 型佔 <input type="range" id="muR" min="0" max="100" step="1" value="64"><output class="mono" id="muO"></output></label></div><div class="cards" id="muK"></div><p class="note" id="muN"></p>`;
  function draw() {
    const r = 112.2 * (1 - b / 100) + 18.7 * b / 100;
    $('#muO', el).textContent = `${b}%`;
    $('#muK', el).innerHTML = card('a', '比旋光度', `+${fx(r, 1)}°`) + card('b', 'α : β', `${100 - b} : ${b}`);
    $('#muN', el).innerHTML = `純的 α-D-葡萄糖（+112.2°）或 β 型（+18.7°）溶於水後，都會經開鏈形式互相轉換，旋光度逐漸變成同一個值 +52.7°，稱為<b>變旋</b>。平衡時 β 約 64%，因為 β 型所有的 OH（包括 C1）都在平伏鍵。計算方法：觀測值 = 112.2 × (α 的分率) + 18.7 × (β 的分率)。`;
  }
  $('#muR', el).oninput = e => { b = +e.target.value; draw(); };
  draw();
  return { set(s) { b = s.b ?? b; $('#muR', el).value = b; draw(); } };
};

/* ===== 4. 核酸鹼基配對 ===== */
W.dnaseq = el => {
  let seq = 'AATCGGATCTAG';
  el.innerHTML = `<label class="sel">DNA 序列（5′→3′）<input id="dnI" value="${seq}" maxlength="24" style="font-family:var(--mono);border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink)"></label><div id="dnG"></div><div class="cards" id="dnK"></div><p class="note">A 與 T 之間 2 個氫鍵、G 與 C 之間 3 個氫鍵，所以 GC 比例越高，雙股越難分開。兩股方向相反（反平行），互補股從 5′ 端讀時要倒過來。RNA 用 U 取代 T，而且核糖的 2′-OH 可以攻擊相鄰的磷酸二酯鍵，所以 RNA 比 DNA 容易水解。</p>`;
  const P = { A: 'T', T: 'A', G: 'C', C: 'G' };
  function draw() {
    const s = seq.toUpperCase().replace(/[^ATGC]/g, ''), c = [...s].map(x => P[x]).join(''), rc = [...c].reverse().join('');
    const box = (ch, x, y) => `<rect x="${x - 11}" y="${y - 14}" width="22" height="22" rx="4" style="fill:${'AT'.includes(ch) ? '#2F3B99' : '#B5326C'};opacity:.85"/><text x="${x}" y="${y + 2}" text-anchor="middle" style="font-size:13px;fill:#fff;font-family:var(--mono)">${ch}</text>`;
    const W0 = Math.max(200, 30 + s.length * 28);
    $('#dnG', el).innerHTML = `<svg class="en" viewBox="0 0 ${W0} 110" style="max-width:${W0}px;margin:auto" role="img" aria-label="鹼基配對"><text class="tk" x="2" y="30">5′</text><text class="tk" x="2" y="92">3′</text>${[...s].map((ch, i) => { const x = 30 + i * 28; return box(ch, x, 30) + `<text class="tk" x="${x}" y="58" text-anchor="middle">${'GC'.includes(ch) ? '≡' : '='}</text>` + box(c[i], x, 92); }).join('')}</svg>`;
    const gc = [...s].filter(x => 'GC'.includes(x)).length;
    $('#dnK', el).innerHTML = card('c', '互補股（對齊寫，3′→5′）', c || '—') + card('r', '互補股（5′→3′）', rc || '—') + card('g', 'GC 比例', s.length ? `${fx(100 * gc / s.length, 0)}%` : '—') + card('h', '氫鍵總數', 2 * (s.length - gc) + 3 * gc);
  }
  $('#dnI', el).oninput = e => { seq = e.target.value; draw(); };
  draw();
  return { set(s) { seq = s.s || seq; $('#dnI', el).value = seq; draw(); } };
};

/* ---------- 後中化學：天然物骨架、鹼基結構與生化能量 ---------- */

/* 苯環（左）與右側環的座標：兩環共用 (0, ±0.5) 這條邊 */
const BZL = { a: [0, 0.5], b: [-0.866, 1], c: [-1.732, 0.5], d: [-1.732, -0.5], e: [-0.866, -1], f: [0, -0.5] };

const BZB = [['a', 'b', 'd'], ['b', 'c', 's'], ['c', 'd', 'd'], ['d', 'e', 's'], ['e', 'f', 'd'], ['f', 'a', 's']];

const SCAF = {

  aurone: ['橙酮（aurone）', '五員環（苯并呋喃酮），C2 以雙鍵接 =CH–苯基；黃色花朵的色素', null],
};

      B.push(['a', 'o1', 's'], ['o1', 'c2', 's'], ['c2', 'c3', 's'], ['c3', 'f', 's'], ['c3', 'ox', 'd'], ['c2', 'ch', 'd'], ['ch', 'ph', 's']);
    } else {
      Object.assign(A, { o1: { x: 0.866, y: 1, t: 'O' }, c2: { x: 1.732, y: 0.5, t: '' }, c3: { x: 1.732, y: -0.5, t: '' }, c4: { x: 0.866, y: -1, t: '' } });
      B.push(['a', 'o1', 's'], ['o1', 'c2', 's'], ['c4', 'f', 's']);
      if (cur === 'coumarin') { A.ox = { x: 2.6, y: 1, t: 'O', hl: 1 }; B.push(['c2', 'ox', 'd'], ['c2', 'c3', 's'], ['c3', 'c4', 'd']); }
      else { A.ox = { x: 0.866, y: -2, t: 'O', hl: 1 }; B.push(['c4', 'ox', 'd'], ['c2', 'c3', 'd'], ['c3', 'c4', 's']); }
      const ph = SCAF[cur][2];

    $('#scN', el).innerHTML = `<b>${SCAF[cur][0]}</b>：${SCAF[cur][1]}。這幾個骨架都是苯環併上一個含 O 的環，差別在 <b>C=O 的位置</b>（C2 是香豆素的內酯、C4 是色酮的酮）、<b>苯基接在哪裡</b>（C2 黃酮、C3 異黃酮），以及右側是六員還是五員環（橙酮）。`;
    pressSeg(el, 'scS', cur);
  }
  bindSeg(el, 'scS', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = s.c || cur; draw(); } };

/* ===== 4. 磷酸化合物的水解自由能 =====
   ΔG°′（kJ/mol）：Lehninger《Principles of Biochemistry》表 13-6 的約略值 */
const HIP = [['磷酸烯醇丙酮酸 PEP', -61.9], ['1,3-雙磷酸甘油酸', -49.3], ['磷酸肌酸', -43.0], ['乙醯磷酸', -43.0], ['ATP → ADP + Pᵢ', -30.5], ['葡萄糖-1-磷酸', -20.9], ['果糖-6-磷酸', -15.9], ['葡萄糖-6-磷酸', -13.8], ['甘油-3-磷酸', -9.2]];
W.hiP = el => {
  el.innerHTML = `<div class="bars pk">${HIP.map(([n, g]) => `<div><span>${n}</span><i class="${g < -30.5 ? 'ba' : g === -30.5 ? 'bha' : 'bha'}" style="width:${100 * -g / 62}%;${g === -30.5 ? 'background:var(--c2)' : g > -30.5 ? 'opacity:.45' : ''}"></i><b class="mono">${g}</b></div>`).join('')}</div><p class="small mut">水解的 ΔG°′（kJ/mol），Lehninger《Principles of Biochemistry》的約略值</p><p class="note">水解放出的自由能比 ATP 多（長條比 ATP 長）的化合物，可以直接把磷酸轉給 ADP 生成 ATP（受質層次磷酸化）。糖解中做這件事的是 <b>1,3-雙磷酸甘油酸</b>與 <b>PEP</b>；葡萄糖-6-磷酸、果糖-6-磷酸放出的能量不夠。氧化還原反應的自由能則用 ΔG = −nFΔE 計算：每轉移 1 mol 電子、電位差 0.1 V，約 −9.6 kJ。</p>`;
  return { set() {} };
};

  const q = (g, pH) => g.reduce((s, [, pk, t]) => s + (t === 'a' ? -1 / (1 + 10 ** (pk - pH)) : 1 / (1 + 10 ** (pH - pk))), 0);
  function pI(g) { let lo = 0, hi = 14; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (q(g, m) > 0) lo = m; else hi = m; } return (lo + hi) / 2; }
  function draw() {

    $('#aaK', el).innerHTML = card('z', `pH ${fx(st.pH, 1)} 的淨電荷`, (z >= 0 ? '+' : '') + fx(z, 2)) + card('p', '等電點 pI', fx(p, 2)) + d.g.map(([n, pk, t], i) => card('g' + i, `${n}（pKa ${pk}）`, t === 'a' ? (st.pH > pk ? 'COO⁻' : 'COOH') : (st.pH < pk ? 'NH₃⁺' : 'NH₂'))).join('');
    $('#aaN', el).innerHTML = `每個基團都用 Henderson–Hasselbalch 判斷：pH 高於 pKa 就以去質子的形式為主。在<b>等電點 pI</b>，正負電荷剛好抵消，淨電荷為零，分子在電場中不移動（電泳的原理）。${st.a === 'gly' ? '中性胺基酸的 pI ≈ 兩個 pKa 的平均：(2.34 + 9.60) ÷ 2 = 5.97。' : st.a === 'asp' ? '酸性胺基酸的 pI 取兩個羧基 pKa 的平均：(1.88 + 3.65) ÷ 2 = 2.77。' : '鹼性胺基酸的 pI 取兩個胺基 pKa 的平均：(8.95 + 10.53) ÷ 2 = 9.74。'} 生理 pH 7.4 時，胺基酸是<b>兩性離子</b>（同時帶 −COO⁻ 與 −NH₃⁺）。`;

  $('#aaP', el).oninput = e => { st.pH = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };

/* ---------- 後中化學：共軛二烯與周環反應 ---------- */

/* ===== 1. 多烯的 π 分子軌域 =====
   係數 c_jk = sin(jkπ/(n+1))（Hückel）；λmax 為實驗值（約略）：乙烯 165、丁二烯 217、己三烯 258、辛四烯 290 nm */
const PLY = { 2: ['乙烯', 165], 4: ['1,3-丁二烯', 217], 6: ['1,3,5-己三烯', 258], 8: ['1,3,5,7-辛四烯', 290] };
W.polyene = el => {
  const st = { n: 4, ex: 0 };
  el.innerHTML = `${seg('pnN', Object.entries(PLY).map(([k, v]) => [k, v[0]]), '4')}${seg('pnE', [['0', '基態'], ['1', '照光（激發態）']], '0')}<div id="pnG"></div><div class="cards" id="pnK"></div><p class="note" id="pnT"></p>`;
  function draw() {
    const n = st.n, H = n / 2, row = 46, W0 = 600, top = 20, hgt = top + row * n + 10;
    let s = '';
    for (let j = n; j >= 1; j--) {
      const y = top + (n - j) * row + row / 2, occ = j <= H ? 2 : 0, e = st.ex ? (j === H ? 1 : j === H + 1 ? 1 : occ) : occ;
      const tag = j === H + (st.ex ? 1 : 0) ? 'HOMO' : j === H + 1 + (st.ex ? -1 : 0) && !st.ex ? 'LUMO' : st.ex && j === H ? '' : '';
      s += `<text class="tk" x="8" y="${y + 4}">ψ${j}${j > H ? '*' : ''}</text>`;
      for (let k = 1; k <= n; k++) {
        const c = Math.sin(j * k * Math.PI / (n + 1)), x = 70 + (k - 1) * (300 / (n - 1 || 1)), rr = 3 + 9 * Math.abs(c), up = c >= 0;
        if (Math.abs(c) < 1e-9) { s += `<circle cx="${x}" cy="${y}" r="2" style="fill:var(--muted)"/>`; continue; }
        s += `<ellipse cx="${x}" cy="${y - rr * 0.75}" rx="${rr * 0.55}" ry="${rr * 0.75}" style="fill:${up ? 'var(--c1)' : 'none'};stroke:var(--c1);stroke-width:1.4"/><ellipse cx="${x}" cy="${y + rr * 0.75}" rx="${rr * 0.55}" ry="${rr * 0.75}" style="fill:${up ? 'none' : 'var(--c1)'};stroke:var(--c1);stroke-width:1.4"/>`;
      }
      const el2 = [0, 1].map(i => i < e ? `<text x="${410 + i * 14}" y="${y + 6}" style="font-size:16px;fill:var(--ink)">${i ? '↓' : '↑'}</text>` : '').join('');
      const lab = (!st.ex && j === H) || (st.ex && j === H + 1) ? 'HOMO' : (!st.ex && j === H + 1) ? 'LUMO' : '';
      s += `<line x1="400" x2="445" y1="${y + 10}" y2="${y + 10}" style="stroke:var(--ink);stroke-width:2"/>${el2}<text class="tk" x="455" y="${y + 4}" style="fill:${lab === 'HOMO' ? 'var(--c2)' : 'var(--c3)'}">${lab} ${j - 1} 個節面</text>`;
      void tag;
    }
    $('#pnG', el).innerHTML = `<svg class="en" viewBox="0 0 ${W0} ${hgt}" style="max-width:${W0}px;margin:auto" role="img" aria-label="π 分子軌域">${s}</svg>`;
    const homo = st.ex ? H + 1 : H, ends = [1, n].map(k => Math.sign(Math.sin(homo * k * Math.PI / (n + 1)))), sym = ends[0] === ends[1];
    $('#pnK', el).innerHTML = card('l', '最大吸收波長 λmax', `${PLY[n][1]} nm`) + card('h', 'HOMO 兩端的瓣', sym ? '同相（對稱）' : '反相（反對稱）') + card('c', '閉環時兩端', sym ? '對旋（disrotatory）' : '順旋（conrotatory）');
    $('#pnT', el).innerHTML = `每個 π 軌域由 ${n} 個 p 軌域組成，實心與空心代表相位相反。能量越高，節面越多（ψ<sub>j</sub> 有 j − 1 個節面）。共軛越長，HOMO 與 LUMO 越接近，吸收的光波長越長：每多一個共軛雙鍵 λmax 約增加 30–40 nm，β-胡蘿蔔素（11 個共軛雙鍵）吸收約 450 nm 的藍光，所以看起來是橘色。<br>電環反應時，HOMO 兩端的瓣要轉成同相才能形成新的 σ 鍵：兩端同相時兩端反向轉（<b>對旋</b>），兩端反相時同向轉（<b>順旋</b>）。照光把一個電子送進 LUMO，HOMO 的對稱性改變，所以照光與加熱的結果相反。`;
    pressSeg(el, 'pnN', String(n)); pressSeg(el, 'pnE', String(st.ex));
  }
  bindSeg(el, 'pnN', v => { st.n = +v; draw(); });
  bindSeg(el, 'pnE', v => { st.ex = +v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 5. 可以轉的八面體：異構物與鏡像 =====

const det3 = A => A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);

  ps.forEach(p => [1, -1].forEach(a => [1, -1].forEach(b => [1, -1].forEach(c => { const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], sg = [a, b, c]; p.forEach((j, i) => { M[i][j] = sg[i]; }); out.push(M); })))); return out; })();

  return SIGNED.filter(G => det3(G) < 0).find(G => OD.every((v, i) => p.lab[dirIdx(mv(G, v))] === p.lab[i])

  const T = m3(m3(V0.map((r, i) => V0.map(q => q[i])), S), V0);   // 模型空間中的鏡射：Vᵀ S V

    const rest = [0, 1, 2, 3, 4, 5].filter(i => !np.includes(i));
    monoPerms(mono).forEach(mp => { const lab = Array(6).fill('N'); rest.forEach((p, i) => { lab[p] = mp[i]; }); const k = canon(lab, en, PROP); if (!out.has(k)) out.set(k, { lab, en }); });

/* ---------- 後中化學：化學平衡的互動圖 ----------
   N₂O₄ ⇌ 2 NO₂：25 °C 時 Kc ≈ 4.6 × 10⁻³（濃度以 M 計），ΔH° ≈ +57.2 kJ/mol（正反應吸熱）。K 隨溫度依 van 't Hoff 式變化。 */
const N2O4 = { K298: 4.6e-3, dH: 57.2e3, R: 8.314 };
const Kat = T => N2O4.K298 * Math.exp(-N2O4.dH / N2O4.R * (1 / T - 1 / 298.15));
// 從 [N₂O₄] = a、[NO₂] = b 出發達到平衡：(b + 2x)² = K(a − x)，取物理上合理的根
function eqSolve(a, b, K) { const B = 4 * b + K, C = b * b - K * a, x = (-B + Math.sqrt(B * B - 16 * C)) / 8; return { a: a - x, b: b + 2 * x, x }; }

/* ===== 1. 動態平衡：A ⇌ B ===== */
W.eqdyn = el => {
  const st = { kf: 0.6, kr: 0.2, t: 2, fromB: false }, T = 12;
  el.innerHTML = `<div class="w-row">${seg('edS', [['A', '從純 A 開始'], ['B', '從純 B 開始']], 'A')}</div>
<div class="w-row"><label class="rng">正反應 k<sub>f</sub> <input type="range" id="edf" min="0.05" max="1.5" step="0.05"><output class="mono" id="edfo"></output></label><label class="rng">逆反應 k<sub>r</sub> <input type="range" id="edr" min="0.05" max="1.5" step="0.05"><output class="mono" id="edro"></output></label></div>
<div class="w-row"><label class="rng">時間 <input type="range" id="edt" min="0" max="${T}" step="0.1"><output class="mono" id="edto"></output></label></div>
<div class="bgrid"><div id="edc"></div><div id="edv"></div></div><div class="cards" id="edk"></div><p class="note" id="edn"></p>`;
  const conc = t => { const s = st.kf + st.kr, Aeq = st.kr / s, A0 = st.fromB ? 0 : 1, A = Aeq + (A0 - Aeq) * Math.exp(-s * t); return [A, 1 - A]; };
  function draw() {
    const ts = Array.from({ length: 121 }, (_, i) => i * T / 120), [A, B] = conc(st.t), K = st.kf / st.kr;
    $('#edc', el).innerHTML = chart({ x: [0, T], y: [0, 1], xt: [0, 3, 6, 9, 12], yt: [0, 0.5, 1], xlab: '時間', ylab: '濃度（M）', h: 220, label: '濃度隨時間' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(1)}"/><circle class="dot2" cx="${X(st.t)}" cy="${Y(A)}" r="5"/><circle class="dot" cx="${X(st.t)}" cy="${Y(B)}" r="5"/><text class="tk lha" x="${X(0.3)}" y="${Y(st.fromB ? 0.06 : 0.93)}">[A]</text><text class="tk la" x="${X(0.3)}" y="${Y(st.fromB ? 0.93 : 0.06)}">[B]</text>`);
    const rmax = Math.max(st.kf, st.kr);
    $('#edv', el).innerHTML = chart({ x: [0, T], y: [0, rmax], xt: [0, 3, 6, 9, 12], yt: [0, +(rmax / 2).toFixed(2), +rmax.toFixed(2)], xlab: '時間', ylab: '反應速率', h: 220, label: '正逆反應速率' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(st.kf * conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(st.kr * conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(rmax)}"/><text class="tk lha" x="${X(T) - 4}" y="${Y(rmax) + 12}" text-anchor="end">藍：正反應 k<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">[A]</tspan></text><text class="tk la" x="${X(T) - 4}" y="${Y(rmax) + 26}" text-anchor="end">橘：逆反應 k<tspan dy="3" font-size="9">r</tspan><tspan dy="-3">[B]</tspan></text>`);
    const Q = A > 1e-9 ? B / A : Infinity, rf = st.kf * A, rr = st.kr * B, eq = Math.abs(rf - rr) < 0.005;
    $('#edk', el).innerHTML = card('q', 'Q = [B] ÷ [A]', Number.isFinite(Q) ? fx(Q) : '∞') + card('k', 'K = k<sub>f</sub> ÷ k<sub>r</sub>', fx(K)) + card('rf', '正反應速率', fx(rf, 3)) + card('rr', '逆反應速率', fx(rr, 3));
    $('#edn', el).innerHTML = eq ? `<b>已達平衡</b>：正逆反應速率相等（都是 ${fx(rf, 3)}），所以濃度不再改變；但兩個反應都還在進行，只是互相抵消。此時 Q = K = ${fx(K)}。`
      : `尚未平衡：${rf > rr ? '正反應比逆反應快，A 持續變成 B' : '逆反應比正反應快，B 持續變回 A'}，Q（${Number.isFinite(Q) ? fx(Q) : '∞'}）${Q < K ? '小於' : '大於'} K（${fx(K)}）。`;
    $('#edfo', el).textContent = fx(st.kf); $('#edro', el).textContent = fx(st.kr); $('#edto', el).textContent = fx(st.t, 1);
    $('#edf', el).value = st.kf; $('#edr', el).value = st.kr; $('#edt', el).value = st.t; pressSeg(el, 'edS', st.fromB ? 'B' : 'A');
  }
  $('#edf', el).oninput = e => { st.kf = +e.target.value; draw(); };
  $('#edr', el).oninput = e => { st.kr = +e.target.value; draw(); };
  $('#edt', el).oninput = e => { st.t = +e.target.value; draw(); };
  bindSeg(el, 'edS', v => { st.fromB = v === 'B'; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 2. Q 與 K、ICE 表 ===== */

  const st = { a: 0.1, b: 0 }, K = N2O4.K298;
  el.innerHTML = `<p class="eq">N₂O₄(g) ⇌ 2 NO₂(g)　　K = [NO₂]² ÷ [N₂O₄] = 4.6 × 10⁻³（25 °C）</p>

      `<line class="mk" x1="${X(lk)}" x2="${X(lk)}" y1="${Y(0)}" y2="${Y(1)}"/><text class="tk hl" x="${X(lk)}" y="${Y(0.85)}" text-anchor="middle">K</text><circle class="dot" cx="${X(Math.max(-6, Math.min(2, lq)))}" cy="${Y(0.4)}" r="7"/><text class="tk" x="${X(Math.max(-6, Math.min(2, lq)))}" y="${Y(0.4) - 12}" text-anchor="middle">Q</text>${dir ? `<path class="arr" d="M${X(Math.max(-6, Math.min(2, lq))) + dir * 12} ${Y(0.4)}L${X(lk) - dir * 8} ${Y(0.4)}" marker-end="url(#ah2)"/>` : ''}<defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--arrow)"/></marker></defs>`);
    const f = v => fx(v, 4);
    $('#qkt', el).innerHTML = `<table class="tbl ice"><thead><tr><th></th><th>[N₂O₄]</th><th>[NO₂]</th></tr></thead><tbody>

/* ===== 3. 勒沙特列原理：干擾後先看 Q，再看系統怎麼回到平衡 ===== */
W.lechat = el => {
  let st, hist;
  const reset = () => { const r = eqSolve(0.1, 0, Kat(298.15)); st = { T: 298.15, V: 1, nN: r.a, nB: r.b, phase: 'eq', msg: '' }; hist = [{ N: r.a, B: r.b, lab: '起始平衡' }]; };
  reset();
  const ACT = { addN: '加入 N₂O₄', addB: '加入 NO₂', comp: '體積減半（加壓）', exp: '體積加倍（減壓）', heat: '加熱 +30 °C', cool: '冷卻 −30 °C' };

<div class="bgrid"><div id="lcs"></div><div class="cards" id="lck"></div></div><div class="w-row"><button class="btn sm pri" type="button" id="lcgo" disabled>讓系統回到平衡 →</button></div><div id="lch"></div><p class="note" id="lcn" aria-live="polite"></p>`;
  const conc = () => ({ a: st.nN / st.V, b: st.nB / st.V });
  function draw() {
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a, eq = st.phase === 'eq';
    // 針筒：寬度 ∝ 體積，顏色深淺 ∝ [NO₂]（紅棕色）
    const w = 60 + 110 * st.V, op = Math.min(0.95, b / 0.06);
    $('#lcs', el).innerHTML = `<svg viewBox="0 0 280 120" class="bk" role="img" aria-label="裝氣體的針筒"><rect x="20" y="30" width="230" height="60" rx="6" fill="none" stroke="var(--muted)" stroke-width="2"/><rect x="22" y="32" width="${w}" height="56" fill="rgb(150,60,20)" fill-opacity="${op.toFixed(2)}"/><rect x="${22 + w}" y="26" width="8" height="68" fill="var(--muted)"/><rect x="${30 + w}" y="56" width="${230 - w}" height="8" fill="var(--muted)"/><text class="tk" x="24" y="110">顏色越深 = NO₂ 越濃；${fx(st.T - 273.15, 0)} °C、${fx(st.V, 2)} L</text></svg>`;
    $('#lck', el).innerHTML = card('a', '[N₂O₄]', fx(a, 4)) + card('b', '[NO₂]', fx(b, 4)) + card('q', 'Q', sci(Q)) + card('k', `K（${fx(st.T - 273.15, 0)} °C）`, sci(K));
    $('#lcgo', el).disabled = eq;
    const pts = hist, mx = Math.max(...pts.flatMap(p => [p.N, p.B])) * 1.1;
    $('#lch', el).innerHTML = chart({ x: [0, Math.max(4, pts.length - 1)], y: [0, mx], xt: [], yt: [0, +(mx / 2).toFixed(2), +mx.toFixed(2)], xlab: '事件順序（每次干擾 → 回到平衡）', ylab: '濃度（M）', h: 200, label: '濃度變化歷程' }, (X, Y) =>
      `<path class="sha" d="${path(pts.map((p, i) => [X(i), Y(p.N)]))}"/><path class="sa" d="${path(pts.map((p, i) => [X(i), Y(p.B)]))}"/>${pts.map((p, i) => `<circle class="dot3" cx="${X(i)}" cy="${Y(p.N)}" r="3"/><circle class="dot2" cx="${X(i)}" cy="${Y(p.B)}" r="3"/>`).join('')}<text class="tk lha" x="${X(0) + 4}" y="${Y(pts[0].N) - 6}">N₂O₄</text><text class="tk la" x="${X(0) + 4}" y="${Y(pts[0].B) + 14}">NO₂</text>`);
    $('#lcn', el).innerHTML = st.msg || '系統在平衡。選一種干擾，先看 Q 和 K 的關係，再按「讓系統回到平衡」。';
  }
  function act(k) {
    if (k === 'reset') { reset(); draw(); return; }
    if (st.phase !== 'eq') relax();
    const K0 = Kat(st.T);
    if (k === 'addN') st.nN += 0.05; if (k === 'addB') st.nB += 0.02;
    if (k === 'comp') st.V /= 2; if (k === 'exp') st.V *= 2;
    if (k === 'heat') st.T += 30; if (k === 'cool') st.T -= 30;
    st.V = clamp(st.V, 0.125, 2); st.T = clamp(st.T, 238.15, 388.15);
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a;
    hist.push({ N: a, B: b, lab: ACT[k] });
    const why = { addN: '加入反應物 N₂O₄，分母變大，Q 變小', addB: '加入產物 NO₂，分子變大，Q 變大', comp: '體積減半，兩者濃度都加倍；但 [NO₂] 是平方，所以 Q 變成原本的 2 倍', exp: '體積加倍，兩者濃度都減半；Q 變成原本的一半', heat: `Q 沒變，但正反應吸熱，升溫讓 K 從 ${sci(K0)} 變大到 ${sci(K)}`, cool: `Q 沒變，但降溫讓 K 從 ${sci(K0)} 變小到 ${sci(K)}` }[k];
    st.phase = 'pert';
    st.msg = `<b>${ACT[k]}</b>：${why}。現在 Q = ${sci(Q)}，K = ${sci(K)}，<b>Q ${Q < K ? '&lt;' : '&gt;'} K</b> → 系統會<b>${Q < K ? '向右（產生更多 NO₂）' : '向左（產生更多 N₂O₄）'}</b>移動。${k === 'comp' ? '向左可以減少氣體分子數（2 個 NO₂ → 1 個 N₂O₄），部分抵銷加壓。注意顏色：先因為變濃而加深，回到平衡時再稍微變淡。' : k === 'exp' ? '向右可以增加氣體分子數，部分抵銷減壓。' : ''}`;
    draw();
  }
  function relax() {
    const { a, b } = conc(), r = eqSolve(a, b, Kat(st.T));
    st.nN = r.a * st.V; st.nB = r.b * st.V; st.phase = 'eq';
    hist.push({ N: r.a, B: r.b, lab: '回到平衡' });
    st.msg = `回到平衡：[N₂O₄] = ${fx(r.a, 4)}、[NO₂] = ${fx(r.b, 4)} M，Q 又等於 K。系統只能<b>部分抵銷</b>干擾，不會完全回到原來的濃度。`;
  }
  $$('[data-a]', el).forEach(b => { b.onclick = () => act(b.dataset.a); });
  $('#lcgo', el).onclick = () => { relax(); draw(); };
  draw();
  return { set(s) { reset(); if (s.act) act(s.act); draw(); } };
};

/* ===== 4. ΔG° 與 K ===== */

    $('#kgb', el).innerHTML = `<div class="stack"><i class="bha" style="width:${100 - 100 * fB}%">${100 - 100 * fB >= 10 ? `A ${fx(100 - 100 * fB, 1)}%` : ''}</i><i class="ba" style="width:${100 * fB}%">${100 * fB >= 10 ? `B ${fx(100 * fB, 1)}%` : ''}</i></div><p class="small mut">A ⇌ B 達到平衡時的組成</p>`;

/* ===== 5. K 的運算：反向、乘係數、相加 ===== */
W.kalgebra = el => {
  const K1 = 12, K2 = 130;
  const OPS = [['倒過來寫', 'C ⇌ A + B', '1 / K₁', 1 / K1], ['係數乘 2', '2A + 2B ⇌ 2C', 'K₁²', K1 * K1], ['係數乘 ½', '½A + ½B ⇌ ½C', '√K₁', Math.sqrt(K1)], ['兩式相加', '3A + 2B ⇌ C + D', 'K₁ × K₂', K1 * K2], ['式 2 減式 1', 'A + C ⇌ D', 'K₂ ÷ K₁', K2 / K1]];
  let cur = 3;
  el.innerHTML = `<p class="eq">式 1：A + B ⇌ C　K₁ = ${K1}　　式 2：2A + B ⇌ D　K₂ = ${K2}</p>${seg('kaS', OPS.map((o, i) => [String(i), o[0]]), '3')}<div class="kaG" id="kaG"></div><p class="note" id="kaN"></p>`;
  function draw() {
    const [nm, rx, f, v] = OPS[cur];
    $('#kaG', el).innerHTML = `<div class="cards">${card('r', '新的反應', rx)}${card('f', '新的 K', f)}${card('v', '數值', fx(v, v < 1 ? 3 : 1))}</div>`;
    $('#kaN', el).innerHTML = `K 是產物濃度的次方相乘除以反應物的次方相乘，所以對方程式的操作會變成對 K 的操作：<b>反向</b>時分子分母互換 → 倒數；<b>係數乘 n</b> 時每個次方乘 n → K 的 n 次方；<b>兩式相加</b>時兩個分式相乘 → K 相乘；<b>相減</b>就是加上反向的式子 → 相除。這和熱化學中 ΔH 的「倒過來變號、乘 n、相加」完全對應（ΔG° = −RT ln K，ΔG° 相加就是 K 相乘）。`;
    pressSeg(el, 'kaS', String(cur));

/* ---------- 後中化學：氣體、計量與溶液的互動圖 ---------- */
const RL = 0.08206;   // L·atm/(mol·K)

/* ===== 1. 理想氣體：固定兩個量，看另外兩個 ===== */
W.pvt = el => {
  const st = { law: 'boyle', n: 1, T: 300, V: 24.6, P: 1 };
  const LAW = { boyle: ['波以耳（固定 n、T）', 'V', 'P'], charles: ['查理（固定 n、P）', 'T', 'V'], gay: ['給呂薩克（固定 n、V）', 'T', 'P'], avog: ['亞佛加厥（固定 T、P）', 'n', 'V'] };
  el.innerHTML = `${seg('pvS', Object.entries(LAW).map(([k, v]) => [k, v[0]]), st.law)}<div class="w-row"><label class="rng" id="pvL"></label></div><div class="bgrid"><div id="pvB"></div><div id="pvC"></div></div><div class="cards" id="pvK"></div><p class="note" id="pvN"></p>`;
  const RNG = { V: [5, 50, 0.5, 'V（L）'], T: [100, 600, 5, 'T（K）'], n: [0.2, 3, 0.1, 'n（mol）'] };
  function solve() { const L = st.law; if (L === 'boyle') st.P = st.n * RL * st.T / st.V; if (L === 'charles' || L === 'avog') st.V = st.n * RL * st.T / st.P; if (L === 'gay') st.P = st.n * RL * st.T / st.V; }
  function draw() {
    const [nm, xk, yk] = LAW[st.law], r = RNG[xk]; solve();
    $('#pvL', el).innerHTML = `${r[3]} <input type="range" id="pvX" min="${r[0]}" max="${r[1]}" step="${r[2]}" value="${st[xk]}"><output class="mono">${fx(st[xk], xk === 'n' ? 1 : 0)}</output>`;
    $('#pvX', el).oninput = e => { st[xk] = +e.target.value; draw(); };
    // 活塞：高度 ∝ V，粒子數 ∝ n，粒子顏色亮度 ∝ T
    const h = clamp(st.V / 50, 0.12, 1) * 150, N = Math.round(st.n * 14), heat = clamp((st.T - 100) / 500, 0, 1);
    const dots = Array.from({ length: N }, (_, i) => `<circle cx="${40 + (i * 47 % 140)}" cy="${170 - ((i * 29) % Math.max(10, h - 10)) - 6}" r="4.5" fill="rgb(${Math.round(60 + 190 * heat)},${Math.round(90 - 40 * heat)},${Math.round(200 - 150 * heat)})"/>`).join('');
    $('#pvB', el).innerHTML = `<svg viewBox="0 0 220 200" class="bk" role="img" aria-label="活塞中的氣體"><path d="M30 20L30 180L190 180L190 20" class="glass"/><rect x="31" y="${178 - h - 8}" width="158" height="8" fill="var(--muted)"/><line x1="110" x2="110" y1="${178 - h - 8}" y2="10" stroke="var(--muted)" stroke-width="5"/>${dots}<text class="tk" x="110" y="196" text-anchor="middle">P = ${fx(st.P, 2)} atm</text></svg>`;
    const xs = Array.from({ length: 61 }, (_, i) => r[0] + i * (r[1] - r[0]) / 60);
    const yv = x => { const s = { ...st, [xk]: x }; return yk === 'P' ? s.n * RL * s.T / s.V : s.n * RL * s.T / s.P; };
    const ymax = Math.max(...xs.map(yv)) * 1.05;
    $('#pvC', el).innerHTML = chart({ x: [r[0], r[1]], y: [0, ymax], xt: [r[0], r[1]], yt: [0, +(ymax / 2).toFixed(1), +ymax.toFixed(1)], xlab: r[3], ylab: yk === 'P' ? 'P（atm）' : 'V（L）', h: 220 }, (X, Y) => `<path class="tline" d="${path(xs.map(x => [X(x), Y(yv(x))]))}"/><circle class="dot" cx="${X(st[xk])}" cy="${Y(yv(st[xk]))}" r="7"/>`);
    $('#pvK', el).innerHTML = card('p', 'P', `${fx(st.P, 2)} atm`) + card('v', 'V', `${fx(st.V, 1)} L`) + card('n', 'n', `${fx(st.n, 1)} mol`) + card('t', 'T', `${fx(st.T, 0)} K`);
    $('#pvN', el).innerHTML = { boyle: '<b>P ∝ 1/V</b>：體積變小，同樣的分子撞牆更頻繁，壓力變大（曲線是雙曲線）。', charles: '<b>V ∝ T</b>：溫度升高，分子跑得更快，要維持同樣壓力，體積必須變大。延長直線會通過 0 K，這就是絕對溫標的由來。', gay: '<b>P ∝ T</b>：體積固定時加熱，撞擊更用力、更頻繁，壓力上升（密閉容器加熱很危險）。', avog: '<b>V ∝ n</b>：同溫同壓下，同體積的任何氣體含有相同的分子數。0 °C、1 atm 時 1 mol 理想氣體佔 22.4 L。' }[st.law] + ' 全部合起來就是 <b>PV = nRT</b>（R = 0.08206 L·atm/(mol·K) = 8.314 J/(mol·K)）。溫度一定要用 <b>K</b>。';
    pressSeg(el, 'pvS', st.law);
  }
  bindSeg(el, 'pvS', v => { st.law = v; st.n = 1; st.T = 300; st.V = 24.6; st.P = 1; draw(); });

/* ===== 7. 真實氣體：PV/nRT 偏離 1 =====
   凡得瓦常數 a（L²·atm/mol²）、b（L/mol），CRC Handbook */
const VDW = { He: [0.0346, 0.0238], H2: [0.2476, 0.02661], N2: [1.370, 0.0387], CH4: [2.283, 0.04278], CO2: [3.640, 0.04267] }, VLAB = { He: 'He', H2: 'H₂', N2: 'N₂', CH4: 'CH₄', CO2: 'CO₂' };
W.realgas = el => {
  const st = { g: 'CO2', T: 300 };
  el.innerHTML = `${seg('rgS', Object.keys(VDW).map(k => [k, VLAB[k]]), st.g)}<div class="w-row"><label class="rng">溫度（K）<input type="range" id="rgT" min="250" max="800" step="10"><output class="mono" id="rgTo"></output></label></div><div id="rgG"></div><p class="eq" id="rgF"></p><p class="note" id="rgN"></p>`;
  const Z = (g, P, T) => { const [a, b] = VDW[g]; let lo = b * 1.0001, hi = 2 * RL * T / P + 1; const f = V => RL * T / (V - b) - a / (V * V) - P;
    // 找最大根（氣相）：由大往小掃描
    let V = hi; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; V = m; } return P * V / (RL * T); };
  function draw() {
    const Ps = Array.from({ length: 81 }, (_, i) => 1 + i * 10);
    $('#rgG', el).innerHTML = chart({ w: 560, h: 250, x: [0, 800], y: [0, 2], xt: [0, 200, 400, 600, 800], yt: [0, 0.5, 1, 1.5, 2], xlab: '壓力 P（atm）', ylab: 'PV / nRT', label: '真實氣體' }, (X, Y) =>
      `<line class="mk" x1="${X(0)}" x2="${X(800)}" y1="${Y(1)}" y2="${Y(1)}"/>` + Object.keys(VDW).map(g => `<path class="tline${g === st.g ? '' : ' faint'}" d="${path(Ps.map(P => [X(P), Y(clamp(Z(g, P, st.T), 0, 2))]))}"/>`).join('') + `<text class="tk" x="${X(790)}" y="${Y(1) - 6}" text-anchor="end">理想氣體 = 1</text>`);
    const [a, b] = VDW[st.g];
    $('#rgF', el).innerHTML = `(P + a·n²/V²)(V − n·b) = nRT　　${VLAB[st.g]}：a = ${a}、b = ${b}`;
    $('#rgN', el).innerHTML = `曲線低於 1：分子互相吸引（a），撞牆的力道變小，實際壓力比理想值低；曲線高於 1：分子本身佔有體積（b），可活動的空間變小。a 越大（分子越大、越容易極化，如 CO₂）向下彎得越明顯；溫度升高時分子動能大、吸引力相對不重要，曲線更接近 1。所以氣體在<b>高溫、低壓</b>下最接近理想，He、H₂ 最接近理想氣體。`;
    $('#rgT', el).value = st.T; $('#rgTo', el).textContent = `${st.T} K`; pressSeg(el, 'rgS', st.g);
  }
  bindSeg(el, 'rgS', v => { st.g = v; draw(); });
  $('#rgT', el).oninput = e => { st.T = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 1. 初速率法：自己做實驗找出反應級數 ===== */
W.ratelaw = el => {
  const RX = {
    no: { n: '2NO + O₂ → 2NO₂', A: 'NO', B: 'O₂', m: 2, n2: 1 },
    sn1: { n: '(CH₃)₃CBr + OH⁻ → (CH₃)₃COH + Br⁻', A: '(CH₃)₃CBr', B: 'OH⁻', m: 1, n2: 0 },
    sn2: { n: 'CH₃Br + OH⁻ → CH₃OH + Br⁻', A: 'CH₃Br', B: 'OH⁻', m: 1, n2: 1 },
  };
  let cur = 'no', A = 0.1, B = 0.1, rows = [], gm = null, gn = null;
  el.innerHTML = `${seg('rlS', Object.entries(RX).map(([k, v]) => [k, v.n]), cur)}<div class="w-row" id="rlC"></div><div class="w-row"><button class="btn sm pri" type="button" id="rlGo">做實驗：量初速率</button><button class="btn sm ghost" type="button" id="rlR">清除紀錄</button></div><div id="rlT"></div><div class="w-row" id="rlG"></div><p class="note" id="rlN"></p>`;
  const rate = (a, b) => { const r = RX[cur]; return a ** r.m * b ** r.n2; };
  function draw() {
    const r = RX[cur];
    $('#rlC', el).innerHTML = [['A', r.A, A], ['B', r.B, B]].map(([k, lab, v]) => `<span class="small">[${lab}] = <b class="mono">${fx(v, 2)}</b> M</span><button class="btn sm" type="button" data-c="${k}" data-f="0.5">÷2</button><button class="btn sm" type="button" data-c="${k}" data-f="2">×2</button><span class="sp"></span>`).join('');
    $$('[data-c]', el).forEach(b => { b.onclick = () => { const f = +b.dataset.f; if (b.dataset.c === 'A') A = clamp(A * f, 0.0125, 0.8); else B = clamp(B * f, 0.0125, 0.8); draw(); }; });
    const r0 = rows[0];
    $('#rlT', el).innerHTML = rows.length ? `<table class="tbl"><thead><tr><th>實驗</th><th>[${r.A}]（M）</th><th>[${r.B}]（M）</th><th>初速率（相對）</th></tr></thead><tbody>${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${fx(x.a, 3)}</td><td>${fx(x.b, 3)}</td><td class="mono">${fx(x.r / r0.r, 2)}</td></tr>`).join('')}</tbody></table>` : '<p class="small mut">還沒有實驗紀錄。調整濃度後按「做實驗」。技巧：每次只改變一種反應物的濃度。</p>';
    $('#rlG', el).innerHTML = `<span class="small">你的猜測：rate = k[${r.A}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gm === v ? ' pri' : ''}" type="button" data-gm="${v}">${v}</button>`).join('')}<span class="small">[${r.B}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gn === v ? ' pri' : ''}" type="button" data-gn="${v}">${v}</button>`).join('')}`;
    $$('[data-gm]', el).forEach(b => { b.onclick = () => { gm = +b.dataset.gm; draw(); }; });
    $$('[data-gn]', el).forEach(b => { b.onclick = () => { gn = +b.dataset.gn; draw(); }; });
    let msg = '先做至少三次實驗：一次當基準，一次只把第一種反應物加倍，一次只把第二種加倍。';
    if (gm != null && gn != null) msg = gm === r.m && gn === r.n2 ? `<span class="ok">✓ 正確</span>：rate = k[${r.A}]${r.m > 1 ? `<sup>${r.m}</sup>` : r.m ? '' : '⁰'}[${r.B}]${r.n2 > 1 ? `<sup>${r.n2}</sup>` : r.n2 ? '' : '⁰'}，總級數 ${r.m + r.n2}。${cur === 'sn1' ? '速率和 OH⁻ 無關：這正是 SN1，最慢的一步只有鹵烷參與。' : cur === 'sn2' ? '兩者都是一級：SN2 的過渡狀態同時包含兩者。' : '注意級數不等於方程式的係數也可以；這裡剛好相同，但必須由實驗決定。'}`
      : `<span class="bad">還不對</span>。找兩次「只有 [${r.A}] 不同」的實驗：濃度變 2 倍時速率變幾倍？2¹ = 2 → 一級；2² = 4 → 二級；不變 → 零級。`;
    $('#rlN', el).innerHTML = msg; pressSeg(el, 'rlS', cur);
  }
  bindSeg(el, 'rlS', v => { cur = v; rows = []; gm = gn = null; A = B = 0.1; draw(); });
  $('#rlGo', el).onclick = () => { rows.push({ a: A, b: B, r: rate(A, B) }); if (rows.length > 8) rows.shift(); draw(); };
  $('#rlR', el).onclick = () => { rows = []; draw(); };
  draw();
  return { set(s) { if (s.rx) { cur = s.rx; rows = []; } (s.rows || []).forEach(([a, b]) => rows.push({ a, b, r: rate(a, b) })); gm = s.gm ?? gm; gn = s.gn ?? gn; draw(); } };
};

/* ===== 2. 積分速率式：哪一種圖是直線 ===== */
W.order = el => {
  const st = { n: 1, k: 0.2 }, A0 = 1, T = 20;
  el.innerHTML = `${seg('orS', [['0', '零級'], ['1', '一級'], ['2', '二級']], '1')}<div class="w-row"><label class="rng">速率常數 k <input type="range" id="ork" min="0.02" max="0.5" step="0.01"><output class="mono" id="oro"></output></label></div><div class="og" id="orG"></div><div class="cards" id="orK"></div><p class="note" id="orN"></p>`;
  const Af = t => st.n === 0 ? Math.max(1e-4, A0 - st.k * t * 0.1) : st.n === 1 ? A0 * Math.exp(-st.k * t) : 1 / (1 / A0 + st.k * t);
  function draw() {
    const ts = Array.from({ length: 101 }, (_, i) => i * T / 100), k = st.n === 0 ? st.k * 0.1 : st.k;
    const half = st.n === 0 ? A0 / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * A0);
    const hs = []; let a = A0, t = 0; for (let i = 0; i < 4; i++) { const h = st.n === 0 ? a / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * a); t += h; a /= 2; if (t > T) break; hs.push([t, h]); }
    const plots = [['[A]', v => v, [0, 1], '[A] 對時間'], ['ln[A]', v => Math.log(v), [-5, 0], 'ln[A] 對時間'], ['1/[A]', v => 1 / v, [0, 12], '1/[A] 對時間']];
    $('#orG', el).innerHTML = plots.map(([lab, f, yr, ttl], i) => {

      `<b>一級</b>：rate = k[A]，<b>ln[A] 對時間是直線</b>，斜率 −k：ln[A] = ln[A]₀ − kt。半生期 <b>t½ = 0.693 ÷ k</b>，和起始濃度無關，所以連續的半生期都一樣長（左圖的虛線等間隔）。放射性衰變、多數藥物排除都是一級。`,

/* ===== 3. 活化能與溫度：能量分佈的尾巴 ===== */
W.arrh = el => {

      `<path class="area" d="${path([[X(Ea), Y(-14)], ...es.filter(e => e >= Ea).map(e => [X(e), Y(lg(dens(e, st.T)))]), [X(Emax), Y(-14)]])}Z"/><path class="tline2" d="${path(es.map(e => [X(e), Y(lg(dens(e, 298)))]))}"/><path class="tline" d="${path(es.map(e => [X(e), Y(lg(dens(e, st.T)))]))}"/><line class="cur" x1="${X(Ea)}" x2="${X(Ea)}" y1="${Y(-14)}" y2="${Y(0)}"/><text class="tk" x="${X(Ea) + 4}" y="${Y(-1)}">Ea</text><text class="tk" x="${X(Emax) - 4}" y="${Y(-0.6)}" text-anchor="end">藍：${st.T} K　灰虛線：298 K</text>`);

    const f = Math.exp(-Ea / (R * st.T)), f0 = Math.exp(-st.Ea / (R * 298)), ratio = f / f0, r10 = Math.exp(Ea / R * (1 / st.T - 1 / (st.T + 10)));

    $('#arN', el).innerHTML = `阿瑞尼斯方程式 k = A e<sup>−Ea/RT</sup>：只有能量超過 Ea 的碰撞才能反應。這些分子在分佈的<b>尾巴</b>上，所以溫度稍微升高，尾巴就抬高很多（縱軸是對數刻度）。Ea = ${Ea} kJ/mol 時，在 ${st.T} K 每升溫 10 K，速率約變為 ${fx(r10, 1)} 倍。${st.cat ? '催化劑提供另一條活化能較低的路徑，速率大增；但它同時加快正逆反應，<b>不改變平衡常數</b>。' : ''}`;

W.mechroles = el => {
  let cur = 'no';
  el.innerHTML = `${seg('mrS', Object.entries(MECH).map(([k, v]) => [k, v[0]]), cur)}<ol class="cs mrl" id="mrL"></ol><p class="eq" id="mrF"></p><div class="cards" id="mrK"></div><p class="note" id="mrN"></p>`;

    $('#mrF', el).innerHTML = `相加、消去兩邊相同的物種：${fmt(-1)} → ${fmt(1)}`;

  function draw() {

  }
  bindSeg(el, 'kpS', v => { cur = v; draw(); });
  draw();

};

/* ===== 3. 會不會沉澱：比較 Q 與 Ksp ===== */

  function draw() {

    $('#ppC', el).innerHTML = `<li>混合後體積加倍，濃度各減半：[Ag⁺] = ${sci(ag)} M、[Cl⁻] = ${sci(cl)} M</li><li>Q = [Ag⁺][Cl⁻] = ${sci(Q)}</li><li>Ksp(AgCl) = ${sci(K)}　→　Q ${ppt ? '&gt;' : '≤'} Ksp</li>`;

/* ===== 5. 錯合物使沉澱溶解：K = Ksp × Kf ===== */
W.complexsol = el => {
  const SALT = { AgCl: ['AgCl', 1.8e-10], AgBr: ['AgBr', 5.0e-13], AgI: ['AgI', 8.3e-17] }, LIG = { nh3: ['NH₃', 'Ag(NH₃)₂⁺', 1.7e7], cn: ['CN⁻', 'Ag(CN)₂⁻', 1.0e21] };
