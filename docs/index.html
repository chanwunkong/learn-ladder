<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="學習階梯：用互動圖解從原理學起的線上課程。">
<meta name="app-site" content="pages">
<meta name="theme-color" content="#2F3B99">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>學習階梯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; }
.home-link:hover { color: var(--accent); }

body { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.prog-all { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hero-box { padding: 48px 0 28px; }
.hero-box h1 { font-family: var(--display); font-size: clamp(30px, 6vw, 46px); margin: 0 0 12px; }
.hero-box .lede { font-size: 17px; color: var(--muted); max-width: 640px; margin: 0; }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 8px 0 40px; }
.course { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); text-decoration: none; position: relative; border-top: 4px solid var(--cc, var(--accent)); transition: border-color .15s, transform .15s; }
a.course:hover { transform: translateY(-2px); border-color: var(--cc, var(--accent)); }
.course .glyph { font-family: var(--mono); font-size: 22px; color: var(--cc, var(--accent)); }
.course h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.course p { margin: 0; color: var(--muted); font-size: 14.5px; }
.course ul { margin: 0; padding-left: 18px; font-size: 14px; }
.course .meter { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.course .meter .bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.course .meter i { display: block; height: 100%; background: var(--cc, var(--accent)); }
.course .go { font-weight: 700; color: var(--cc, var(--accent)); }
.course.soon { opacity: .75; }
.badge { position: absolute; top: 14px; right: 14px; font-size: 12px; border-radius: 99px; padding: 2px 10px; background: var(--warn-soft); color: var(--warn); }
.how { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding: 20px 0 40px; }
.how b { color: var(--ink); }
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <a class="brand" href="./" style="text-decoration:none">學習階梯<small>LEARN LADDER</small></a>
  <span class="prog-all" id="progAll"></span>
</div></header>
<main class="wrap">
  <section class="hero-box">
    <p class="eyebrow" id="eb">互動圖解 · 從原理學起</p>
    <h1 id="h1">一階一階，把難的東西學懂。</h1>
    <p class="lede" id="lede">每門課都從直覺和圖像開始，再講原理與應用。不用安裝軟體，手機也能學；登入後進度在不同裝置同步。</p>
    <div id="syncSlot"></div>
  </section>
  <section class="courses" id="courses" aria-label="課程"></section>
  <p class="how" id="how"></p>
</main>
<script>
/* ---------- 雲端同步（Firebase，各課程與首頁共用）：Google 登入後，把「已完成的章節」存到 Firestore ----------
   只在正式網站（GitHub Pages，HEAD 帶 app-site meta）啟用；Artifact 與本機檔案不載入 SDK。
   位置：users/{uid}/settings/<課程 doc> ＝ { done: {章節id: 1}, lang, updated }
   使用前先定義 COURSE：
     tracks: [{ doc, get() → 已完成表, set(表) }]   課程頁一條；首頁列出全部課程，一次同步
     count() / total()                             面板上顯示的完成章數
     refresh()                                     從雲端合併進新章節後重畫畫面
   介面：右上角按鈕 → 下拉面板說明「登入有什麼用」與目前同步狀態；hint() 給首頁的提示列。 */
const CLOUD = (() => {
  const CFG = { apiKey: 'AIzaSyD8oEe02SY2PCDe3d40NtTprrApqW_DhB8', authDomain: 'test-5dbba.firebaseapp.com', projectId: 'test-5dbba' };
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-';
  let auth = null, db = null, user = null, timer = 0, ready = false, busy = false, err = '', last = 0;
  const on = () => !!document.querySelector('meta[name="app-site"]') && /^https?:$/.test(location.protocol);
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const ref = doc => db.collection('users').doc(user.uid).collection('settings').doc(doc);
  const zh = () => (typeof isZh === 'function' ? isZh() : true), lang = () => (typeof I18N !== 'undefined' ? I18N.lang : 'zh-TW');
  const T = (a, b) => (zh() ? a : b);
  const nDone = () => COURSE.count();
  const time = t => new Date(t).toLocaleTimeString(zh() ? 'zh-TW' : 'en', { hour: '2-digit', minute: '2-digit' });
  const G = '<svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 5.9-2.2L12 13.6c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.8a5.4 5.4 0 0 1 0-3.5V4.9H1a9 9 0 0 0 0 8.1l3-2.3z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 4.9l3 2.3c.7-2.1 2.7-3.6 5-3.6z"/></svg>';

  function panelHTML() {
    if (!ready) return `<p class="cp-t">${T('連線中…', 'Connecting…')}</p>`;
    const n = nDone(), tot = COURSE.total(), e = err ? `<p class="cp-err">${esc(err)}</p>` : '';
    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>
<p>${T('用 Google 帳號登入後，你完成的章節會存到雲端。之後在手機或其他電腦登入同一個帳號，進度會自動接上。', 'Sign in with Google and the chapters you finish are saved to the cloud. Sign in with the same account on your phone or another computer and your progress follows you.')}</p>
<p class="cp-st">${T(`目前：進度只存在這台裝置（已完成 ${n} / ${tot} 章）`, `Now: progress is saved on this device only (${n} / ${tot} chapters done)`)}</p>
<button class="btn pri cp-go" type="button" id="cpIn">${G}<span>${T('用 Google 登入', 'Sign in with Google')}</span></button>
<p class="cp-s">${T('不登入也能使用全部內容。這裡只儲存「完成了哪些章節」，不會讀取你的其他 Google 資料。', 'Everything works without signing in. Only the list of finished chapters is stored, nothing else from your Google account.')}</p>${e}`;
    return `<p class="cp-t">${user.photoURL ? `<img class="cp-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(user.displayName || T('已登入', 'Signed in'))}<small>${esc(user.email || '')}</small></span></p>
<p class="cp-st ok">${busy ? T('同步中…', 'Syncing…') : `✓ ${T(`已同步 ${n} / ${tot} 章`, `${n} / ${tot} chapters synced`)}${last ? ` · ${time(last)}` : ''}`}</p>
<p>${T('在其他裝置用同一個帳號登入，就會看到相同的進度；在任何一台標記完成，其他裝置也會跟著更新。', 'Sign in with the same account on another device to see the same progress. Chapters you finish anywhere show up everywhere.')}</p>
<button class="btn" type="button" id="cpOut">${T('登出', 'Sign out')}</button>
<p class="cp-s" style="margin-top:8px !important">${T('登出後，這台裝置上的進度仍會保留。', 'Signing out keeps your progress on this device.')}</p>${e}`;
  }
  function render() {
    const b = document.getElementById('cloudBtn'), p = document.getElementById('cloudPanel');
    if (b) {
      b.innerHTML = user ? `${user.photoURL ? `<img class="cb-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '<span class="cb-dot"></span>'}<span>${busy ? T('同步中', 'Syncing') : T('已同步', 'Synced')}</span>` : `<span aria-hidden="true">☁</span><span>${T('同步進度', 'Sync progress')}</span>`;
      b.title = user ? T('進度已同步到雲端，點一下看詳情', 'Progress is synced; click for details') : T('登入後可在不同裝置同步學習進度', 'Sign in to sync progress across devices');
    }
    if (p && !p.hidden) {
      p.innerHTML = panelHTML();
      const i = document.getElementById('cpIn'), o = document.getElementById('cpOut');
      if (i) i.onclick = signIn;
      if (o) o.onclick = () => auth.signOut();
    }
    const h = document.getElementById('syncHint'); if (h) h.outerHTML = hint();
  }
  function signIn() {
    err = ''; if (!ready) return;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { err = T('登入失敗：', 'Sign-in failed: ') + e.code; toggle(true); }
    });
  }
  function toggle(show) {
    const p = document.getElementById('cloudPanel'), b = document.getElementById('cloudBtn'); if (!p) return;
    p.hidden = show === undefined ? !p.hidden : !show; b.setAttribute('aria-expanded', String(!p.hidden)); render();
  }
  function push() {
    if (!user) return;
    clearTimeout(timer); busy = true; render();
    timer = setTimeout(() => Promise.all(COURSE.tracks.map(t => ref(t.doc).set({ done: t.get(), lang: lang(), updated: Date.now() })))
      .then(() => { busy = false; err = ''; last = Date.now(); render(); })
      .catch(e => { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }), 800);
  }
  async function pull() {
    try {
      busy = true; render();
      let added = 0, ahead = false;
      for (const t of COURSE.tracks) {
        const snap = await ref(t.doc).get(), remote = (snap.exists && snap.data().done) || {}, local = { ...t.get() };
        const add = Object.keys(remote).filter(k => !local[k]);
        add.forEach(k => { local[k] = 1; });
        if (add.length) { t.set(local); added += add.length; }
        if (Object.keys(local).some(k => !remote[k])) ahead = true;
      }
      if (added) COURSE.refresh();
      busy = false; last = Date.now(); err = '';
      if (ahead) push(); else render();
    } catch (e) { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }
  }
  // 首頁提示：有進度、還沒登入、沒按過「不用了」時才出現
  function hint() {
    if (!on() || user || !ready || !nDone() || store.get('syncHintOff', 0)) return '<div id="syncHint" hidden></div>';
    return `<div id="syncHint" class="sync-hint" data-notr><span>☁ ${T(`你已完成 ${nDone()} 章，進度目前只存在這台裝置。登入 Google 帳號，換手機或電腦也能接著學。`, `You've finished ${nDone()} chapters, saved on this device only. Sign in with Google to continue on your phone or another computer.`)}</span><button class="btn sm pri" type="button" data-sync="in">${T('登入同步', 'Sign in')}</button><button class="btn sm" type="button" data-sync="off">${T('不用了', 'No thanks')}</button></div>`;
  }
  async function start() {
    if (!on()) return;
    const top = document.querySelector('.top-in');
    if (!top) return;
    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, hint, render };
})();


/* ---------- 學習階梯首頁：課程總覽、各課程進度、登入同步（一次同步所有課程） ---------- */
// 語言跟著生統階梯的設定（目前只有生統有英文版）
const isZh = () => { let l = null; try { l = localStorage.getItem('biostat-ladder:lang'); } catch (e) { /* 私密模式 */ } return l ? l === 'zh-TW' : /^zh/i.test(navigator.language || 'zh'); };
const T = (zh, en) => (isZh() ? zh : en);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('learn-ladder:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('learn-ladder:' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時忽略 */ } },
};
// 各課程的本機進度存在自己的前綴下（同網域，首頁讀得到）；total 由課程頁開啟時寫入
const local = (pre, k, d) => { try { const v = localStorage.getItem(pre + ':' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const COURSES = [
  { id: 'biostat', pre: 'biostat-ladder', doc: 'biostatLadder', total: 67, color: '#2F3B99', glyph: 'μ · p · HR',
    title: ['生統階梯', 'Biostat Ladder'], desc: ['從國中數學到可投稿論文的生物統計。', 'Biostatistics from middle-school math to a publishable paper.'],
    items: [['互動圖解每個統計概念', 'Every concept as an interactive chart'], ['一份模擬試驗資料貫穿全課程', 'One simulated trial used throughout'], ['不寫程式的分析實驗室', 'A no-code analysis lab']] },
  { id: 'chem', pre: 'chem-ladder', doc: 'chemLadder', total: 30, color: '#17705F', glyph: 'H⁺ ⇌ A⁻',
    title: ['後中化學', 'Post-bacc Chemistry'], desc: ['學士後中醫入學考的普通化學與有機化學，從原理學起。', 'General and organic chemistry for Taiwan’s post-baccalaureate TCM entrance exam.'],
    items: [['滴定、平衡、反應機構都能動手操作', 'Hands-on titrations, equilibria and mechanisms'], ['看懂電子怎麼流，不用死背反應', 'Understand electron flow instead of memorizing reactions'], ['普化原理直接串到有機反應', 'General chemistry linked straight to organic reactions']] },
];
const doneOf = c => local(c.pre, 'done', {}), totalOf = c => local(c.pre, 'total', c.total);
const countOf = c => Object.keys(doneOf(c)).length;
const L = a => a[isZh() ? 0 : 1];

function render() {
  document.documentElement.lang = isZh() ? 'zh-Hant' : 'en';
  document.title = T('學習階梯', 'Learn Ladder');
  $('#eb').textContent = T('互動圖解 · 從原理學起', 'Interactive · From first principles');
  $('#h1').textContent = T('一階一階，把難的東西學懂。', 'Learn hard things, one step at a time.');
  $('#lede').textContent = T('每門課都從直覺和圖像開始，再講原理與應用。不用安裝軟體，手機也能學；登入後進度在不同裝置同步。', 'Every course starts from intuition and pictures, then principles and applications. Nothing to install, works on your phone, and progress syncs across devices when you sign in.');
  $('#courses').innerHTML = COURSES.map(c => {
    const n = countOf(c), t = totalOf(c), body = `<span class="glyph">${c.glyph}</span><h2>${L(c.title)}</h2><p>${L(c.desc)}</p><ul>${c.items.map(i => `<li>${L(i)}</li>`).join('')}</ul>`;
    if (c.soon) return `<div class="course soon" style="--cc:${c.color}"><span class="badge">${T('製作中', 'Coming soon')}</span>${body}</div>`;
    return `<a class="course" href="./${c.id}/" style="--cc:${c.color}">${body}<span class="meter"><span>${n} / ${t}</span><span class="bar"><i style="width:${Math.round(100 * n / t)}%"></i></span><span class="go">${n ? T('繼續', 'Continue') : T('開始', 'Start')} →</span></span></a>`;
  }).join('');
  const all = COURSES.filter(c => !c.soon).reduce((s, c) => s + countOf(c), 0);
  $('#progAll').textContent = all ? T(`已完成 ${all} 章`, `${all} chapters done`) : '';
  $('#how').innerHTML = T('<b>課程內容</b>皆為原創教材，互動圖中的資料多為模擬資料，僅供學習。程式碼採 MIT 授權，課程內容採 CC BY 4.0。', '<b>All course material</b> is original; data in the charts are mostly simulated and for learning only. Code under MIT, content under CC BY 4.0.');
  $('#syncSlot').innerHTML = CLOUD.hint();
}
const $ = s => document.querySelector(s);

// 雲端同步設定：首頁一次同步所有已開放的課程（src/shared/cloud.js）
const COURSE = {
  tracks: COURSES.filter(c => !c.soon).map(c => ({ doc: c.doc, get: () => doneOf(c), set: m => { try { localStorage.setItem(c.pre + ':done', JSON.stringify(m)); } catch (e) { /* 忽略 */ } } })),
  count: () => COURSES.filter(c => !c.soon).reduce((s, c) => s + countOf(c), 0),
  total: () => COURSES.filter(c => !c.soon).reduce((s, c) => s + totalOf(c), 0),
  refresh: render,
};
render();
CLOUD.start();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
