<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="學習階梯：用互動圖解從原理學起的線上課程。">
<meta name="app-site" content="pages">
<meta name="theme-color" content="#2F3B99">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>學習階梯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
@media (max-width: 480px) { .cloud-btn > span:last-child { display: none; } }   /* 手機：頁首只顯示頭像或雲朵，維持一行 */
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-link:hover { color: var(--accent); }

body { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.prog-all { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hero-box { padding: 48px 0 28px; }
.hero-box h1 { font-family: var(--display); font-size: clamp(30px, 6vw, 46px); margin: 0 0 12px; }
.hero-box .lede { font-size: 17px; color: var(--muted); max-width: 640px; margin: 0; }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 8px 0 40px; }
.course { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); text-decoration: none; position: relative; border-top: 4px solid var(--cc, var(--accent)); transition: border-color .15s, transform .15s; }
a.course:hover { transform: translateY(-2px); border-color: var(--cc, var(--accent)); }
.course .glyph { font-family: var(--mono); font-size: 22px; color: var(--cc, var(--accent)); }
.course h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.course p { margin: 0; color: var(--muted); font-size: 14.5px; }
.course ul { margin: 0; padding-left: 18px; font-size: 14px; }
.course .meter { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.course .meter .bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.course .meter i { display: block; height: 100%; background: var(--cc, var(--accent)); }
.course .go { font-weight: 700; color: var(--cc, var(--accent)); }
.course.soon { opacity: .75; }
.badge { position: absolute; top: 14px; right: 14px; font-size: 12px; border-radius: 99px; padding: 2px 10px; background: var(--warn-soft); color: var(--warn); }
.other-h { font-family: var(--display); font-size: 22px; margin: 8px 0 4px; }
/* 後中考試區 */
.exam { display: grid; gap: 16px; padding: 4px 0 36px; }
.ex-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ex-h { font-family: var(--display); font-size: clamp(26px, 5vw, 34px); margin: 0; }
.count { display: flex; align-items: center; gap: 10px; }
.count b { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--eosin); font-variant-numeric: tabular-nums; }
.count span { font-size: 14px; line-height: 1.4; }
.count small, .dates small { color: var(--muted); font-size: 12px; }
.next { margin: 0; font-size: 14.5px; padding: 10px 14px; background: var(--warn-soft); border-radius: 8px; }
.chip { display: inline-block; margin-left: 8px; font-family: var(--mono); font-size: 11px; border-radius: 99px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.chip.known { border-color: var(--good); color: var(--good); } .chip.goal { border-color: var(--accent); color: var(--accent); }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h3 { margin: 0; font-size: 17px; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo a, .todo li.soon { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; }
.todo a:hover { border-color: var(--accent); }
.todo b { font-weight: 500; font-size: 13px; color: var(--eosin); text-align: right; }
.todo .ok b { color: var(--good); } .todo li.soon { color: var(--muted); } .todo li.soon b { color: var(--muted); }
.ck { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 13px; color: var(--good); }
.todo .ok .ck { border-color: var(--good); background: var(--good-soft); }
.streak { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.streak b { font-family: var(--mono); font-size: 20px; color: var(--accent); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { height: 18px; border-radius: 3px; background: var(--sunk); min-width: 0; }
.heat i.l1 { background: color-mix(in srgb, var(--good) 30%, var(--sunk)); } .heat i.l2 { background: color-mix(in srgb, var(--good) 62%, var(--sunk)); } .heat i.l3 { background: var(--good); }
.heat i.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-cap { display: flex; justify-content: space-between; margin: -4px 0 0; font-size: 11.5px; color: var(--muted); }
.eslots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 6px 0; }
.eslots a { display: grid; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; text-align: center; }
.eslots i { display: block; height: 10px; border-radius: 3px; background: linear-gradient(to right, var(--accent) calc(var(--f) * 100%), var(--sunk) 0); }
.subj { border-top: 1px solid var(--line); padding-top: 10px; }
.subj summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.subj summary::-webkit-details-marker { display: none; }
.subj summary::after { content: "▾"; margin-left: auto; color: var(--muted); } .subj:not([open]) summary::after { content: "▸"; }
.sj { font-family: var(--display); font-size: 20px; font-weight: 700; }
.big { font-family: var(--mono); font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; } .big small { font-size: 14px; }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--sunk); margin-top: 10px; }
.s-master, .t-master { background: var(--good); } .s-prac { background: var(--accent); } .s-weak { background: var(--bad); } .s-none { background: var(--sunk); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.k-master::before { background: var(--good); } .k-prac::before { background: var(--accent); } .k-weak::before { background: var(--bad); } .k-none::before { background: var(--sunk); border: 1px solid var(--line); }
.chmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 8px 0; }
.enter { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; margin: 14px 0 18px; }
.ent { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 14px 16px; border-radius: 12px; background: var(--sc); color: #fff; text-decoration: none; min-height: 64px; }
.ent b { font-family: var(--display); font-size: 22px; } .ent span { font-size: 14px; opacity: .92; } .ent i { font-style: normal; font-size: 22px; }
.ent:active { filter: brightness(1.15); }
.subj summary a.sj { color: inherit; text-decoration: none; }
.tile i { font-style: normal; color: var(--accent); }
.navwait { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 99px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.navwait::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -1px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tile { display: grid; gap: 2px; padding: 7px 9px; border-radius: 7px; text-decoration: none; font-size: 12.5px; line-height: 1.35; border: 1px solid var(--line); color: var(--ink); min-width: 0; }
.tile span { overflow-wrap: anywhere; } .tile small { font-size: 11px; color: var(--muted); }
.tile.t-master { background: var(--good-soft); border-color: var(--good); } .tile.t-prac { background: var(--soft); border-color: var(--accent); }
.tile.t-weak { background: var(--bad-soft); border-color: var(--bad); } .tile.t-none { background: var(--surface); }
.dates { list-style: none; margin: 0; padding: 0; display: grid; }
.dates li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 4.5em; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.dates li:last-child { border-bottom: 0; }
.dates .when { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dates .left { text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--eosin); }
.dates li.ex.mine .what b { color: var(--eosin); } .dates li.other { color: var(--muted); } .dates li.other .left { color: var(--muted); } .dates li.past { opacity: .5; }
@media (max-width: 520px) { .dates li { grid-template-columns: 7.6em minmax(0, 1fr) 3.6em; gap: 8px; font-size: 13.5px; } }
.how { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding: 20px 0 40px; }
.how b { color: var(--ink); }
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <a class="brand" href="./" style="text-decoration:none">學習階梯<small>LEARN LADDER</small></a>
  <span class="prog-all" id="progAll"></span>
</div></header>
<main class="wrap">
  <section class="hero-box">
    <p class="eyebrow" id="eb">互動圖解 · 從原理學起</p>
    <h1 id="h1">一階一階，把難的東西學懂。</h1>
    <p class="lede" id="lede">每門課都從直覺和圖像開始，再講原理與應用。不用安裝軟體，手機也能學；登入後進度在不同裝置同步。</p>
    <div id="syncSlot"></div>
  </section>
  <section class="exam" id="exam" aria-label="後中考試"></section>
  <h2 class="other-h" id="otherH">其他課程</h2>
  <section class="courses" id="courses" aria-label="課程"></section>
  <p class="how" id="how"></p>
</main>
<script>
/* ---------- 雲端同步（Firebase，各課程與首頁共用）：Google 登入後，把「已完成的章節」存到 Firestore ----------
   只在正式網站（GitHub Pages，HEAD 帶 app-site meta）啟用；Artifact 與本機檔案不載入 SDK。
   位置：users/{uid}/settings/<課程 doc> ＝ { done: {章節id: 1}, lang, updated }
   使用前先定義 COURSE：
     tracks: [{ doc, get() → 已完成表, set(表) }]   課程頁一條；首頁列出全部課程，一次同步
     count() / total()                             面板上顯示的完成章數
     refresh()                                     從雲端合併進新章節後重畫畫面
     logs: { doc, get() → 紀錄陣列, set(陣列) } 或其陣列（選用） 練習紀錄：與雲端取聯集合併，任何一邊都不會刪掉另一邊的紀錄
   介面：右上角按鈕 → 下拉面板說明「登入有什麼用」與目前同步狀態；hint() 給首頁的提示列。 */
const CLOUD = (() => {
  const CFG = { apiKey: 'AIzaSyD8oEe02SY2PCDe3d40NtTprrApqW_DhB8', authDomain: 'test-5dbba.firebaseapp.com', projectId: 'test-5dbba' };
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-';
  let auth = null, db = null, user = null, timer = 0, ready = false, busy = false, err = '', last = 0;
  const on = () => !!document.querySelector('meta[name="app-site"]') && /^https?:$/.test(location.protocol);
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const ref = doc => db.collection('users').doc(user.uid).collection('settings').doc(doc);
  const zh = () => (typeof isZh === 'function' ? isZh() : true), lang = () => (typeof I18N !== 'undefined' ? I18N.lang : 'zh-TW');
  const T = (a, b) => (zh() ? a : b);
  const nDone = () => COURSE.count();
  const time = t => new Date(t).toLocaleTimeString(zh() ? 'zh-TW' : 'en', { hour: '2-digit', minute: '2-digit' });
  const G = '<svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 5.9-2.2L12 13.6c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.8a5.4 5.4 0 0 1 0-3.5V4.9H1a9 9 0 0 0 0 8.1l3-2.3z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 4.9l3 2.3c.7-2.1 2.7-3.6 5-3.6z"/></svg>';

  function panelHTML() {
    if (!ready) return `<p class="cp-t">${T('連線中…', 'Connecting…')}</p>`;
    const n = nDone(), tot = COURSE.total(), e = err ? `<p class="cp-err">${esc(err)}</p>` : '';
    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>

/* ---------- 錯題排程（化學、英文與首頁共用） ----------
   只從練習紀錄推算，不另外存狀態，所以紀錄同步到哪裡，排程就跟到哪裡。
   紀錄每一筆：{ t 時間, c 章, k 題型, h 題目識別碼, ok, n 第幾次作答 }；n === 1 是「一次作答」的開頭。
   規則（2026-11-02 使用者要求加長）：每題每天只算第一次作答。
   - 第一次就答錯 → 進入錯題本，隔 1 天到期（第 1 格）。
   - 到期後（之後任何一天）第一次就答對 → 進到下一格，依序再隔 3、7、14、30 天；五格都過才算掌握，離開錯題本。
   - 在錯題本中又答錯 → 從第 1 格重新開始（隔 1 天）。
   - 考前總複習：FINAL 那天起，所有曾經答錯、已經掌握的題目再到期一次；答對就完成，答錯就重新進錯題本。
   防止「猜對」（2026-11-02 使用者要求，兩個方法一起用）：
   - 追問：第一次就答對時，接著追問這題的一個推理步驟（k: 'fu'，fk 為原題型）。追問第一次就答錯 → 這次作答當成答錯（猜對）。
   - 確認題：第一次就答對的新題目，CHECK 天後再出一次（chk）；答對才算會，答錯就進五格複習。
   作廢（2026-11-07 使用者要求）：「重新練習」選「之前的不算」時記一筆 k:'reset'、v 為那一段的題目識別碼；那些題目在這之前的作答全部不算（紀錄本身保留）。 */
const REVIEW = (() => {
  const DAY = 864e5, GAPS = [1, 3, 7, 14, 30], CHECK = 3, FINAL = new Date(2027, 2, 1).getTime();   // 2027-03-01
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const RULE = `第一次就答錯的題目會進錯題本，依序在隔 ${GAPS.join('、')} 天回來（共 ${GAPS.length} 格）。每次都要當天第一次就答對才往下一格；中途答錯就從第 1 格重新開始。五格都過才算掌握。為了排除猜對：答對後會追問一個理由，理由答錯就當成猜對、進錯題本；第一次就答對的題目，${CHECK} 天後還會出一次確認題。2027 年 3 月 1 日起，所有曾經錯過的題目會再出現一次（考前總複習）。`;
  // 拿掉被「之前的不算」作廢的作答
  function live(log) {
    const rs = log.filter(e => e.k === 'reset' && e.v);
    if (!rs.length) return log;
    const cut = new Map(); rs.forEach(r => r.v.forEach(h => cut.set(h, Math.max(cut.get(h) || 0, r.t))));
    return log.filter(e => !(e.h && e.k !== 'reset' && e.t < (cut.get(e.h) || 0)));
  }
  // 每題每天的第一次作答
  function trials(log) {
    log = live(log);
    const seen = new Set(), out = [], guess = new Set();
    for (const e of log) if (e.k === 'fu' && e.n === 1 && !e.ok) guess.add(`${e.c}|${e.fk}|${e.h}@${dayKey(e.t)}`);   // 追問答錯 → 那天的作答算猜對
    for (const e of log) {
      if (e.n !== 1 || !e.h || e.k === 'fu') continue;
      const key = `${e.c}|${e.k}|${e.h}`, dk = dayKey(e.t);
      if (seen.has(key + '@' + dk)) continue;
      const g = !!e.ok && guess.has(key + '@' + dk);
      seen.add(key + '@' + dk); out.push({ key, t: e.t, ok: !!e.ok && !g, guess: g, c: e.c, k: e.k, h: e.h, i: e.i, qt: e.qt });
    }
    return out;
  }
  // 每題目前的狀態：{ key, c, k, h, i, qt, open, stage（0 起算的格數）, due, wrongs, last, first（第一次作答是否答對） }
  function state(log) {
    const m = new Map();
    for (const tr of trials(log)) {
      let s = m.get(tr.key);
      const fresh = !s;
      if (!s) { s = { key: tr.key, c: tr.c, k: tr.k, h: tr.h, i: tr.i, qt: tr.qt, open: false, chk: false, stage: 0, due: 0, wrongs: 0, guesses: 0, last: 0, first: tr.ok }; m.set(tr.key, s); }
      s.i = tr.i; s.qt = tr.qt || s.qt; if (tr.guess) s.guesses++;
      if (!tr.ok) { s.open = true; s.chk = false; s.stage = 0; s.wrongs++; s.due = dayStart(tr.t) + GAPS[0] * DAY; }
      else if (fresh) { s.open = true; s.chk = true; s.due = dayStart(tr.t) + CHECK * DAY; }   // 新題目第一次就答對 → 確認題
      else if (s.open && s.chk && tr.t >= s.due) { s.open = false; s.chk = false; }
      else if (s.open && tr.t >= s.due) {
        s.stage++;
        if (s.stage >= GAPS.length) s.open = false; else s.due = dayStart(tr.t) + GAPS[s.stage] * DAY;
      }
      s.last = tr.t;
    }
    return m;
  }
  // 錯題本：還沒掌握的題目；due 為「今天以前到期」，加上考前總複習（final: true）
  function book(log, now = Date.now()) {
    const st = [...state(log).values()], all = st.filter(s => s.open && !s.chk), checks = st.filter(s => s.open && s.chk);
    const fin = now >= FINAL ? st.filter(s => !s.open && s.wrongs > 0 && s.last < FINAL).map(s => ({ ...s, final: true, due: FINAL })) : [];
    return { open: all, checks, due: all.concat(checks).filter(s => s.due <= now).concat(fin).sort((a, b) => a.due - b.due) };
  }
  // 答對之後的說明：下一次什麼時候回來
  // 選對之後的開頭：第一次就選對才說「答對了」；前面選錯過就照實說（2026-11-07：選錯三次後仍顯示「答對了」很混淆）
  const okHead = tries => (tries > 1 ? `<b>選對了</b>，但前面選錯 ${tries - 1} 次，這次不算答對。` : '<b>答對了。</b>');
  // guess：第一次就選對、但追問理由答錯
  function after(s, firstTry, guess = false) {
    if (!firstTry) return `${guess ? '理由沒選對，算猜對' : '今天第一次沒選對'}，從第 1 格重新開始，明天再考一次。`;
    if (s.final) return '考前總複習完成。';
    if (s.chk) return '確認完成：這題真的會了。';
    if (s.stage + 1 >= GAPS.length) return `五格都過了，這題已經掌握，離開錯題本（2027 年 3 月起的考前總複習還會再出現一次）。`;
    return `${GAPS[s.stage + 1]} 天後再考一次（進到第 ${s.stage + 2} / ${GAPS.length} 格）。`;
  }
  // 「重新練習」的確認：之前的作答照算（隔很久重新複習），或不算（測試、亂按、跳過）
  const resetAsk = what => `<span class="small">讓${what}全部恢復成沒做過的樣子。之前的作答要算嗎？</span><button class="btn sm pri" type="button" data-y>照算（重新複習）</button><button class="btn sm" type="button" data-v>之前的不算（測試／亂按）</button><button class="btn sm" type="button" data-n>取消</button><span class="small">「之前的不算」：${what}的題目在這之前的作答，錯題本和週報都不算。</span>`;
  const label = s => (s.final ? '考前總複習' : s.chk ? '確認題（之前第一次就答對）' : `第 ${s.stage + 1} / ${GAPS.length} 格`);
  // 接下來 14 天每天到期幾題：[[dayKey, 題數]]
  function upcoming(open, now = Date.now(), days = 14) {
    const m = new Map();
    [].concat(open).filter(s => s.due > now && s.due <= now + days * DAY).forEach(s => { const k = dayKey(s.due); m.set(k, (m.get(k) || 0) + 1); });
    return [...m.entries()].sort();
  }
  return { live, resetAsk, trials, state, book, after, okHead, label, upcoming, dayKey, dayStart, DAY, GAPS, CHECK, RULE, FINAL };
})();

// 要和英文頁的 qlog 一樣含 fu（追問）：追問答錯的題目算猜對、進錯題本，少了它首頁的錯題數和到期數會和錯題本頁對不上
const engLog = () => REVIEW.live(local('eng-ladder', 'log', [])).filter(e => ['w', 'wr', 's', 'g', 'p', 'fu'].includes(e.k));
const engSum = () => local('eng-ladder', 'sum', null);
const ENG_WEEKS = 17;   // 2026-11 起到 2027-02 底
const chemDone = () => local('chem-ladder', 'done', {});

// 一題的進度（依錯題複習）：沒做 0；錯題本第 1 格 0.2、每過一格 +0.15；第一次就答對、等確認題 0.6；確認答對或五格都過 1
const qScore = s => (!s ? 0 : !s.open ? 1 : s.chk ? 0.6 : 0.2 + 0.15 * s.stage);
// 各章狀態：未開始／練習中／待加強／已掌握；got＝已拿到的考卷比重（%）：每章佔 w × 2 %（中國醫每份 50 題約 w 題），平分給有題目的各小節，各節再乘上題目進度的平均
function chemChapters(log) {
  const tr = REVIEW.trials(log), book = REVIEW.book(log), done = chemDone(), stM = REVIEW.state(log);
  return CHEM_META.map(m => {
    const t = tr.filter(x => x.c === m.id), recent = t.slice(-20), acc = recent.length ? recent.filter(x => x.ok).length / recent.length : 0;
    const seen = new Set(t.map(x => x.key)).size, open = book.open.filter(s => s.c === m.id).length;
    let st = 'none';
    if (t.length) {
      if ((recent.length >= 3 && acc < 0.6) || open >= 3) st = 'weak';
      else if (done[m.id] && seen >= m.n * 0.4 && acc >= 0.8 && !open) st = 'master';
      else st = 'prac';
    }
    const pct = m.w * 2, got = m.s.length ? m.s.reduce((a, qs) => a + qs.reduce((b, kh) => b + qScore(stM.get(`${m.id}|${kh}`)), 0) / qs.length, 0) / m.s.length * pct : 0;
    return { ...m, st, acc, seen, open, pct, got };
  });
}
const CH_ST = { master: '已掌握', prac: '練習中', weak: '待加強', none: '未開始' };

function renderExam() {

  // 今天複習了幾題：今天作答、而且在今天以前就在錯題本裡的題目
  const before = REVIEW.book(log.filter(e => REVIEW.dayKey(e.t) !== today));

  $('#exam').innerHTML = `

    </details>

// 英文「今天」：下一個還沒做完的段落

  if (!es.next) return `<li class="ok"><a href="./eng/#report"><span class="ck">✓</span><span>英文第 ${es.n} 週全部完成</span><b>看週報、匯出給下一週</b></a></li>`;

  return `<li class="${n ? 'ok' : ''}"><a href="./eng/#d${d + 1}${s}"><span class="ck">${n ? '✓' : ''}</span><span>英文：第 ${es.n} 週第 ${d + 1} 天${s === 'am' ? '早上' : '晚上'}</span><b>${n ? `今天做了 ${n} 題` : '今天還沒練習'}</b></a></li>`;

function engProgress(es) {
