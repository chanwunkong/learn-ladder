<title>學習階梯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/*BASE*/
body { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.prog-all { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hero-box { padding: 48px 0 28px; }
.hero-box h1 { font-family: var(--display); font-size: clamp(30px, 6vw, 46px); margin: 0 0 12px; }
.hero-box .lede { font-size: 17px; color: var(--muted); max-width: 640px; margin: 0; }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 8px 0 40px; }
.course { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); text-decoration: none; position: relative; border-top: 4px solid var(--cc, var(--accent)); transition: border-color .15s, transform .15s; }
a.course:hover { transform: translateY(-2px); border-color: var(--cc, var(--accent)); }
.course .glyph { font-family: var(--mono); font-size: 22px; color: var(--cc, var(--accent)); }
.course h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.course p { margin: 0; color: var(--muted); font-size: 14.5px; }
.course ul { margin: 0; padding-left: 18px; font-size: 14px; }
.course .meter { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.course .meter .bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.course .meter i { display: block; height: 100%; background: var(--cc, var(--accent)); }
.course .go { font-weight: 700; color: var(--cc, var(--accent)); }
.course.soon { opacity: .75; }
.badge { position: absolute; top: 14px; right: 14px; font-size: 12px; border-radius: 99px; padding: 2px 10px; background: var(--warn-soft); color: var(--warn); }
.other-h { font-family: var(--display); font-size: 22px; margin: 8px 0 4px; }
/* 後中考試區 */
.exam { display: grid; gap: 16px; padding: 4px 0 36px; }
.ex-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ex-h { font-family: var(--display); font-size: clamp(26px, 5vw, 34px); margin: 0; }
.count { display: flex; align-items: center; gap: 10px; }
.count b { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--eosin); font-variant-numeric: tabular-nums; }
.count span { font-size: 14px; line-height: 1.4; }
.count small, .dates small { color: var(--muted); font-size: 12px; }
.next { margin: 0; font-size: 14.5px; padding: 10px 14px; background: var(--warn-soft); border-radius: 8px; }
.chip { display: inline-block; margin-left: 8px; font-family: var(--mono); font-size: 11px; border-radius: 99px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.chip.known { border-color: var(--good); color: var(--good); } .chip.goal { border-color: var(--accent); color: var(--accent); }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h3 { margin: 0; font-size: 17px; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo a, .todo li.soon { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; }
.todo a:hover { border-color: var(--accent); }
.todo b { font-weight: 500; font-size: 13px; color: var(--eosin); text-align: right; }
.todo .ok b { color: var(--good); } .todo li.soon { color: var(--muted); } .todo li.soon b { color: var(--muted); }
.ck { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 13px; color: var(--good); }
.todo .ok .ck { border-color: var(--good); background: var(--good-soft); }
.streak { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.streak b { font-family: var(--mono); font-size: 20px; color: var(--accent); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { height: 18px; border-radius: 3px; background: var(--sunk); min-width: 0; }
.heat i.l1 { background: color-mix(in srgb, var(--good) 30%, var(--sunk)); } .heat i.l2 { background: color-mix(in srgb, var(--good) 62%, var(--sunk)); } .heat i.l3 { background: var(--good); }
.heat i.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-cap { display: flex; justify-content: space-between; margin: -4px 0 0; font-size: 11.5px; color: var(--muted); }
.subj { border-top: 1px solid var(--line); padding-top: 10px; }
.subj summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.subj summary::-webkit-details-marker { display: none; }
.subj summary::after { content: "▾"; margin-left: auto; color: var(--muted); } .subj:not([open]) summary::after { content: "▸"; }
.sj { font-family: var(--display); font-size: 20px; font-weight: 700; }
.big { font-family: var(--mono); font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; } .big small { font-size: 14px; }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--sunk); margin-top: 10px; }
.s-master, .t-master { background: var(--good); } .s-prac { background: var(--accent); } .s-weak { background: var(--bad); } .s-none { background: var(--sunk); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.k-master::before { background: var(--good); } .k-prac::before { background: var(--accent); } .k-weak::before { background: var(--bad); } .k-none::before { background: var(--sunk); border: 1px solid var(--line); }
.chmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 8px 0; }
.tile { display: grid; gap: 2px; padding: 7px 9px; border-radius: 7px; text-decoration: none; font-size: 12.5px; line-height: 1.35; border: 1px solid var(--line); color: var(--ink); min-width: 0; }
.tile span { overflow-wrap: anywhere; } .tile small { font-size: 11px; color: var(--muted); }
.tile.t-master { background: var(--good-soft); border-color: var(--good); } .tile.t-prac { background: var(--soft); border-color: var(--accent); }
.tile.t-weak { background: var(--bad-soft); border-color: var(--bad); } .tile.t-none { background: var(--surface); }
.dates { list-style: none; margin: 0; padding: 0; display: grid; }
.dates li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 4.5em; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.dates li:last-child { border-bottom: 0; }
.dates .when { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dates .left { text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--eosin); }
.dates li.ex .what b { color: var(--eosin); } .dates li.past { opacity: .5; }
@media (max-width: 520px) { .dates li { grid-template-columns: 7.6em minmax(0, 1fr) 3.6em; gap: 8px; font-size: 13.5px; } }
.how { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding: 20px 0 40px; }
.how b { color: var(--ink); }
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="./" style="text-decoration:none">學習階梯<small>LEARN LADDER</small></a>
  <span class="prog-all" id="progAll"></span>
</div></header>
<main class="wrap">
  <section class="hero-box">
    <p class="eyebrow" id="eb">互動圖解 · 從原理學起</p>
    <h1 id="h1">一階一階，把難的東西學懂。</h1>
    <p class="lede" id="lede">每門課都從直覺和圖像開始，再講原理與應用。不用安裝軟體，手機也能學；登入後進度在不同裝置同步。</p>
    <div id="syncSlot"></div>
  </section>
  <section class="exam" id="exam" aria-label="後中考試"></section>
  <h2 class="other-h" id="otherH">其他課程</h2>
  <section class="courses" id="courses" aria-label="課程"></section>
  <p class="how" id="how"></p>
</main>
