<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="學士後中醫入學考英文：每天早晚兩段，單字、長句拆解、文法、克漏字與閱讀，錯題自動複習。">
<meta name="app-site" content="pages">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>後中英文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
@media (max-width: 480px) { .cloud-btn > span:last-child { display: none; } }   /* 手機：頁首只顯示頭像或雲朵，維持一行 */
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; }
.home-link:hover { color: var(--accent); }

/* 後中英文：沿用學習階梯色票，主色改為墨水藍；英文用襯線字排成「可以標註的原文」，句構用螢光筆式的底線與框線 */
:root { --accent: #1F4E79; --soft: #E3ECF5; --verb: #C98A00; --verb-soft: #FFF1C9; --subj: #0E7C7B; --subj-soft: #DDF2F1; --mod: #8A94A3;
  --en: "Source Serif 4", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #8DB8E8; --accent-ink: #0E1B2A; --soft: #1E2E40; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; } }
:root[data-theme="dark"] { --accent: #8DB8E8; --accent-ink: #0E1B2A; --soft: #1E2E40; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; }
body { margin: 0; }
.top-in .wk { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; }
#main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; }
#main h1 { font-family: var(--display); font-size: clamp(26px, 5vw, 36px); margin: 0 0 10px; }
#main h2 { font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#main h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); font-family: var(--mono); }
#main h3 { font-size: 16px; margin: 10px 0 0; }
.lede { font-size: 16px; color: var(--muted); }
.note { color: var(--muted); font-size: 14.5px; margin: 0; }
section.part { margin-top: 36px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.endrow { margin-top: 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.ens { font-family: var(--en); font-size: 17px; line-height: 1.75; }
.enw { font-family: var(--en); font-size: 1.2em; font-weight: 600; }
.pos { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
.zh { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; }
.gap { border-bottom: 2px solid var(--accent); color: var(--accent); }
/* 首頁：7 天 × 早晚 */
.duebar a { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 14px; text-decoration: none; }
.days { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }
.day h2 { font-size: 16px !important; }
.day h2 small { font-family: var(--body) !important; }
.day.now h2 { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.slot { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); text-decoration: none; font-size: 13.5px; min-width: 0; }
.slot:hover { border-color: var(--accent); }
.slot.cur { border: 2px solid var(--accent); }
.slot.fin { background: var(--good-soft); border-color: var(--good); }
.sl-h { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sl-h small { font-weight: 400; color: var(--muted); font-size: 12px; }
.sl-w { color: var(--muted); }
.sl-st { font-size: 12.5px; color: var(--accent); min-height: 1.2em; }
.slot.fin .sl-st { color: var(--good); }
.pbar { display: block; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.slot.fin .pbar i { background: var(--good); }
.segprog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.segprog .pbar { flex: 1; max-width: 240px; }
.pn { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.pn a { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; text-decoration: none; color: var(--ink); background: var(--surface); font-size: 13.5px; }
/* 單字卡 */
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.wcard p { margin: 0; }
.wh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.wz { font-weight: 700; margin-left: auto; }
.root { font-size: 13px; color: var(--accent); }
.wcard .ens { font-size: 15.5px; }
.wcard .unsure { justify-self: start; margin-top: 4px; }
.btn.unsure.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
/* 選擇題 */
.q { border-top: 1px solid var(--line); padding: 14px 0; }
.qnum, .qsrc { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.qt { font-weight: 500; margin: 0 0 8px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 14.5px; min-height: 44px; }
.opt.en-o { font-family: var(--en); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.why { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 14.5px; }
.why.ok { background: var(--good-soft); } .why.no { background: var(--bad-soft); }
.why.fu { background: var(--soft); border-left: 3px solid var(--accent); } .fu-h { margin: 0 0 4px; } .fu-no { color: var(--bad); font-size: 13.5px; margin: 6px 0 0; }
.why .btn { margin-left: 8px; }
.guide { margin-top: 8px; }
.gbody { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 4px; }
.gq { font-weight: 500; margin: 2px 0 6px; }
.gdone { font-size: 13.5px; color: var(--muted); margin: 0 0 6px; padding-left: 20px; }
.gdone b { color: var(--ink); }
.stepn { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
.rv-q, .rv-sent { margin-bottom: 8px; }
.ctx { margin: 0 0 4px; }
/* 長句 */
.sentc { display: grid; gap: 8px; margin-bottom: 4px; }
.sent { font-family: var(--en); font-size: 19px; line-height: 2.3; }
.ch { padding: 2px 1px; border-radius: 4px; transition: background .2s, color .2s; }
.ch.v { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); font-weight: 600; }
.ch.s { background: var(--subj-soft); outline: 2px solid var(--subj); outline-offset: 1px; }
.ch.m { color: var(--mod); }
.ch.m::before { content: "["; } .ch.m::after { content: "]"; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0; }
.legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: .35em; vertical-align: -.1em; }
.legend .lv::before { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); }
.legend .ls::before { background: var(--subj-soft); outline: 2px solid var(--subj); }
.legend .lm::before { border: 1px dashed var(--mod); }
.core { font-family: var(--en); font-size: 17px; background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 0; }
.core .lbl { display: inline; margin-right: 10px; }
.sbody { display: grid; gap: 6px; }
/* 文法與文章 */
.lesson p { margin: 8px 0; }
.lesson .ex { font-family: var(--en); font-size: 17px; line-height: 2.2; background: var(--sunk); border-radius: 8px; padding: 6px 12px; }
.lesson ul { margin: 6px 0; padding-left: 22px; }
.passage { display: grid; gap: 2px; }
.passage p { margin: 0 0 8px; }
.ptitle { font-family: var(--en); font-weight: 600; font-size: 19px; }
.blank { font-family: var(--mono); font-size: 14px; color: var(--accent); background: var(--soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.blank.fill { font-family: var(--en); font-size: 16px; color: var(--good); background: var(--good-soft); }
.pre ol { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.pre .ens { font-size: 15.5px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
/* 週報 */
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lessons a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14px; }
.lessons b { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.lessons .fin a { border-color: var(--good); }
.ck { color: var(--good); font-weight: 700; }
.skg { display: grid; gap: 4px; }
.skg h3 { margin-top: 12px !important; font-size: 14px !important; color: var(--muted); }
.skr { display: grid; grid-template-columns: minmax(0, 11em) minmax(60px, 1fr) 3.5em 6.5em; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.skv { font-family: var(--mono); font-size: 12.5px; text-align: right; }
.sks { font-size: 12.5px; color: var(--muted); }
.st-weak .sks { color: var(--bad); font-weight: 700; } .st-weak .pbar i { background: var(--bad); }
.st-mid .sks { color: var(--warn); } .st-mid .pbar i { background: var(--warn); }
.st-good .sks { color: var(--good); } .st-good .pbar i { background: var(--good); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.tags li { background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
#exTxt { width: 100%; margin-top: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.5; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
#exBox { display: grid; gap: 4px; }
/* 發音：頁首只放一個按鈕，設定在下拉面板 */
.spk { position: relative; font-size: 13px; color: var(--muted); }
.spk-b { font-family: var(--mono); }
.spk-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(280px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 12px 14px; display: grid; gap: 10px; }
.spk label { display: flex; align-items: center; gap: 8px; }
.spk-pop input { flex: 1; width: auto !important; }
.spk-pop select { flex: 1; max-width: none !important; }
/* 回想題的提示、早上單字面板 */
.qrow { display: flex; flex-wrap: wrap; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); font-size: 14px; }
.qrow span { color: var(--muted); min-width: 0; overflow-wrap: anywhere; } .qrow .r-ok { color: var(--good); } .qrow .r-no { color: var(--bad); }
.collapsed > :not(.qrow) { display: none !important; }
.q.skipped, .sentc.skipped { border-left: 4px solid var(--warn); padding-left: 10px; }
.q.skipped::before, .sentc.skipped::before { content: "跳過了"; display: inline-block; font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 6px; margin-bottom: 4px; }
.pcnt { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--warn); font-weight: 400; } .pcnt.fin { color: var(--good); }
.skips { flex-basis: 100%; font-size: 13px; color: var(--warn); }
.linkb { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }
.resetbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 0; }
.segprog { flex-wrap: wrap; }
.redo { margin: 0 0 6px; font-size: 13.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 10px; display: inline-block; }
.hintrow { margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hintz { color: var(--warn); font-size: 14px; }
.peekbtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; max-height: 72vh; overflow: auto; background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0,0,0,.18); padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 14px 14px 0 0; }
.sheet-h { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 12px 0; z-index: 1; }
.q.done .qnum::after { content: " ✓"; color: var(--good); }
.spk input { width: 90px; accent-color: var(--accent); }

<header class="top"><div class="top-in">
  <a class="brand" href="#" style="text-decoration:none">後中英文<small>ENGLISH · 句構 → 閱讀</small></a>
  <span class="wk" id="wkTag"></span><span id="spkSlot"></span>
</div></header>
<main id="main"></main>
<script>
/* ---------- 後中英文：介面小工具與能力分類 ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('eng-ladder:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eng-ladder:' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時忽略 */ } },
};
// 固定的亂數：同一題每次打開選項順序一樣（複習時才認得出來）
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(n, seed) {
  let x = hash(seed) || 1; const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 能力分類：每一題、每一步都標其中一項；週報與匯出依此統計弱項
const SKILL_GROUPS = [
  ['v', '單字'], ['s', '句子結構'], ['g', '文法'], ['c', '克漏字'], ['r', '閱讀'],
];
const SKILLS = {
  'v.root': '字根拆字', 'v.mean': '字義', 'v.collo': '搭配用法',
  's.core': '找主幹（主詞＋動詞）', 's.rel': '關係子句', 's.part': '分詞修飾', 's.noun': '名詞子句', 's.pass': '被動語態', 's.para': '平行結構',
  'g.tense': '時態與主詞動詞一致', 'g.conj': '連接詞與轉折語',
  'c.logic': '前後文邏輯', 'c.form': '詞性與形式', 'c.collo': '固定搭配',
  'r.main': '主旨', 'r.locate': '找細節', 'r.para': '換句話說', 'r.infer': '推論', 'r.word': '由上下文猜字義', 'r.attitude': '作者態度',
};
// 每週的資料檔（wk/wNNa.js、wNNb.js）把自己 push 進來
const WEEKS = [];

/* ---------- 發音：瀏覽器內建的語音合成（不需網路）；語速與聲音存在本機 ----------
   按鈕寫成 <button class="say" data-say="要唸的英文">；data-say-el 表示唸「所在段落」的文字（克漏字：沒填的格子唸 blank）。 */
const SPEECH = (() => {
  const ok = typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
  let rate = store.get('rate', 0.9), voiceName = store.get('voice', ''), cur = null;
  const voices = () => (ok ? speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)) : []);
  const pick = () => { const vs = voices(); return vs.find(v => v.name === voiceName) || vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null; };
  function stop() { if (ok) speechSynthesis.cancel(); if (cur) cur.classList.remove('on'); cur = null; }
  function say(text, btn) {
    if (!ok || !text) return;
    const again = btn && btn === cur; stop(); if (again) return;   // 再按一次＝停止
    const u = new SpeechSynthesisUtterance(text), v = pick();
    u.lang = v ? v.lang : 'en-US'; if (v) u.voice = v; u.rate = rate;
    if (btn) { cur = btn; btn.classList.add('on'); u.onend = u.onerror = () => { if (cur === btn) { btn.classList.remove('on'); cur = null; } }; }
    speechSynthesis.speak(u);
  }
  function elText(el) {
    const c = el.cloneNode(true);
    c.querySelectorAll('.say').forEach(b => b.remove());
    c.querySelectorAll('.blank').forEach(b => { b.textContent = b.classList.contains('fill') ? b.textContent.replace(/^\(\d\)\s*/, '') : ' blank '; });
    c.querySelectorAll('.gap').forEach(b => { b.textContent = ' blank '; });
    return c.textContent.replace(/\s+/g, ' ').trim();
  }
  // 頁首的語速與聲音
  function controls() {
    if (!ok) return '';
    return `<div class="spk"><button class="btn sm spk-b" type="button" id="spBtn" aria-expanded="false" aria-controls="spPop">🔊 <span id="spBtnV">${rate.toFixed(1)}×</span></button><div class="spk-pop" id="spPop" hidden><label>語速 <input type="range" id="spRate" min="0.5" max="1.3" step="0.1" value="${rate}" aria-label="發音語速"><output id="spRateV">${rate.toFixed(1)}×</output></label><label>聲音 <select id="spVoice" aria-label="發音的聲音"><option>系統預設</option></select></label></div></div>`;
  }
  function bind() {
    if (!ok) { document.documentElement.classList.add('no-tts'); return; }
    const r = document.getElementById('spRate'), sel = document.getElementById('spVoice');
    if (r) r.oninput = () => { rate = +r.value; store.set('rate', rate); document.getElementById('spRateV').textContent = document.getElementById('spBtnV').textContent = rate.toFixed(1) + '×'; };
    const btn = document.getElementById('spBtn'), pop = document.getElementById('spPop');
    if (btn) { btn.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; btn.setAttribute('aria-expanded', String(!pop.hidden)); };
      document.addEventListener('click', e => { if (!e.target.closest('.spk')) { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); } }); }
    const fill = () => { const vs = voices(); if (!sel || !vs.length) return; const p = pick();
      sel.innerHTML = vs.map(v => `<option value="${esc(v.name)}"${p && v.name === p.name ? ' selected' : ''}>${esc(v.name.replace(/\s*\(.*\)/, ''))}（${esc(v.lang)}）</option>`).join(''); };
    fill(); speechSynthesis.onvoiceschanged = fill;
    if (sel) sel.onchange = () => { voiceName = sel.value; store.set('voice', voiceName); };
    document.addEventListener('click', e => {
      const b = e.target.closest('.say'); if (!b) return;
      e.preventDefault(); e.stopPropagation();
      say(b.dataset.sayEl != null ? elText(b.closest(b.dataset.sayEl || 'p')) : b.dataset.say, b);
    }, true);
    addEventListener('hashchange', stop);
  }
  return { ok, say, stop, controls, bind };
})();
const sayBtn = (text, label = '發音') => `<button class="say" type="button" data-say="${esc(text)}" aria-label="${label}：${esc(text)}" title="${label}"></button>`;
const sayEl = (sel, label = '朗讀這段') => `<button class="say" type="button" data-say-el="${sel}" aria-label="${label}" title="${label}"></button>`;

/* ---------- 後中英文：第 1 週（單字與長句） ----------
   單字取自中國醫、慈濟、義守近兩年英文卷中「出現在兩份以上考卷、詞頻排名 2500–12000」的學術與醫學字（analysis/eng）。
   單字格式：[英文, 詞性, 中文, 字根拆解, 例句, 例句中文, 更多例句 [[英文, 中文] × 3]（晚上回想與錯題複習用，早上的卡片不顯示）]
   長句格式：{ chunks: [片段…], steps: [[問題, 正解, 誤1, 誤2, 說明, 能力, {片段序號: 標記}]…], core, zh }
     標記：v 主要動詞、s 主詞、m 修飾 */
WEEKS.push({ n: 1, theme: '句子主幹與修飾', days: [] });
WEEKS[0].words = [
  // 第 1 天：臨床
  [['clinical', 'adj.', '臨床的', 'clinic 診所 + -al 形容詞', 'The drug passed several clinical trials before approval.', '這個藥在核准前通過了幾次臨床試驗。', [['Medical students begin their clinical training in the hospital during the fifth year.', '醫學生在第五年開始在醫院接受臨床訓練。'], ['The new test looked promising in the lab, but its clinical value is still unclear.', '這項新檢測在實驗室裡看起來很有希望，但它的臨床價值仍不清楚。'], ['Nurses with years of clinical experience often notice problems before the machines do.', '有多年臨床經驗的護理師，常常比儀器更早察覺問題。']]],
   ['chronic', 'adj.', '慢性的、長期的', 'chron 時間 + -ic', 'Chronic pain lasts for more than three months.', '慢性疼痛持續三個月以上。', [['Unlike a cold, which passes in a week, diabetes is a chronic illness.', '不像感冒一週就好，糖尿病是慢性疾病。'], ['Living with chronic stress can raise blood pressure over many years.', '長期處於慢性壓力下，多年來會使血壓升高。'], ['My grandfather has had a chronic cough since he worked in the coal mine.', '我祖父從在煤礦工作以來，就一直有慢性咳嗽。']]],
   ['symptom', 'n.', '症狀', 'sym 一起 + ptom 落下：一起出現的現象', 'Fever is a common symptom of infection.', '發燒是感染常見的症狀。', [['A sore throat is often the first symptom of a cold.', '喉嚨痛常常是感冒的第一個症狀。'], ['Patients were asked to write down symptoms such as headache or nausea every evening.', '病人被要求每天晚上記下頭痛或噁心等症狀。'], ['Because the early symptoms are mild, many people ignore the disease for years.', '因為早期症狀很輕微，許多人好幾年都沒注意到這個疾病。']]],
   ['diagnosis', 'n.', '診斷', 'dia 穿過 + gnosis 認識：看穿而認出', 'Early diagnosis makes treatment easier.', '早期診斷讓治療比較容易。', [['The doctor could not make a diagnosis until the blood test results came back.', '醫生要等血液檢查結果出來，才能做出診斷。'], ['A wrong diagnosis can mean that patients receive treatment for the wrong disease.', '錯誤的診斷可能讓病人接受錯誤疾病的治療。'], ['After her diagnosis of diabetes, she changed her diet completely.', '在被診斷出糖尿病之後，她完全改變了飲食。']]],
   ['therapy', 'n.', '治療、療法', '', 'Physical therapy helped her walk again.', '物理治療幫助她重新走路。', [['Speech therapy helped the child pronounce difficult sounds more clearly.', '語言治療幫助這個孩子把困難的音發得更清楚。'], ['Some patients receive therapy at home instead of staying in the hospital.', '有些病人在家接受治療，而不是住在醫院。'], ['Cancer patients often feel tired during long courses of radiation therapy.', '癌症病人在長療程的放射治療期間，常常覺得疲倦。']]],
   ['infection', 'n.', '感染', 'in 進入 + fect 做、放 + -ion', 'Washing hands reduces the risk of infection.', '洗手能降低感染的風險。', [['The wound became red and swollen, which suggested a bacterial infection.', '傷口變得紅腫，表示可能是細菌感染。'], ['Hospitals clean their rooms carefully to prevent the spread of infection.', '醫院仔細清潔病房，以防止感染擴散。'], ['Children in day care often catch one ear infection after another.', '上托兒所的孩子常常一個耳朵感染接著一個。']]],
   ['immune', 'adj.', '免疫的', 'im 不 + mune 負擔：不受侵害', 'The immune system protects the body from bacteria.', '免疫系統保護身體不受細菌侵害。', [['People who have had chickenpox are usually immune to it for life.', '得過水痘的人通常終身對它免疫。'], ['Vaccines train the immune system to recognize a virus before the person ever gets sick.', '疫苗訓練免疫系統，在人生病之前就認得病毒。'], ['Lack of sleep can weaken the body’s immune response.', '睡眠不足會削弱身體的免疫反應。']]],
   ['prevalence', 'n.', '盛行率、普遍程度', 'pre 在前 + val 強 + -ence：佔上風', 'The prevalence of diabetes has doubled since 1980.', '糖尿病的盛行率自 1980 年以來加倍了。', [['The prevalence of smoking among young men has fallen sharply in Taiwan.', '台灣年輕男性的吸菸盛行率已大幅下降。'], ['Researchers compared the prevalence of allergies in cities and in rural areas.', '研究人員比較了城市與鄉村地區過敏的盛行率。'], ['Because of its high prevalence, high blood pressure is a major public health problem.', '由於盛行率高，高血壓是重大的公共衛生問題。']]],
   ['intervention', 'n.', '介入、處置', 'inter 之間 + vent 來 + -ion：來到中間', 'Early intervention can prevent serious complications.', '早期介入可以預防嚴重的併發症。', [['A simple intervention, such as a text message reminder, helped patients take their pills.', '一個簡單的介入措施，例如簡訊提醒，就幫助病人按時服藥。'], ['Without surgical intervention, the patient would have lost his leg.', '如果沒有手術介入，這位病人就會失去他的腿。'], ['The school started an intervention program for students who were falling behind in reading.', '學校為閱讀進度落後的學生開辦了一個介入輔導計畫。']]],
   ['outcome', 'n.', '結果', 'out 出 + come 來', 'Patients who exercised had better outcomes.', '有運動的病人結果比較好。', [['Nobody could predict the outcome of the election until the last vote was counted.', '在最後一票開出之前，沒有人能預測選舉的結果。'], ['Early treatment is linked to better outcomes for stroke patients.', '及早治療與中風病人較好的預後有關。'], ['The researchers measured two outcomes: weight loss and blood sugar levels.', '研究人員測量了兩項結果：體重減輕與血糖值。']]]],
  // 第 2 天：身體與心理
  [['mechanism', 'n.', '機制、作用方式', 'mechan 機器 + -ism', 'Scientists still do not understand the mechanism of the disease.', '科學家仍不了解這個疾病的機制。', [['Sweating is the main mechanism the body uses to cool itself down.', '流汗是身體用來降溫的主要機制。'], ['The lock has a simple mechanism that even a child can repair.', '這個鎖的機械構造很簡單，連小孩都能修。'], ['Researchers proposed a new mechanism to explain how the virus enters cells.', '研究人員提出一個新機制，解釋病毒如何進入細胞。']]],
   ['genetic', 'adj.', '基因的、遺傳的', 'gen 產生 + -etic', 'Some cancers have a strong genetic factor.', '有些癌症有很強的遺傳因素。', [['Eye color is largely determined by genetic factors passed down from parents.', '眼睛的顏色主要由父母遺傳下來的基因因素決定。'], ['A genetic test showed that she carried the gene for the disease.', '基因檢測顯示她帶有這個疾病的基因。'], ['Identical twins share the same genetic material but can still develop different illnesses.', '同卵雙胞胎擁有相同的遺傳物質，但仍可能得不同的病。']]],
   ['hormone', 'n.', '荷爾蒙、激素', '', 'Insulin is a hormone that lowers blood sugar.', '胰島素是一種降低血糖的激素。', [['During stress, the body releases a hormone that speeds up the heartbeat.', '在壓力下，身體會釋放一種讓心跳加快的激素。'], ['Teenagers experience mood changes partly because their hormone levels change quickly.', '青少年情緒起伏，部分原因是他們的荷爾蒙濃度變化很快。'], ['Growth hormone is produced mainly at night while we sleep.', '生長激素主要在夜間我們睡覺時分泌。']]],
   ['nutrient', 'n.', '營養素', 'nutri 餵養 + -ent', 'Vegetables provide important nutrients such as vitamin C.', '蔬菜提供維生素 C 等重要的營養素。', [['Plants take up nutrients from the soil through their roots.', '植物透過根從土壤中吸收營養素。'], ['Processed food is often high in calories but low in nutrients.', '加工食品常常熱量高但營養素少。'], ['Iron is a nutrient that the body needs to carry oxygen in the blood.', '鐵是身體在血液中運送氧氣所需的營養素。']]],
   ['obesity', 'n.', '肥胖', 'ob 加上 + esity 吃', 'Obesity increases the risk of heart disease.', '肥胖會增加心臟病的風險。', [['Childhood obesity has become more common as children spend more time on screens.', '隨著孩子花更多時間看螢幕，兒童肥胖變得更常見。'], ['The government taxed sugary drinks in an effort to reduce obesity.', '政府對含糖飲料課稅，以減少肥胖。'], ['Many doctors define obesity as having a body mass index of 30 or more.', '許多醫生把肥胖定義為身體質量指數 30 以上。']]],
   ['syndrome', 'n.', '症候群', 'syn 一起 + drome 跑：一起出現的一群症狀', 'Down syndrome is caused by an extra chromosome.', '唐氏症是由多一條染色體造成的。', [['Chronic fatigue syndrome leaves some patients too tired to work for months.', '慢性疲勞症候群讓一些病人累到好幾個月無法工作。'], ['The syndrome includes a group of symptoms that tend to appear together.', '這個症候群包含一群常常一起出現的症狀。'], ['Babies born to mothers who drink heavily may develop a syndrome that affects growth and learning.', '母親大量飲酒所生的嬰兒，可能出現影響生長與學習的症候群。']]],
   ['cognitive', 'adj.', '認知的', 'co 一起 + gni 知道 + -tive', 'Sleep loss affects cognitive function.', '睡眠不足會影響認知功能。', [['Puzzles and new hobbies may help older adults keep their cognitive skills sharp.', '拼圖與新嗜好也許能幫助長者維持敏銳的認知能力。'], ['The study tested cognitive abilities such as memory, attention, and reasoning.', '這項研究測試了記憶、注意力與推理等認知能力。'], ['Memory loss is one of the cognitive problems linked to heavy drinking.', '記憶衰退是與大量飲酒有關的認知問題之一。']]],
   ['psychological', 'adj.', '心理的', 'psycho 心 + logy 學 + -ical', 'Stress can cause both physical and psychological problems.', '壓力會造成生理與心理的問題。', [['Losing a job can cause psychological stress as well as money problems.', '失業會造成心理壓力，也會帶來金錢問題。'], ['The hospital offers psychological support to patients after a cancer diagnosis.', '醫院在病人被診斷出癌症後，提供心理支持。'], ['Some pain has no physical cause and is mainly psychological.', '有些疼痛沒有生理上的原因，主要是心理性的。']]],
   ['elderly', 'adj.', '年長的', 'elder 年長的 + -ly', 'Elderly patients often take several medicines.', '年長的病人常常同時吃好幾種藥。', [['Many elderly people live alone after their children move to the city.', '許多長者在子女搬到城市後獨自生活。'], ['The bus company offers free rides to elderly passengers.', '公車公司提供年長乘客免費搭乘。'], ['Falls are a leading cause of injury among the elderly.', '跌倒是長者受傷的主要原因之一。']]],

   ['comprehensive', 'adj.', '全面的、廣泛的', 'com 完全 + prehend 抓住 + -sive', 'The report gives a comprehensive review of the evidence.', '這份報告對證據做了全面的回顧。', [['The library has a comprehensive collection of medical journals.', '這間圖書館收藏的醫學期刊非常齊全。'], ['Before surgery, she had a comprehensive check-up that took a whole day.', '手術前，她做了一次花一整天的全面健康檢查。'], ['The new law offers comprehensive protection for workers, from pay to safety.', '新法律從薪資到安全，為勞工提供全面的保障。']]],
   ['protocol', 'n.', '（實驗或治療的）標準流程', '', 'All nurses must follow the same protocol.', '所有護理師都必須遵守同一套流程。', [['According to hospital protocol, visitors must wash their hands before entering.', '依照醫院的規定流程，訪客進入前必須洗手。'], ['The research team wrote a detailed protocol before the study began.', '研究團隊在研究開始前，寫好詳細的研究計畫書。'], ['When a fire alarm sounds, staff follow a set protocol to move patients out safely.', '火警警報響起時，工作人員依照既定流程安全地疏散病人。']]],

   ['nevertheless', 'adv.', '儘管如此', 'never + the + less：一點也沒有減少', 'The drug has side effects. Nevertheless, it is widely used.', '這個藥有副作用。儘管如此，它仍被廣泛使用。', [['The test was difficult; nevertheless, most students passed.', '考試很難；儘管如此，大多數學生還是及格了。'], ['He knew the risks of smoking but nevertheless refused to quit.', '他知道吸菸的風險，卻仍然拒絕戒菸。'], ['The weather was terrible. Nevertheless, thousands of people came to the concert.', '天氣很糟。儘管如此，還是有數千人來聽演唱會。']]],

  { id: 's.rel', title: '關係子句：who、which、that 補充說明前面的名詞', body: `<p>想說明「是哪一個人或東西」時，英文把說明放在名詞<b>後面</b>，用 who（人）、which（物）、that（人或物）接起來。關係子句裡有自己的動詞，但那不是整句的主要動詞。</p>
<p class="ex"><span class="ch s">People</span> <span class="ch m">who sleep less than six hours</span> <span class="ch v">are</span> more vulnerable to infection.</p>
<p>逗號加 which（, which…）是附帶補充，拿掉不影響句子的意思。</p>`,
    qs: [{ id: 'g2-1', sk: 's.rel', q: 'Patients ____ take the drug for more than a year may lose bone density.', o: ['who', 'which', 'whose', 'what'], why: '先行詞是 Patients（人），後面缺主詞，用 who。',
      st: [['空格前的名詞是人還是物？', '人：Patients', '物：the drug', '時間：a year', '先行詞決定用哪一個關係代名詞。', 's.rel'], ['空格後面缺什麼？', 'take 的主詞', 'take 的受詞', '什麼都不缺', '___ take the drug：誰吃藥？', 's.rel'], ['人＋缺主詞，用？', 'who', 'which', 'whose', 'which 指物；whose 後面要接名詞。', 's.rel']] },
      { id: 'g2-2', sk: 's.rel', q: 'Insulin is a hormone ____ helps cells take up sugar.', o: ['that', 'who', 'where', 'what'], why: '先行詞 hormone 是物，that／which 都可以。',
      st: [['先行詞是？', 'a hormone', 'Insulin', 'cells', '空格緊接在 hormone 後面。', 's.rel'], ['指物可以用哪些關係代名詞？', 'which 或 that', 'who 或 that', 'where 或 what', 'where 用在地點。', 's.rel'], ['what 為什麼不行？', 'what 已含先行詞', 'what 只能指人', 'what 不能當主詞', 'what 用在名詞子句。', 's.noun']] },
      { id: 'g2-3', sk: 's.rel', q: '“The study, which was conducted in five hospitals, found no serious side effects.” 主要動詞是？', o: ['found', 'was conducted', 'hospitals', 'side effects'], why: 'which 子句是補充說明，主幹是 The study found…。',
      st: [['兩個逗號之間是什麼？', '補充 The study 的子句', '整句話的主要子句', '修飾 hospitals 的子句', '逗號加 which 可以整段拿掉。', 's.rel'], ['拿掉後句子變成？', 'The study found no serious side effects.', 'Which was conducted in five hospitals.', 'The study was conducted in five hospitals.', '剩下主詞＋動詞＋受詞。', 's.core'], ['所以主要動詞是？', 'found', 'was conducted', 'conducted', 'was conducted 在 which 子句裡。', 's.core']] }] },
  { id: 's.part', title: '分詞修飾：名詞後面的 V-ing 與 V-ed', body: `<p>名詞後面直接接 V-ing 或 V-ed 片語，是把「關係代名詞＋be 動詞」省略掉的關係子句：</p>
<p class="ex"><span class="ch s">Participants</span> <span class="ch m">taking the new drug</span> <span class="ch v">reported</span> fewer symptoms.　（＝ who were taking）</p>
<p class="ex"><span class="ch s">The samples</span> <span class="ch m">collected from 200 patients</span> <span class="ch v">were tested</span>.　（＝ that were collected）</p>
<p><b>V-ing 是主動</b>（受試者自己在服藥），<b>V-ed 是被動</b>（樣本被採集）。看到「名詞＋V-ing／V-ed」，先別把它當成主要動詞。</p>`,
    qs: [{ id: 'g3-1', sk: 's.part', q: 'The data ____ from the survey showed a clear pattern.', o: ['collected', 'collecting', 'collect', 'to collect'], why: '資料是「被收集」的，用過去分詞 collected。',
      st: [['句子的主要動詞是？', 'showed', '空格', 'survey', 'showed 已經是主要動詞，空格只能是修飾。', 's.core'], ['資料和「收集」的關係是？', '被收集（被動）', '自己去收集（主動）', '沒有關係', '資料不會自己收集東西。', 's.part'], ['被動用？', '過去分詞 V-ed', '現在分詞 V-ing', '原形', 'V-ed 表被動。', 's.part']] },
      { id: 'g3-2', sk: 's.part', q: 'Children ____ in polluted cities are more likely to develop asthma.', o: ['living', 'lived', 'live', 'are living'], why: '孩子自己住在城市，主動，用 living。',
      st: [['主要動詞是？', 'are', '空格', 'develop', '空格後面已經有 are。', 's.core'], ['孩子和「住」的關係？', '主動：孩子自己住', '被動：孩子被住', '沒有主被動關係', '住是孩子自己做的事。', 's.part'], ['主動用？', 'V-ing：living', 'V-ed：lived', '原形 live', 'V-ing 表主動。', 's.part']] },
      { id: 'g3-3', sk: 's.part', q: '“Drugs approved by the agency must be tested again every five years.” approved 的作用是？', o: ['修飾 Drugs', '主要動詞', '修飾 agency', '過去式動詞'], why: '主要動詞是 must be tested；approved by the agency ＝ that are approved by the agency。',
      st: [['主要動詞是？', 'must be tested', 'were approved', 'by the agency', '助動詞 must 帶出主要動詞。', 's.core'], ['approved 前面有 be 動詞或 have 嗎？', '沒有，緊跟在名詞後', '有，前面是 are', '有，前面是 must', '沒有 be／have 的 V-ed 跟在名詞後面，是分詞修飾。', 's.part'], ['它表示主動還是被動？', '被動', '主動', '進行中', 'V-ed 表被動。', 's.part']] }] },
  { id: 'g.conj', title: '連接詞與轉折語：前後是什麼關係？', body: `<p>克漏字最常考空格前後的<b>邏輯關係</b>。先判斷前後兩句是同方向、相反方向，還是因果，再選字：</p>
<ul><li><b>補充（同方向）</b>：and、moreover、in addition、furthermore</li><li><b>轉折（相反）</b>：but、however、although、whereas、nevertheless</li><li><b>因果</b>：because、since（原因）；therefore、consequently、thus（結果）</li></ul>
<p>注意形式：although、because 後面接子句；however、therefore 是副詞，前面要用句號或分號。</p>`,
    qs: [{ id: 'g4-1', sk: 'g.conj', q: 'The treatment is expensive. ____, many patients choose it because it works quickly.', o: ['Nevertheless', 'Consequently', 'Furthermore', 'Because of this'], why: '「貴」和「很多人仍選」方向相反，用表示轉折的 Nevertheless。',
      st: [['前一句說了什麼？', '治療很貴', '治療很便宜', '治療很快', '先讀懂前句。', 'c.logic'], ['後一句說了什麼？', '很多人還是選它', '很多人不選', '它很危險', '貴卻仍然選：方向相反。', 'c.logic'], ['相反方向又放在句首、後面接逗號，用？', 'Nevertheless', 'Consequently', 'Because', 'Because 後面要接子句；Therefore 是結果。', 'g.conj']] },
      { id: 'g4-2', sk: 'g.conj', q: 'Type 1 diabetes usually begins in childhood, ____ type 2 diabetes is more common in adults.', o: ['whereas', 'because', 'so', 'unless'], why: '兩種糖尿病的發病年齡做對比，用 whereas。',
      st: [['前後在比較什麼？', '兩種糖尿病的發病年齡', '兩種糖尿病的病因', '兩種糖尿病的治療', 'type 1 vs type 2。', 'c.logic'], ['關係是？', '對比', '因果', '條件', '一個在兒童、一個在成人。', 'c.logic'], ['表示對比、連接兩個子句的是？', 'whereas', 'because', 'unless', 'unless＝除非。', 'g.conj']] },
      { id: 'g4-3', sk: 'g.conj', q: 'He stopped smoking; ____, his cough disappeared within a month.', o: ['consequently', 'nevertheless', 'although', 'whereas'], why: '戒菸是原因，咳嗽消失是結果。',
      st: [['分號前後的關係？', '原因 → 結果', '相反', '並列對比', '戒菸之後咳嗽消失。', 'c.logic'], ['表示結果的副詞？', 'consequently', 'nevertheless', 'whereas', 'however 是轉折。', 'g.conj'], ['為什麼 although 不行？', 'although 不能放在分號後', 'although 意思不對', 'although 也可以用', '形式也要對。', 'c.form']] }] },
  { id: 's.pass', title: '被動語態：主詞是「被」做的那一方', body: `<p>科學文章常用被動，因為重點是「做了什麼」，而不是誰做的。形式是 <b>be 動詞＋過去分詞</b>，做動作的人用 by 帶出（常常省略）：</p>
<p class="ex"><span class="ch s">The vaccine</span> <span class="ch v">was developed</span> <span class="ch m">by a team of scientists</span>.</p>
<p>判斷要不要用被動：問「主詞能不能自己做這個動作」。樣本不會自己檢驗、病人不會自己被診斷，就用被動。</p>`,
    qs: [{ id: 'g5-1', sk: 's.pass', q: 'The results ____ in a medical journal last month.', o: ['were published', 'published', 'have publish', 'publishing'], why: '結果「被發表」，而且是上個月：過去式被動 were published。',
      st: [['結果能自己發表嗎？', '不能，是被發表', '能，自己發表', '要看是哪種結果', '主詞是承受動作的一方。', 's.pass'], ['被動的形式？', 'be 動詞＋過去分詞', '只有過去分詞', 'have＋原形', 'were published。', 's.pass'], ['時間 last month 用什麼時態？', '過去式：were', '現在式：are', '未來式', '時間副詞決定時態。', 'g.tense']] },
      { id: 'g5-2', sk: 's.pass', q: 'More than 500 nurses ____ in the survey.', o: ['were included', 'included', 'were including', 'include'], why: '護理師是「被納入」調查的。',
      st: [['誰把護理師放進調查？', '研究人員', '護理師自己', '調查本身', '動作的發出者不是主詞。', 's.pass'], ['所以主詞和動作的關係？', '被動', '主動', '進行', '護理師被納入。', 's.pass'], ['形式？', 'were included', 'included', 'were including', 'were including 是主動進行式。', 's.pass']] },
      { id: 'g5-3', sk: 's.pass', q: '“The disease is characterized by high fever and a rash.” 這句的意思是？', o: ['這個疾病的特徵是高燒和疹子', '高燒和疹子造成這個疾病', '這個疾病會造成高燒和疹子', '高燒和疹子在這個疾病很少見'], why: 'be characterized by ＝ 以…為特徵。',
      st: [['主要動詞是？', 'is characterized', 'characterized', 'by high fever', 'be＋過去分詞。', 's.pass'], ['by 後面是什麼？', '特徵的內容', '研究人員', '疾病的原因', 'characterized by：以…為特徵。', 'v.collo'], ['所以句意？', '疾病的特徵是高燒和疹子', '高燒和疹子造成疾病', '疾病很少有高燒和疹子', '常見搭配要記：be characterized by。', 'v.collo']] }] },
  { id: 's.noun', title: '名詞子句：整段話當主詞或受詞', body: `<p>what、that、whether、how 可以把一整個句子變成一個名詞，放在主詞或受詞的位置：</p>
<p class="ex"><span class="ch s">What surprised the doctors</span> <span class="ch v">was</span> <span class="ch m">how quickly the patient recovered</span>.</p>
<ul><li><b>what</b>：…的事物（本身就是名詞，前面不能再有名詞）</li><li><b>that</b>：…這件事（The study shows that…）</li><li><b>whether／if</b>：是否</li></ul>
<p>看到句首是 What 或 Whether，先找到它結束的位置，後面才是主要動詞。</p>`,
    qs: [{ id: 'g6-1', sk: 's.noun', q: 'The study shows ____ regular exercise improves memory.', o: ['that', 'what', 'which', 'who'], why: 'shows 的受詞是一個完整句子，用 that 帶出。',
      st: [['空格後面是不是完整的句子？', '是，句子完整', '不是，缺少主詞', '不是，缺少受詞', '主詞＋動詞＋受詞都有。', 's.noun'], ['完整句子當受詞，用？', 'that', 'what', 'which', 'what 後面的句子會缺東西。', 's.noun'], ['整句意思？', '研究顯示規律運動能改善記憶', '研究顯示哪一種運動能改善記憶', '研究顯示記憶能改善運動習慣', 'that 本身沒有意思，只是把句子變成名詞。', 's.noun']] },
      { id: 'g6-2', sk: 's.noun', q: '____ the drug works in children is still unknown.', o: ['Whether', 'That', 'What', 'Which'], why: '「這個藥對兒童是否有效」還不知道：用 Whether。',
      st: [['主要動詞是？', 'is', 'works', 'unknown', 'works 在空格開頭的子句裡。', 's.core'], ['主詞是什麼？', '空格開頭到 children 的整段', '空格後面的 the drug 這個名詞', '句子最後的 children 這個字', '整段子句當主詞。', 's.noun'], ['「還不知道」的是？', '藥「是否」有效', '藥「什麼」有效', '「那個」藥', 'unknown 搭配 whether（是否）。', 's.noun']] },
      { id: 'g6-3', sk: 's.noun', q: '____ patients need most is clear information.', o: ['What', 'That', 'Whether', 'Which'], why: 'What patients need most＝病人最需要的東西，what 子句裡 need 缺受詞。',
      st: [['空格後的 patients need most 缺什麼？', 'need 的受詞', '主詞', '什麼都不缺', '需要「什麼」？', 's.noun'], ['子句缺受詞，用？', 'What', 'That', 'Whether', 'that、whether 後面要接完整句子。', 's.noun'], ['整句意思？', '病人最需要的是清楚的資訊', '病人是否需要清楚的資訊', '那些病人需要清楚的資訊', 'What… ＝ …的東西。', 's.noun']] }] },
  { id: 's.para', title: '平行結構：and、or 連接的東西形式要一樣', body: `<p>用 and、or、but、not only… but also… 連接兩個以上的東西時，它們的<b>詞性與形式要一致</b>：名詞配名詞、動詞配同樣時態的動詞、to V 配 to V。克漏字看到 and 後面的空格，先往前找和它對應的那一個。</p>
<p class="ex">Regular exercise <span class="ch v">lowers</span> blood pressure, <span class="ch v">improves</span> sleep, and <span class="ch v">reduces</span> stress.</p>`,
    qs: [{ id: 'g7-1', sk: 's.para', q: 'The program aims to reduce smoking and ____ physical activity.', o: ['to increase', 'increasing', 'increased', 'increases'], why: 'to reduce… and to increase…：平行的不定詞。',
      st: [['and 前面是什麼形式？', 'to reduce', 'reducing', 'reduced', '往前找和空格對應的部分。', 's.para'], ['and 後面要用？', 'to increase', 'increasing', 'increased', '平行結構。', 's.para'], ['（to 也可以省略，寫成 and increase）這兩者都對嗎？', '都對，選項中只有 to increase', '都錯，要改成 increasing', '只有省略 to 的寫法才對', '選項中形式一致的只有 to increase。', 'c.form']] },
      { id: 'g7-2', sk: 's.para', q: 'Patients were asked to rest, drink water, and ____ alcohol.', o: ['avoid', 'avoiding', 'to avoiding', 'avoided'], why: 'to rest, (to) drink, and (to) avoid：三個原形動詞平行。',
      st: [['前兩項的形式？', '原形', 'V-ing', '過去式', 'to 後面接原形。', 's.para'], ['第三項要？', '原形：avoid', 'avoiding', 'avoided', '三項形式一致。', 's.para'], ['and 放在哪？', '最後一項之前', '每一項之間', '第一項之前', 'A, B, and C。', 's.para']] },
      { id: 'g7-3', sk: 's.para', q: 'The new test is not only cheaper but also ____.', o: ['more accurate', 'accuracy', 'accurately', 'to be accurate'], why: 'not only cheaper but also more accurate：兩個比較級形容詞平行。',
      st: [['not only 後面是什麼詞性？', '形容詞比較級', '名詞的複數', '副詞的比較級', 'not only A but also B，A 與 B 形式相同。', 's.para'], ['but also 後面要？', 'more accurate', 'accuracy', 'accurately', '平行結構。', 's.para'], ['accurate 為什麼用 more？', '多音節形容詞用 more', '後面要接 than 才用 more', '只是習慣，沒有規則', 'cheap → cheaper；accurate → more accurate。', 'c.form']] }] },
];

  // 第 1 天：克漏字
  { type: 'cloze', title: 'Why is chronic pain so hard to treat?', text: [
    'Chronic pain is pain that lasts for more than three months. It {1} about one in five adults worldwide. Unlike pain from a cut, which disappears when the wound heals, chronic pain often continues {2} the original injury has healed.',
    'One reason is that the nervous system itself changes. Nerves that are exposed to pain for a long time become more sensitive, so even a light touch {3} feel painful. {4}, chronic pain is closely linked to sleep and mood. Patients who sleep poorly feel more pain, and more pain makes it harder to sleep.',
    'For this reason, doctors now recommend treatment that combines medicine, exercise, and psychological {5}. A single drug is rarely enough.'],
    zh: '慢性疼痛是持續三個月以上的疼痛，影響全世界約五分之一的成人。和割傷的疼痛不同（傷口好了就不痛），慢性疼痛常常在原本的傷已經癒合後仍持續。原因之一是神經系統本身改變了：長期暴露在疼痛中的神經變得更敏感，連輕輕碰一下都可能覺得痛。此外，慢性疼痛和睡眠、情緒密切相關：睡不好的病人覺得更痛，而更痛又更難入睡。因此，醫師現在建議結合藥物、運動和心理治療的療法；單一藥物很少足夠。',
    qs: [{ id: 'p1-1', sk: 'c.form', q: '第 (1) 格', o: ['affects', 'affect', 'affecting', 'effect'], why: '主詞 It（單數），現在式動詞加 s。',
      st: [['這一句缺什麼？', '主要動詞', '主詞', '受詞', 'It ___ about one in five adults。', 's.core'], ['主詞 It 單數還是複數？', '單數', '複數', '看不出來', 'It 指 chronic pain。', 'c.form'], ['effect 為什麼不行？', 'effect 是名詞', 'effect 是形容詞', 'effect 是過去式', 'affect（v.）影響；effect（n.）效果。', 'v.mean']] },
      { id: 'p1-2', sk: 'c.logic', q: '第 (2) 格', o: ['after', 'before', 'because', 'unless'], why: '傷「已經癒合之後」疼痛仍持續。',
      st: [['前面說了什麼對比？', '割傷好了就不痛', '割傷不會痛', '慢性疼痛會消失', 'Unlike pain from a cut…', 'c.logic'], ['所以慢性疼痛是？', '傷好了以後還在痛', '傷好之前就停', '因為傷好了才痛', '和割傷相反。', 'c.logic'], ['「…之後」用？', 'after', 'before', 'unless', 'has healed 是已經完成的事。', 'g.conj']] },
      { id: 'p1-3', sk: 'c.form', q: '第 (3) 格', o: ['can', 'is', 'to', 'being'], why: 'even a light touch can feel painful：can＋原形動詞 feel。',
      st: [['空格後面是什麼？', '原形動詞', '名詞', '形容詞', '原形動詞前面需要助動詞。', 'c.form'], ['哪一個可以接原形動詞？', '助動詞 can', 'is', 'being', 'is feel 不合文法。', 'c.form'], ['句意？', '連輕碰都可能覺得痛', '輕碰本身就是疼痛', '輕碰不會覺得痛', 'can 表可能。', 'r.para']] },

      st: [['前一段在說什麼？', '慢性疼痛難治的一個原因', '慢性疼痛的治療方法', '病人年齡和疼痛的關係', 'One reason is…', 'c.logic'], ['空格後在說什麼？', '另一個原因', '相反的說法', '前面的結果', '又是一個原因。', 'c.logic'], ['補充另一點用？', 'In addition', 'However', 'Therefore', 'However 是轉折。', 'g.conj']] },

  // 第 2 天：閱讀
  { type: 'read', title: 'Sleep and memory in older adults', text: [
    'Many older adults sleep less deeply than they did when they were young. For years, this was seen as a normal part of aging. However, a growing number of studies suggest that poor sleep may also contribute to memory decline.',
    'In one study, 120 participants aged 65 to 80 wore a small device that measured their sleep for two weeks. They then took memory tests. Participants who spent more time in deep sleep remembered more words, even after the researchers controlled for age and education.',
    'The researchers believe that deep sleep helps the brain move new information into long-term memory. If this is true, treating sleep problems in older adults could protect cognitive function. The authors note, however, that the study cannot prove that poor sleep causes memory loss; people with early brain changes may simply sleep worse.'],
    zh: '很多長者睡得比年輕時淺。多年來，這被視為老化的正常現象。然而越來越多研究顯示，睡不好也可能造成記憶衰退。在一項研究中，120 位 65 到 80 歲的受試者戴著測量睡眠的小型裝置兩週，接著做記憶測驗。深層睡眠時間較長的受試者記得較多單字，即使研究人員已經把年齡和教育程度的影響排除。研究人員認為，深層睡眠幫助大腦把新資訊轉成長期記憶；如果這是真的，治療長者的睡眠問題可能可以保護認知功能。不過作者也指出，這項研究無法證明睡不好「造成」記憶衰退：有早期腦部變化的人可能本來就睡得比較差。',
    qs: [{ id: 'p2-1', sk: 'r.main', pre: '主旨：整篇在講什麼關係', q: 'What is the passage mainly about?', o: ['A possible link between deep sleep and memory', 'How to measure sleep with a small device', 'Why young people sleep more deeply than others', 'A new drug that improves memory in older adults'], why: '第 1 段提出問題（睡眠與記憶），第 2 段是研究，第 3 段是解釋與限制。',
      st: [['第 1 段最後一句提出什麼？', '睡不好可能造成記憶衰退', '年輕人睡得比長者好', '睡眠裝置的測量很準', 'However, a growing number of studies suggest…', 'r.locate'], ['第 2、3 段在做什麼？', '用研究支持並討論這個關係', '介紹一種改善記憶的新藥', '比較年輕人和長者的睡眠', '整篇圍繞同一件事。', 'r.main'], ['哪個選項涵蓋全文？', '深層睡眠與記憶的關聯', '如何用裝置測量睡眠', '一種改善記憶的新藥', '裝置只是細節。', 'r.para']] },
      { id: 'p2-2', sk: 'r.locate', pre: '細節：受試者做了什麼', q: 'What did the participants do in the study?', o: ['They wore a sleep device and then took memory tests.', 'They took a sleeping pill every night for two weeks.', 'They slept in a hospital for two weeks of tests.', 'They took memory tests before and after a nap.'], why: '第 2 段：wore a small device… for two weeks. They then took memory tests.',
      st: [['答案在哪一段？', '第 2 段', '第 1 段', '第 3 段', '描述研究怎麼做的那一段。', 'r.locate'], ['受試者戴了什麼、多久？', '戴測量睡眠的裝置兩週', '每晚吃安眠藥兩週', '住院接受檢查兩週', 'wore a small device that measured their sleep for two weeks', 'r.locate'], ['之後做了什麼？', '記憶測驗', '睡眠藥物', '問卷', 'They then took memory tests.', 'r.para']] },
      { id: 'p2-3', sk: 'r.word', pre: '字義：controlled for 的意思', q: 'In paragraph 2, “controlled for age and education” most likely means the researchers ____.', o: ['made sure age and education did not explain the result', 'asked participants to report their age and education', 'chose only participants with a high level of education', 'changed the participants’ age and education levels'], why: 'control for 是研究用語：排除某因素的影響。',
      st: [['前面的 even after 暗示什麼？', '排除其他解釋後，結果仍成立', '排除其他解釋後，結果改變了', '因為其他因素，研究失敗了', 'even after…：即使…之後仍然。', 'c.logic'], ['年齡和教育可能怎麼影響記憶？', '年紀大、教育少本來就可能記得少', '年齡和教育跟記憶完全無關', '年齡和教育只會影響睡眠長短', '所以要把它們的影響拿掉。', 'r.infer'], ['所以 controlled for 的意思？', '確保結果不是年齡、教育造成的', '控制受試者的年齡和學歷', '只選年輕而且高學歷的人', '研究方法的常見說法。', 'r.word']] },
      { id: 'p2-4', sk: 'r.locate', pre: '細節：研究人員認為深層睡眠的作用', q: 'According to the researchers, deep sleep may ____.', o: ['help move new information into long-term memory', 'cause memory loss in people over the age of sixty', 'make people sleep less deeply during the night', 'replace the need for regular memory tests'], why: '第 3 段第一句。',
      st: [['用題目關鍵字 deep sleep 找，在哪一段？', '第 3 段第一句', '第 1 段', '第 2 段最後一句', 'The researchers believe that deep sleep…', 'r.locate'], ['那一句說深層睡眠做什麼？', 'helps the brain store new information', 'makes the brain lose old information', 'makes people tired during the day', '找到原句。', 'r.locate'], ['哪個選項是同一句話？', 'help move new information into long-term memory', 'cause memory loss in people over sixty-five', 'make people sleep less deeply at night', '換句話說的程度很低，直接對應。', 'r.para']] },
      { id: 'p2-5', sk: 'r.attitude', pre: '作者態度：研究能不能證明因果', q: 'Which statement would the authors agree with?', o: ['The study shows a link but cannot prove cause.', 'The study proves that poor sleep causes memory loss.', 'Sleep and memory are not related in older adults.', 'Older adults should stop taking memory tests.'], why: '第 3 段最後：cannot prove that poor sleep causes memory loss。',
      st: [['作者的保留意見在哪？', '第 3 段 however 之後', '第 1 段 However 之後', '第 2 段最後一句', 'The authors note, however…', 'r.locate'], ['作者說研究不能證明什麼？', '睡不好「造成」記憶衰退', '睡眠和記憶「有關」', '深層睡眠真的存在', 'cannot prove that poor sleep causes memory loss', 'r.attitude'], ['為什麼不能證明？', '可能是腦部變化讓人睡不好', '受試者的人數太多了', '研究沒有做任何記憶測驗', 'people with early brain changes may simply sleep worse', 'r.infer']] }] },
  // 第 3 天：克漏字
  { type: 'cloze', title: 'How is a clinical trial conducted?', text: [
    'Before a new drug can be sold, it must be tested in clinical trials. In a typical trial, participants are divided {1} two groups at random. One group receives the new drug, {2} the other group receives a placebo, a pill that looks the same but contains no active ingredient.',
    'Neither the participants nor the doctors know who is in which group. This design, {3} is called a double-blind trial, prevents expectations from affecting the results. At the end of the trial, the researchers compare the outcomes of the two groups.',
    'If the drug group does much better, the drug is {4} to be effective. Even then, one trial is rarely enough; the results must be {5} by other studies before the drug is approved.'],
    zh: '新藥上市前必須經過臨床試驗。典型的試驗把受試者隨機分成兩組：一組服用新藥，另一組服用安慰劑（外觀一樣但不含有效成分的藥丸）。受試者和醫生都不知道誰在哪一組；這種設計稱為雙盲試驗，可以避免預期心理影響結果。試驗結束時，研究人員比較兩組的結果。如果服藥組好很多，這個藥就被認為有效。即使如此，一次試驗很少足夠，結果必須被其他研究證實，藥才會核准。',
    qs: [{ id: 'p3-1', sk: 'v.collo', q: '第 (1) 格', o: ['into', 'from', 'with', 'on'], why: 'divide A into B：把 A 分成 B。',
      st: [['divide 的常見搭配？', 'divide … into …', 'divide … from …', 'divide … on …', '固定搭配要記。', 'v.collo'], ['句意？', '受試者被隨機分成兩組', '受試者從兩組中被選出', '受試者和兩組一起試驗', '分成兩組。', 'r.para'], ['所以填？', 'into', 'from', 'with', 'into 表示變成。', 'v.collo']] },
      { id: 'p3-2', sk: 'c.logic', q: '第 (2) 格', o: ['while', 'because', 'so', 'if'], why: '一組吃新藥、另一組吃安慰劑，兩者對照，用 while（而）。',
      st: [['逗號前後在說什麼？', '一組吃藥、一組吃安慰劑', '先吃藥、後來才吃安慰劑', '吃藥的原因和吃藥的結果', 'One group…, ___ the other group…', 'c.logic'], ['兩者的關係？', '對照', '因果', '條件', 'one… the other… 是對照。', 'c.logic'], ['表示對照、連接兩個子句的是？', 'while', 'because', 'so', 'while 也可以表示「而」。', 'g.conj']] },
      { id: 'p3-3', sk: 's.rel', q: '第 (3) 格', o: ['which', 'what', 'who', 'it'], why: '逗號後補充說明 This design，用 which。',
      st: [['空格前的名詞是？', 'This design', 'the doctors', 'the group', '逗號前緊接的名詞。', 's.rel'], ['這段兩個逗號之間是？', '補充 This design', '修飾 the doctors', '修飾 the results', '拿掉後：This design prevents…', 's.rel'], ['補充說明物，用？', 'which', 'what', 'who', '逗號後不用 that。', 's.rel']] },
      { id: 'p3-4', sk: 's.pass', q: '第 (4) 格', o: ['considered', 'considering', 'consider', 'to consider'], why: 'the drug is considered to be effective：藥被認為有效（被動）。',
      st: [['空格前有什麼？', 'be 動詞 is', '助動詞 have', '沒有任何字', 'the drug is ___。', 's.pass'], ['藥會自己認為嗎？', '不會，是被認為', '會，藥自己認為', '要看哪一種藥', '主詞承受動作。', 's.pass'], ['be＋過去分詞？', 'considered', 'considering', 'consider', 'be considered to be…＝被認為是…。', 'v.collo']] },
      { id: 'p3-5', sk: 'v.mean', q: '第 (5) 格', o: ['confirmed', 'ignored', 'hidden', 'reduced'], why: '其他研究要「證實」結果，藥才會核准。',
      st: [['前面說一次試驗怎樣？', '很少足夠', '一定足夠', '完全沒用', 'one trial is rarely enough', 'c.logic'], ['所以其他研究要對結果做什麼？', '再次證實', '忽略', '隱藏', '核准前要更多證據。', 'r.infer'], ['「證實」的英文？', 'confirmed', 'ignored', 'reduced', 'confirm＝證實。', 'v.mean']] }] },
  // 第 4 天：閱讀
  { type: 'read', title: 'Do sugar taxes reduce obesity?', text: [
    'More than 50 countries now tax drinks that contain added sugar. The idea is simple: if sugary drinks cost more, people will buy fewer of them, and obesity rates will eventually fall.',
    'The first part of this idea is well supported. In Mexico, sales of sugary drinks dropped by about 10 percent in the two years after a tax was introduced, and the decline was largest among poorer families. Some companies also reduced the sugar in their drinks to avoid the tax.',
    'The second part is harder to prove. Obesity develops slowly and has many causes, so a change in one type of drink may take years to show an effect. Moreover, people may replace sugary drinks with other high-calorie foods. Most experts therefore see sugar taxes as one useful tool, not a complete solution.'],
    zh: '目前有 50 多個國家對添加糖的飲料課稅。想法很簡單：含糖飲料變貴，人們就會少買，肥胖率最終就會下降。前半部分有充分證據：在墨西哥，開徵稅後兩年內含糖飲料的銷售量下降約一成，貧窮家庭降得最多；有些公司也降低飲料含糖量來避稅。後半部分比較難證明：肥胖發展得很慢、原因很多，單一類飲料的改變可能要好幾年才看得出效果；而且人們可能改吃其他高熱量的食物。因此多數專家認為糖稅是一項有用的工具，但不是完整的解決方案。',
    qs: [{ id: 'p4-1', sk: 'r.main', pre: '主旨：文章對糖稅的整體評價', q: 'What is the main idea of the passage?', o: ['Sales fell, but the effect on obesity is unclear.', 'Sugar taxes have ended obesity in Mexico.', 'Sugar taxes are unfair to poor families.', 'Companies refuse to change their drinks.'], why: '第 2 段：銷量確實下降；第 3 段：對肥胖的效果較難證明。',
      st: [['第 1 段提出的想法有幾個部分？', '兩個', '一個', '三個', 'people will buy fewer… and obesity rates will fall', 'r.locate'], ['第 2、3 段各自在談哪一部分？', '第 2 段談銷量，第 3 段談肥胖', '第 2 段談肥胖，第 3 段談公司', '兩段都在談肥胖率的變化', 'The first part… The second part…', 'r.main'], ['涵蓋兩段的選項？', '銷量下降，但對肥胖效果不明', '糖稅已經完全消滅了肥胖', '糖稅對貧窮家庭不公平', '只講一半的選項不是主旨。', 'r.para']] },
      { id: 'p4-2', sk: 'r.locate', pre: '細節：墨西哥的結果', q: 'What happened in Mexico after the tax was introduced?', o: ['Sales of sugary drinks fell by about 10 percent.', 'Obesity fell by 10 percent.', 'Sales rose among poorer families.', 'All companies stopped selling sugary drinks.'], why: '第 2 段：sales of sugary drinks dropped by about 10 percent。',
      st: [['用 Mexico 找答案在哪？', '第 2 段', '第 1 段', '第 3 段', '題目的專有名詞是最好的定位線索。', 'r.locate'], ['下降的是什麼？', '含糖飲料的銷量', '兒童的肥胖率', '飲料的稅率', 'sales of sugary drinks dropped', 'r.locate'], ['為什麼「肥胖下降一成」是陷阱？', '下降的是銷量，不是肥胖', '文中的數字是兩成', '文中的國家不是墨西哥', '換掉主詞是常見陷阱。', 'r.para']] },
      { id: 'p4-3', sk: 'r.infer', pre: '推論：為什麼肥胖的效果難證明', q: 'Why is it hard to prove that sugar taxes reduce obesity?', o: ['Obesity has many causes and changes slowly.', 'People drink more sugary drinks after the tax.', 'The tax is too small to change anything.', 'Experts refuse to study the effects of taxes.'], why: '第 3 段：Obesity develops slowly and has many causes。',
      st: [['答案在哪一段？', '第 3 段', '第 2 段', '第 1 段', 'The second part is harder to prove.', 'r.locate'], ['文中給了哪兩個理由？', '肥胖發展慢、原因多；可能改吃別的', '稅太少，而且專家都不願意研究', '飲料變貴，而且公司都不願意改', '找 because 或 so、Moreover。', 'r.locate'], ['哪個選項是其中之一？', '肥胖原因多、變化慢', '稅後大家喝更多', '稅太少沒有效果', '其他選項文中沒有。', 'r.para']] },
      { id: 'p4-4', sk: 'r.word', pre: '字義：replace 的意思', q: 'In paragraph 3, “replace sugary drinks with other high-calorie foods” means people may ____.', o: ['eat other high-calorie foods instead', 'drink more sugary drinks than before', 'stop eating high-calorie foods completely', 'add more sugar to the food they eat'], why: 'replace A with B：用 B 取代 A。',
      st: [['replace A with B 的意思？', '用 B 取代 A', '用 A 取代 B', '把 A 和 B 混合', '常見搭配。', 'v.collo'], ['A 和 B 各是什麼？', 'A 含糖飲料、B 高熱量食物', 'A 高熱量食物、B 含糖飲料', 'A、B 都是含糖飲料', '照順序對應。', 'r.locate'], ['為什麼這是問題？', '總熱量仍然沒有減少', '飲料變得更好喝', '稅率又變得更高', 'Moreover 帶出的另一個困難。', 'r.infer']] },
      { id: 'p4-5', sk: 'r.attitude', pre: '作者態度：專家怎麼看糖稅', q: 'How do most experts view sugar taxes?', o: ['As useful but not a complete solution', 'As completely useless for health', 'As the only way to end obesity', 'As harmful to people’s health'], why: '最後一句：one useful tool, not a complete solution。',
      st: [['在哪一句？', '最後一句', '第一句', '第 2 段', 'Most experts therefore see…', 'r.locate'], ['專家的看法有幾個部分？', '有用，但不夠', '沒用，也有害', '唯一的方法', 'not A but B 的反向：A，not B。', 'r.attitude'], ['對應的選項？', 'useful but not a complete solution', 'completely useless for public health', 'the only way to end obesity quickly', '兩個部分都要對上。', 'r.para']] }] },
  // 第 5 天：克漏字
  { type: 'cloze', title: 'Exercise and the immune system', text: [
    'Moderate exercise, such as brisk walking for 30 minutes a day, appears to {1} the immune system. During exercise, immune cells move faster through the blood and are more likely to find and destroy germs.',
    'Studies have shown that people who exercise regularly catch fewer colds {2} people who rarely exercise. The effect is especially important for elderly people, {3} immune systems naturally weaken with age.',
    'However, more is not always better. Very long or intense exercise, such as running a marathon, may {4} weaken the immune system for a few hours. During this period, athletes are more {5} to infection.'],
    zh: '適度運動，例如每天快走 30 分鐘，似乎能強化免疫系統。運動時，免疫細胞在血液中移動得更快，更容易找到並消滅病菌。研究顯示，規律運動的人比很少運動的人少感冒。這對長者特別重要，因為免疫系統會隨年齡自然變弱。不過，越多不一定越好：非常長或劇烈的運動，例如跑馬拉松，可能會暫時削弱免疫系統幾個小時；這段期間運動員比較容易感染。',
    qs: [{ id: 'p5-1', sk: 'v.mean', q: '第 (1) 格', o: ['strengthen', 'weaken', 'overwhelm', 'replace'], why: '後面說免疫細胞更快找到病菌：運動「強化」免疫系統。',
      st: [['後一句說運動時免疫細胞怎樣？', '移動更快、更容易消滅病菌', '移動變慢、比較少遇到病菌', '數量減少、消失在血液中', '用後文判斷方向。', 'c.logic'], ['所以運動對免疫系統是？', '有好處', '有壞處', '沒影響', '方向是正面的。', 'c.logic'], ['「強化」的英文？', 'strengthen', 'weaken', 'lengthen', 'strength＋-en＝使變強。', 'v.root']] },
      { id: 'p5-2', sk: 'c.form', q: '第 (2) 格', o: ['than', 'as', 'to', 'from'], why: 'fewer… than…：比較級要配 than。',
