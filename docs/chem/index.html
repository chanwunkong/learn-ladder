  el.innerHTML = `${seg('csS', Object.entries(SALT).map(([k, v]) => [k, v[0]]), st.s)}${seg('csL', Object.entries(LIG).map(([k, v]) => [k, v[0]]), st.l)}<div class="w-row"><label class="rng">配位基濃度（M）<input type="range" id="csC" min="0.05" max="6" step="0.05"><output class="mono" id="csO"></output></label></div><div class="bars pk" id="csB"></div><p class="eq" id="csF"></p><p class="note" id="csN"></p>`;
  function draw() {
    const [nm, ksp] = SALT[st.s], [ln, cx, kf] = LIG[st.l], K = ksp * kf, r = Math.sqrt(K), s = r * st.c / (1 + 2 * r), s0 = Math.sqrt(ksp);
    const lo = Math.log10(s0) - 1, hi = 1, w = v => clamp((Math.log10(v) - lo) / (hi - lo), 0.02, 1) * 100;
    $('#csB', el).innerHTML = `<div><span>在純水中</span><i class="ba" style="width:${w(s0)}%"></i><b class="mono">${sci(s0, 2)} M</b></div><div class="on"><span>在 ${fx(st.c, 2)} M ${ln} 中</span><i class="ba" style="width:${w(Math.min(s, st.c / 2))}%"></i><b class="mono">${sci(s, 2)} M</b></div><p class="small mut">長條為對數長度</p>`;
    $('#csF', el).innerHTML = `${nm}(s) + 2${ln} ⇌ ${cx} + ${nm.slice(2)}⁻　K = Ksp × Kf = ${sci(ksp, 1)} × ${sci(kf, 1)} = ${sci(K, 2)}；s² ÷ (C − 2s)² = K → s = √K·C ÷ (1 + 2√K)`;
    $('#csN', el).innerHTML = `配位基把 Ag⁺ 抓成錯離子，使 [Ag⁺] 極低，溶解平衡往右。總平衡常數是兩個反應相加：K = Ksp × Kf。${K > 1 ? '這裡 K 大於 1，沉澱幾乎可以全部溶解（受配位基的量限制）。' : `K 小於 1，Ksp 越小的鹽越難溶：AgCl 溶於氨水，AgI 幾乎不溶，需要形成常數更大的 CN⁻。`}`;
    $('#csC', el).value = st.c; $('#csO', el).textContent = fx(st.c, 2); pressSeg(el, 'csS', st.s); pressSeg(el, 'csL', st.l);
  }
  bindSeg(el, 'csS', v => { st.s = v; draw(); });
  bindSeg(el, 'csL', v => { st.l = v; draw(); });
  $('#csC', el).oninput = e => { st.c = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 1. 原子軌域相加、相減：成鍵與反鍵 ===== */
W.lcao = el => {
  const st = { t: 'b', m: 'homo' };
  el.innerHTML = `${seg('lcT', [['b', '相加：成鍵軌域'], ['a', '相減：反鍵軌域']], st.t)}${seg('lcM', [['homo', 'H₂（同核）'], ['hetero', 'HeH⁺（異核）']], st.m)}<div id="lcG"></div><p class="eq" id="lcF"></p><p class="note" id="lcN"></p>`;
  function draw() {
    const het = st.m === 'hetero', bond = st.t === 'b', cA = het ? (bond ? 0.85 : 0.53) : 0.71, cB = (het ? (bond ? 0.53 : 0.85) : 0.71) * (bond ? 1 : -1);
    const fA = x => Math.exp(-Math.abs(x + 0.9) * (het ? 1.4 : 1)), fB = x => Math.exp(-Math.abs(x - 0.9)), psi = x => cA * fA(x) + cB * fB(x), xs = Array.from({ length: 161 }, (_, i) => -4 + i * 0.05);
    $('#lcG', el).innerHTML = chart({ w: 560, h: 250, x: [-4, 4], y: [-1, 1.4], xt: [], yt: [-1, 0, 1], xlab: '沿著鍵軸的位置', ylab: 'ψ（線）與 ψ²（陰影）', label: '分子軌域' }, (X, Y) =>
      `<path d="${path(xs.map(x => [X(x), Y(psi(x) ** 2)]))}L${X(4)} ${Y(0)}L${X(-4)} ${Y(0)}Z" class="dens"/><path class="tline faint" d="${path(xs.map(x => [X(x), Y(cA * fA(x))]))}"/><path class="tline faint" d="${path(xs.map(x => [X(x), Y(cB * fB(x))]))}"/><path class="tline" d="${path(xs.map(x => [X(x), Y(psi(x))]))}"/>`
      + `<line class="mk" x1="${X(-4)}" x2="${X(4)}" y1="${Y(0)}" y2="${Y(0)}"/><circle class="nucA" cx="${X(-0.9)}" cy="${Y(0)}" r="7"/><circle class="nucB" cx="${X(0.9)}" cy="${Y(0)}" r="6"/><text class="tk" x="${X(-0.9)}" y="${Y(-0.25)}" text-anchor="middle">${het ? 'He' : 'H'}</text><text class="tk" x="${X(0.9)}" y="${Y(-0.25)}" text-anchor="middle">H</text>`
      + (bond ? '' : (() => { let x0 = -0.9; for (let x = -0.9; x <= 0.9; x += 0.005) if (psi(x) * psi(-0.9) <= 0) { x0 = x; break; } return `<line class="node" x1="${X(x0)}" x2="${X(x0)}" y1="${Y(-0.9)}" y2="${Y(1.3)}"/><text class="tk hl" x="${X(x0)}" y="${Y(1.2)}" text-anchor="middle">節面</text>`; })()));
    $('#lcF', el).innerHTML = `ψ${bond ? '' : '*'} = ${fx(cA, 2)} ψ(${het ? 'He' : 'H'}) ${bond ? '+' : '−'} ${fx(Math.abs(cB), 2)} ψ(H)`;
    $('#lcN', el).innerHTML = bond ? `兩個原子軌域<b>同號相加</b>，在兩個原子核之間互相加強，電子密度（陰影）集中在兩核之間，同時被兩個原子核吸引，能量比原來的原子軌域<b>低</b>：成鍵軌域。${het ? '異核分子中，成鍵軌域比較像能量較低、電負度較大的原子（He）的軌域，所以 He 的係數較大。' : ''}`
      : `兩個原子軌域<b>異號相減</b>，在兩核之間互相抵消，出現一個<b>節面</b>（電子密度為 0），電子被推到兩核外側，能量比原子軌域<b>高</b>：反鍵軌域（以 * 表示）。${het ? '異核分子中，反鍵軌域比較像能量較高、電負度較小的原子（H）的軌域，所以 H 的係數較大。' : ''}`;

/* ===== 1. 烷類命名：主鏈、編號、排序 =====
   n：主鏈碳數；subs：[位置（由左編號）, 英文, 中文, 碳數] */
const ALKN = [
  { n: 6, subs: [[2, 'methyl', '甲基', 1], [3, 'ethyl', '乙基', 2]], en: 'hexane', zh: '己烷' },
  { n: 5, subs: [[2, 'methyl', '甲基', 1], [2, 'methyl', '甲基', 1], [4, 'methyl', '甲基', 1]], en: 'pentane', zh: '戊烷' },
  { n: 5, subs: [[2, 'chloro', '氯', 0], [3, 'methyl', '甲基', 1]], en: 'pentane', zh: '戊烷' },
  { n: 7, subs: [[3, 'methyl', '甲基', 1], [5, 'ethyl', '乙基', 2], [5, 'methyl', '甲基', 1]], en: 'heptane', zh: '庚烷' },
];
const MULTI = ['', '', 'di', 'tri', 'tetra'], MULTIZ = ['', '', '二', '三', '四'];
function alkName(p, rev) {
  const subs = p.subs.map(([i, e, z, c]) => [rev ? p.n + 1 - i : i, e, z, c]);
  const g = {}; subs.forEach(([i, e, z]) => { (g[e] = g[e] || { z, l: [] }).l.push(i); });
  const keys = Object.keys(g).sort();
  const en = keys.map(k => `${g[k].l.sort((a, b) => a - b).join(',')}-${MULTI[g[k].l.length]}${k}`).join('-') + p.en;
  const zh = keys.map(k => `${g[k].l.sort((a, b) => a - b).join(',')}-${MULTIZ[g[k].l.length]}${g[k].z}`).join('-') + p.zh;
  return { en, zh, loc: subs.map(s => s[0]).sort((a, b) => a - b) };
}
W.namealk = el => {
  const st = { i: 0, rev: 0 };
  el.innerHTML = `${seg('naS', ALKN.map((p, i) => [String(i), `結構 ${i + 1}`]), '0')}${seg('naD', [['0', '由左往右編號'], ['1', '由右往左編號']], '0')}<div id="naG"></div><div class="cards" id="naK"></div><p class="note" id="naN"></p>`;
  function draw() {
    const p = ALKN[st.i], atoms = {}, bonds = [], cnt = {};
    p.subs.forEach(([i]) => { cnt[i] = (cnt[i] || 0) + 1; });
    for (let k = 1; k <= p.n; k++) { const x = (k - (p.n + 1) / 2) * 0.87, y = k % 2 ? -0.25 : 0.25; atoms['c' + k] = { x, y, t: '' }; atoms['n' + k] = { x, y: y - Math.sign(y) * 0.6, t: `<tspan class="cnum">${st.rev ? p.n + 1 - k : k}</tspan>` }; if (k > 1) bonds.push(['c' + (k - 1), 'c' + k, 's']); }
    const used = {};
    p.subs.forEach(([i, e, z, c], j) => { const C0 = atoms['c' + i], dir = Math.sign(C0.y), dx = cnt[i] > 1 ? (used[i] ? 0.45 : -0.45) : 0; used[i] = 1;
      if (c === 0) { atoms['s' + j] = { x: C0.x + dx, y: C0.y + dir * 0.95, t: 'Cl' }; bonds.push(['c' + i, 's' + j, 's']); return; }
      let prev = 'c' + i; for (let m = 0; m < c; m++) { const id = `s${j}_${m}`; atoms[id] = { x: C0.x + dx + (m ? 0.5 : 0), y: C0.y + dir * (0.95 + m * 0.5), t: '' }; bonds.push([prev, id, 's']); prev = id; } });
    $('#naG', el).innerHTML = MOL.svg({ atoms, bonds }, { w: 520, h: 230, s: 50, label: '主鏈與編號' });
    const a = alkName(p, 0), b = alkName(p, 1), cur = st.rev ? b : a;
    const cmp = (x, y) => { for (let k = 0; k < x.length; k++) if (x[k] !== y[k]) return x[k] < y[k] ? 0 : 1; return 0; };
    const best = cmp(a.loc, b.loc);
    $('#naK', el).innerHTML = card('l', '目前的取代基位置', cur.loc.join(', ')) + card('o', '另一方向', (st.rev ? a : b).loc.join(', ')) + card('n', '名稱', st.rev === best ? '<span class="ok">✓ 正確</span>' : '<span class="bad">✗ 編號方向不對</span>');
    $('#naN', el).innerHTML = `<b class="mono">${cur.en}</b>（${cur.zh}）<br>步驟：① 找出最長的碳鏈當主鏈（一樣長時選取代基較多的）；② 從靠近取代基的一端編號，比較兩個方向的位置數組，第一個不同的數字較小者為準；③ 取代基依英文字母排序（di-、tri- 不算進排序），同樣的取代基用 di-、tri- 合併。`;
    pressSeg(el, 'naS', String(st.i)); pressSeg(el, 'naD', String(st.rev));
  }
  bindSeg(el, 'naS', v => { st.i = +v; draw(); });
  bindSeg(el, 'naD', v => { st.rev = +v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

  const st = { a: 6, b: 1, c: 2, d: 0 };   // a、b 在左邊碳（上、下），c、d 在右邊碳（上、下）

    const res = !hiL || !hiR ? '無幾何異構' : hiL === hiR ? 'Z' : 'E';

/* ---------- 後中化學：有機酸鹼的互動圖 ---------- */

/* ===== 1. 苯環取代基的位置與 pKa =====

  CH3: ['甲基微弱地推電子，讓負電荷較不穩定，酸性稍弱（pKa 稍大）。', ''],

  ['NaH', 35, 'H₂（氣體逸出，不可逆）'], ['NaNH₂', 35, 'NH₃'], ['LDA', 36, '二異丙基胺'], ['n-BuLi', 50, '丁烷'],

/* ===== 3. 用酸鹼萃取分離混合物 =====
   [名稱, 類別（a 酸 b 鹼 n 中性）, pKa（鹼為共軛酸的 pKa）] */
const EXCMP = [['苯甲酸', 'a', 4.2], ['4-羥基苯甲醛', 'a', 7.6], ['酚', 'a', 10.0], ['苯胺', 'b', 4.6], ['萘', 'n', 0]];
const EXW = { w: ['水', 7], bic: ['5% NaHCO₃', 6.35], oh: ['1 M NaOH', 15.7], hcl: ['1 M HCl', -1.7] };
W.extract = el => {
  let cur = 'bic';
  el.innerHTML = `${seg('exS', Object.entries(EXW).map(([k, v]) => [k, v[0]]), cur)}<div id="exG"></div><p class="note" id="exN"></p>`;
  function where(c) {
    const [, t, p] = c, [, q] = EXW[cur];
    if (cur === 'w') return 0;
    if (t === 'a' && cur !== 'hcl') return q > p + 1 ? 1 : 0;
    if (t === 'b' && cur === 'hcl') return 1;
    return 0;
  }
  function draw() {
    const top = [], bot = [];
    EXCMP.forEach(c => (where(c) ? bot : top).push(c));
    const ion = c => c[1] === 'a' ? c[0] + '⁻（鹽）' : c[0] + 'H⁺（鹽）';
    const row = (arr, y, f) => arr.map((c, i) => `<text class="tk" x="${220}" y="${y + i * 20}" text-anchor="middle" style="font-size:13px;fill:var(--ink)">${f(c)}</text>`).join('');

    $('#exN', el).innerHTML = `${EXW[cur][0]}：${cur === 'w' ? '中性的有機分子都留在乙醚層，無法分離。' : cur === 'hcl' ? '只有鹼（苯胺）被質子化成銨鹽，溶進水層。' : `只有 pKa 比 ${EXW[cur][1]}（鹼的共軛酸）小的酸會被拿走 H⁺，變成帶電的鹽溶進水層。`}帶電的離子溶於水，中性分子溶於有機溶劑：這就是<b>酸鹼萃取</b>。所以 NaHCO₃ 能把羧酸和酚分開（只拿走羧酸的 H），NaOH 則把兩者都拉進水層。水層再加酸，就能把酸沉澱回收。`;

/* ===== 4. 用 pKa 預測酸鹼反應方向 ===== */
// pKa 主要採 OpenStax《Organic Chemistry》（McMurry）的數值；不同教科書略有差異（例如 NH₃ 為 35–38、CH₄ 為 50–60）
const PKA = [
  ['HCl', 'Cl⁻', -7], ['H₃O⁺', 'H₂O', -1.7], ['CH₃COOH', 'CH₃COO⁻', 4.76], ['H₂CO₃', 'HCO₃⁻', 6.35], ['NH₄⁺', 'NH₃', 9.25], ['C₆H₅OH（酚）', 'C₆H₅O⁻', 10.0],
  ['H₂O', 'OH⁻', 15.7], ['CH₃CH₂OH', 'CH₃CH₂O⁻', 16], ['HC≡CH', 'HC≡C⁻', 25], ['NH₃', 'NH₂⁻', 35], ['CH₃CH₃', 'CH₃CH₂⁻', 50],
];
W.pkaeq = el => {
  let ia = 8, ib = 6;
  const PRE = [['NaOH 能拿走乙炔的 H 嗎？', 8, 6], ['NaNH₂ 呢？', 8, 9], ['碳酸氫鈉能溶解醋酸嗎？', 2, 3], ['碳酸氫鈉能溶解酚嗎？', 5, 3], ['乙醇與 NaOH', 7, 6]];
  el.innerHTML = `<div class="w-row"><span class="small mut">試試：</span>${PRE.map((p, i) => `<button class="btn sm ghost" type="button" data-p="${i}">${p[0]}</button>`).join('')}</div>
<div class="w-row"><label class="sel">酸 HA <select id="pkA">${PKA.map((p, i) => `<option value="${i}">${p[0]}（pKa ${p[2]}）</option>`).join('')}</select></label><label class="sel">鹼 B⁻ <select id="pkB">${PKA.map((p, i) => `<option value="${i}">${p[1]}（共軛酸 pKa ${p[2]}）</option>`).join('')}</select></label></div><div id="pkR"></div><div id="pkS"></div><p class="note" id="pkN"></p>`;
  function draw() {
    const A = PKA[ia], B = PKA[ib], d = B[2] - A[2], K = 10 ** d, right = d > 0;
    $('#pkA', el).value = ia; $('#pkB', el).value = ib;
    $('#pkR', el).innerHTML = `<p class="eq">${A[0]} + ${B[1]} ${right ? '<b>⟶</b>' : '⟵'} ${A[1]} + ${B[0]}<br><span class="small">pKa ${A[2]}　　　　　　　　　pKa ${B[2]}</span></p>`;
    $('#pkS', el).innerHTML = chart({ x: [-10, 52], y: [0, 1], xt: [-10, 0, 10, 20, 30, 40, 50], yt: [], xlab: 'pKa（越左酸越強；共軛鹼越右越強）', h: 130 }, (X, Y) => PKA.map((p, i) => { const on = i === ia || i === ib, y = Y(0.25 + 0.55 * ((i % 3) / 2)); return `<line class="mk" x1="${X(p[2])}" x2="${X(p[2])}" y1="${Y(0)}" y2="${y}"/><circle class="${on ? 'dot' : 'dot3'}" cx="${X(p[2])}" cy="${y}" r="${on ? 6 : 4}"/><text class="tk${on ? ' hl' : ''}" x="${X(p[2])}" y="${y - 9}" text-anchor="middle">${p[0].replace(/（.*）/, '')}</text>`; }).join(''));
    $('#pkN', el).innerHTML = ia === ib ? '選兩個不同的物種。' : `平衡常數 K = 10<sup>(pKa 右邊的酸 − pKa 左邊的酸)</sup> = 10<sup>${fx(d, 2)}</sup> ≈ ${sci(K, 1)}。平衡偏向<b>較弱的酸（pKa 較大）那一側</b>：${right ? `${B[0]}（${B[2]}）比 ${A[0]}（${A[2]}）弱，所以反應<b>向右</b>，${B[1]} 可以把 ${A[0]} 的 H⁺ 拿走。` : `${A[0]}（${A[2]}）比 ${B[0]}（${B[2]}）弱，反應<b>幾乎不往右走</b>：${B[1]} 不夠強，拿不走 ${A[0]} 的 H⁺。`}`;
  }
  $('#pkA', el).onchange = e => { ia = +e.target.value; draw(); };
  $('#pkB', el).onchange = e => { ib = +e.target.value; draw(); };
  $$('[data-p]', el).forEach(b => { b.onclick = () => { const p = PRE[+b.dataset.p]; ia = p[1]; ib = p[2]; draw(); }; });
  draw();
  return { set(s) { ia = s.a ?? ia; ib = s.b ?? ib; draw(); } };
};

W.dbe = el => {
  let cur = 0;
  el.innerHTML = `${seg('dbS', DBEF.map((v, i) => [String(i), v[0]]), '0')}<p class="eq" id="dbF"></p><div class="dbb" id="dbB"></div><p class="note" id="dbN"></p>`;
  function draw() {
    const [f, C, H, N, X, ex] = DBEF[cur], d = (2 * C + 2 + N - H - X) / 2;

/* ===== 1. 相圖：水與二氧化碳 =====
   以實測的特徵點畫邊界（三相點、正常沸點或昇華點、臨界點），氣液線與昇華線在 (1/T, ln P) 上分段線性；熔化線用近似斜率。圖為示意，但特徵點數值正確。 */
W.phase = el => {
  const SUB = {
    water: { n: '水', tp: [273.16, 0.00604], bp: [373.15, 1], cp: [647.1, 217.7], subB: 6146, melt: P => 273.16 - 0.0074 * (P - 0.00604), notes: '熔化線向左傾（負斜率）：加壓會讓冰熔化，因為冰的密度比水小。' },
    co2: { n: '二氧化碳', tp: [216.6, 5.11], bp: null, sp: [194.7, 1], cp: [304.2, 72.9], melt: P => 216.6 + 0.02 * (P - 5.11), notes: '三相點壓力 5.1 atm 高於 1 atm，所以在一大氣壓下 CO₂ 不會變成液體，乾冰直接昇華（−78.5 °C）。熔化線向右傾，和大多數物質一樣。' },
  };
  const st = { s: 'water', T: 298, lp: 0 };
  el.innerHTML = `${seg('phS', Object.entries(SUB).map(([k, v]) => [k, v.n]), st.s)}<div class="w-row"><label class="rng">溫度（°C）<input type="range" id="phT" min="-120" max="420" step="1"><output class="mono" id="phTo"></output></label><label class="rng">壓力（atm，對數）<input type="range" id="phP" min="-3" max="3" step="0.05"><output class="mono" id="phPo"></output></label></div><div id="phG"></div><p class="note" id="phN"></p>`;
  const lin = (a, b, x) => a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  function curves(d) {
    const iT = T => 1 / T, L = (p, q, T) => Math.exp(lin([iT(p[0]), Math.log(p[1])], [iT(q[0]), Math.log(q[1])], iT(T)));
    const lv = T => (d.bp ? (T <= d.bp[0] ? L(d.tp, d.bp, T) : L(d.bp, d.cp, T)) : L(d.tp, d.cp, T));
    const sub = T => (d.sp ? L(d.sp, d.tp, T) : d.tp[1] * Math.exp(-d.subB * (1 / T - 1 / d.tp[0])));
    return { lv, sub, pv: T => (T < d.tp[0] ? sub(T) : lv(T)) };
  }
  function phaseAt(d, T, P) {
    const c = curves(d);
    if (T >= d.cp[0] && P >= d.cp[1]) return '超臨界流體';
    if (T >= d.cp[0]) return '氣體';
    if (P < c.pv(T)) return '氣體';
    return T < d.melt(P) ? '固體' : '液體';
  }
  function draw() {
    const d = SUB[st.s], c = curves(d), P = 10 ** st.lp, T = st.T, ph = phaseAt(d, T, P);
    const Ts = (a, b) => Array.from({ length: 80 }, (_, i) => a + (b - a) * i / 79);
    $('#phG', el).innerHTML = chart({ x: [150, 700], y: [-3, 3], xt: [173, 273, 373, 473, 573, 673], yt: [-3, -2, -1, 0, 1, 2, 3], xlab: '溫度（K）', ylab: 'log P（atm）', h: 270, label: `${d.n}的相圖` }, (X, Y) => {
      const cl = v => clamp(Math.log10(v), -3, 3);
      const sub = Ts(150, d.tp[0]).map(t => [X(t), Y(cl(c.sub(t)))]), lv = Ts(d.tp[0], d.cp[0]).map(t => [X(t), Y(cl(c.lv(t)))]);
      const melt = Array.from({ length: 40 }, (_, i) => { const lp = Math.log10(d.tp[1]) + (3 - Math.log10(d.tp[1])) * i / 39; return [X(d.melt(10 ** lp)), Y(lp)]; });
      return `<line class="mk" x1="${X(150)}" x2="${X(700)}" y1="${Y(0)}" y2="${Y(0)}"/><text class="tk" x="${X(690)}" y="${Y(0) - 5}" text-anchor="end">1 atm</text><path class="pb" d="${path(sub)}"/><path class="pb" d="${path(lv)}"/><path class="pb" d="${path(melt)}"/>
<circle class="dot2" cx="${X(d.tp[0])}" cy="${Y(Math.log10(d.tp[1]))}" r="5"/><text class="tk" x="${X(d.tp[0]) + 8}" y="${Y(Math.log10(d.tp[1])) + 14}">三相點</text><circle class="dot2" cx="${X(d.cp[0])}" cy="${Y(Math.log10(d.cp[1]))}" r="5"/><text class="tk" x="${X(d.cp[0]) + 6}" y="${Y(Math.log10(d.cp[1])) - 6}">臨界點</text>
<text class="tk hl" x="${X(st.s === 'water' ? 200 : 170)}" y="${Y(2.2)}">固</text><text class="tk hl" x="${X(st.s === 'water' ? 330 : 260)}" y="${Y(2.2)}">液</text><text class="tk hl" x="${X(450)}" y="${Y(-1.5)}">氣</text>
<circle class="dot" cx="${X(clamp(T, 150, 700))}" cy="${Y(st.lp)}" r="7"/>`;
    });
    $('#phN', el).innerHTML = `${d.n}在 ${fx(T - 273.15, 0)} °C、${P >= 0.1 ? fx(P, 2) : sci(P, 1)} atm：<b>${ph}</b>。${d.notes} 三相點：${fx(d.tp[0] - 273.15, 2)} °C、${d.tp[1]} atm；臨界點：${fx(d.cp[0] - 273.15, 1)} °C、${d.cp[1]} atm，超過臨界點後液體與氣體沒有界線（超臨界 CO₂ 用來萃取咖啡因）。`;
    $('#phT', el).value = T - 273.15; $('#phTo', el).textContent = fx(T - 273.15, 0); $('#phP', el).value = st.lp; $('#phPo', el).textContent = P >= 0.1 ? fx(P, 2) : sci(P, 1); pressSeg(el, 'phS', st.s);
  }
  bindSeg(el, 'phS', v => { st.s = v; draw(); });
  $('#phT', el).oninput = e => { st.T = +e.target.value + 273.15; draw(); };
  $('#phP', el).oninput = e => { st.lp = +e.target.value; draw(); };
  draw();
  return { set(s) { if (s.s) st.s = s.s; if (s.C != null) st.T = s.C + 273.15; if (s.P != null) st.lp = Math.log10(s.P); draw(); } };
};

/* ===== 3. 環己烷上的 E2：離去基必須直立 ===== */
W.chaire2 = el => {
  let cis = 1;
  el.innerHTML = `${seg('ceS', [['1', 'cis-1-溴-2-甲基環己烷'], ['0', 'trans-1-溴-2-甲基環己烷']], '1')}<div id="ceV"></div><div class="cards" id="ceK"></div><p class="note" id="ceN"></p>`;
  const r = 1.2, h = 0.3, S = 60, A = 42, DY = 0.32;
  function chair(cx, fl) {
    const P = Array.from({ length: 6 }, (_, k) => { const t = k * Math.PI / 3, z = fl * (k % 2 ? -1 : 1) * h; return { t, z, sx: cx + r * Math.cos(t) * S, sy: 115 - (DY * r * Math.sin(t) + z) * S }; });
    let s = P.map((p, i) => { const q = P[(i + 1) % 6]; return `<line class="b" x1="${p.sx}" y1="${p.sy}" x2="${q.sx}" y2="${q.sy}"/>`; }).join('');
    const put = (k, up, t, cls, L = 1, dx = 0) => { const p = P[k], ax = (up > 0) === (p.z > 0), sg = Math.sign(p.z);
      const e = ax ? [p.sx + dx, p.sy - sg * A * L] : [p.sx + Math.cos(p.t) * A * 0.95, p.sy - DY * Math.sin(p.t) * A + sg * A * 0.35];
      s += `<line class="b" x1="${p.sx}" y1="${p.sy}" x2="${e[0]}" y2="${e[1]}"/><text class="at ${cls}" style="font-size:13px" x="${e[0] + (ax ? 0 : Math.cos(p.t) * 18)}" y="${e[1] + (ax ? (sg > 0 ? -6 : 16) : 5)}" text-anchor="middle">${t}</text>`; return ax; };
    const brAx = put(0, 1, 'Br', 'hl'), meUp = cis ? 1 : -1, meAx = put(1, meUp, 'CH₃', 'br', 1, 0);
    let h2 = false, h6 = false;
    if (brAx) { h2 = put(1, -meUp, 'H', meAx ? '' : 'ok', 0.55, 14); h6 = put(5, -1, 'H', 'ok', 1.1, 0); h2 = h2 && !meAx; }
    return { s, brAx, meAx, h2, h6 };
  }
  function draw() {
    const a = chair(150, 1), b = chair(430, -1);
    const re = [a, b].find(c => c.brAx);
    $('#ceV', el).innerHTML = `<svg class="mol" viewBox="0 0 580 240" role="img" aria-label="環己烷 E2">${a.s}${b.s}<text class="tk" x="290" y="20" text-anchor="middle">⇄ 環翻轉 ⇄</text><text class="tk" x="150" y="232" text-anchor="middle">${a.brAx ? 'Br 直立：可以 E2' : 'Br 平伏：不能 E2'}</text><text class="tk" x="430" y="232" text-anchor="middle">${b.brAx ? 'Br 直立：可以 E2' : 'Br 平伏：不能 E2'}</text></svg>`;
    const fast = cis === 1;
    $('#ceK', el).innerHTML = card('c', 'Br 直立的那個椅式', fast ? '甲基在平伏鍵（穩定、常見）' : '甲基也被迫直立（不穩定、很少）') + card('h', '可拿的反式 β-H', fast ? 'C2 與 C6 都有' : '只有 C6') + card('p', '主產物', fast ? '1-甲基環己烯（查依采夫）' : '3-甲基環己烯') + card('r', '相對速率', fast ? '快' : '慢');
    $('#ceN', el).innerHTML = `環上的 E2 一樣要反式共平面，在椅式中只有<b>兩個都在直立鍵</b>的 H 與 Br（反式雙直立）才共平面。綠色的 H 是可以被拿走的。${fast ? '順式異構物中，Br 直立時甲基剛好平伏，這個構形穩定、比例高，C2 上的 H 也是直立的，所以生成取代較多的 1-甲基環己烯，反應快。' : '反式異構物要讓 Br 直立，甲基也得直立，這個構形能量高、比例很低，所以反應慢；而且 C2 上的 H 變成平伏，只能拿 C6 的 H，得到違反查依采夫規則的 3-甲基環己烯。'}`;
    void re; pressSeg(el, 'ceS', String(cis));
  }
  bindSeg(el, 'ceS', v => { cis = +v; draw(); });
  draw();
  return { set(s) { cis = s.cis ?? cis; draw(); } };
};

/* ---------- 後中化學：立體化學與構形的互動圖 ----------
   掌性中心以四面體的四個位置表示：上（紙面）、右（紙面）、楔形（朝向讀者）、虛楔（遠離讀者）。
   構型一律由三維向量計算：優先順序 1、2、3 的向量 v1·(v2 × v3) < 0 為 R，> 0 為 S（不靠記憶規則，避免畫錯）。 */
const TET = { up: [0, 1, 0], right: [0.94, -0.33, 0], wedge: [-0.47, -0.33, 0.82], dash: [-0.47, -0.33, -0.82] };
const POS2 = { up: [0, 1.1], right: [1.0, -0.38], wedge: [-0.85, -0.52], dash: [-0.22, -1.02] };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const chir = (v1, v2, v3) => (dot3(v1, cross(v2, v3)) < 0 ? 'R' : 'S');
// slots：{ 位置: 基團索引 }；pri：各基團優先順序（1 最高）
function centerScene(labels, slots, mirror = false, hl = {}) {
  const atoms = { C: { x: 0, y: 0, t: 'C' } }, bonds = [];
  for (const [pos, gi] of Object.entries(slots)) {
    const [x, y] = POS2[pos], id = 'g' + gi; atoms[id] = { x: mirror ? -x : x, y, t: labels[gi], hl: hl[gi] ? 1 : 0 };
    bonds.push(['C', id, pos === 'wedge' ? 'w' : pos === 'dash' ? 'h' : 's']);
  }
  return { atoms, bonds };
}

  const r = 1.2, h = 0.3, S = 52, A = 40;
  function chair(cx, fl, subs) {
    const P = Array.from({ length: 6 }, (_, k) => { const t = k * Math.PI / 3, z = fl * (k % 2 ? -1 : 1) * h; return { t, z, sx: cx + r * Math.cos(t) * S, sy: 110 - (0.32 * r * Math.sin(t) + z) * S }; });

      const e = ax ? [p.sx, p.sy - sg * A] : [p.sx + Math.cos(p.t) * A * 0.95, p.sy - 0.32 * Math.sin(p.t) * A + sg * A * 0.35];

    const same = st.g === 'mm', pos = st.pos, chiral = pos === 4 ? false : same ? !st.cis : true;
    $('#dsK', el).innerHTML = card('a', '左邊椅式（直立的能量）', `${fx(a.E, 1)} kJ/mol${best === 0 && a.E !== b.E ? ' ✓' : ''}`) + card('b', '右邊椅式', `${fx(b.E, 1)} kJ/mol${best === 1 && a.E !== b.E ? ' ✓' : ''}`) + card('c', '掌性', chiral ? '掌性（有鏡像異構物）' : same && pos !== 4 ? '內消旋（非掌性）' : '非掌性');

/* ---------- 後中化學：計量化學與溶液的互動圖 ---------- */
const AM = { H: 1.008, C: 12.01, N: 14.01, O: 16.00, S: 32.07, Cl: 35.45, Ca: 40.08, As: 74.92 };
const parseF = f => { const out = {}; f.replace(/([A-Z][a-z]?)(\d*)/g, (_, e, n) => { out[e] = (out[e] || 0) + (+n || 1); }); return out; };
const molarM = f => Object.entries(parseF(f)).reduce((a, [e, n]) => a + AM[e] * n, 0);
const subF = f => f.replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);

/* ===== 1. 有效數字：加減看小數位、乘除看位數 ===== */
const SF = [['4.23', '23.68'], ['23.68', '4.12'], ['0.0050', '12.30'], ['1.2', '3.456']];
const sigCount = s => { const t = s.replace('-', ''), d = t.replace('.', '').replace(/^0+/, ''); return t.includes('.') ? d.length : d.replace(/0+$/, '').length; };
const decimals = s => (s.includes('.') ? s.split('.')[1].length : 0);
W.sigfig = el => {
  const st = { i: 0, op: '+' };
  el.innerHTML = `<div class="w-row">${SF.map(([a, b], i) => `<button class="btn sm ghost" type="button" data-i="${i}">${a} 與 ${b}</button>`).join('')}</div>${seg('sfO', [['+', '相加'], ['×', '相乘']], st.op)}<div class="sfg" id="sfG"></div><p class="note" id="sfN"></p>`;
  const digits = s => { let seen = false; return s.split('').map(c => { if (c === '.') return '<span class="sd">.</span>'; if (c !== '0') seen = true; return `<span class="${seen ? 'sg' : 'ns'}">${c}</span>`; }).join(''); };
  function draw() {
    const [a, b] = SF[st.i], A = +a, B = +b;
    if (st.op === '+') {
      const dp = Math.min(decimals(a), decimals(b)), r = (A + B).toFixed(dp), w = Math.max(a.split('.')[0].length, b.split('.')[0].length);
      const pad = s => '&nbsp;'.repeat(w - s.split('.')[0].length) + digits(s);
      $('#sfG', el).innerHTML = `<div class="mono sfa">${pad(a)}<br>+ ${pad(b).replace(/^(&nbsp;)/, '')}<hr>${'&nbsp;'.repeat(Math.max(0, w - r.split('.')[0].length))}${digits(r)}</div><div class="cards">${card('a', `${a} 的小數位`, decimals(a))}${card('b', `${b} 的小數位`, decimals(b))}${card('r', '結果取', `${dp} 位小數`, `= ${r}`)}</div>`;
      $('#sfN', el).innerHTML = `加減法看<b>小數點後的位數</b>：把小數點對齊，結果只能保留到兩者中最不精確的那一位（${dp} 位小數），結果 ${r} 有 ${sigCount(r)} 位有效數字。`;
    } else {
      const n = Math.min(sigCount(a), sigCount(b)), r = Number((A * B).toPrecision(n));
      $('#sfG', el).innerHTML = `<div class="mono sfa">${digits(a)} × ${digits(b)} = ${(A * B).toPrecision(8).replace(/0+$/, '')}<br>→ <b>${r.toPrecision(n)}</b></div><div class="cards">${card('a', `${a} 的有效數字`, sigCount(a))}${card('b', `${b} 的有效數字`, sigCount(b))}${card('r', '結果取', `${n} 位`, `= ${r.toPrecision(n)}`)}</div>`;
      $('#sfN', el).innerHTML = `乘除法看<b>有效數字的位數</b>（深色的數字）：結果和兩者中位數較少的相同。開頭的 0 只是定位，不算有效數字（0.0050 只有 2 位）；小數點後面結尾的 0 要算。`;
    }
    pressSeg(el, 'sfO', st.op);
    $$('[data-i]', el).forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.i === st.i)));
  }
  $$('[data-i]', el).forEach(x => { x.onclick = () => { st.i = +x.dataset.i; draw(); }; });
  bindSeg(el, 'sfO', v => { st.op = v; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 2. 莫耳：質量、粒子數、體積的換算中心 ===== */

    s += box(300, 120, '莫耳數 n', `${fx(n, 3)} mol`, 'hub') + box(90, 120, '質量', `${st.g} g`) + box(510, 120, '分子數', sci(n * 6.022e23, 3));
    s += arr(162, 120, 228, 120, `÷ M（${fx(M, 2)} g/mol）`, 195, 80) + arr(372, 120, 438, 120, '× 6.022 × 10²³', 405, 80);

    $('#mmD', el).innerHTML = `<svg class="ch" viewBox="0 0 600 270" role="img" aria-label="莫耳換算">${s}</svg>`;
    $('#mmG', el).value = st.g; $('#mmO', el).textContent = `${st.g} g`;
    const parts = Object.entries(at).map(([e, k]) => `${e}：${k} × ${AM[e]} = ${fx(k * AM[e], 2)}（${fx(100 * k * AM[e] / M, 1)}%）`).join('；');
    $('#mmN', el).innerHTML = `${nm} ${subF(f)} 的莫耳質量 M = ${parts}，合計 ${fx(M, 2)} g/mol。任何量都先換成中間的莫耳數，再換成要的量。${gas ? '' : `例如 ${st.g} g 中 ${Object.keys(at)[0]} 的質量 = ${fx(st.g * at[Object.keys(at)[0]] * AM[Object.keys(at)[0]] / M, 2)} g。`}`;
    pressSeg(el, 'mmS', String(st.i));
  }
  bindSeg(el, 'mmS', v => { st.i = +v; draw(); });
  $('#mmG', el).oninput = e => { st.g = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 3. 由百分組成求化學式 ===== */
const EMP = [['葡萄糖', { C: 40.0, H: 6.7, O: 53.3 }, 180], ['富馬酸', { C: 41.38, H: 3.47, O: 55.15 }, 116], ['硝酸羥胺', { N: 29.17, H: 4.20, O: 66.63 }, 96], ['乙酸乙酯', { C: 54.53, H: 9.15, O: 36.32 }, 88]];
W.empform = el => {
  let cur = 0;
  el.innerHTML = `${seg('efS', EMP.map((v, i) => [String(i), v[0]]), '0')}<div class="bars pk" id="efB"></div><ol class="cs" id="efC"></ol><p class="note" id="efN"></p>`;
  function draw() {
    const [nm, pc, M] = EMP[cur], mol = Object.fromEntries(Object.entries(pc).map(([e, p]) => [e, p / AM[e]])), mn = Math.min(...Object.values(mol));
    const rat = Object.fromEntries(Object.entries(mol).map(([e, v]) => [e, v / mn])), mult = [1, 2, 3].find(k => Object.values(rat).every(v => Math.abs(v * k - Math.round(v * k)) < 0.12)) || 1;
    const emp = Object.fromEntries(Object.entries(rat).map(([e, v]) => [e, Math.round(v * mult)])), em = Object.entries(emp).reduce((a, [e, k]) => a + AM[e] * k, 0), n = Math.round(M / em);
    const fstr = o => Object.entries(o).map(([e, k]) => `${e}${k > 1 ? subF(String(k)) : ''}`).join('');
    $('#efB', el).innerHTML = Object.entries(pc).map(([e, p]) => `<div><span>${e}：${p}% → ${fx(mol[e], 3)} mol</span><i class="ba" style="width:${rat[e] / Math.max(...Object.values(rat)) * 100}%"></i><b class="mono">${fx(rat[e], 2)}</b></div>`).join('');
    $('#efC', el).innerHTML = `<li>假設 100 g：各元素的質量 = 百分率，除以原子量得莫耳數</li><li>除以最小的莫耳數 ${fx(mn, 3)}：得比值（長條長度）${mult > 1 ? `，再乘 ${mult} 變成整數` : ''}</li><li>實驗式 ${fstr(emp)}，式量 ${fx(em, 1)}</li><li>分子量 ${M} ÷ ${fx(em, 1)} ≈ ${n} → 分子式 <b>${fstr(Object.fromEntries(Object.entries(emp).map(([e, k]) => [e, k * n])))}</b></li>`;

    pressSeg(el, 'efS', String(cur));

};

/* ===== 5. 熱力學第一定律：ΔE = q + w（1 mol 單原子理想氣體） ===== */
W.firstlaw = el => {
  const st = { p: 'iso', r: 2, dT: 50 };
  el.innerHTML = `${seg('flS', [['iso', '等溫膨脹（298 K）'], ['cp', '定壓加熱'], ['cv', '定容加熱']], st.p)}<div class="w-row"><label class="rng" id="flL"><span></span><input type="range" id="flR"><output class="mono" id="flO"></output></label></div><div class="bars pk flb" id="flB"></div><div class="cards" id="flK"></div><p class="note" id="flN"></p>`;
  const R = 8.314;
  function draw() {
    let q, w, dE, dS, txt;
    if (st.p === 'iso') { w = -R * 298 * Math.log(st.r); dE = 0; q = -w; dS = R * Math.log(st.r); txt = `理想氣體的內能只和溫度有關，等溫時 ΔE = 0：氣體對外做的功 −w = nRT ln(V₂/V₁) 全部由吸收的熱補充。熵增加 ΔS = nR ln(V₂/V₁) = ${fx(dS, 2)} J/K。`; }
    else if (st.p === 'cp') { q = 2.5 * R * st.dT; w = -R * st.dT; dE = 1.5 * R * st.dT; dS = 2.5 * R * Math.log((298 + st.dT) / 298); txt = `定壓下 q = ΔH = nCₚΔT（Cₚ = 5/2 R），其中一部分用來推動活塞（w = −PΔV = −nRΔT），其餘使內能增加 nCᵥΔT。所以 Cₚ − Cᵥ = R。`; }
    else { q = 1.5 * R * st.dT; w = 0; dE = q; dS = 1.5 * R * Math.log((298 + st.dT) / 298); txt = `體積不變，不做功（w = 0），吸收的熱全部變成內能：q = ΔE = nCᵥΔT（單原子 Cᵥ = 3/2 R）。彈卡計就是定容，量到的是 ΔE。`; }
    const mx = Math.max(Math.abs(q), Math.abs(w), Math.abs(dE), 1);
    $('#flB', el).innerHTML = [['q（吸收的熱）', q], ['w（環境對系統做的功）', w], ['ΔE = q + w', dE]].map(([t, v]) => `<div><span>${t}</span><span class="zbar"><i class="${v >= 0 ? 'pos' : 'neg'}" style="width:${Math.abs(v) / mx * 50}%;${v >= 0 ? 'left:50%' : `right:50%`}"></i></span><b class="mono">${v >= 0 ? '+' : '−'}${fx(Math.abs(v), 0)} J</b></div>`).join('');
    $('#flK', el).innerHTML = card('s', 'ΔS', `${fx(dS, 2)} J/K`) + card('t', '過程', st.p === 'iso' ? `V₂/V₁ = ${st.r}` : `ΔT = ${st.dT} K`);
    $('#flN', el).innerHTML = `${txt} 符號規則：系統吸熱 q &gt; 0，環境對系統做功 w &gt; 0（被壓縮），系統對外做功 w &lt; 0（膨脹）。q 和 w 和路徑有關，ΔE、ΔH、ΔS 是狀態函數。`;
    const L = $('#flL', el), r = $('#flR', el);
    if (st.p === 'iso') { L.firstChild.textContent = '體積變為幾倍 V₂/V₁'; r.min = 1; r.max = 4; r.step = 0.1; r.value = st.r; $('#flO', el).textContent = fx(st.r, 1); }
    else { L.firstChild.textContent = '升溫 ΔT（K）'; r.min = 0; r.max = 200; r.step = 5; r.value = st.dT; $('#flO', el).textContent = st.dT; }
    pressSeg(el, 'flS', st.p);
  }
  bindSeg(el, 'flS', v => { st.p = v; draw(); });
  $('#flR', el).oninput = e => { if (st.p === 'iso') st.r = +e.target.value; else st.dT = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

    let s = lv.map(([t, v], i) => `<line class="lvl" x1="${60 + i * 60}" x2="${200 + i * 60}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tk" x="${205 + i * 60}" y="${Y(v) + 4}">${t}</text>`).join('');
    s += lv.slice(1).map(([, v, d, nm], i) => `<line class="${d > 0 ? 'dlt up' : 'dlt dn'}" x1="${110 + (i + 1) * 60}" x2="${110 + (i + 1) * 60}" y1="${Y(v - d)}" y2="${Y(v)}"/><text class="tk sm" x="${104 + (i + 1) * 60}" y="${(Y(v - d) + Y(v)) / 2 + 3}" text-anchor="end">${d > 0 ? '+' : ''}${d}</text>`).join('');
    s += `<line class="lvl on" x1="60" x2="200" y1="${Y(f)}" y2="${Y(f)}"/><text class="tk hl" x="205" y="${Y(f) + 4}">${cur}(s)　ΔHf = ${f}</text><line class="dlt dn" x1="420" x2="420" y1="${Y(lv[lv.length - 1][1])}" y2="${Y(f)}"/><text class="tk hl" x="426" y="${(Y(lv[lv.length - 1][1]) + Y(f)) / 2}">−${fx(U, 0)}（晶格能）</text>`;
    $('#bhG', el).innerHTML = `<svg class="en" style="max-width:640px" viewBox="40 0 600 285" role="img" aria-label="波恩–哈柏循環">${s}</svg>`;
    $('#bhF', el).innerHTML = `ΔHf = ${st.slice(1).map(x => `(${x[1] > 0 ? '+' : ''}${x[1]})`).join(' + ')} + (−U)　→　U = <b>${fx(U, 0)} kJ/mol</b>`;
    $('#bhN', el).innerHTML = `從元素到離子晶體，可以直接生成（ΔHf），也可以分步走：金屬昇華、非金屬斷鍵、游離、得電子，最後氣態離子結合成晶體（放出晶格能）。焓是狀態函數，兩條路的總和相同，所以可以用已知的各步驟反推晶格能。同樣的道理，溶解熱 = 晶格能 + 水合能：NaI 晶格能 686、溶解熱 −7.6 kJ/mol，則水合能 = −7.6 − 686 = −693.6 kJ/mol。`;
    pressSeg(el, 'bhS', cur);

  draw();
  return { set(s) { cur = s.c || cur; draw(); } };
};

/* ===== 7. ln K 對 1/T（凡特何夫） ===== */
const VH = { nh3: ['N₂ + 3H₂ ⇌ 2NH₃（放熱）', -92.2, -198.7], no2: ['N₂O₄ ⇌ 2NO₂（吸熱）', 57.2, 175.8] };
W.vanthoff = el => {
  const st = { r: 'nh3', T: 298 };
  el.innerHTML = `${seg('vhS', Object.entries(VH).map(([k, v]) => [k, v[0]]), st.r)}<div class="w-row"><label class="rng">溫度（K）<input type="range" id="vhT" min="250" max="800" step="5"><output class="mono" id="vhO"></output></label></div><div id="vhG"></div><p class="eq" id="vhF"></p><p class="note" id="vhN"></p>`;
  function draw() {
    const [nm, H, S] = VH[st.r], lnK = T => -H * 1000 / (8.314 * T) + S / 8.314, xs = Array.from({ length: 41 }, (_, i) => 1.25 + i * 0.0725), y = lnK(st.T), ys = xs.map(x => lnK(1000 / x)), lo = Math.floor(Math.min(...ys) / 5) * 5, hi = Math.ceil(Math.max(...ys) / 5) * 5;
    $('#vhG', el).innerHTML = chart({ w: 560, h: 240, x: [1.25, 4.15], y: [lo, hi], xt: [1.5, 2, 2.5, 3, 3.5, 4], yt: [lo, (lo + hi) / 2, hi].map(Math.round), xlab: '1000 / T（K⁻¹）', ylab: 'ln K', label: 'ln K 對 1/T' }, (X, Y) =>
      `<path class="tline" d="${path(xs.map((x, i) => [X(x), Y(ys[i])]))}"/><circle class="dot" cx="${X(1000 / st.T)}" cy="${Y(y)}" r="7"/>`);
    $('#vhF', el).innerHTML = `ln K = −ΔH°/(RT) + ΔS°/R　→　斜率 = −ΔH°/R = ${fx(-H * 1000 / 8.314, 0)} K；${st.T} K 時 ln K = ${fx(y, 2)}，K = ${sci(Math.exp(y), 2)}`;
    $('#vhN', el).innerHTML = `由 ΔG° = ΔH° − TΔS° = −RT ln K 得到這條直線。<b>放熱反應</b>斜率為正：往右（低溫）ln K 變大，升溫使 K 變小；<b>吸熱反應</b>相反，升溫 K 變大。這就是勒沙特列原理中溫度效應的定量版本。`;
    $('#vhT', el).value = st.T; $('#vhO', el).textContent = `${st.T} K`; pressSeg(el, 'vhS', st.r);
  }
  bindSeg(el, 'vhS', v => { st.r = v; draw(); });
  $('#vhT', el).oninput = e => { st.T = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 5. 位能曲線：鍵長與鍵能 =====
   鍵長 pm、鍵能 kJ/mol（教科書常用值）；曲線用 E = D[(r₀/r)¹² − 2(r₀/r)⁶] 示意 */
const BONDS2 = { 'H–H': [74, 436], 'F–F': [142, 158], 'Cl–Cl': [199, 243], 'Br–Br': [228, 193], 'I–I': [267, 151], 'O=O': [121, 498], 'N≡N': [110, 945] };
W.potcurve = el => {
  const st = { b: 'Cl–Cl', r: 300 };
  el.innerHTML = `${seg('pcS', Object.keys(BONDS2).map(k => [k, k]), st.b)}<div class="w-row"><label class="rng">核間距離 r<input type="range" id="pcR" min="60" max="450" step="2"><output class="mono" id="pcO"></output></label></div><div id="pcG"></div><p class="eq" id="pcF"></p><p class="note" id="pcN"></p>`;

<div class="seg" id="wview">${WVIEW.map((v, i) => `<button aria-pressed="${i === state.wv}" data-i="${i}">${v}</button>`).join('')}</div>
<div class="trees">${UNITS.map(p => `<div class="tree" data-k="${p.key}"><h3>${p.part}</h3><div class="tree-in"><svg class="tree-ln" aria-hidden="true"></svg>${treeRows(p)}</div></div>`).join('')}</div>
<details class="tree-src"><summary>比重怎麼算的</summary><p>中國醫藥、義守、慈濟大學 106–115 學年度學士後中醫化學試題共 30 份、1498 題，逐題依主題分類。越近的年份越重要：106 年權重 1、107 年權重 2……115 年權重 10。「近三年」只看 113–115 年，不加權。106–110 年有 95 題只能看圖判斷產物、未細分主題，沒有算進來，所以各章加總略少於 50 題。一題常同時牽涉兩個主題，分類以主要考點為準。</p></details>
<h2>怎麼使用</h2>
<ul class="how"><li><b>每章是一堂課</b>：照小節順序讀，每節都有可以動手調整的圖。先玩圖、看說明，再往下讀。</li>
<li><b>章末小題只用來確認懂了沒</b>：答錯時按「在圖上看」，回到圖上找出哪裡想錯。</li>
<li><b>考試範圍</b>：中國醫藥、義守、慈濟大學學士後中醫的化學考科都包含普通化學與有機化學，命題以大學教科書為準；課程單元依教科書標準章節安排。</li></ul>
</div>`;
}

const WVIEW = ['加權平均', '近三年', '中國醫藥', '義守', '慈濟'];
state.wv = store.get('wv', 0);
const isNew = u => !unitCh(u);
function treeRows(p) {
  const ids = p.items.map(i => i[0]), d = {};
  const depth = u => d[u] ?? (d[u] = Math.max(-1, ...TREE[u].pre.filter(x => ids.includes(x)).map(depth)) + 1);
  const rows = []; ids.forEach(u => (rows[depth(u)] = rows[depth(u)] || []).push(u));
  const pos = {};   // 每列依上一列父節點的平均位置排序，減少連線交叉
  rows.forEach(r => { r.forEach((u, i) => { const ps = TREE[u].pre.filter(x => pos[x] != null); r[i] = [u, ps.length ? ps.reduce((a, x) => a + pos[x], 0) / ps.length : i / r.length]; });
    r.sort((a, b) => a[1] - b[1]); r.forEach(([u], i) => { pos[u] = r.length > 1 ? i / (r.length - 1) : .5; r[i] = u; }); });
  return rows.map(r => `<div class="trow">${r.map(u => treeNode(u, p)).join('')}</div>`).join('');
}
function treeNode(u, p) {
  const c = unitCh(u), t = unitName(u), cross = TREE[u].pre.filter(x => !x.startsWith(p.key));
  return `<a class="tn${c ? '' : ' plan'}${c && state.done[c.id] ? ' done' : ''}" data-u="${u}" ${c ? `href="#${c.id}"` : 'tabindex="0"'}>
<span class="tn-t">${t}${c && state.done[c.id] ? ' <span class="okm">✓</span>' : ''}</span>
<span class="tn-w"><span class="tn-bar"><i></i></span><b></b></span>
${c ? '' : '<small class="tn-s">規劃中</small>'}${cross.length ? `<small class="tn-x">先修：${cross.map(unitName).join('、')}</small>` : ''}</a>`;
}
function treeWeights() {
  $$('.tn').forEach(n => { const w = TREE[n.dataset.u].w[state.wv], a = TREE[n.dataset.u].w[0];
    n.querySelector('b').textContent = `≈ ${w.toFixed(1)} 題`;
    n.querySelector('i').style.width = `${Math.min(100, w / 4 * 100)}%`;
    n.style.setProperty('--heat', Math.min(1, w / 3.5).toFixed(2));
    n.title = `${unitName(n.dataset.u)}：每份約 ${w.toFixed(1)} 題（${WVIEW[state.wv]}）` + (state.wv === 1 && w - a >= .4 ? '，比十年加權高' : ''); });
}
function treeLines() {
  $$('.tree-in').forEach(box => { const svg = box.querySelector('svg'), B = box.getBoundingClientRect(); let h = '';
    box.querySelectorAll('.tn').forEach(n => TREE[n.dataset.u].pre.forEach(pu => { const m = box.querySelector(`.tn[data-u="${pu}"]`); if (!m) return;
      const a = m.getBoundingClientRect(), b = n.getBoundingClientRect();
      const x1 = a.left + a.width / 2 - B.left, y1 = a.bottom - B.top, x2 = b.left + b.width / 2 - B.left, y2 = b.top - B.top, my = (y1 + y2) / 2;
      h += `<path data-a="${pu}" data-b="${n.dataset.u}" d="M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; }));
    svg.setAttribute('width', B.width); svg.setAttribute('height', B.height); svg.innerHTML = h; });
}
function treeFocus(u) {   // 標出這章的全部先修鏈
  const set = new Set(), walk = x => { if (set.has(x)) return; set.add(x); TREE[x].pre.forEach(walk); };
  if (u) walk(u);
  $$('.tn').forEach(n => n.classList.toggle('lit', set.has(n.dataset.u)));
  $$('.tree-ln path').forEach(p => p.classList.toggle('lit', set.has(p.dataset.a) && set.has(p.dataset.b)));
  $$('.trees').forEach(t => t.classList.toggle('focus', !!u));
}
function bindTree() {
  treeWeights(); treeLines();
  $$('#wview button').forEach(b => b.onclick = () => { state.wv = +b.dataset.i; store.set('wv', state.wv);
    $$('#wview button').forEach(x => x.setAttribute('aria-pressed', x === b)); treeWeights(); });
  $$('.tn').forEach(n => { n.onmouseenter = n.onfocus = () => treeFocus(n.dataset.u); n.onmouseleave = n.onblur = () => treeFocus(null); });
  if (!window.__treeRO) { window.__treeRO = new ResizeObserver(() => $('.trees') && treeLines()); window.__treeRO.observe($('#article')); }
}

/* ---------- 練習紀錄：每次作答存一筆（只存在這台裝置的瀏覽器） ----------
   { t: 時間戳, c: 章 id, k: 'q' 章末題／'x' 相似題, i: 題號, p: 選的選項, ok: 1/0, n: 這次第幾次作答 } */
const LOG = store.get('log', []);
function logAnswer(e) { LOG.push({ t: Date.now(), ...e }); if (LOG.length > 5000) LOG.splice(0, LOG.length - 5000); store.set('log', LOG); }
const qbank = (c, k) => (k === 'x' ? c.exam : c.quiz) || [];
const strip = h => String(h).replace(/<[^>]+>/g, '');
const dstr = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const tstr = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function qblock(list, kind) {
  return list.map((q, k) => `<div class="q" data-k="${kind}" data-q="${k}">${q.src ? `<p class="qsrc">仿 ${q.src}</p>` : ''}<p class="qt">${k + 1}. ${q.q}</p><div class="opts">${order(q, k).map(j => `<button class="opt" type="button" data-o="${j}">${q.o[j]}</button>`).join('')}</div><div class="why" hidden></div></div>`).join('');
}
// 把連續的作答併成「一題一次」：同一章、同一題、同一頁面瀏覽中，從第 1 次作答到答對為止
function sessions(log = LOG) {
  const out = [];
  log.forEach(e => { const last = out.length && [...out].reverse().find(s => s.c === e.c && s.k === e.k && s.i === e.i && !s.closed);
    if (e.n === 1 || !last) out.push({ t: e.t, c: e.c, k: e.k, i: e.i, tries: 1, ok: e.ok, first: e.ok, closed: !!e.ok, end: e.t });
    else { last.tries++; last.end = e.t; if (e.ok) { last.ok = 1; last.closed = true; } } });
  return out;
}
function lastSeen(id) {
  const ss = sessions().filter(s => s.c === id && s.k === 'q'); if (!ss.length) return '';
  const d = dstr(ss[ss.length - 1].t), day = ss.filter(s => dstr(s.t) === d);
  return `<br>上次練習 ${d}：${day.length} 題，第一次就答對 ${day.filter(s => s.first).length} 題。<a href="#log">看練習紀錄</a>`;
}
function renderLog() {
  const ss = sessions(), days = [...new Set(ss.map(s => dstr(s.t)))].sort().reverse(), pct = (a, b) => (b ? `${Math.round(100 * a / b)}%` : '—');
  const byCh = CH.map(c => { const x = ss.filter(s => s.c === c.id); return { c, n: x.length, f: x.filter(s => s.first).length, last: x.length ? dstr(x[x.length - 1].t) : '' }; }).filter(r => r.n);
  const res = s => (s.first ? '<span class="ok">✓ 第一次答對</span>' : s.ok ? `<span class="warn">第 ${s.tries} 次答對</span>` : `<span class="bad">✗ 未答對</span>`);
  $('#article').innerHTML = `<p class="eyebrow">後中化學</p><h1>練習紀錄</h1><p class="lede">每一次作答都會自動記錄：日期時間、章節、題目、作答次數與結果。紀錄存在這台裝置的瀏覽器中。</p>
${ss.length ? `<div class="cards">${card('n', '練習題次', ss.length)}${card('f', '第一次就答對', pct(ss.filter(s => s.first).length, ss.length))}${card('d', '練習天數', days.length)}${card('l', '最近一次', `${dstr(ss[ss.length - 1].t)} ${tstr(ss[ss.length - 1].t)}`)}</div>
<h2>各章</h2><table class="tbl"><thead><tr><th>章節</th><th>題次</th><th>第一次就答對</th><th>最近練習</th></tr></thead><tbody>${byCh.map(r => `<tr><td><a href="#${r.c.id}">${r.c.title}</a></td><td>${r.n}</td><td>${pct(r.f, r.n)}</td><td>${r.last}</td></tr>`).join('')}</tbody></table>
<h2>每日紀錄</h2>${days.map((d, k) => { const x = ss.filter(s => dstr(s.t) === d);
  return `<details class="logday"${k ? '' : ' open'}><summary><b>${d}</b>　${x.length} 題，第一次就答對 ${pct(x.filter(s => s.first).length, x.length)}</summary><table class="tbl"><thead><tr><th>時間</th><th>章節</th><th>題目</th><th>結果</th></tr></thead><tbody>${x.map(s => { const c = chOf(s.c), q = c && qbank(c, s.k)[s.i];
    return `<tr><td class="mono">${tstr(s.t)}</td><td>${c ? `<a href="#${c.id}/${s.k === 'x' ? 'exam' : 'quiz'}">${c.title.split('：')[0]}</a>` : s.c}${s.k === 'x' ? '<small class="mut">（相似題）</small>' : ''}</td><td>${q ? strip(q.q).slice(0, 48) : '（題目已更新）'}</td><td>${res(s)}</td></tr>`; }).join('')}</tbody></table></details>`; }).join('')}
<div class="w-row"><button class="btn sm" type="button" id="logCsv">下載 CSV</button><button class="btn sm ghost" type="button" id="logClr">清除全部紀錄</button></div>`
  : '<p class="note">還沒有紀錄。到任何一章的「確認理解」或「歷屆考題相似題」作答，就會自動記在這裡。</p>'}`;
  if (!ss.length) return;
  $('#logCsv').onclick = () => {
    const rows = [['日期', '時間', '章節', '類型', '題號', '題目', '作答次數', '第一次就答對', '最後答對']].concat(ss.map(s => { const c = chOf(s.c), q = c && qbank(c, s.k)[s.i];
      return [dstr(s.t), tstr(s.t), c ? c.title : s.c, s.k === 'x' ? '相似題' : '章末題', s.i + 1, q ? strip(q.q) : '', s.tries, s.first ? '是' : '否', s.ok ? '是' : '否']; }));
    const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `化學練習紀錄-${dstr(Date.now())}.csv`; a.click();
  };
  $('#logClr').onclick = () => { if (confirm('確定要清除這台裝置上的全部練習紀錄？')) { LOG.length = 0; store.set('log', LOG); renderLog(); } };
}

const INST = {};   // 目前頁面上各互動圖的實例（練習題「在圖上看」用）
function renderChapter(id) {
  const c = chOf(id), i = CH.indexOf(c), prev = CH[i - 1], next = CH[i + 1];
  $('#article').innerHTML = `<p class="eyebrow">${UNITS.find(p => p.items.some(x => x[0] === c.unit)).part} · ${unitName(c.unit)}</p><h1>${c.title}</h1><p class="lede">${c.lede}</p>
<nav class="secnav" aria-label="本章小節">${c.sections.map((s, k) => `<a href="#${id}/${k + 1}">${k + 1}. ${s.h}</a>`).join('')}<a href="#${id}/quiz">確認理解</a>${c.exam ? `<a href="#${id}/exam">歷屆考題相似題</a>` : ''}</nav>${(TERMS[id] || []).length ? `<div class="tchips" aria-label="本章名詞"><span class="lbl">本章名詞</span>${TERMS[id].map((t, k) => `<button type="button" class="tchip" data-t="${k}">${t[0]}</button>`).join('')}</div>` : ''}
${c.sections.map((s, k) => `<section class="sec" id="sec-${k + 1}"><h2><span class="sn">${k + 1}</span>${s.h}</h2><div class="prose">${s.body}</div>${[].concat(s.w || []).map(w => `<div class="widget" data-w="${w}"></div>`).join('')}</section>`).join('')}
<section class="sec" id="sec-quiz"><h2><span class="sn">✓</span>確認理解</h2><p class="mut small">答錯了沒關係：按「在圖上看」回到對應的圖，找出哪裡想錯。${lastSeen(id)}</p>${qblock(c.quiz, 'q')}</section>
${c.exam ? `<section class="sec" id="sec-exam"><h2><span class="sn">考</span>歷屆考題相似題</h2><p class="mut small">依照中國醫藥、義守、慈濟大學歷屆試題的考法另外出的題目（化合物與數字已更換），每題標出參考的原題。</p>${qblock(c.exam, 'x')}</section>` : ''}
<div class="foot"><button class="btn ${state.done[id] ? 'done' : ''}" type="button" id="doneBtn">${state.done[id] ? '已完成 ✓' : '標記為完成'}</button><nav class="pn">${prev ? `<a href="#${prev.id}"><small>上一章</small>${prev.title}</a>` : '<span></span>'}${next ? `<a href="#${next.id}" class="nx"><small>下一章</small>${next.title}</a>` : ''}</nav></div>`;
  for (const k in INST) delete INST[k];
  $$('.widget', $('#article')).forEach(w => { const n = w.dataset.w; try { const inst = W[n](w); if (!INST[n]) INST[n] = { inst, el: w }; } catch (e) { w.innerHTML = `<p class="note bad">互動圖載入失敗：${esc(e.message)}</p>`; console.error(e); } });
  const right = new Set();
  $$('.q', $('#article')).forEach(qe => {
    const kind = qe.dataset.k, qi = +qe.dataset.q, q = (kind === 'x' ? c.exam : c.quiz)[qi], why = $('.why', qe);
    let tries = 0;
    $$('.opt', qe).forEach(b => { b.onclick = () => {
      const ok = +b.dataset.o === q.a; b.classList.add(ok ? 'right' : 'wrong'); why.hidden = false;
      logAnswer({ c: id, k: kind, i: qi, p: +b.dataset.o, ok: ok ? 1 : 0, n: ++tries });
      const demo = q.show && INST[q.show.w] ? '<button class="btn sm" type="button" data-show>在圖上看 ↑</button>' : '';
      if (ok) { $$('.opt', qe).forEach(x => { x.disabled = true; }); why.className = 'why ok'; why.innerHTML = `<b>答對了。</b>${q.why}${demo}`; if (kind === 'q') right.add(qe.dataset.q);
        if (right.size === c.quiz.length && !state.done[id]) { setDone(id, true); markBtn(); } }
      else { b.disabled = true; why.className = 'why no'; why.innerHTML = `<b>再想想。</b>${demo ? '按下面的按鈕回到圖上看看。' : ''}${demo}`; }
      const sb = $('[data-show]', why); if (sb) sb.onclick = () => showOnChart(q.show);
    }; });
  });
  bindTerms(id);
  const markBtn = () => { const d = !!state.done[id]; $('#doneBtn').textContent = d ? '已完成 ✓' : '標記為完成'; $('#doneBtn').classList.toggle('done', d); };
  $('#doneBtn').onclick = () => { setDone(id, !state.done[id]); markBtn(); };
}
// 選項順序：依題號固定打散，避免正解永遠在第一個（不用亂數，重新整理後順序不變）
// 名詞：內文第一次出現時變成連結，點了跳出解釋框；有對應互動圖時可以「在圖上看」
function showOnChart(show) {
  const it = INST[show.w]; if (!it) return;
  if (show.set) it.inst.set(show.set);
  it.el.scrollIntoView({ behavior: 'smooth', block: 'center' }); it.el.classList.add('flash'); setTimeout(() => it.el.classList.remove('flash'), 1200);
}
function bindTerms(id) {
  const T = TERMS[id] || [], art = $('#article');
  T.forEach(([term], k) => {   // 每個名詞只連結內文中第一次出現的位置（略過公式框與表格標題）
    const w = document.createTreeWalker(art, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement.closest('.prose') && !n.parentElement.closest('.eq, th, .tlink, button') && n.nodeValue.includes(term) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
    const n = w.nextNode(); if (!n) return;
    const i = n.nodeValue.indexOf(term), after = n.splitText(i); after.nodeValue = after.nodeValue.slice(term.length);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tlink'; b.dataset.t = k; b.textContent = term; n.parentNode.insertBefore(b, after);
  });
  const pop = document.createElement('div'); pop.id = 'tpop'; pop.hidden = true; pop.setAttribute('role', 'dialog'); art.appendChild(pop);
  const open = (btn, k) => {
    const [term, def, show] = T[k], ab = art.getBoundingClientRect(), r = btn.getBoundingClientRect();
    pop.innerHTML = `<b>${term}</b><p>${def}</p>${show && INST[show.w] ? '<button type="button" class="btn sm pri" data-go>在圖上看 →</button>' : ''}`;
    pop.hidden = false; pop.style.top = `${r.bottom - ab.top + 6}px`; pop.style.left = `${Math.max(0, Math.min(r.left - ab.left, ab.width - pop.offsetWidth))}px`;
    const g = $('[data-go]', pop); if (g) g.onclick = () => { pop.hidden = true; showOnChart(show); };
  };
  $$('.tlink, .tchip', art).forEach(b => { b.onclick = e => { e.stopPropagation(); open(b, +b.dataset.t); }; });
  if (!window.__tpopBound) {   // 點外面或按 Esc 關閉（只綁一次）
    window.__tpopBound = true;
    document.addEventListener('click', e => { const p = $('#tpop'); if (p && !p.hidden && !p.contains(e.target)) p.hidden = true; });
    document.addEventListener('keydown', e => { const p = $('#tpop'); if (p && e.key === 'Escape') p.hidden = true; });
  }
}
function order(q, k) { const n = q.o.length, s = (k * 7 + q.q.length) % n; return Array.from({ length: n }, (_, i) => (i + s) % n); }

let shown = null;
function route(h) {
  const [id, sec] = (h || '').split('/');
  const c = chOf(id);
  if (c && shown === id && sec) { const t = document.getElementById(`sec-${sec}`); if (t) t.scrollIntoView({ block: 'start' }); return; }  // 同一章只捲動，保留互動圖狀態
  shown = c ? id : null;
  if (c) { renderChapter(id); renderTOC(id); document.title = `${c.title}｜後中化學`; }
  else if (id === 'log') { renderLog(); renderTOC('log'); document.title = '練習紀錄｜後中化學'; }
  else { renderHome(); bindTree(); renderTOC(''); document.title = '後中化學｜學習階梯'; }
  $('#tocBox').classList.remove('open'); $('#tocBtn').textContent = '☰ 單元';
  const t = sec ? document.getElementById(`sec-${sec}`) : id === 'map' && document.getElementById('map');
  if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 0); else window.scrollTo(0, 0);
}
function boot() {
  addEventListener('hashchange', () => route(location.hash.slice(1)));
  $('#tocBtn').onclick = () => { const o = $('#tocBox').classList.toggle('open'); $('#tocBtn').textContent = o ? '✕ 關閉' : '☰ 單元'; window.scrollTo(0, 0); };
  updateProgress(); route(location.hash.slice(1));
}

/* ---------- 雲端同步（Firebase，各課程與首頁共用）：Google 登入後，把「已完成的章節」存到 Firestore ----------
   只在正式網站（GitHub Pages，HEAD 帶 app-site meta）啟用；Artifact 與本機檔案不載入 SDK。
   位置：users/{uid}/settings/<課程 doc> ＝ { done: {章節id: 1}, lang, updated }
   使用前先定義 COURSE：
     tracks: [{ doc, get() → 已完成表, set(表) }]   課程頁一條；首頁列出全部課程，一次同步
     count() / total()                             面板上顯示的完成章數
     refresh()                                     從雲端合併進新章節後重畫畫面
   介面：右上角按鈕 → 下拉面板說明「登入有什麼用」與目前同步狀態；hint() 給首頁的提示列。 */
const CLOUD = (() => {
  const CFG = { apiKey: 'AIzaSyD8oEe02SY2PCDe3d40NtTprrApqW_DhB8', authDomain: 'test-5dbba.firebaseapp.com', projectId: 'test-5dbba' };
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-';
  let auth = null, db = null, user = null, timer = 0, ready = false, busy = false, err = '', last = 0;
  const on = () => !!document.querySelector('meta[name="app-site"]') && /^https?:$/.test(location.protocol);
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const ref = doc => db.collection('users').doc(user.uid).collection('settings').doc(doc);
  const zh = () => (typeof isZh === 'function' ? isZh() : true), lang = () => (typeof I18N !== 'undefined' ? I18N.lang : 'zh-TW');
  const T = (a, b) => (zh() ? a : b);
  const nDone = () => COURSE.count();
  const time = t => new Date(t).toLocaleTimeString(zh() ? 'zh-TW' : 'en', { hour: '2-digit', minute: '2-digit' });
  const G = '<svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 5.9-2.2L12 13.6c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.8a5.4 5.4 0 0 1 0-3.5V4.9H1a9 9 0 0 0 0 8.1l3-2.3z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 4.9l3 2.3c.7-2.1 2.7-3.6 5-3.6z"/></svg>';

  function panelHTML() {
    if (!ready) return `<p class="cp-t">${T('連線中…', 'Connecting…')}</p>`;
    const n = nDone(), tot = COURSE.total(), e = err ? `<p class="cp-err">${esc(err)}</p>` : '';
    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>
<p>${T('用 Google 帳號登入後，你完成的章節會存到雲端。之後在手機或其他電腦登入同一個帳號，進度會自動接上。', 'Sign in with Google and the chapters you finish are saved to the cloud. Sign in with the same account on your phone or another computer and your progress follows you.')}</p>
<p class="cp-st">${T(`目前：進度只存在這台裝置（已完成 ${n} / ${tot} 章）`, `Now: progress is saved on this device only (${n} / ${tot} chapters done)`)}</p>
<button class="btn pri cp-go" type="button" id="cpIn">${G}<span>${T('用 Google 登入', 'Sign in with Google')}</span></button>
<p class="cp-s">${T('不登入也能使用全部內容。這裡只儲存「完成了哪些章節」，不會讀取你的其他 Google 資料。', 'Everything works without signing in. Only the list of finished chapters is stored, nothing else from your Google account.')}</p>${e}`;
    return `<p class="cp-t">${user.photoURL ? `<img class="cp-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(user.displayName || T('已登入', 'Signed in'))}<small>${esc(user.email || '')}</small></span></p>
<p class="cp-st ok">${busy ? T('同步中…', 'Syncing…') : `✓ ${T(`已同步 ${n} / ${tot} 章`, `${n} / ${tot} chapters synced`)}${last ? ` · ${time(last)}` : ''}`}</p>
<p>${T('在其他裝置用同一個帳號登入，就會看到相同的進度；在任何一台標記完成，其他裝置也會跟著更新。', 'Sign in with the same account on another device to see the same progress. Chapters you finish anywhere show up everywhere.')}</p>
<button class="btn" type="button" id="cpOut">${T('登出', 'Sign out')}</button>
<p class="cp-s" style="margin-top:8px !important">${T('登出後，這台裝置上的進度仍會保留。', 'Signing out keeps your progress on this device.')}</p>${e}`;
  }
  function render() {
    const b = document.getElementById('cloudBtn'), p = document.getElementById('cloudPanel');
    if (b) {
      b.innerHTML = user ? `${user.photoURL ? `<img class="cb-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '<span class="cb-dot"></span>'}<span>${busy ? T('同步中', 'Syncing') : T('已同步', 'Synced')}</span>` : `<span aria-hidden="true">☁</span><span>${T('同步進度', 'Sync progress')}</span>`;
      b.title = user ? T('進度已同步到雲端，點一下看詳情', 'Progress is synced; click for details') : T('登入後可在不同裝置同步學習進度', 'Sign in to sync progress across devices');
    }
    if (p && !p.hidden) {
      p.innerHTML = panelHTML();
      const i = document.getElementById('cpIn'), o = document.getElementById('cpOut');
      if (i) i.onclick = signIn;
      if (o) o.onclick = () => auth.signOut();
    }
    const h = document.getElementById('syncHint'); if (h) h.outerHTML = hint();
  }
  function signIn() {
    err = ''; if (!ready) return;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { err = T('登入失敗：', 'Sign-in failed: ') + e.code; toggle(true); }
    });
  }
  function toggle(show) {
    const p = document.getElementById('cloudPanel'), b = document.getElementById('cloudBtn'); if (!p) return;
    p.hidden = show === undefined ? !p.hidden : !show; b.setAttribute('aria-expanded', String(!p.hidden)); render();
  }
  function push() {
    if (!user) return;
    clearTimeout(timer); busy = true; render();
    timer = setTimeout(() => Promise.all(COURSE.tracks.map(t => ref(t.doc).set({ done: t.get(), lang: lang(), updated: Date.now() })))
      .then(() => { busy = false; err = ''; last = Date.now(); render(); })
      .catch(e => { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }), 800);
  }
  async function pull() {
    try {
      busy = true; render();
      let added = 0, ahead = false;
      for (const t of COURSE.tracks) {
        const snap = await ref(t.doc).get(), remote = (snap.exists && snap.data().done) || {}, local = { ...t.get() };
        const add = Object.keys(remote).filter(k => !local[k]);
        add.forEach(k => { local[k] = 1; });
        if (add.length) { t.set(local); added += add.length; }
        if (Object.keys(local).some(k => !remote[k])) ahead = true;
      }
      if (added) COURSE.refresh();
      busy = false; last = Date.now(); err = '';
      if (ahead) push(); else render();
    } catch (e) { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }
  }
  // 首頁提示：有進度、還沒登入、沒按過「不用了」時才出現
  function hint() {
    if (!on() || user || !ready || !nDone() || store.get('syncHintOff', 0)) return '<div id="syncHint" hidden></div>';
    return `<div id="syncHint" class="sync-hint" data-notr><span>☁ ${T(`你已完成 ${nDone()} 章，進度目前只存在這台裝置。登入 Google 帳號，換手機或電腦也能接著學。`, `You've finished ${nDone()} chapters, saved on this device only. Sign in with Google to continue on your phone or another computer.`)}</span><button class="btn sm pri" type="button" data-sync="in">${T('登入同步', 'Sign in')}</button><button class="btn sm" type="button" data-sync="off">${T('不用了', 'No thanks')}</button></div>`;
  }
  async function start() {
    if (!on()) return;
    const top = document.querySelector('.top-in');
    if (!top) return;
    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, hint, render };
})();


/* ---------- 後中化學：啟動、雲端同步、PWA ---------- */
boot();
store.set('total', CH.length);  // 給學習階梯首頁顯示進度
const COURSE = {
  tracks: [{ doc: 'chemLadder', get: () => state.done, set: m => { state.done = m; store.set('done', m); } }],
  count: () => CH.filter(c => state.done[c.id]).length, total: () => CH.length,
  refresh: () => { updateProgress(); route(location.hash.slice(1)); },
};
if (document.querySelector('meta[name="app-site"]')) {
  document.querySelector('.brand').insertAdjacentHTML('beforebegin', '<a class="home-link" href="../">‹ 學習階梯</a>');
  if (typeof CLOUD !== 'undefined') CLOUD.start();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
}

</script>
