<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; }
.home-link:hover { color: var(--accent); }

/* 後中英文：沿用學習階梯色票，主色改為墨水藍；英文用襯線字排成「可以標註的原文」，句構用螢光筆式的底線與框線 */
:root { --accent: #1F4E79; --soft: #E3ECF5; --verb: #C98A00; --verb-soft: #FFF1C9; --subj: #0E7C7B; --subj-soft: #DDF2F1; --mod: #8A94A3;
  --en: "Source Serif 4", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #8DB8E8; --accent-ink: #0E1B2A; --soft: #1E2E40; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; } }
:root[data-theme="dark"] { --accent: #8DB8E8; --accent-ink: #0E1B2A; --soft: #1E2E40; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; }
body { margin: 0; }
.top-in .wk { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; }
#main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; }
#main h1 { font-family: var(--display); font-size: clamp(26px, 5vw, 36px); margin: 0 0 10px; }
#main h2 { font-size: 20px; margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#main h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); font-family: var(--mono); }
#main h3 { font-size: 16px; margin: 10px 0 0; }
.lede { font-size: 16px; color: var(--muted); }
.note { color: var(--muted); font-size: 14.5px; margin: 0; }
section.part { margin-top: 36px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.endrow { margin-top: 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.ens { font-family: var(--en); font-size: 17px; line-height: 1.75; }
.enw { font-family: var(--en); font-size: 1.2em; font-weight: 600; }
.pos { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
.zh { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; }
.gap { border-bottom: 2px solid var(--accent); color: var(--accent); }
/* 首頁：7 天 × 早晚 */
.duebar a { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 14px; text-decoration: none; }
.days { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }
.day h2 { font-size: 16px !important; }
.day h2 small { font-family: var(--body) !important; }
.day.now h2 { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.slot { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); text-decoration: none; font-size: 13.5px; min-width: 0; }
.slot:hover { border-color: var(--accent); }
.slot.cur { border: 2px solid var(--accent); }
.slot.fin { background: var(--good-soft); border-color: var(--good); }
.sl-h { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sl-h small { font-weight: 400; color: var(--muted); font-size: 12px; }
.sl-w { color: var(--muted); }
.sl-st { font-size: 12.5px; color: var(--accent); min-height: 1.2em; }
.slot.fin .sl-st { color: var(--good); }
.pbar { display: block; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.slot.fin .pbar i { background: var(--good); }
.segprog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.segprog .pbar { flex: 1; max-width: 240px; }
.pn { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.pn a { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; text-decoration: none; color: var(--ink); background: var(--surface); font-size: 13.5px; }
/* 單字卡 */
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.wcard p { margin: 0; }
.wh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.wz { font-weight: 700; margin-left: auto; }
.root { font-size: 13px; color: var(--accent); }
.wcard .ens { font-size: 15.5px; }
.wcard .unsure { justify-self: start; margin-top: 4px; }
.btn.unsure.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
/* 選擇題 */
.q { border-top: 1px solid var(--line); padding: 14px 0; }
.qnum, .qsrc { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.qt { font-weight: 500; margin: 0 0 8px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 14.5px; min-height: 44px; }
.opt.en-o { font-family: var(--en); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.why { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 14.5px; }
.why.ok { background: var(--good-soft); } .why.no { background: var(--bad-soft); }
.why .btn { margin-left: 8px; }
.guide { margin-top: 8px; }
.gbody { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 4px; }
.gq { font-weight: 500; margin: 2px 0 6px; }
.gdone { font-size: 13.5px; color: var(--muted); margin: 0 0 6px; padding-left: 20px; }
.gdone b { color: var(--ink); }
.stepn { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
.rv-q, .rv-sent { margin-bottom: 8px; }
.ctx { margin: 0 0 4px; }
/* 長句 */
.sentc { display: grid; gap: 8px; margin-bottom: 4px; }
.sent { font-family: var(--en); font-size: 19px; line-height: 2.3; }
.ch { padding: 2px 1px; border-radius: 4px; transition: background .2s, color .2s; }
.ch.v { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); font-weight: 600; }
.ch.s { background: var(--subj-soft); outline: 2px solid var(--subj); outline-offset: 1px; }
.ch.m { color: var(--mod); }
.ch.m::before { content: "["; } .ch.m::after { content: "]"; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0; }
.legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: .35em; vertical-align: -.1em; }
.legend .lv::before { background: var(--verb-soft); box-shadow: inset 0 -3px 0 var(--verb); }
.legend .ls::before { background: var(--subj-soft); outline: 2px solid var(--subj); }
.legend .lm::before { border: 1px dashed var(--mod); }
.core { font-family: var(--en); font-size: 17px; background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 0; }
.core .lbl { display: inline; margin-right: 10px; }
.sbody { display: grid; gap: 6px; }
/* 文法與文章 */
.lesson p { margin: 8px 0; }
.lesson .ex { font-family: var(--en); font-size: 17px; line-height: 2.2; background: var(--sunk); border-radius: 8px; padding: 6px 12px; }
.lesson ul { margin: 6px 0; padding-left: 22px; }
.passage { display: grid; gap: 2px; }
.passage p { margin: 0 0 8px; }
.ptitle { font-family: var(--en); font-weight: 600; font-size: 19px; }
.blank { font-family: var(--mono); font-size: 14px; color: var(--accent); background: var(--soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.blank.fill { font-family: var(--en); font-size: 16px; color: var(--good); background: var(--good-soft); }
.pre ol { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.pre .ens { font-size: 15.5px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
/* 週報 */
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lessons a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14px; }
.lessons b { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.lessons .fin a { border-color: var(--good); }
.ck { color: var(--good); font-weight: 700; }
.skg { display: grid; gap: 4px; }
.skg h3 { margin-top: 12px !important; font-size: 14px !important; color: var(--muted); }
.skr { display: grid; grid-template-columns: minmax(0, 11em) minmax(60px, 1fr) 3.5em 6.5em; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.skv { font-family: var(--mono); font-size: 12.5px; text-align: right; }
.sks { font-size: 12.5px; color: var(--muted); }
.st-weak .sks { color: var(--bad); font-weight: 700; } .st-weak .pbar i { background: var(--bad); }
.st-mid .sks { color: var(--warn); } .st-mid .pbar i { background: var(--warn); }
.st-good .sks { color: var(--good); } .st-good .pbar i { background: var(--good); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.tags li { background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
#exTxt { width: 100%; margin-top: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.5; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
#exBox { display: grid; gap: 4px; }
@media (max-width: 560px) {
  .slots { grid-template-columns: minmax(0, 1fr); }
  .skr { grid-template-columns: minmax(0, 1fr) 3.5em 5.5em; }
  .skr .pbar { grid-column: 1 / -1; grid-row: 2; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* ---------- 後中英文：介面小工具與能力分類 ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('eng-ladder:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eng-ladder:' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時忽略 */ } },
};
// 固定的亂數：同一題每次打開選項順序一樣（複習時才認得出來）
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(n, seed) {
  let x = hash(seed) || 1; const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 能力分類：每一題、每一步都標其中一項；週報與匯出依此統計弱項
const SKILL_GROUPS = [
  ['v', '單字'], ['s', '句子結構'], ['g', '文法'], ['c', '克漏字'], ['r', '閱讀'],
];
const SKILLS = {
  'v.root': '字根拆字', 'v.mean': '字義', 'v.collo': '搭配用法',
  's.core': '找主幹（主詞＋動詞）', 's.rel': '關係子句', 's.part': '分詞修飾', 's.noun': '名詞子句', 's.pass': '被動語態', 's.para': '平行結構',
  'g.tense': '時態與主詞動詞一致', 'g.conj': '連接詞與轉折語',
  'c.logic': '前後文邏輯', 'c.form': '詞性與形式', 'c.collo': '固定搭配',
  'r.main': '主旨', 'r.locate': '找細節', 'r.para': '換句話說', 'r.infer': '推論', 'r.word': '由上下文猜字義', 'r.attitude': '作者態度',
};
// 每週的資料檔（wk/wNNa.js、wNNb.js）把自己 push 進來

  { id: 's.core', title: '句子主幹：先找動詞，再找主詞', body: `<p>再長的句子，骨架都是「誰＋做什麼」。讀英文長句的第一步不是逐字翻譯，而是<b>先找主要動詞</b>：它不在 who／which／that 子句裡，前面也沒有 to。找到動詞，往前找做這個動作的人或物，就是主詞。其他的部分（介系詞片語、子句）都是修飾，第一遍可以先跳過。</p>

  { id: 's.rel', title: '關係子句：who、which、that 補充說明前面的名詞', body: `<p>想說明「是哪一個人或東西」時，英文把說明放在名詞<b>後面</b>，用 who（人）、which（物）、that（人或物）接起來。關係子句裡有自己的動詞，但那不是整句的主要動詞。</p>

  { id: 's.part', title: '分詞修飾：名詞後面的 V-ing 與 V-ed', body: `<p>名詞後面直接接 V-ing 或 V-ed 片語，是把「關係代名詞＋be 動詞」省略掉的關係子句：</p>

  { type: 'cloze', title: 'Why is chronic pain so hard to treat?', text: [

    'One reason is that the nervous system itself changes. Nerves that are exposed to pain for a long time become more sensitive, so even a light touch {3} feel painful. {4}, chronic pain is closely linked to sleep and mood. Patients who sleep poorly feel more pain, and more pain makes it harder to sleep.',

  { type: 'read', title: 'Sleep and memory in older adults', text: [
    'Many older adults sleep less deeply than they did when they were young. For years, this was seen as a normal part of aging. However, a growing number of studies suggest that poor sleep may also contribute to memory decline.',
    'In one study, 120 participants aged 65 to 80 wore a small device that measured their sleep for two weeks. They then took memory tests. Participants who spent more time in deep sleep remembered more words, even after the researchers controlled for age and education.',
    'The researchers believe that deep sleep helps the brain move new information into long-term memory. If this is true, treating sleep problems in older adults could protect cognitive function. The authors note, however, that the study cannot prove that poor sleep causes memory loss; people with early brain changes may simply sleep worse.'],
    zh: '很多長者睡得比年輕時淺。多年來，這被視為老化的正常現象。然而越來越多研究顯示，睡不好也可能造成記憶衰退。在一項研究中，120 位 65 到 80 歲的受試者戴著測量睡眠的小型裝置兩週，接著做記憶測驗。深層睡眠時間較長的受試者記得較多單字，即使研究人員已經把年齡和教育程度的影響排除。研究人員認為，深層睡眠幫助大腦把新資訊轉成長期記憶；如果這是真的，治療長者的睡眠問題可能可以保護認知功能。不過作者也指出，這項研究無法證明睡不好「造成」記憶衰退：有早期腦部變化的人可能本來就睡得比較差。',
    qs: [{ id: 'p2-1', sk: 'r.main', pre: '主旨：整篇在講什麼關係', q: 'What is the passage mainly about?', o: ['A possible link between deep sleep and memory in older adults', 'How to measure sleep with a device', 'Why young people sleep more deeply', 'A new drug for memory loss'], why: '第 1 段提出問題（睡眠與記憶），第 2 段是研究，第 3 段是解釋與限制。',

      { id: 'p2-2', sk: 'r.locate', pre: '細節：受試者做了什麼', q: 'What did the participants do in the study?', o: ['They wore a sleep device for two weeks and then took memory tests.', 'They took a sleeping pill every night.', 'They slept in a hospital for two weeks.', 'They were all younger than 65.'], why: '第 2 段：wore a small device… for two weeks. They then took memory tests.',
      st: [['答案在哪一段？', '第 2 段', '第 1 段', '第 3 段', '描述研究怎麼做的那一段。', 'r.locate'], ['受試者戴了什麼、多久？', '測量睡眠的裝置，兩週', '吃藥兩週', '住院', 'wore a small device that measured their sleep for two weeks', 'r.locate'], ['之後做了什麼？', '記憶測驗', '睡眠藥物', '問卷', 'They then took memory tests.', 'r.para']] },
      { id: 'p2-3', sk: 'r.word', pre: '字義：controlled for 的意思', q: 'In paragraph 2, “controlled for age and education” most likely means the researchers ____.', o: ['made sure age and education did not explain the result', 'asked participants about their age', 'chose only highly educated people', 'changed the participants’ age'], why: 'control for 是研究用語：排除某因素的影響。',
      st: [['前面的 even after 暗示什麼？', '即使排除其他可能的解釋，結果仍成立', '結果改變了', '研究失敗了', 'even after…：即使…之後仍然。', 'c.logic'], ['年齡和教育可能怎麼影響記憶？', '年紀大、教育少的人記憶測驗本來就可能較差', '沒有影響', '只影響睡眠', '所以要把它們的影響拿掉。', 'r.infer'], ['所以 controlled for 的意思？', '確保結果不是由年齡、教育造成的', '控制受試者的年齡', '只選高學歷', '研究方法的常見說法。', 'r.word']] },
      { id: 'p2-4', sk: 'r.locate', pre: '細節：研究人員認為深層睡眠的作用', q: 'According to the researchers, deep sleep may ____.', o: ['help move new information into long-term memory', 'cause memory loss', 'make people sleep less', 'replace memory tests'], why: '第 3 段第一句。',
      st: [['用題目關鍵字 deep sleep 找，在哪一段？', '第 3 段第一句', '第 1 段', '第 2 段最後一句', 'The researchers believe that deep sleep…', 'r.locate'], ['那一句說深層睡眠做什麼？', 'helps the brain move new information into long-term memory', 'causes memory loss', 'makes people tired', '找到原句。', 'r.locate'], ['哪個選項是同一句話？', 'help move new information into long-term memory', 'cause memory loss', 'replace tests', '換句話說的程度很低，直接對應。', 'r.para']] },
      { id: 'p2-5', sk: 'r.attitude', pre: '作者態度：研究能不能證明因果', q: 'Which statement would the authors agree with?', o: ['The study shows a link but cannot prove that poor sleep causes memory loss.', 'The study proves that poor sleep causes memory loss.', 'Sleep has nothing to do with memory.', 'Older adults should stop taking memory tests.'], why: '第 3 段最後：cannot prove that poor sleep causes memory loss。',
      st: [['作者的保留意見在哪？', '第 3 段最後的 however 之後', '第 1 段', '第 2 段', 'The authors note, however…', 'r.locate'], ['作者說研究不能證明什麼？', '睡不好「造成」記憶衰退', '兩者有關', '深層睡眠存在', 'cannot prove that poor sleep causes memory loss', 'r.attitude'], ['為什麼不能證明？', '可能是早期腦部變化讓人睡不好（方向相反）', '樣本太大', '沒有測驗', 'people with early brain changes may simply sleep worse', 'r.infer']] }] },

  { type: 'cloze', title: 'How is a clinical trial conducted?', text: [
    'Before a new drug can be sold, it must be tested in clinical trials. In a typical trial, participants are divided {1} two groups at random. One group receives the new drug, {2} the other group receives a placebo, a pill that looks the same but contains no active ingredient.',
    'Neither the participants nor the doctors know who is in which group. This design, {3} is called a double-blind trial, prevents expectations from affecting the results. At the end of the trial, the researchers compare the outcomes of the two groups.',

    zh: '新藥上市前必須經過臨床試驗。典型的試驗把受試者隨機分成兩組：一組服用新藥，另一組服用安慰劑（外觀一樣但不含有效成分的藥丸）。受試者和醫生都不知道誰在哪一組；這種設計稱為雙盲試驗，可以避免預期心理影響結果。試驗結束時，研究人員比較兩組的結果。如果服藥組好很多，這個藥就被認為有效。即使如此，一次試驗很少足夠，結果必須被其他研究證實，藥才會核准。',

  { type: 'read', title: 'Do sugar taxes reduce obesity?', text: [
    'More than 50 countries now tax drinks that contain added sugar. The idea is simple: if sugary drinks cost more, people will buy fewer of them, and obesity rates will eventually fall.',
    'The first part of this idea is well supported. In Mexico, sales of sugary drinks dropped by about 10 percent in the two years after a tax was introduced, and the decline was largest among poorer families. Some companies also reduced the sugar in their drinks to avoid the tax.',
    'The second part is harder to prove. Obesity develops slowly and has many causes, so a change in one type of drink may take years to show an effect. Moreover, people may replace sugary drinks with other high-calorie foods. Most experts therefore see sugar taxes as one useful tool, not a complete solution.'],
    zh: '目前有 50 多個國家對添加糖的飲料課稅。想法很簡單：含糖飲料變貴，人們就會少買，肥胖率最終就會下降。前半部分有充分證據：在墨西哥，開徵稅後兩年內含糖飲料的銷售量下降約一成，貧窮家庭降得最多；有些公司也降低飲料含糖量來避稅。後半部分比較難證明：肥胖發展得很慢、原因很多，單一類飲料的改變可能要好幾年才看得出效果；而且人們可能改吃其他高熱量的食物。因此多數專家認為糖稅是一項有用的工具，但不是完整的解決方案。',
    qs: [{ id: 'p4-1', sk: 'r.main', pre: '主旨：文章對糖稅的整體評價', q: 'What is the main idea of the passage?', o: ['Sugar taxes reduce sugary drink sales, but their effect on obesity is less clear.', 'Sugar taxes have ended obesity in Mexico.', 'Sugar taxes are unfair to poor families.', 'Companies refuse to change their drinks.'], why: '第 2 段：銷量確實下降；第 3 段：對肥胖的效果較難證明。',
      st: [['第 1 段提出的想法有幾個部分？', '兩個：少買飲料、肥胖下降', '一個', '三個', 'people will buy fewer… and obesity rates will fall', 'r.locate'], ['第 2、3 段各自在談哪一部分？', '第 2 段：銷量（有證據）；第 3 段：肥胖（難證明）', '都在談肥胖', '都在談公司', 'The first part… The second part…', 'r.main'], ['涵蓋兩段的選項？', '銷量下降，但對肥胖的效果不明確', '已經消滅肥胖', '對窮人不公平', '只講一半的選項不是主旨。', 'r.para']] },
      { id: 'p4-2', sk: 'r.locate', pre: '細節：墨西哥的結果', q: 'What happened in Mexico after the tax was introduced?', o: ['Sales of sugary drinks fell by about 10 percent.', 'Obesity fell by 10 percent.', 'Sales rose among poorer families.', 'All companies stopped selling sugary drinks.'], why: '第 2 段：sales of sugary drinks dropped by about 10 percent。',
      st: [['用 Mexico 找答案在哪？', '第 2 段', '第 1 段', '第 3 段', '題目的專有名詞是最好的定位線索。', 'r.locate'], ['下降的是什麼？', '含糖飲料的銷量', '肥胖率', '稅率', 'sales of sugary drinks dropped', 'r.locate'], ['為什麼「肥胖下降一成」是陷阱？', '文中下降的是銷量，不是肥胖', '數字不對', '國家不對', '換掉主詞是常見陷阱。', 'r.para']] },

/* ---------- 錯題排程（化學、英文與首頁共用） ----------
   只從練習紀錄推算，不另外存狀態，所以紀錄同步到哪裡，排程就跟到哪裡。
   紀錄每一筆：{ t 時間, c 章, k 題型, h 題目識別碼, ok, n 第幾次作答 }；n === 1 是「一次作答」的開頭。
   規則：每題每天只算第一次作答。
   - 第一次就答錯 → 進入錯題本，隔 1 天到期。
   - 到期後（之後任何一天）第一次就答對 → 再隔 3 天；再答對一次 → 掌握，離開錯題本。
   - 在錯題本中又答錯 → 從頭開始（隔 1 天）。 */
const REVIEW = (() => {
  const DAY = 864e5, GAPS = [1, 3];
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  // 每題每天的第一次作答
  function trials(log) {
    const seen = new Set(), out = [];
    for (const e of log) {
      if (e.n !== 1 || !e.h) continue;
      const key = `${e.c}|${e.k}|${e.h}`, dk = dayKey(e.t);
      if (seen.has(key + '@' + dk)) continue;
      seen.add(key + '@' + dk); out.push({ key, t: e.t, ok: !!e.ok, c: e.c, k: e.k, h: e.h, i: e.i, qt: e.qt });
    }
    return out;
  }
  // 每題目前的狀態：{ key, c, k, h, i, qt, stage, due, wrongs, last }
  function state(log) {
    const m = new Map();
    for (const tr of trials(log)) {
      let s = m.get(tr.key);
      if (!s) { s = { key: tr.key, c: tr.c, k: tr.k, h: tr.h, i: tr.i, qt: tr.qt, open: false, stage: 0, due: 0, wrongs: 0, last: 0 }; m.set(tr.key, s); }
      s.i = tr.i; s.qt = tr.qt || s.qt;
      if (!tr.ok) { s.open = true; s.stage = 0; s.wrongs++; s.due = dayStart(tr.t) + GAPS[0] * DAY; }
      else if (s.open && tr.t >= s.due) {
        s.stage++;
        if (s.stage >= GAPS.length) s.open = false; else s.due = dayStart(tr.t) + GAPS[s.stage] * DAY;
      }
      s.last = tr.t;
    }
    return m;
  }
  // 錯題本：還沒掌握的題目；due 為「今天以前到期」
  function book(log, now = Date.now()) {
    const all = [...state(log).values()].filter(s => s.open);
    return { open: all, due: all.filter(s => s.due <= now).sort((a, b) => a.due - b.due) };
  }
  return { trials, state, book, dayKey, dayStart, DAY };
})();

   紀錄每一筆：{ t, c 第幾週第幾天哪一段（w1d3am）, k 種類, h 題目識別碼, sk 能力, ok, n 第幾次作答, p 選了什麼, qt 題目摘要 }
   k：w 單字、wr 單字回想、s 長句的一步、g 文法題、p 文章題（進錯題本）；x 一步一步來的小步驟；u 標記「不熟」（p 1 標記、-1 取消）。 */
const LOG = store.get('log', []);
const REVIEW_KINDS = new Set(['w', 'wr', 's', 'g', 'p']);
function logAnswer(e) {
  LOG.push({ t: Date.now(), ...e }); if (LOG.length > 20000) LOG.splice(0, LOG.length - 20000);
  store.set('log', LOG); if (typeof CLOUD !== 'undefined' && CLOUD.pushLog) CLOUD.pushLog();
}
const qlog = () => LOG.filter(e => REVIEW_KINDS.has(e.k));
const okSet = () => new Set(LOG.filter(e => e.ok && e.h).map(e => e.h));
const unsure = () => { const m = {}; LOG.forEach(e => { if (e.k === 'u') m[e.h] = e.p === 1 ? e : null; }); return m; };
const DAYN = '一二三四五六日';

const wkKey = w => 'w' + w.n;
function wordQ(w, d, i) {
  const day = w.words[d], x = day[i], others = [1, 3, 6].map(k => day[(i + k) % day.length]);
  return { h: `w:${wkKey(w)}:${x[0]}`, k: 'w', sk: 'v.mean', c: `${wkKey(w)}d${d + 1}am`, en: 1,
    q: `<span class="enw">${esc(x[0])}</span> <span class="pos">${esc(x[1])}</span> 的意思是？`, o: [x[2], ...others.map(y => y[2])],
    why: `${esc(x[0])}：${esc(x[2])}。${x[3] ? `<br><span class="mut">${esc(x[3])}</span>` : ''}`, qt: x[0] };
}
// 晚上的回想：把早上例句裡的單字挖空
function stemRe(word) { const s = word.length > 5 ? word.replace(/(e|y|ate|ize)$/, '') : word; return new RegExp(`\\b${s}\\w*`, 'i'); }
function recallQ(w, d, i) {
  const day = w.words[d], x = day[i], others = [2, 5, 7].map(k => day[(i + k) % day.length]);
  const sent = esc(x[4]).replace(stemRe(x[0]), '<span class="gap">＿＿＿＿</span>');
  return { h: `wr:${wkKey(w)}:${x[0]}`, k: 'wr', sk: 'v.mean', c: `${wkKey(w)}d${d + 1}pm`, en: 1,
    q: `<span class="ens">${sent}</span><br><small class="mut">${esc(x[5])}（選項是原形，句中可能有變化）</small>`, o: [x[0], ...others.map(y => y[0])],
    why: `${esc(x[4])}`, qt: x[0] };
}
const gramQ = (w, d, q) => ({ ...q, h: `g:${wkKey(w)}:${q.id}`, k: 'g', c: `${wkKey(w)}d${d + 1}pm`, en: 1, qt: q.q.replace(/<[^>]+>/g, '').slice(0, 60) });
const passQ = (w, d, q) => ({ ...q, h: `p:${wkKey(w)}:${q.id}`, k: 'p', c: `${wkKey(w)}d${d + 1}pm`, en: 1, qt: `${w.passages[d].title}・${q.q}`.slice(0, 80) });
const sentH = (w, d, j, i) => `s:${wkKey(w)}:${d}:${j}:${i}`;
let QIX = null;
function qindex() {
  if (QIX) return QIX; QIX = {};
  WEEKS.forEach(w => w.words.forEach((day, d) => {
    day.forEach((x, i) => { const a = wordQ(w, d, i), b = recallQ(w, d, i); QIX[a.h] = { q: a, w, d }; QIX[b.h] = { q: b, w, d }; });
    (w.sents[d] || []).forEach((s, j) => s.steps.forEach((st, i) => { QIX[sentH(w, d, j, i)] = { sent: s, w, d, j, i, sk: st[5] }; }));
    if (w.gram[d]) w.gram[d].qs.forEach(q => { const g = gramQ(w, d, q); QIX[g.h] = { q: g, w, d }; });
    if (w.passages[d]) w.passages[d].qs.forEach(q => { const p = passQ(w, d, q); QIX[p.h] = { q: p, w, d }; });
  }));
  return QIX;
}
// 每一段要完成的題目
const amIds = (w, d) => [...w.words[d].map((x, i) => wordQ(w, d, i).h), ...(w.sents[d] || []).flatMap((s, j) => s.steps.map((st, i) => sentH(w, d, j, i)))];
const pmIds = (w, d) => [...w.gram[d].qs.map(q => gramQ(w, d, q).h), ...w.passages[d].qs.map(q => passQ(w, d, q).h), ...w.words[d].map((x, i) => recallQ(w, d, i).h)];
const frac = (ids, ok) => ids.filter(h => ok.has(h)).length / ids.length;

/* ---- 選擇題：答錯可以再選；「一步一步來」把題目拆成小判斷 ---- */
function mcq(q, num) {
  const ord = shuffled(q.o.length, q.h);
  return `<div class="q" data-h="${esc(q.h)}">${num ? `<p class="qnum">${num}</p>` : ''}<p class="qt">${q.q}</p><div class="opts">${ord.map(j => `<button class="opt${q.en ? ' en-o' : ''}" type="button" data-o="${j}">${esc(q.o[j])}</button>`).join('')}</div><div class="why" hidden></div></div>`;
}
function bindMcq(root, list, onDone) {
  list.forEach(q => {
    const qe = root.querySelector(`.q[data-h="${CSS.escape(q.h)}"]`); if (!qe) return;
    let n = 0; const why = $('.why', qe);
    if (q.st && q.st.length) guide(qe, q);
    $$('.opt', qe).forEach(b => { b.onclick = () => {
      const ok = b.dataset.o === '0'; n++;
      logAnswer({ c: q.c, k: q.k, h: q.h, sk: q.sk, ok, n, p: q.o[+b.dataset.o], qt: q.qt });
      b.classList.add(ok ? 'right' : 'wrong'); b.disabled = true; why.hidden = false;
      if (ok) {
        $$('.opt', qe).forEach(x => { x.disabled = true; }); const g = $('.guide', qe); if (g) g.hidden = true;
        why.className = 'why ok'; why.innerHTML = `<b>答對了。</b>${q.why}`; qe.classList.add('done');
        if (onDone) onDone(q);
      } else {
        why.className = 'why no'; why.innerHTML = `這個不對，再選一次。${q.st && q.st.length ? '<button class="btn sm" type="button" data-gopen>一步一步來</button>' : ''}`;
        const go = $('[data-gopen]', why); if (go) go.onclick = () => qe.openGuide();
      }
    }; });
  });
}
function guide(qe, q) {
  const sts = q.st, box = document.createElement('div'); box.className = 'guide';
  box.innerHTML = '<button class="btn sm ghost" type="button" data-g>一步一步來</button><div class="gbody" hidden></div>';
  $('.opts', qe).after(box);
  const body = $('.gbody', box), done = [];
  const draw = k => {
    const st = sts[k], ord = shuffled(3, q.h + k).map(j => j + 1);
    body.innerHTML = `${done.length ? `<ol class="gdone">${done.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}<p class="stepn">第 ${k + 1} 步，共 ${sts.length} 步</p><p class="gq">${esc(st[0])}</p><div class="opts">${ord.map(j => `<button class="gopt opt" type="button" data-j="${j}">${esc(st[j])}</button>`).join('')}</div><div class="gwhy" hidden></div>`;
    let n = 0;
    $$('.gopt', body).forEach(b => { b.onclick = () => {
      const ok = b.dataset.j === '1', w = $('.gwhy', body); n++;
      logAnswer({ c: q.c, k: 'x', h: `x:${q.h}:${k}`, sk: st[5], ok, n, p: st[+b.dataset.j], qt: st[0] });
      b.classList.add(ok ? 'right' : 'wrong'); b.disabled = true; w.hidden = false;
      if (!ok) { w.className = 'gwhy why no'; w.textContent = '這個不對，再想想。'; return; }
      $$('.gopt', body).forEach(x => { x.disabled = true; }); done.push(`${esc(st[0])} <b>${esc(st[1])}</b>`);
      const last = k === sts.length - 1;
      w.className = 'gwhy why ok'; w.innerHTML = `<b>對。</b>${esc(st[4])} <button class="btn sm" type="button" data-n>${last ? '回到原題再選一次 ↑' : '下一步'}</button>`;
      $('[data-n]', w).onclick = () => { if (last) { body.hidden = true; $('[data-g]', box).hidden = false; done.length = 0; qe.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else draw(k + 1); };
    }; });
  };
  qe.openGuide = () => { if (!body.hidden) return; $('[data-g]', box).hidden = true; body.hidden = false; done.length = 0; draw(0); };
  $('[data-g]', box).onclick = qe.openGuide;
}
// 「？還不太懂」：單字、文法、長句、文章都可以標，匯出時列出來
function unsureBtn(key, c, label) {
  const on = !!unsure()[key];
  return `<button class="btn sm unsure${on ? ' on' : ''}" type="button" data-u="${esc(key)}" data-uc="${esc(c)}" data-ul="${esc(label)}" aria-pressed="${on}">${on ? '已標記：不熟' : '？還不太懂'}</button>`;
}
function bindUnsure(root) {
  $$('[data-u]', root).forEach(b => { b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    logAnswer({ c: b.dataset.uc, k: 'u', h: b.dataset.u, p: on ? 1 : -1, qt: b.dataset.ul });
    b.setAttribute('aria-pressed', on); b.classList.toggle('on', on); b.textContent = on ? '已標記：不熟' : '？還不太懂';
  }; });
}

/* ---- 長句拆解：一步一步標出主詞、動詞、修飾 ---- */
function sentHTML(w, d, j, s, key = `${d}:${j}`) {
  return `<div class="card sentc" data-sent="${key}"><div class="sent">${s.chunks.map((c, i) => `<span class="ch" data-i="${i}">${esc(c)}</span> `).join('')}</div>
<p class="legend"><span class="ls">主詞</span><span class="lv">主要動詞</span><span class="lm">修飾（第一遍可以跳過）</span></p><div class="sbody"></div></div>`;
}
function bindSent(root, w, d, j, s, onDone, key = `${d}:${j}`) {
  const card = root.querySelector(`[data-sent="${key}"]`), body = $('.sbody', card), c = `${wkKey(w)}d${d + 1}am`, done = [];
  const mark = m => Object.entries(m || {}).forEach(([i, v]) => { const e = card.querySelector(`.ch[data-i="${i}"]`); if (e) { e.classList.remove('s', 'v', 'm'); e.classList.add(v); } });
  const finish = () => {
    s.steps.forEach(st => mark(st[6]));
    body.innerHTML = `${done.length ? `<ol class="gdone">${done.join('')}</ol>` : ''}<p class="core"><span class="lbl">主幹</span>${esc(s.core)}</p><p class="zh">${esc(s.zh)}</p><div class="row">${unsureBtn(`u:sent:${wkKey(w)}:${d}:${j}`, c, s.core)}</div>`;
    bindUnsure(body); if (onDone) onDone();
  };
  const draw = k => {
    if (k >= s.steps.length) return finish();
    const st = s.steps[k], h = sentH(w, d, j, k), ord = shuffled(3, h).map(x => x + 1); let n = 0;
    body.innerHTML = `${done.length ? `<ol class="gdone">${done.join('')}</ol>` : ''}<p class="stepn">第 ${k + 1} 步，共 ${s.steps.length} 步</p><p class="gq">${esc(st[0])}</p><div class="opts">${ord.map(x => `<button class="opt en-o" type="button" data-j="${x}">${esc(st[x])}</button>`).join('')}</div><div class="why" hidden></div>`;
    $$('.opt', body).forEach(b => { b.onclick = () => {
      const ok = b.dataset.j === '1', why = $('.why', body); n++;
      logAnswer({ c, k: 's', h, sk: st[5], ok, n, p: st[+b.dataset.j], qt: `${s.core}｜${st[0]}` });
      b.classList.add(ok ? 'right' : 'wrong'); b.disabled = true; why.hidden = false;
      if (!ok) { why.className = 'why no'; why.textContent = '這個不對，再想想。'; return; }
      $$('.opt', body).forEach(x => { x.disabled = true; }); mark(st[6]);
      why.className = 'why ok'; why.innerHTML = `<b>對。</b>${esc(st[4])} <button class="btn sm" type="button" data-n>${k === s.steps.length - 1 ? '看主幹與翻譯' : '下一步'}</button>`;
      $('[data-n]', why).onclick = () => { done.push(`<li>${esc(st[0])} <b>${esc(st[1])}</b></li>`); draw(k + 1); };
    }; });
  };
  draw(0);
}

/* ---- 畫面 ---- */
const curWeek = () => WEEKS[Math.min(store.get('week', WEEKS.length - 1), WEEKS.length - 1)];
// 建議的今天：這週第一個還沒做完的段落
function nextSlot(w, ok = okSet()) {

  return null;
}
const bar = f => `<span class="pbar"><i style="width:${Math.round(100 * f)}%"></i></span>`;
function renderHome() {

  const slot = (d, s) => {
    const f = frac(s === 'am' ? amIds(w, d) : pmIds(w, d), ok), cur = nx && nx.d === d && nx.s === s;

    return `<a class="slot${f >= 1 ? ' fin' : ''}${cur ? ' cur' : ''}" href="#d${d + 1}${s}"><span class="sl-h">${s === 'am' ? '早上' : '晚上'}<small>約 30 分鐘</small></span><span class="sl-w">${what}</span>${bar(f)}<span class="sl-st">${f >= 1 ? '✓ 完成' : f > 0 ? `${Math.round(100 * f)}%` : cur ? '從這裡開始 →' : ''}</span></a>`;
  };
  $('#main').innerHTML = `<p class="eyebrow">第 ${w.n} 週 · 每天約 60 分鐘</p><h1>${esc(w.theme)}</h1>
<p class="lede">每天分成早上與晚上兩段。早上先複習到期的錯題，再學 10 個新單字和 2 個長句；晚上學一個文法重點，做一篇克漏字或閱讀，最後回想早上的單字。答錯的題目會自動排進之後的複習。</p>
${due ? `<p class="duebar"><a href="#review">錯題本有 <b>${due}</b> 題今天到期 →</a></p>` : ''}
<ol class="days">${w.words.map((x, d) => `<li class="day${nx && nx.d === d ? ' now' : ''}"><h2>第 ${d + 1} 天<small>${esc(w.gram[d].title.split('：')[0])}</small></h2><div class="slots">${slot(d, 'am')}${slot(d, 'pm')}</div></li>`).join('')}</ol>
<div class="row endrow"><a class="btn pri" href="#report">本週報告與匯出</a><a class="btn" href="#review">錯題本</a></div>
${WEEKS.length > 1 ? `<p class="small">其他週：${WEEKS.map((x, i) => `<button class="btn sm" type="button" data-wk="${i}">第 ${x.n} 週</button>`).join(' ')}</p>` : ''}`;
  $$('[data-wk]').forEach(b => { b.onclick = () => { store.set('week', +b.dataset.wk); renderHome(); }; });
}
function dayHead(w, d, s) {

  return `<p class="eyebrow">第 ${w.n} 週・第 ${d + 1} 天・${s === 'am' ? '早上' : '晚上'}</p>
<nav class="pn">${prev ? `<a href="${prev}">‹ 上一段</a>` : ''}<a href="#">本週</a><a href="${next}">${s === 'pm' && d === 6 ? '本週報告' : '下一段'} ›</a></nav>`;
}
function progressLine(ids) {
  const el = $('#segProg'); if (!el) return;
  const f = frac(ids, okSet()); el.innerHTML = `${bar(f)}<span>${f >= 1 ? '✓ 這一段完成了' : `完成 ${Math.round(100 * f)}%`}</span>`;

<section class="part"><h2>1. 錯題複習<small>約 5–10 分鐘</small></h2>${rv.length ? `<p class="note">之前答錯、今天到期的題目。第一次就答對才算過關，答錯會再排一次。</p><div id="rv">${reviewHTML(rv)}</div>` : '<p class="note">今天沒有到期的錯題。</p>'}</section>
<section class="part"><h2>2. 新單字<small>約 10 分鐘</small></h2><p class="note">先看字根拆解和例句，大聲唸一次例句。不熟的按「？還不太懂」，匯出時會列給下一週。</p>
<div class="words">${words.map(x => `<article class="wcard"><p class="wh"><span class="enw">${esc(x[0])}</span><span class="pos">${esc(x[1])}</span><span class="wz">${esc(x[2])}</span></p>${x[3] ? `<p class="root">${esc(x[3])}</p>` : ''}<p class="ens">${esc(x[4])}</p><p class="zh">${esc(x[5])}</p>${unsureBtn(`u:word:${wkKey(w)}:${x[0]}`, c, `${x[0]}（${x[2]}）`)}</article>`).join('')}</div>
<h3>小測驗：選出意思</h3><div id="wq">${wq.map((q, i) => mcq(q, `${i + 1} / ${wq.length}`)).join('')}</div></section>
<section class="part"><h2>3. 長句拆解<small>約 10 分鐘</small></h2><p class="note">先找主要動詞，再找主詞，其他部分都是修飾。每一步答對，句子上會標出來。</p>${w.sents[d].map((s, j) => sentHTML(w, d, j, s)).join('')}</section>
<div class="row endrow"><a class="btn pri" href="#d${d + 1}pm">晚上的部分 ›</a></div>`;
  const ids = amIds(w, d), upd = () => progressLine(ids);
  bindReview(rv); bindUnsure($('#main')); bindMcq($('#wq'), wq, upd); w.sents[d].forEach((s, j) => bindSent($('#main'), w, d, j, s, upd)); upd();
}
function passageHTML(w, d, P) {
  const blank = t => esc(t).replace(/\{(\d)\}/g, (m, n) => `<span class="blank" data-b="${n}">(${n}) ＿＿＿＿</span>`);
  const pq = P.qs.map(q => passQ(w, d, q));
  const text = `<div class="passage card"><p class="ptitle">${esc(P.title)}</p>${P.text.map(t => `<p class="ens">${blank(t)}</p>`).join('')}<details><summary>中文翻譯（做完再看）</summary><p class="zh">${esc(P.zh)}</p></details></div>`;
  if (P.type === 'cloze') return `<p class="note">克漏字：每格先看前後文是什麼關係（同方向、相反、因果），再看空格要什麼詞性。</p>${text}<div id="pq">${pq.map((q, i) => mcq(q, `第 ${i + 1} 格`)).join('')}</div>`;
  return `<p class="note">閱讀：先看題目知道要找什麼，再讀文章，最後回答。</p>
<div class="card pre"><p class="lbl">先看題目</p><ol>${P.qs.map(q => `<li><span class="ens">${esc(q.q)}</span><br><small class="mut">${esc(q.pre || '')}</small></li>`).join('')}</ol></div>${text}<div id="pq">${pq.map((q, i) => mcq(q, `第 ${i + 1} 題`)).join('')}</div>`;
}

  const G = w.gram[d], P = w.passages[d], c = `${wkKey(w)}d${d + 1}pm`;
  const gq = G.qs.map(q => gramQ(w, d, q)), pq = P.qs.map(q => passQ(w, d, q)), rq = w.words[d].map((x, i) => recallQ(w, d, i));

/* ---- 錯題複習 ---- */
function reviewItems(max = 50) {
  const ix = qindex(), seen = new Set(), out = [];
  for (const s of REVIEW.book(qlog()).due) {
    const f = ix[s.h]; if (!f) continue;
    if (f.sent) { const key = `sent:${f.w.n}:${f.d}:${f.j}`; if (seen.has(key)) continue; seen.add(key); out.push({ sent: f, s }); }
    else out.push({ q: f.q, f, s });
    if (out.length >= max) break;
  }
  return out;
}
function reviewHTML(items) {
  return items.map((it, n) => {

/* ---- 週報：依能力分類列出本週練了什麼、哪裡弱 ---- */
function weekStats(w) {
  const pre = wkKey(w) + 'd', tr = REVIEW.trials(qlog()).filter(x => x.c && x.c.startsWith(pre));
  const sk = {}; Object.keys(SKILLS).forEach(k => { sk[k] = { n: 0, ok: 0 }; });
  const skOf = {}; LOG.forEach(e => { if (e.h && e.sk) skOf[e.h] = e.sk; });
  tr.forEach(x => { const k = skOf[x.h]; if (!sk[k]) return; sk[k].n++; if (x.ok) sk[k].ok++; });
  return { tr, sk };
}
const skillState = s => (!s.n ? 'none' : s.n < 3 ? 'few' : s.ok / s.n < 0.6 ? 'weak' : s.ok / s.n < 0.8 ? 'mid' : 'good');

/* ---- 匯出：本週紀錄＋給下一週 AI 的指示 ---- */
function exportMD(w) {
  const { tr, sk } = weekStats(w), ix = qindex(), u = unsure(), today = REVIEW.dayKey(Date.now());
  const st = REVIEW.state(qlog());
  const wrong = {}; tr.filter(x => !x.ok).forEach(x => { wrong[x.h] = (wrong[x.h] || 0) + 1; });
  const picks = {}; LOG.forEach(e => { if (e.h && !e.ok && e.p != null && REVIEW_KINDS.has(e.k)) (picks[e.h] = picks[e.h] || new Set()).add(e.p); });
  const strip = s => String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  const line = h => {
    const f = ix[h], s = st.get([...st.keys()].find(k => k.endsWith('|' + h)) || '') || {}, mark = s.open ? '未掌握' : '已掌握';
    const pk = picks[h] ? `；我選過：${[...picks[h]].join('／')}` : '';
    if (!f) return `- ${h}（${mark}）`;
    if (f.sent) { const stp = f.sent.steps[f.i]; return `- [長句・${SKILLS[stp[5]]}] ${f.sent.chunks.join(' ')}\n  - 步驟：${stp[0]} → 正解：${stp[1]}${pk}（${mark}）`; }
    return `- [${SKILLS[f.q.sk] || f.q.sk}] ${strip(f.q.q)}\n  - 正解：${f.q.o[0]}${pk}（${mark}，錯 ${wrong[h]} 次）`;
  };
  const prevOpen = REVIEW.book(qlog()).open.filter(s => !(s.c || '').startsWith(wkKey(w) + 'd'));
  const wrongWords = Object.keys(wrong).filter(h => /^wr?:/.test(h)).map(h => h.split(':')[2]);
  const unsureL = Object.values(u).filter(Boolean);
  const steps = {}; LOG.filter(e => e.k === 'x' && e.c && e.c.startsWith(wkKey(w) + 'd') && !e.ok && e.n === 1).forEach(e => { steps[e.sk] = (steps[e.sk] || 0) + 1; });
  const skLines = Object.keys(SKILLS).map(k => `| ${k} | ${SKILLS[k]} | ${sk[k].n} | ${sk[k].ok} | ${sk[k].n ? Math.round(100 * sk[k].ok / sk[k].n) + '%' : '—'} | ${SK_ST[skillState(sk[k])]} |`);
  const allWords = WEEKS.flatMap(x => x.words.flat().map(y => y[0]));
  return `# 後中英文 第 ${w.n} 週學習紀錄（匯出日 ${today}）

## 給 AI 的指示：請產生第 ${w.n + 1} 週的訓練內容

我在準備台灣學士後中醫入學考（目標：中國醫藥大學，116 學年度，2027 年 4 月筆試）的英文。英文基礎差，目標是 2027 年 2 月底前達到考試程度。考試題型：字彙、克漏字、閱讀（文章約一半是醫學與生命科學）。我不背罕見字，重點是克漏字、閱讀、文法和學術／醫學常用字。

請依照下面「本週紀錄」的弱項，產生第 ${w.n + 1} 週的兩個資料檔 \`w${String(w.n + 1).padStart(2, '0')}a.js\`、\`w${String(w.n + 1).padStart(2, '0')}b.js\`，格式必須和下面的規格完全一樣（網站會直接載入，格式錯了整頁會壞）。

### 內容要求
1. 每天兩段：早上（10 個新單字＋2 個長句拆解）、晚上（1 個文法重點＋3 題、1 篇文章＋5 題、單字回想自動產生）。共 7 天。
2. **新單字 70 個**：學術與醫學常用字（詞頻約 3000–12000 名），不可與「已學過的單字」重複。每天一個主題。
3. **弱項優先**：「需要加強」的能力，下週至少安排兩天的文法重點或長句練它；「本週沒練到」的能力至少練一次；「穩定」的能力仍要在文章中混著出現。
4. **錯題回收**：「答錯的單字」與「不熟的單字」要在下週的長句或文章裡再出現（當成已學過的字使用，不是新字）。
5. **難度**：比本週稍難一點。文章 180–250 字，句子變長、修飾更多；克漏字與閱讀交替（第 1、3、5、7 天克漏字，第 2、4、6 天閱讀）。題目要有一個明確正解，三個誘答要合理但確定錯。
6. 每一題附 2–3 步的「一步一步來」：每一步是一個小判斷，引導學生自己推出答案，不要直接給答案。
7. 中文用台灣繁體，說明用語要白話；每個文法名詞第一次出現要解釋。

### 資料格式
\`\`\`js

  [['英文', '詞性', '中文', '字根拆解（沒有就空字串）', '例句（必須包含這個字或它的變化形）', '例句中文'], …],
  …
];
WEEKS[${w.n}].sents = [   // 7 天 × 2 句
  [{ chunks: ['片段', …], core: '主幹句', zh: '整句中文',
     steps: [['問題', '正解', '誤1', '誤2', '說明', '能力代碼', { 片段序號: 's' | 'v' | 'm' }], …] }, …],
  …
];
// wNNb.js
WEEKS[${w.n}].gram = [    // 7 天，各 1 個文法重點
  { id: '能力代碼', title: '標題：一句話說重點', body: \`<p>說明 HTML，可用 <span class="ch s|v|m"> 標主詞／動詞／修飾</span></p>\`,
    qs: [{ id: 'g1-1', sk: '能力代碼', q: '題目', o: ['正解', '誤1', '誤2', '誤3'], why: '解析', st: [['問題', '正解', '誤1', '誤2', '說明', '能力代碼'], …] }, …] },
  …
];
WEEKS[${w.n}].passages = [  // 7 天，各 1 篇；克漏字的空格寫 {1}…{5}，題目 q 寫「第 (1) 格」
  { type: 'cloze' | 'read', title: '標題', text: ['段落', …], zh: '全文中文',
    qs: [{ id: 'p1-1', sk: '能力代碼', pre: '（閱讀題才要）題型：要找什麼', q: '題目', o: ['正解', …3 個誤答], why: '解析', st: [[…同上…]] }, …] },

完成：${w.words.map((x, d) => `第${d + 1}天 早${Math.round(100 * frac(amIds(w, d), okSet()))}% 晚${Math.round(100 * frac(pmIds(w, d), okSet()))}%`).join('、')}
作答：${tr.length} 題（每題每天只算第一次），第一次就答對 ${tr.length ? Math.round(100 * tr.filter(x => x.ok).length / tr.length) : 0}%

    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>
<p>${T('用 Google 帳號登入後，你完成的章節會存到雲端。之後在手機或其他電腦登入同一個帳號，進度會自動接上。', 'Sign in with Google and the chapters you finish are saved to the cloud. Sign in with the same account on your phone or another computer and your progress follows you.')}</p>
<p class="cp-st">${T(`目前：進度只存在這台裝置（已完成 ${n} / ${tot} 章）`, `Now: progress is saved on this device only (${n} / ${tot} chapters done)`)}</p>
<button class="btn pri cp-go" type="button" id="cpIn">${G}<span>${T('用 Google 登入', 'Sign in with Google')}</span></button>
<p class="cp-s">${T('不登入也能使用全部內容。這裡只儲存「完成了哪些章節」與練習紀錄，不會讀取你的其他 Google 資料。', 'Everything works without signing in. Only the list of finished chapters is stored, nothing else from your Google account.')}</p>${e}`;
    return `<p class="cp-t">${user.photoURL ? `<img class="cp-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(user.displayName || T('已登入', 'Signed in'))}<small>${esc(user.email || '')}</small></span></p>
<p class="cp-st ok">${busy ? T('同步中…', 'Syncing…') : `✓ ${T(`已同步 ${n} / ${tot} 章`, `${n} / ${tot} chapters synced`)}${last ? ` · ${time(last)}` : ''}`}</p>
<p>${T('在其他裝置用同一個帳號登入，就會看到相同的進度；在任何一台標記完成，其他裝置也會跟著更新。', 'Sign in with the same account on another device to see the same progress. Chapters you finish anywhere show up everywhere.')}</p>
<button class="btn" type="button" id="cpOut">${T('登出', 'Sign out')}</button>
<p class="cp-s" style="margin-top:8px !important">${T('登出後，這台裝置上的進度仍會保留。', 'Signing out keeps your progress on this device.')}</p>${e}`;
  }
  function render() {
    const b = document.getElementById('cloudBtn'), p = document.getElementById('cloudPanel');
    if (b) {
      b.innerHTML = user ? `${user.photoURL ? `<img class="cb-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '<span class="cb-dot"></span>'}<span>${busy ? T('同步中', 'Syncing') : T('已同步', 'Synced')}</span>` : `<span aria-hidden="true">☁</span><span>${T('同步進度', 'Sync progress')}</span>`;
      b.title = user ? T('進度已同步到雲端，點一下看詳情', 'Progress is synced; click for details') : T('登入後可在不同裝置同步學習進度', 'Sign in to sync progress across devices');
    }
    if (p && !p.hidden) {
      p.innerHTML = panelHTML();
      const i = document.getElementById('cpIn'), o = document.getElementById('cpOut');
      if (i) i.onclick = signIn;
      if (o) o.onclick = () => auth.signOut();
    }
    const h = document.getElementById('syncHint'); if (h) h.outerHTML = hint();
  }
  function signIn() {
    err = ''; if (!ready) return;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { err = T('登入失敗：', 'Sign-in failed: ') + e.code; toggle(true); }
    });
  }
  function toggle(show) {
    const p = document.getElementById('cloudPanel'), b = document.getElementById('cloudBtn'); if (!p) return;
    p.hidden = show === undefined ? !p.hidden : !show; b.setAttribute('aria-expanded', String(!p.hidden)); render();
  }
  function push() {
    if (!user) return;
    clearTimeout(timer); busy = true; render();
    timer = setTimeout(() => Promise.all(COURSE.tracks.map(t => ref(t.doc).set({ done: t.get(), lang: lang(), updated: Date.now() })))
      .then(() => { busy = false; err = ''; last = Date.now(); render(); })
      .catch(e => { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }), 800);
  }
  // 練習紀錄：只增不減。上傳最近 3000 筆（Firestore 單一文件上限 1 MB）；下載時與本機取聯集
  const lkey = e => `${e.t}|${e.c}|${e.h || e.k + e.i}|${e.p}`;
  let ltimer = 0;
  const LOGS = () => [].concat(COURSE.logs || []);
  function pushLog() {
    if (!user || !LOGS().length) return;
    clearTimeout(ltimer);
    ltimer = setTimeout(() => LOGS().forEach(L => ref(L.doc).set({ log: L.get().slice(-3000), updated: Date.now() }).catch(e => console.warn('log sync', e.code))), 2000);
  }
  async function pullLog() {
    let added = 0;
    for (const L of LOGS()) {
      try {
        const snap = await ref(L.doc).get(), remote = (snap.exists && snap.data().log) || [], local = L.get();
        const seen = new Set(local.map(lkey)), add = remote.filter(e => !seen.has(lkey(e)));
        if (add.length) { L.set(local.concat(add).sort((a, b) => a.t - b.t)); added += add.length; }
        const rs = new Set(remote.map(lkey));
        if (local.some(e => !rs.has(lkey(e)))) pushLog();
      } catch (e) { console.warn('log sync', e.code); }
    }
    return added;
  }
  async function pull() {
    try {
      busy = true; render();
      let added = 0, ahead = false;
      for (const t of COURSE.tracks) {
        const snap = await ref(t.doc).get(), remote = (snap.exists && snap.data().done) || {}, local = { ...t.get() };
        const add = Object.keys(remote).filter(k => !local[k]);
        add.forEach(k => { local[k] = 1; });
        if (add.length) { t.set(local); added += add.length; }
        if (Object.keys(local).some(k => !remote[k])) ahead = true;
      }
      if (await pullLog()) added++;
      if (added) COURSE.refresh();
      busy = false; last = Date.now(); err = '';
      if (ahead) push(); else render();
    } catch (e) { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }
  }
  // 首頁提示：有進度、還沒登入、沒按過「不用了」時才出現
  function hint() {
    if (!on() || user || !ready || !nDone() || store.get('syncHintOff', 0)) return '<div id="syncHint" hidden></div>';
    return `<div id="syncHint" class="sync-hint" data-notr><span>☁ ${T(`你已完成 ${nDone()} 章，進度目前只存在這台裝置。登入 Google 帳號，換手機或電腦也能接著學。`, `You've finished ${nDone()} chapters, saved on this device only. Sign in with Google to continue on your phone or another computer.`)}</span><button class="btn sm pri" type="button" data-sync="in">${T('登入同步', 'Sign in')}</button><button class="btn sm" type="button" data-sync="off">${T('不用了', 'No thanks')}</button></div>`;
  }
  async function start() {
    if (!on()) return;
    const top = document.querySelector('.top-in');
    if (!top) return;
    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, pushLog, hint, render };
})();


/* ---------- 後中英文：啟動、雲端同步、PWA ---------- */
boot();
store.set('weeks', WEEKS.length);  // 給學習階梯首頁顯示進度
const COURSE = {
  tracks: [],
  count: () => WEEKS.reduce((s, w) => s + w.words.filter((x, d) => frac(amIds(w, d), okSet()) >= 1 && frac(pmIds(w, d), okSet()) >= 1).length, 0),
  total: () => WEEKS.length * 7,
  refresh: route,
  logs: { doc: 'engLog', get: () => LOG, set: a => { LOG.length = 0; LOG.push(...a); store.set('log', LOG); } },
};
if (document.querySelector('meta[name="app-site"]')) {
  document.querySelector('.brand').insertAdjacentHTML('beforebegin', '<a class="home-link" href="../">‹ 學習階梯</a>');
  if (typeof CLOUD !== 'undefined') CLOUD.start();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
}

</script>
