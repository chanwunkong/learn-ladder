<style>

:root {

  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }

  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;

:root { --accent: #2E6B3A; --soft: #E3F1E4; --verb: #C98A00; --verb-soft: #FFF1C9; --subj: #0E7C7B; --subj-soft: #DDF2F1; --mod: #8A94A3;
  --en: "Source Serif 4", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #8FD19E; --accent-ink: #0F2A15; --soft: #1E3324; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; } }
:root[data-theme="dark"] { --accent: #8FD19E; --accent-ink: #0F2A15; --soft: #1E3324; --verb: #F2C14E; --verb-soft: #3A2F12; --subj: #5FD0CC; --subj-soft: #133331; --mod: #7D8794; }
body { margin: 0; }
.top-in .wk { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 13.5px; line-height: 1.35; cursor: pointer; transition: border-color .15s, opacity .15s, box-shadow .15s; }
.tn:hover, .tn:focus-visible { border-color: var(--accent); outline: none; }

<script>
/* ---------- 後中生物：介面小工具 ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('bio-ladder:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bio-ladder:' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時忽略 */ } },
};
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(n, seed) {
  let x = hash(seed) || 1; const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- 後中生物：章節、先修關係與考試比重 ----------
   比重來自 analysis/bio（中國醫、義守、慈濟 106–115 學年度生物試題 30 份、1500 題逐題分類）。

/* ---------- 錯題排程（化學、英文與首頁共用） ----------
   只從練習紀錄推算，不另外存狀態，所以紀錄同步到哪裡，排程就跟到哪裡。
   紀錄每一筆：{ t 時間, c 章, k 題型, h 題目識別碼, ok, n 第幾次作答 }；n === 1 是「一次作答」的開頭。
   規則（2026-11-02 使用者要求加長）：每題每天只算第一次作答。
   - 第一次就答錯 → 進入錯題本，隔 1 天到期（第 1 格）。
   - 到期後（之後任何一天）第一次就答對 → 進到下一格，依序再隔 3、7、14、30 天；五格都過才算掌握，離開錯題本。
   - 在錯題本中又答錯 → 從第 1 格重新開始（隔 1 天）。
   - 考前總複習：FINAL 那天起，所有曾經答錯、已經掌握的題目再到期一次；答對就完成，答錯就重新進錯題本。
   防止「猜對」（2026-11-02 使用者要求，兩個方法一起用）：
   - 追問：第一次就答對時，接著追問這題的一個推理步驟（k: 'fu'，fk 為原題型）。追問第一次就答錯 → 這次作答當成答錯（猜對）。
   - 確認題：第一次就答對的新題目，CHECK 天後再出一次（chk 1），答對後再隔 CHECK2 天做長期確認（chk 2）；兩次都答對才算會，任何一次答錯就進五格複習。
     （2026-11-09 使用者要求加長期確認：3 天還在短期記憶，答對後可能一個月就忘了）
   作廢（2026-11-07 使用者要求）：「重新練習」選「之前的不算」時記一筆 k:'reset'、v 為那一段的題目識別碼；那些題目在這之前的作答全部不算（紀錄本身保留）。 */
const REVIEW = (() => {
  const DAY = 864e5, GAPS = [1, 3, 7, 14, 30], CHECK = 3, CHECK2 = 30, FINAL = new Date(2027, 2, 1).getTime();   // 2027-03-01
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  // 拿掉被「之前的不算」作廢的作答
  function live(log) {
    const rs = log.filter(e => e.k === 'reset' && e.v);
    if (!rs.length) return log;
    const cut = new Map(); rs.forEach(r => r.v.forEach(h => cut.set(h, Math.max(cut.get(h) || 0, r.t))));
    return log.filter(e => !(e.h && e.k !== 'reset' && e.t < (cut.get(e.h) || 0)));
  }
  // 每題每天的第一次作答
  function trials(log) {
    log = live(log);
    const seen = new Set(), out = [], guess = new Set();
    for (const e of log) if (e.k === 'fu' && e.n === 1 && !e.ok) guess.add(`${e.c}|${e.fk}|${e.h}@${dayKey(e.t)}`);   // 追問答錯 → 那天的作答算猜對
    for (const e of log) {
      if (e.n !== 1 || !e.h || e.k === 'fu') continue;
      const key = `${e.c}|${e.k}|${e.h}`, dk = dayKey(e.t);
      if (seen.has(key + '@' + dk)) continue;
      const g = !!e.ok && guess.has(key + '@' + dk);
      seen.add(key + '@' + dk); out.push({ key, t: e.t, ok: !!e.ok && !g, guess: g, c: e.c, k: e.k, h: e.h, i: e.i, qt: e.qt });
    }
    return out;
  }
  // 每題目前的狀態：{ key, c, k, h, i, qt, open, stage（0 起算的格數）, due, wrongs, last, first（第一次作答是否答對） }
  function state(log) {
    const m = new Map();
    for (const tr of trials(log)) {
      let s = m.get(tr.key);
      const fresh = !s;
      if (!s) { s = { key: tr.key, c: tr.c, k: tr.k, h: tr.h, i: tr.i, qt: tr.qt, open: false, chk: false, stage: 0, due: 0, wrongs: 0, guesses: 0, last: 0, first: tr.ok }; m.set(tr.key, s); }
      s.i = tr.i; s.qt = tr.qt || s.qt; if (tr.guess) s.guesses++;
      if (!tr.ok) { s.open = true; s.chk = false; s.stage = 0; s.wrongs++; s.due = dayStart(tr.t) + GAPS[0] * DAY; }
      else if (fresh) { s.open = true; s.chk = 1; s.due = dayStart(tr.t) + CHECK * DAY; }   // 新題目第一次就答對 → 3 天後確認
      else if (s.open && s.chk === 1 && tr.t >= s.due) { s.chk = 2; s.due = dayStart(tr.t) + CHECK2 * DAY; }   // 確認答對 → 30 天後長期確認
      else if (s.open && s.chk === 2 && tr.t >= s.due) { s.open = false; s.chk = false; }
      else if (s.open && tr.t >= s.due) {
        s.stage++;
        if (s.stage >= GAPS.length) s.open = false; else s.due = dayStart(tr.t) + GAPS[s.stage] * DAY;
      }
      s.last = tr.t;
    }
    return m;
  }
  // 錯題本：還沒掌握的題目；due 為「今天以前到期」，加上考前總複習（final: true）
  function book(log, now = Date.now()) {
    const st = [...state(log).values()], all = st.filter(s => s.open && !s.chk), checks = st.filter(s => s.open && s.chk);
    const fin = now >= FINAL ? st.filter(s => !s.open && s.wrongs > 0 && s.last < FINAL).map(s => ({ ...s, final: true, due: FINAL })) : [];
    return { open: all, checks, due: all.concat(checks).filter(s => s.due <= now).concat(fin).sort((a, b) => a.due - b.due) };
  }
  // 答對之後的說明：下一次什麼時候回來
  // 選對之後的開頭：第一次就選對才說「答對了」；前面選錯過就照實說（2026-11-07：選錯三次後仍顯示「答對了」很混淆）
  const okHead = tries => (tries > 1 ? `<b>選對了</b>，但前面選錯 ${tries - 1} 次，這次不算答對。` : '<b>答對了。</b>');
  // guess：第一次就選對、但追問理由答錯
  function after(s, firstTry, guess = false) {
    if (!firstTry) return `${guess ? '理由沒選對，算猜對' : '今天第一次沒選對'}，從第 1 格重新開始，明天再考一次。`;
    if (s.final) return '考前總複習完成。';
    if (s.chk === 1) return `確認答對，${CHECK2} 天後還會再確認一次（長期記憶）。`;
    if (s.chk) return '長期確認完成：這題真的會了。';
    if (s.stage + 1 >= GAPS.length) return `五格都過了，這題已經掌握，離開錯題本（2027 年 3 月起的考前總複習還會再出現一次）。`;
    return `${GAPS[s.stage + 1]} 天後再考一次（進到第 ${s.stage + 2} / ${GAPS.length} 格）。`;
  }
  // 「重新練習」的確認：之前的作答照算（隔很久重新複習），或不算（測試、亂按、跳過）
  const resetAsk = what => `<span class="small">讓${what}全部恢復成沒做過的樣子。之前的作答要算嗎？</span><button class="btn sm pri" type="button" data-y>照算（重新複習）</button><button class="btn sm" type="button" data-v>之前的不算（測試／亂按）</button><button class="btn sm" type="button" data-n>取消</button><span class="small">「之前的不算」：${what}的題目在這之前的作答，錯題本和週報都不算。</span>`;
  const label = s => (s.final ? '考前總複習' : s.chk === 2 ? `長期確認（${CHECK2} 天後）` : s.chk ? '確認題（之前第一次就答對）' : `第 ${s.stage + 1} / ${GAPS.length} 格`);
  // 依到期日分組（dayCards 用） [{ key, label, list }]，days 天以後併成一組（2026-11-08 使用者要求：每天到期的分開列）
  function byDay(list, due = x => x.due, now = Date.now(), days = 14) {
    const lim = dayStart(now) + (days + 1) * DAY, m = new Map();
    list.forEach(x => { const k = due(x) >= lim ? '~' : dayKey(due(x)); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`; };
    return [...m.keys()].sort().map(k => {
      const t = k === '~' ? lim : due(m.get(k)[0]);
      return { key: k, label: k === '~' ? `${md(lim)} 及以後` : `${dayKey(t) === dayKey(dayStart(now) + DAY) ? '明天 ' : ''}${md(t)}`, list: m.get(k) };
    });
  }
  // 錯題本頁上方的日期格子：今天（含之前沒做完的，late 是幾題）一定有；之後 days − 1 天有題目的各一格，更晚的併成「之後」（2026-11-09 使用者要求）
  function dayCards(list, due = x => x.due, now = Date.now(), days = 5) {
    const today = list.filter(x => due(x) <= now);
    return [{ key: 'today', label: '今天', list: today, late: today.filter(x => due(x) < dayStart(now)).length }]
      .concat(byDay(list.filter(x => due(x) > now), due, now, days - 1).map(g => (g.key === '~' ? { ...g, label: '之後' } : g)));
  }
  const cardsHTML = (cs, sel, n = g => g.list.length) => cs.map(g => `<button type="button" class="dcard" data-k="${g.key}" aria-pressed="${g.key === sel}"><b>${g.label}</b><span>${n(g)} 題</span>${g.late ? `<small>其中 ${g.late} 題是之前沒做完的</small>` : ''}</button>`).join('');
  // 今天的作答分成「新題目」（今天以前沒做過）與「複習」（以前做過的題目：錯題、確認題、重做），首頁「今天」分開計算（2026-11-10 使用者要求）
  function todaySplit(log, now = Date.now()) {
    const t0 = dayStart(now), tr = trials(log), seen = new Set(tr.filter(x => x.t < t0).map(x => x.key)), td = tr.filter(x => x.t >= t0 && x.t < t0 + DAY);
    return { fresh: td.filter(x => !seen.has(x.key)), review: td.filter(x => seen.has(x.key)) };
  }
  // 題數：英文長句的每一步各算一筆紀錄，但頁面上一個長句是一張卡，所以同一句的步驟只算 1 題（h 為 s:w週:天:句:步；2026-11-10 格子 27 題、頁面 24 題對不上）
  const units = list => new Set(list.map(s => String(s.h).replace(/^(s:w\d+:\d+:\d+):\d+$/, '$1'))).size;
  return { units, todaySplit, live, resetAsk, trials, state, book, after, okHead, label, byDay, dayCards, cardsHTML, dayKey, dayStart, DAY, GAPS, CHECK, CHECK2, FINAL };
})();

/* ---------- 後中生物：先測再學（2026-11-11 使用者決定） ----------
   1. 程度測驗：每章 6 題，依「部」分卷；每題四個選項外加「不確定」（算答錯，避免猜對被當成會）。
   2. 每章依第一次作答分三級：5–6 題對＝已掌握、3–4＝要補洞、0–2＝弱項，標在章節地圖上；弱項依中國醫比重排優先順序。
   3. 答錯或選不確定的題目進共用的錯題排程（src/shared/review.js）；答對的不排確認題（測驗題太多，只追蹤錯的）。
   紀錄每一筆：{ t, c 章, k:'dx', h 'dx:題目 id', ok, n, p 選了什麼, qt 題目摘要 } */
const LOG = store.get('log', []);
function logAnswer(e) {
  LOG.push({ t: Date.now(), ...e }); if (LOG.length > 20000) LOG.splice(0, LOG.length - 20000);
  store.set('log', LOG); if (typeof CLOUD !== 'undefined' && CLOUD.pushLog) CLOUD.pushLog();
}
const plain = h => String(h).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

const UNSURE = '不確定';

const qlog = () => { const bad = new Set(LOG.filter(e => e.k === 'dx' && !e.ok).map(e => e.h)); return REVIEW.live(LOG).filter(e => e.k === 'dx' && bad.has(e.h)); };
const firstAns = () => { const m = new Map(); LOG.forEach(e => { if (e.k === 'dx' && e.h && !m.has(e.h)) m.set(e.h, e); }); return m; };

/* ---- 章節名稱與狀態 ---- */
const ITEMS = UNITS.flatMap(p => p.items.map(([u, t], i) => ({ u, t, p, num: `${p.s}${i + 1}` })));

function status(u, first = firstAns()) {
  const qs = chQs(u); if (!qs.length) return null;
  const ans = qs.filter(q => first.has(qh(q))), ok = ans.filter(q => first.get(qh(q)).ok).length;
  if (ans.length < qs.length) return { n: ans.length, of: qs.length, ok };
  const r = ok / qs.length;
  return { n: ans.length, of: qs.length, ok, lv: r >= 5 / 6 ? 'good' : r >= .5 ? 'mid' : 'weak' };
}

/* ---- 選擇題：四個選項打亂，「不確定」固定在最後；只作答一次，答完列出四個選項的說明 ---- */
const exHTML = q => `<ul class="exl">${q.o.map((o, j) => `<li class="${j ? 'no' : 'ok'}"><b>${j ? '✗' : '✓'} ${esc(o)}</b><br>${esc(q.ex[j])}</li>`).join('')}</ul>`;

  const ord = shuffled(q.o.length, q.id + Math.random());   // 每次打開都重新打亂，複習時不能靠記位置
  return `<div class="q" data-h="${esc(qh(q))}">${num ? `<p class="qnum">${num}</p>` : ''}<p class="qt">${esc(q.q)}</p><div class="opts">${ord.map(j => `<button class="opt" type="button" data-o="${j}">${esc(q.o[j])}</button>`).join('')}<button class="opt unsure" type="button" data-o="u">${UNSURE}</button></div><div class="why" hidden></div></div>`;
}
const whyHTML = (q, e) => `<b>${e.ok ? '✓ 答對了。' : e.p === UNSURE ? '? 選了不確定，算答錯，已進錯題本。' : '✗ 答錯了，已進錯題本。'}</b><small class="qch">${IT[q.u].num} ${esc(unitName(q.u))}</small>${exHTML(q)}`;
function showAnswer(qe, q, e) {
  $$('.opt', qe).forEach(x => { x.disabled = true; const o = x.dataset.o; if (o === '0') x.classList.add('right'); else if ((o === 'u' ? UNSURE : q.o[+o]) === e.p && !e.ok) x.classList.add('wrong'); });
  const why = $('.why', qe); why.hidden = false; why.className = `why ${e.ok ? 'ok' : 'no'}`; why.innerHTML = whyHTML(q, e); qe.classList.add('done');
}
// done(q, e)：作答後呼叫；restore：已做過的題目直接顯示結果（測驗頁）
function bindMcq(root, list, { done, restore, rv } = {}) {
  const first = firstAns();
  list.forEach(q => {
    const qe = root.querySelector(`.q[data-h="${CSS.escape(qh(q))}"]`); if (!qe) return;
    if (restore && first.has(qh(q))) { showAnswer(qe, q, first.get(qh(q))); return; }
    $$('.opt', qe).forEach(b => { b.onclick = () => {
      const p = b.dataset.o === 'u' ? UNSURE : q.o[+b.dataset.o], e = { c: q.u, k: 'dx', h: qh(q), ok: b.dataset.o === '0' ? 1 : 0, n: 1, p, qt: plain(q.q).slice(0, 60) };
      logAnswer(e); showAnswer(qe, q, e);
      if (rv) $('.why', qe).insertAdjacentHTML('beforeend', `<p><small>${REVIEW.after(rv[qh(q)], e.ok)}</small></p>`);
      if (done) done(q, e);
    }; });
  });
}

/* ---- 首頁 ---- */
const WVIEW = ['加權平均', '近三年', '中國醫藥', '義守', '慈濟'];
let wv = store.get('wv', 0);
function partRow(p, first) {
  const qs = partQs(p), n = qs.filter(q => first.has(qh(q))).length, ready = p.items.every(([u]) => chQs(u).length);
  if (!ready) return `<li class="dx soon"><span class="dx-h">${p.part}</span><span class="dx-s">題目製作中</span></li>`;
  return `<li class="dx${n === qs.length ? ' fin' : ''}"><a href="#dx-${p.key}"><span class="dx-h">${p.part}</span><span class="dx-s">${p.items.length} 章 × 6 題・約 ${Math.round(qs.length * 0.75)} 分鐘</span><span class="pbar"><i style="width:${Math.round(100 * n / qs.length)}%"></i></span><span class="dx-st">${n === qs.length ? '✓ 完成，看結果' : n ? `${n} / ${qs.length} 題` : '開始測驗 →'}</span></a></li>`;
}
function priority(first) {
  const rows = ITEMS.map(x => ({ ...x, s: status(x.u, first) })).filter(x => x.s && x.s.lv);
  if (!rows.length) return '';
  const ord = { weak: 0, mid: 1, good: 2 }, list = rows.sort((a, b) => ord[a.s.lv] - ord[b.s.lv] || TREE[b.u].w[2] - TREE[a.u].w[2]);
  const li = x => `<li class="pr st-${x.s.lv}"><span class="pr-l">${LV[x.s.lv]}</span><span>${x.num} ${esc(x.t)}</span><b>答對 ${x.s.ok}/${x.s.of}・中國醫每份約 ${TREE[x.u].w[2].toFixed(1)} 題</b></li>`;
  const todo = list.filter(x => x.s.lv !== 'good'), ok = list.filter(x => x.s.lv === 'good');
  return `<h2>要先補強的章節</h2><p class="mut tree-note">已測完的章節中，弱項排最前面；同一級依中國醫的考試比重由高到低。</p>
${todo.length ? `<ol class="prs">${todo.map(li).join('')}</ol>` : '<p class="note">已測完的章節都已掌握。</p>'}
${ok.length ? `<details class="tree-src"><summary>已掌握 ${ok.length} 章（只留在之後的混合複習）</summary><ol class="prs">${ok.map(li).join('')}</ol></details>` : ''}`;
}
function renderHome() {

${due ? `<p class="duebar"><a href="#review">錯題本有 <b>${due}</b> 題今天到期 →</a></p>` : ''}
<h2>程度測驗</h2><ol class="dxs">${UNITS.map(p => partRow(p, first)).join('')}</ol>
${priority(first)}

// 章節地圖（照化學的畫法：每列依先修深度，連線是先修關係）
function treeRows(p, first) {
  const ids = p.items.map(i => i[0]), d = {};
  const depth = u => d[u] ?? (d[u] = Math.max(-1, ...TREE[u].pre.filter(x => ids.includes(x)).map(depth)) + 1);
  const rows = []; ids.forEach(u => (rows[depth(u)] = rows[depth(u)] || []).push(u));
  const pos = {};   // 每列依上一列父節點的平均位置排序，減少連線交叉
  rows.forEach(r => { r.forEach((u, i) => { const ps = TREE[u].pre.filter(x => pos[x] != null); r[i] = [u, ps.length ? ps.reduce((a, x) => a + pos[x], 0) / ps.length : i / r.length]; });
    r.sort((a, b) => a[1] - b[1]); r.forEach(([u], i) => { pos[u] = r.length > 1 ? i / (r.length - 1) : .5; r[i] = u; }); });
  return rows.map(r => `<div class="trow">${r.map(u => treeNode(u, p, first)).join('')}</div>`).join('');
}
function treeNode(u, p, first) {
  const s = status(u, first), cross = TREE[u].pre.filter(x => !x.startsWith(p.key));
  return `<a class="tn${s && s.lv ? ` st-${s.lv}` : ' plan'}" data-u="${u}" ${s ? `href="#dx-${p.key}"` : 'tabindex="0"'}>
<span class="tn-t"><small class="tn-n">${IT[u].num}</small> ${unitName(u)}</span>
<span class="tn-w"><span class="tn-bar"><i></i></span><b></b></span>
<small class="tn-s">${s && s.lv ? `${LV[s.lv]}・答對 ${s.ok}/${s.of}` : s && s.n ? `測驗中 ${s.n}/${s.of}` : s ? '還沒測' : '題目製作中'}</small>${cross.length ? `<small class="tn-x">先修：${cross.map(unitName).join('、')}</small>` : ''}</a>`;
}
function treeWeights() {
  $$('.tn').forEach(n => { const w = TREE[n.dataset.u].w[wv];
    n.querySelector('b').textContent = `≈ ${w.toFixed(1)} 題`;
    n.querySelector('i').style.width = `${Math.min(100, w / 5 * 100)}%`;
    n.title = `${unitName(n.dataset.u)}：每份約 ${w.toFixed(1)} 題（${WVIEW[wv]}）`; });
}
function treeLines() {
  $$('.tree-in').forEach(box => { const svg = box.querySelector('svg'), B = box.getBoundingClientRect(); let h = '';
    box.querySelectorAll('.tn').forEach(n => TREE[n.dataset.u].pre.forEach(pu => { const m = box.querySelector(`.tn[data-u="${pu}"]`); if (!m) return;
      const a = m.getBoundingClientRect(), b = n.getBoundingClientRect();
      const x1 = a.left + a.width / 2 - B.left, y1 = a.bottom - B.top, x2 = b.left + b.width / 2 - B.left, y2 = b.top - B.top, my = (y1 + y2) / 2;
      h += `<path data-a="${pu}" data-b="${n.dataset.u}" d="M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; }));
    svg.setAttribute('width', B.width); svg.setAttribute('height', B.height); svg.innerHTML = h; });
}
function treeFocus(u) {   // 標出這章的全部先修鏈（跨部的先修也一起亮）
  const set = new Set(), walk = x => { if (set.has(x)) return; set.add(x); TREE[x].pre.forEach(walk); };
  if (u) walk(u);
  $$('.tn').forEach(n => n.classList.toggle('lit', set.has(n.dataset.u)));
  $$('.tree-ln path').forEach(p => p.classList.toggle('lit', set.has(p.dataset.a) && set.has(p.dataset.b)));
  $$('.trees').forEach(t => t.classList.toggle('focus', !!u));
}
function bindTree() {
  treeWeights(); treeLines();
  $$('#wview button').forEach(b => { b.onclick = () => { wv = +b.dataset.i; store.set('wv', wv);
    $$('#wview button').forEach(x => x.setAttribute('aria-pressed', x === b)); treeWeights(); }; });
  $$('.tn').forEach(n => { n.onmouseenter = n.onfocus = () => treeFocus(n.dataset.u); n.onmouseleave = n.onblur = () => treeFocus(null); });

}

/* ---- 程度測驗：一卷＝一部；題目順序打散（固定種子），不依章節排，避免從前後題猜出考點 ---- */
function renderDx(p) {

  const G = '<svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 5.9-2.2L12 13.6c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.8a5.4 5.4 0 0 1 0-3.5V4.9H1a9 9 0 0 0 0 8.1l3-2.3z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 4.9l3 2.3c.7-2.1 2.7-3.6 5-3.6z"/></svg>';

  function panelHTML() {
    if (!ready) return `<p class="cp-t">${T('連線中…', 'Connecting…')}</p>`;
    const n = nDone(), tot = COURSE.total(), e = err ? `<p class="cp-err">${esc(err)}</p>` : '';
    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>
<p>${T('用 Google 帳號登入後，你完成的章節會存到雲端。之後在手機或其他電腦登入同一個帳號，進度會自動接上。', 'Sign in with Google and the chapters you finish are saved to the cloud. Sign in with the same account on your phone or another computer and your progress follows you.')}</p>
<p class="cp-st">${T(`目前：進度只存在這台裝置（已完成 ${n} / ${tot} 章）`, `Now: progress is saved on this device only (${n} / ${tot} chapters done)`)}</p>
<button class="btn pri cp-go" type="button" id="cpIn">${G}<span>${T('用 Google 登入', 'Sign in with Google')}</span></button>
<p class="cp-s">${T('不登入也能使用全部內容。這裡只儲存「完成了哪些章節」與練習紀錄，不會讀取你的其他 Google 資料。', 'Everything works without signing in. Only the list of finished chapters is stored, nothing else from your Google account.')}</p>${e}`;
    return `<p class="cp-t">${user.photoURL ? `<img class="cp-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(user.displayName || T('已登入', 'Signed in'))}<small>${esc(user.email || '')}</small></span></p>
<p class="cp-st ok">${busy ? T('同步中…', 'Syncing…') : `✓ ${T(`已同步 ${n} / ${tot} 章`, `${n} / ${tot} chapters synced`)}${last ? ` · ${time(last)}` : ''}`}</p>
<p>${T('在其他裝置用同一個帳號登入，就會看到相同的進度；在任何一台標記完成，其他裝置也會跟著更新。', 'Sign in with the same account on another device to see the same progress. Chapters you finish anywhere show up everywhere.')}</p>
<button class="btn" type="button" id="cpOut">${T('登出', 'Sign out')}</button>
<p class="cp-s" style="margin-top:8px !important">${T('登出後，這台裝置上的進度仍會保留。', 'Signing out keeps your progress on this device.')}</p>${e}`;
  }
  function render() {
    const b = document.getElementById('cloudBtn'), p = document.getElementById('cloudPanel');
    if (b) {
      b.innerHTML = user ? `${user.photoURL ? `<img class="cb-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '<span class="cb-dot"></span>'}<span>${busy ? T('同步中', 'Syncing') : T('已同步', 'Synced')}</span>` : `<span aria-hidden="true">☁</span><span>${T('同步進度', 'Sync progress')}</span>`;
      b.title = user ? T('進度已同步到雲端，點一下看詳情', 'Progress is synced; click for details') : T('登入後可在不同裝置同步學習進度', 'Sign in to sync progress across devices');
    }
    if (p && !p.hidden) {
      p.innerHTML = panelHTML();
      const i = document.getElementById('cpIn'), o = document.getElementById('cpOut');
      if (i) i.onclick = signIn;
      if (o) o.onclick = () => auth.signOut();
    }
    const h = document.getElementById('syncHint'); if (h) h.outerHTML = hint();
  }
  function signIn() {
    err = ''; if (!ready) return;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { err = T('登入失敗：', 'Sign-in failed: ') + e.code; toggle(true); }
    });
  }
  function toggle(show) {
    const p = document.getElementById('cloudPanel'), b = document.getElementById('cloudBtn'); if (!p) return;
    p.hidden = show === undefined ? !p.hidden : !show; b.setAttribute('aria-expanded', String(!p.hidden)); render();
  }
  function push() {
    if (!user) return;
    clearTimeout(timer); busy = true; render();
    timer = setTimeout(() => Promise.all(COURSE.tracks.map(t => ref(t.doc).set({ done: t.get(), lang: lang(), updated: Date.now() })))
      .then(() => { busy = false; err = ''; last = Date.now(); render(); })
      .catch(e => { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }), 800);
  }
  // 練習紀錄：只增不減。上傳最近 3000 筆（Firestore 單一文件上限 1 MB）；下載時與本機取聯集
  const lkey = e => `${e.t}|${e.c}|${e.h || e.k + e.i}|${e.p}`;
  let ltimer = 0;
  const LOGS = () => [].concat(COURSE.logs || []);
  function pushLog() {
    if (!user || !LOGS().length) return;
    clearTimeout(ltimer);
    ltimer = setTimeout(() => LOGS().forEach(L => ref(L.doc).set({ log: L.get().slice(-3000), updated: Date.now() }).catch(e => console.warn('log sync', e.code))), 2000);
  }
  async function pullLog() {
    let added = 0;
    for (const L of LOGS()) {
      try {
        const snap = await ref(L.doc).get(), remote = (snap.exists && snap.data().log) || [], local = L.get();
        const seen = new Set(local.map(lkey)), add = remote.filter(e => !seen.has(lkey(e)));
        if (add.length) { L.set(local.concat(add).sort((a, b) => a.t - b.t)); added += add.length; }
        const rs = new Set(remote.map(lkey));
        if (local.some(e => !rs.has(lkey(e)))) pushLog();
      } catch (e) { console.warn('log sync', e.code); }
    }
    return added;
  }
  async function pull() {
    try {
      busy = true; render();
      let added = 0, ahead = false;
      for (const t of COURSE.tracks) {
        const snap = await ref(t.doc).get(), remote = (snap.exists && snap.data().done) || {}, local = { ...t.get() };
        const add = Object.keys(remote).filter(k => !local[k]);
        add.forEach(k => { local[k] = 1; });
        if (add.length) { t.set(local); added += add.length; }
        if (Object.keys(local).some(k => !remote[k])) ahead = true;
      }
      if (await pullLog()) added++;
      if (added) COURSE.refresh();
      busy = false; last = Date.now(); err = '';
      if (ahead) push(); else render();
    } catch (e) { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }
  }
  // 首頁提示：有進度、還沒登入、沒按過「不用了」時才出現
  function hint() {
    if (!on() || user || !ready || !nDone() || store.get('syncHintOff', 0)) return '<div id="syncHint" hidden></div>';
    return `<div id="syncHint" class="sync-hint" data-notr><span>☁ ${T(`你已完成 ${nDone()} 章，進度目前只存在這台裝置。登入 Google 帳號，換手機或電腦也能接著學。`, `You've finished ${nDone()} chapters, saved on this device only. Sign in with Google to continue on your phone or another computer.`)}</span><button class="btn sm pri" type="button" data-sync="in">${T('登入同步', 'Sign in')}</button><button class="btn sm" type="button" data-sync="off">${T('不用了', 'No thanks')}</button></div>`;
  }
  async function start() {
    if (!on()) return;
    const top = document.querySelector('.top-in');
    if (!top) return;
    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, pushLog, hint, render };
})();


/* ---------- 後中生物：啟動、雲端同步、PWA ---------- */
boot();
const COURSE = {
  tracks: [],
  count: () => { const f = firstAns(); return DIAG.filter(q => f.has(qh(q))).length; },
  total: () => DIAG.length,
  refresh: route,
  logs: { doc: 'bioLog', get: () => LOG, set: a => { LOG.length = 0; LOG.push(...a); store.set('log', LOG); } },
};
if (document.querySelector('meta[name="app-site"]')) {
  document.querySelector('.brand').insertAdjacentHTML('beforebegin', '<a class="home-link" href="../">‹ 學習階梯</a>');
  if (typeof CLOUD !== 'undefined') CLOUD.start();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.controller && navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
}

</script>
