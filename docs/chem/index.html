/* 座標圖：o = { w, h, x:[min,max], y:[min,max], xt:[刻度], yt:[刻度], xlab, ylab }；draw(X, Y) 回傳圖內 SVG */

/* ---------- 後中化學：酸鹼平衡計算引擎 ----------
   不用近似：直接解電荷平衡 [H⁺] + [Na⁺] = [OH⁻] + [A⁻] + [Cl⁻]，其中 [A⁻] = C·Ka/(Ka + [H⁺])（強酸則 [A⁻] = C）。
   左邊減右邊隨 [H⁺] 單調遞增，所以在 log[H⁺] 上二分法一定收斂。濃度 M、體積 mL、量 mmol。 */
const KW = 1e-14;
function solveH({ Ca = 0, Ka = 1e-5, strong = false, Na = 0, Cl = 0 }) {
  const f = h => h + Na - KW / h - (strong ? Ca : Ca * Ka / (Ka + h)) - Cl;
  let lo = -15, hi = 1.5;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (f(10 ** m) > 0) hi = m; else lo = m; }
  return 10 ** ((lo + hi) / 2);
}
const ACID = {
  weak: { name: '醋酸 CH₃COOH', short: 'HA', pKa: 4.74, strong: false },
  strong: { name: '鹽酸 HCl', short: 'HCl', pKa: -7, strong: true },

function titr({ Va = 25, Ca0 = 0.1, Cb = 0.1, Vb = 0, pKa = 4.74, strong = false }) {
  const V = Va + Vb, Ca = Ca0 * Va / V, Na = Cb * Vb / V, Ka = 10 ** -pKa, h = solveH({ Ca, Ka, strong, Na });
  const fHA = strong ? 0 : h / (Ka + h);
  return { V, h, pH: -Math.log10(h), nHA: Ca * V * fHA, nA: Ca * V * (1 - fHA), nOH: KW / h * V, nH: h * V, nNa: Cb * Vb, Veq: Ca0 * Va / Cb };
}
// 緩衝溶液：V mL 中各含 C M 的 HA 與 NaA，再加入 addH mmol 強酸或 addOH mmol 強鹼（以濃溶液加入，體積變化忽略）
function buffer({ C = 0.1, V = 100, pKa = 4.74, addH = 0, addOH = 0 }) {
  const Ka = 10 ** -pKa, h = solveH({ Ca: 2 * C, Ka, Na: (C * V + addOH) / V, Cl: addH / V }), f = h / (Ka + h);
  return { pH: -Math.log10(h), nHA: 2 * C * V * f, nA: 2 * C * V * (1 - f) };
}
function water({ V = 100, addH = 0, addOH = 0 }) { const h = solveH({ Ca: 0, Na: addOH / V, Cl: addH / V }); return { pH: -Math.log10(h) }; }
// 指示劑：變色範圍與兩端顏色（低 pH → 高 pH）
const IND = {
  none: { name: '不加指示劑' },
  pp: { name: '酚酞', lo: 8.2, hi: 10.0, c0: [248, 246, 240], c1: [214, 51, 132], txt: '無色 → 粉紅' },
  mo: { name: '甲基橙', lo: 3.1, hi: 4.4, c0: [214, 60, 50], c1: [240, 196, 60], txt: '紅 → 黃' },
  btb: { name: '溴瑞香草酚藍', lo: 6.0, hi: 7.6, c0: [226, 200, 60], c1: [52, 104, 196], txt: '黃 → 藍' },
};
function indColor(key, pH) {
  const d = IND[key]; if (!d || !d.c0) return 'var(--water)';
  const t = clamp((pH - d.lo) / (d.hi - d.lo), 0, 1), c = d.c0.map((v, i) => Math.round(v + (d.c1[i] - v) * t));
  return `rgb(${c.join(',')})`;
}

/* ---------- 後中化學：分子與反應機構繪圖 ----------
   場景（scene）：
     atoms: { id: { x, y, t: 標籤（'' 為骨架頂點）, c: 電荷（'+' '−' 'δ+' 'δ−'）, lp: [孤對電子方向（度）], halo: 立體障礙半徑, hl: 強調色, hide } }
     bonds: [[a, b, 型別]]  型別：'s' 單鍵、'd' 雙鍵、't' 參鍵、'w' 楔形（朝向讀者）、'h' 虛楔（遠離讀者）、'p' 部分鍵（過渡狀態）、'sd' 實線＋虛線（共振混成）
     rings: [{ x, y, r }]  環內圈（苯的共振混成）
     arrows: [{ f: { lp: [原子, 角度] } | { b: [a, b] }, t: { a: 原子 } | { m: [a, b] }, bend }]  彎箭頭：電子從哪裡流到哪裡
     orbs: [{ a: 原子, ang }]  空的 p 軌域（兩瓣）；ts: true 畫過渡狀態的括號；notes: [{ x, y, t, cls }]
   座標以鍵長為 1，y 朝上；MOL.svg(scene, { w, h, s: 每單位像素, cx, cy }) 畫出 SVG。 */
const MOL = (() => {
  const vis = t => (t || '').replace(/[₀-₉⁰-⁹⁺⁻]/g, '').length;   // 標籤可見字數（下標不太佔寬）
  const rad = a => (a.t ? 7 + 4.2 * vis(a.t) : 0);
  function geom(sc, o) {
    const S = o.s || 46, cx = o.cx ?? o.w / 2, cy = o.cy ?? o.h / 2;
    const P = id => { const a = sc.atoms[id]; return [cx + a.x * S, cy - a.y * S]; };
    return { S, P };
  }
  function bond(sc, G, [a, b, k]) {
    const A = sc.atoms[a], B = sc.atoms[b]; if (!A || !B || A.hide || B.hide) return '';
    let [x1, y1] = G.P(a), [x2, y2] = G.P(b); const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const r1 = Math.min(rad(A), L * 0.4), r2 = Math.min(rad(B), L * 0.4);

    if (k === 'h') return Array.from({ length: 6 }, (_, i) => { const t = (i + 0.5) / 6, w = 0.8 + 4.5 * t, px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t; return `<line class="bh" x1="${px + nx * w}" y1="${py + ny * w}" x2="${px - nx * w}" y2="${py - ny * w}"/>`; }).join('');
    if (k === 'p') return `<line class="bp" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (k === 'sd') return `<line class="b" x1="${x1 + nx * 3}" y1="${y1 + ny * 3}" x2="${x2 + nx * 3}" y2="${y2 + ny * 3}"/><line class="bp" x1="${x1 - nx * 3}" y1="${y1 - ny * 3}" x2="${x2 - nx * 3}" y2="${y2 - ny * 3}"/>`;
    if (k === 't') return `<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="b" x1="${x1 + nx * 4}" y1="${y1 + ny * 4}" x2="${x2 + nx * 4}" y2="${y2 + ny * 4}"/><line class="b" x1="${x1 - nx * 4}" y1="${y1 - ny * 4}" x2="${x2 - nx * 4}" y2="${y2 - ny * 4}"/>`;
    if (k === 'd') return `<line class="b" x1="${x1 + nx * 3}" y1="${y1 + ny * 3}" x2="${x2 + nx * 3}" y2="${y2 + ny * 3}"/><line class="b" x1="${x1 - nx * 3}" y1="${y1 - ny * 3}" x2="${x2 - nx * 3}" y2="${y2 - ny * 3}"/>`;
    return `<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  function atom(sc, G, id) {
    const a = sc.atoms[id]; if (a.hide) return '';
    const [x, y] = G.P(id), r = rad(a);
    let s = '';
    if (a.halo) s += `<circle class="halo" cx="${x}" cy="${y}" r="${a.halo * G.S}"/>`;
    if (a.t) s += `<text class="at${a.hl ? ' hl' : ''}" x="${x}" y="${y + 5.5}" text-anchor="middle">${a.t}</text>`;
    (a.lp || []).forEach(g => {
      const u = [Math.cos(g * Math.PI / 180), -Math.sin(g * Math.PI / 180)], d = Math.max(r, 6) + 5, px = x + u[0] * d, py = y + u[1] * d;
      s += `<circle class="lp" cx="${px - u[1] * 3}" cy="${py + u[0] * 3}" r="1.9"/><circle class="lp" cx="${px + u[1] * 3}" cy="${py - u[0] * 3}" r="1.9"/>`;
    });
    if (a.c) { const cxx = x + Math.max(r, 6) + 2, cyy = y - 10; s += a.c.startsWith('δ') ? `<text class="dl" x="${cxx}" y="${cyy}">${a.c}</text>` : `<circle class="chg" cx="${cxx + 4}" cy="${cyy - 3}" r="7"/><text class="chgt" x="${cxx + 4}" y="${cyy + 1}" text-anchor="middle">${a.c === '+' ? '+' : '−'}</text>`; }
    return s;
  }
  function arrow(sc, G, ar) {
    let s, e;
    if (ar.f.lp) { const [id, g] = ar.f.lp, [x, y] = G.P(id), r = Math.max(rad(sc.atoms[id]), 6) + 5; s = [x + Math.cos(g * Math.PI / 180) * r, y - Math.sin(g * Math.PI / 180) * r]; }
    else { const [p, q] = ar.f.b.map(G.P); s = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    if (ar.t.a) { const [x, y] = G.P(ar.t.a), r = Math.max(rad(sc.atoms[ar.t.a]), 7) + 3, d = Math.hypot(x - s[0], y - s[1]) || 1; e = [x - (x - s[0]) / d * r, y - (y - s[1]) / d * r]; }
    else { const [p, q] = ar.t.m.map(G.P); e = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    const mx = (s[0] + e[0]) / 2, my = (s[1] + e[1]) / 2, L = Math.hypot(e[0] - s[0], e[1] - s[1]), b = ar.bend ?? 0.45;
    const c = [mx - (e[1] - s[1]) / L * L * b, my + (e[0] - s[0]) / L * L * b];
    return `<path class="arr" d="M${s[0].toFixed(1)} ${s[1].toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${e[0].toFixed(1)} ${e[1].toFixed(1)}" marker-end="url(#ah)"/>`;
  }
  function orb(sc, G, o) {
    const [x, y] = G.P(o.a), g = (o.ang || 0), r = G.S * 0.62;
    return [0, 180].map(k => { const t = (g + k) * Math.PI / 180; return `<ellipse class="orb" cx="${x + Math.cos(t) * r}" cy="${y - Math.sin(t) * r}" rx="${r * 0.82}" ry="${r * 0.42}" transform="rotate(${-(g + k)} ${x + Math.cos(t) * r} ${y - Math.sin(t) * r})"/>`; }).join('');
  }
  function svg(sc, o) {
    const G = geom(sc, o), ids = Object.keys(sc.atoms);

    body += ids.filter(i => sc.atoms[i].halo && !sc.atoms[i].hide).map(i => { const [x, y] = G.P(i); return `<circle class="halo" cx="${x}" cy="${y}" r="${sc.atoms[i].halo * G.S}"/>`; }).join('');
    body += (sc.bonds || []).map(b => bond(sc, G, b)).join('');
    body += (sc.rings || []).map(r => `<circle class="bp" fill="none" cx="${(o.cx ?? o.w / 2) + r.x * G.S}" cy="${(o.cy ?? o.h / 2) - r.y * G.S}" r="${r.r * G.S}"/>`).join('');
    body += ids.map(i => atom(sc, G, i).replace(/<circle class="halo"[^>]*\/>/, '')).join('');
    body += (sc.arrows || []).map(a => arrow(sc, G, a)).join('');
    if (sc.ts) body += `<text class="ts" x="${o.w / 2 - G.S * 3.1}" y="${o.h / 2 + 14}">[</text><text class="ts" x="${o.w / 2 + G.S * 2.85}" y="${o.h / 2 + 14}">]</text><text class="tsd" x="${o.w / 2 + G.S * 3.15}" y="${o.h / 2 - 26}">‡</text>`;
    body += (sc.notes || []).map(n => { const x = (o.cx ?? o.w / 2) + n.x * G.S, y = (o.cy ?? o.h / 2) - n.y * G.S; return `<text class="note ${n.cls || ''}" x="${x}" y="${y}" text-anchor="middle">${n.t}</text>`; }).join('');
    return `<svg class="mol" viewBox="0 0 ${o.w} ${o.h}" role="img"${o.label ? ` aria-label="${esc(o.label)}"` : ''}><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahp"/></marker></defs>${body}</svg>`;
  }
  // 兩個場景之間的插值：位置線性內插；前半段用起點的鍵，後半段用終點的鍵；動畫中不畫箭頭
  function lerp(a, b, t) {
    const atoms = {};
    for (const id of new Set([...Object.keys(a.atoms), ...Object.keys(b.atoms)])) {
      const p = a.atoms[id], q = b.atoms[id];
      if (p && q) atoms[id] = { ...(t < 0.5 ? p : q), x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, hide: (t < 0.5 ? p : q).hide };
      else atoms[id] = { ...(p || q), hide: (p ? t > 0.5 : t < 0.5) || (p || q).hide };

})();

/* 反應能量圖：pts 為 [x, y] 的控制點（x 0–1、y 0–1），以平滑曲線連起來；at 為目前位置 */
function energySVG(pts, at, o = {}) {
  const w = o.w || 300, h = o.h || 150, L = 26, B = 22, T = 10, R = 8;
  const X = v => L + v * (w - L - R), Y = v => h - B - v * (h - T - B);
  const mk = P => x => { // 分段餘弦內插：極大極小點都平滑
    for (let i = 0; i < P.length - 1; i++) { const [x0, y0] = P[i], [x1, y1] = P[i + 1]; if (x <= x1) { const t = (x - x0) / (x1 - x0); return y0 + (y1 - y0) * (1 - Math.cos(Math.PI * t)) / 2; } }
    return P[P.length - 1][1];
  };
  const f = mk(pts), alt = o.alt ? `<path class="catc" d="${path(Array.from({ length: 121 }, (_, i) => [X(i / 120), Y(mk(o.alt)(i / 120))]))}"/>` : '';
  const line = Array.from({ length: 121 }, (_, i) => [X(i / 120), Y(f(i / 120))]);
  const cur = at == null ? '' : `<circle class="edot" cx="${X(at)}" cy="${Y(f(at))}" r="6"/>`;
  const labs = (o.labels || []).map(([x, t, dy]) => `<text class="elab" x="${X(x) + (x < 0.1 ? 6 : 0)}" y="${Math.max(12, Y(f(x)) - (dy || 10))}" text-anchor="${x < 0.1 ? 'start' : x > 0.9 ? 'end' : 'middle'}">${t}</text>`).join('');
  return `<svg class="en" viewBox="0 0 ${w} ${h}" role="img" aria-label="反應能量圖"><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${h - B}"/><line class="ax" x1="${L}" y1="${h - B}" x2="${w - R}" y2="${h - B}"/><text class="lab" transform="translate(15 ${(T + h - B) / 2}) rotate(-90)" text-anchor="middle">能量</text><text class="lab" x="${(L + w) / 2}" y="${h - 5}" text-anchor="middle">反應進行 →</text><path class="ecurve" d="${path(line)}"/>${alt}${labs}${cur}</svg>`;
}

/* 機構播放器：frames = [{ sc, cap, at }]；在 el 中畫出分子、說明、能量圖與控制鈕。回傳 { go(i), reset() } */
function mechPlayer(el, o) {
  let frames = o.frames(), i = 0, anim = 0;
  el.innerHTML = `<div class="mech"><div class="mech-view"></div><div class="mech-side">${o.energy ? '<div class="mech-en"></div>' : ''}<p class="mech-cap" aria-live="polite"></p></div></div>
<div class="w-row mech-ctl"><button class="btn sm" type="button" data-m="0">⟲ 重來</button><button class="btn sm" type="button" data-m="-1">‹ 上一步</button><button class="btn sm pri" type="button" data-m="1">下一步 ›</button><span class="mech-step mono small mut"></span></div>`;
  const view = $('.mech-view', el), cap = $('.mech-cap', el), en = $('.mech-en', el), step = $('.mech-step', el), W = o.w || 520, H = o.h || 260;
  // 能量圖設定可以是固定值，或依目前選項變化的函式 () => ({ pts, alt, labels })
  const EG = () => (typeof o.energy === 'function' ? o.energy() : { pts: o.energy, labels: o.elabels });
  const eDraw = at => { const g = EG(); return energySVG(g.pts, at, { labels: g.labels, alt: g.alt }); };
  const draw = (sc, f) => {
    view.innerHTML = MOL.svg(sc, { w: W, h: H, s: o.s || 56, cy: o.cy, label: o.label });
    if (f) { cap.innerHTML = f.cap; if (en) en.innerHTML = eDraw(f.at); step.textContent = `${i + 1} / ${frames.length}`; }
    $('[data-m="1"]', el).disabled = i >= frames.length - 1; $('[data-m="-1"]', el).disabled = i <= 0;
  };
  const show = () => draw(frames[i].sc, frames[i]);
  function go(n, animate = true) {
    n = clamp(n, 0, frames.length - 1); cancelAnimationFrame(anim);
    if (!animate || n !== i + 1 || matchMedia('(prefers-reduced-motion: reduce)').matches) { i = n; show(); return; }
    const a = frames[i].sc, b = frames[n].sc, t0 = performance.now(), D = 900;
    const tick = now => {
      const t = clamp((now - t0) / D, 0, 1), e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      view.innerHTML = MOL.svg(MOL.lerp(a, b, e), { w: W, h: H, s: o.s || 56, cy: o.cy });
      if (en) en.innerHTML = eDraw(frames[i].at + (frames[n].at - frames[i].at) * e);
      if (t < 1) anim = requestAnimationFrame(tick); else { i = n; show(); }
    };
    anim = requestAnimationFrame(tick);

  $$('[data-m]', el).forEach(b => { b.onclick = () => { const m = +b.dataset.m; if (m === 0) go(0, false); else go(i + m, m > 0); }; });
  show();
  return { go, reset() { frames = o.frames(); i = Math.min(i, frames.length - 1); go(0, false); }, get i() { return i; } };
}

/* ---------- 後中化學：課程內容 ----------

const UNITS = [

<p>布忍斯特–羅瑞的酸給出 H⁺ 後變成它的<b>共軛鹼</b>，鹼接受 H⁺ 後變成<b>共軛酸</b>。同一個物種可以當酸也可以當鹼（H₂O、HCO₃⁻、H₂PO₄⁻），稱為兩性物質。切換不同反應，看每個物種扮演的角色，以及它符合哪幾種定義。</p>` },

<p>結構上的趨勢：同族往下（HF &lt; HCl &lt; HBr &lt; HI）鍵越長越弱，酸性越強，HF 因為 H–F 鍵很強而是弱酸；含氧酸中心原子的電負度越大、接的 O 越多，酸性越強（HClO &lt; HClO₂ &lt; HClO₃ &lt; HClO₄）。H₃PO₃ 只有兩個 H 接在 O 上，是二質子酸；H₃BO₃ 是接受 OH⁻ 的路易斯酸，只算一質子。</p>` },
      { h: '多質子酸在不同 pH 下是什麼形式？', w: 'polyprot', body: `

<p>藥物分子也一樣：pKa 4.7 的弱酸在 pH 7.4 的血液中，[A⁻]/[HA] = 10^2.7 ≈ 500，幾乎全部以帶負電的形式存在。</p>` },
      { h: '滴定時燒杯裡發生什麼？', w: 'titration', body: `

<p>K 非常大，代表這個反應幾乎完全進行：<b>加了多少 OH⁻，就有多少 HA 變成 A⁻</b>。這是整章最重要的一句話，後面所有計算都從這裡出發。</p>

<p class="eq">加入強酸：A⁻ + H⁺ → HA　　　加入強鹼：HA + OH⁻ → A⁻ + H₂O</p>
<p>加進來的 H⁺ 或 OH⁻ 幾乎全被吃掉，溶液裡真正改變的只是 A⁻ 和 HA 的比例，而 pH 只跟這個比例的<b>對數</b>有關，所以變化很小。</p>

<p>羧酸（RCOOH）的酸性來自羧酸根的共振（兩個 O 平分負電荷），pKa 約 4–5（有機酸鹼一章）。拉電子基使酸性增強，例如三氯乙酸 pKa 0.65。</p>
<p>在生理 pH（約 7.4）下，羧酸幾乎完全以<b>羧酸根</b>（RCOO⁻）存在：胺基酸、脂肪酸、許多藥物都是如此。這影響它們的溶解度與能否穿過細胞膜。</p>
<p>羧酸的製備：一級醇或醛氧化、烷基苯以 KMnO₄ 氧化（側鏈變成 COOH）、甲基酮的碘仿反應（少一個碳）、格里納試劑加 CO₂、腈（R–CN）水解。後兩者都多接一個碳，但限制不同：切換下圖的目標比較。</p>` },

<p>醯氯、酸酐、酯、醯胺都是<b>羧酸衍生物</b>：羰基碳上接著一個電負度大的原子（Cl、O、N）。它們的共同反應：</p>
<ol><li>親核基加成到羰基碳，形成<b>四面體中間物</b>（和醛酮相同）；</li><li>C=O 重新形成，把較好的離去基擠出去。</li></ol>
<p>醛酮停在第 1 步，是因為 H⁻ 和 R⁻ 不會離開；羧酸衍生物則有 Cl⁻、RCOO⁻、RO⁻ 等可以離開，所以會走完第 2 步。這類「先加成、再脫去」的反應稱為<b>親核醯基取代</b>。</p>` },

<p class="eq">醯氯 &gt; 酸酐 &gt; 酯 ≈ 羧酸 &gt; 醯胺 &gt; 羧酸根</p>
<p>兩個原因指向同一個方向：</p>
<ul><li><b>離去基能力</b>：共軛酸越強越好離開（Cl⁻ 最好、NH₂⁻ 最差）。</li><li><b>共振穩定</b>：接在羰基上的原子把孤對電子共振給羰基，降低羰基碳的正電性。N 給得最多，所以醯胺最穩定（蛋白質的胜肽鍵在水中可以保存很久）。</li></ul>
<p>結論：<b>只能往下轉換</b>，從活潑的變成穩定的。例如醯氯加醇得到酯、加胺得到醯胺；但酯不能直接變成醯氯。</p>` },

<ul><li><b>費雪酯化</b>：羧酸 + 醇，酸催化，可逆（K 約 1–10）。用過量醇或移除水提高產率。</li>
<li><b>酯的水解</b>：酸性水解可逆；鹼性水解（<b>皂化</b>）因生成羧酸根而不可逆。油脂皂化得到肥皂（脂肪酸鈉）與甘油。</li>
<li><b>還原</b>：LiAlH₄ 把酯、羧酸還原成一級醇；醯胺還原成胺。NaBH₄ 太弱，通常不還原酯。</li>
<li><b>格里納試劑</b>：和酯反應兩次（第一次取代成酮，酮更活潑，立刻再加成一次），得到三級醇。</li>
<li><b>克來森縮合</b>：酯的 α-H 被拿走形成烯醇離子，攻擊另一個酯的羰基，得到 β-酮酯，相當於酯版本的醛醇反應。脂肪酸合成與分解都用到這類反應。</li></ul>` },

<li><b>LiAlH₄</b> 把羧酸、酯、醯氯都還原成一級醇（異丁酸、異丁酸甲酯、異丁醯氯都得到異丁醇）；醯胺則還原成<b>胺</b>（C=O 變成 CH₂）。</li>

<p>醇（R–OH）依帶 OH 的碳接幾個碳，分為一級、二級、三級。O–H 鍵讓醇：</p>
<ul><li>分子間形成<b>氫鍵</b>，沸點比同分子量的醚、烷高很多；</li><li>小分子醇能和水互溶；碳鏈越長越不溶。</li><li>有很弱的酸性（pKa 約 16，和水相近），和 Na 金屬或 NaH 反應生成<b>烷氧離子</b> RO⁻，是強鹼也是好的親核基。</li></ul>
<p>醚（R–O–R）沒有 O–H，分子之間不能形成氫鍵，沸點低、化性穩定，常當作溶劑（乙醚、THF）。</p>` },
    { h: '醇怎麼進行取代與脫去？', w: ['alcconv', 'dehyd'], body: `
<p>OH⁻ 是強鹼、很差的離去基（有機酸鹼一章）。要讓醇進行取代或脫去，第一步永遠是<b>把 OH 改造成好離去基</b>：</p>
<ul><li><b>加酸</b>：質子化成 –OH₂⁺，以中性水離開。適合 HX 取代與酸催化脫水。三級醇與濃 HCl 室溫就能反應，用來區分醇級數的<b>盧卡斯試驗</b>就是利用這一點。三級醇經碳陽離子（SN1／E1），要注意重排。</li>
<li><b>PBr₃、SOCl₂</b>：把 O 接到 P 或 S 上變成好離去基，再讓 X⁻ 做 SN2。不經碳陽離子，不重排，適合一級、二級醇。</li>
<li><b>TsCl</b>：變成磺酸酯（–OTs），之後可以接任何親核基。這一步 C–O 鍵沒斷，構型保留。</li></ul>
<p>醇的酸催化<b>脫水</b>是 E1（三級、二級），得到查依采夫烯；溫度較低、醇過量時，則可能兩分子醇脫水生成醚。第二張圖切換不同的醇，看碳陽離子是否重排、生成哪些烯。用 SOCl₂ 或 PBr₃ 時不經碳陽離子，骨架不變，例如 2-乙基-1-丁醇與 SOCl₂ 得到 1-氯-2-乙基丁烷。</p>` },

<p>體內的乙醇代謝也是同樣的路：乙醇 →（醇脫氫酶）乙醛 →（醛脫氫酶）乙酸。乙醛造成宿醉與臉紅；部分東亞人醛脫氫酶活性低，所以特別容易臉紅。反方向的「還原」就是醛酮一章的 NaBH₄ 反應。</p>` },

<p>醚的 C–O 鍵很穩定，只有強酸（HBr、HI）才能切開：O 先質子化，再由 Br⁻ 以 SN2 進攻較不擠的碳（三級烷基則走 SN1）。環狀的 THF 與過量 HBr 反應，兩個 C–O 鍵都被切開，得到 1,4-二溴丁烷；苯甲醚則得到酚和 CH₃Br（Br⁻ 不能進攻苯環碳）。</p>

/* ---------- 後中化學：烯烴與炔烴 ---------- */
CH.push({
  id: 'alkene', unit: 'o5', title: '烯烴與炔烴：親電子加成',
  lede: '雙鍵的 π 電子是分子裡最容易被拿到的電子，所以烯烴最典型的反應是「加成」：雙鍵打開，兩邊各接上一個基團。看懂碳陽離子和溴鎓離子這兩種中間物，十幾種加成反應的產物就能自己推出來。',
  sections: [
    { h: 'HBr 加在哪一個碳上？', w: 'hbr', body: `
<p>π 鍵的電子位於鍵軸上下，離原子核較遠，容易被<b>親電子試劑</b>（缺電子、帶正電或部分正電的物種）吸引。HBr 加成分兩步：</p>
<ol><li>π 電子攻擊 H⁺，生成碳陽離子（慢步驟）；</li><li>Br⁻ 加到碳陽離子上（快）。</li></ol>
<p>不對稱的烯（例如丙烯）有兩種加法。比較兩條路：H 加到 CH₂ 會得到<b>二級</b>碳陽離子，加到 CH 會得到<b>一級</b>碳陽離子。由於碳陽離子穩定度三級 > 二級 > 一級（SN1 那一節學過的超共軛），第一條路的過渡狀態低得多，幾乎所有產物都走這條路。</p>
<p>這就是<b>馬可尼可夫規則</b>：H 加到原本 H 較多的碳上。但真正要記的是背後的原因：<b>反應會經過較穩定的碳陽離子</b>。這個說法在規則失效的地方（例如有拉電子基時）仍然正確。</p>` },
    { h: '碳陽離子什麼時候會重排？', w: 'shift', body: `
<p>碳陽離子生成之後，如果隔壁的碳上有 H（或甲基）移過來能讓正電荷落在更穩定的位置，它就會移過來：H 帶著鍵上的兩個電子一起移動，稱為 <b>1,2-氫移位</b>（甲基移動則稱 1,2-甲基移位）。</p>
<p>所以 3-甲基-1-丁烯加 HBr，主產物是 2-溴-<b>2</b>-甲基丁烷：正電荷從二級碳移到三級碳之後，Br⁻ 才加上去。</p>
<p>判斷原則：<b>只要反應經過碳陽離子，就檢查能不能變得更穩定</b>。SN1、E1、酸催化水合都適用。</p>` },
    { h: '加 Br₂ 為什麼是反式加成？', w: 'brom', body: `
<p>Br₂ 本身沒有極性，但靠近富含電子的雙鍵時被極化。π 電子攻擊近端的 Br，生成三元環的<b>溴鎓離子</b>，而不是開放的碳陽離子。</p>
<p>溴鎓離子把雙鍵的一面擋住，Br⁻ 只能從另一面進攻，像 SN2 一樣從背面打開三元環。結果兩個 Br 在相反兩側：<b>反式加成</b>。環己烯加 Br₂ 只得到 trans-1,2-二溴環己烷。</p>
<p>因為沒有自由的碳陽離子，溴的加成<b>不會重排</b>。如果溶劑是水，大量的水分子會搶先打開溴鎓離子，得到鹵醇（OH 和 Br 反式），OH 接在較多取代、較能承受正電荷的那個碳上。</p>` },
    { h: '不同試劑的產物怎麼推？', w: 'addmap', body: `
<p>烯烴的加成反應很多，但只要知道<b>經過什麼中間物</b>，區域選擇和立體化學就跟著決定：</p>
<ul><li><b>碳陽離子</b>（HX、酸催化水合）：馬可尼可夫、可能重排、沒有立體選擇。</li>
<li><b>三元環離子</b>（Br₂、Br₂/H₂O）：反式加成、不重排。</li>
<li><b>同時從同一側加上</b>（氫化、硼氫化、OsO₄）：同側（syn）加成。</li>
<li><b>自由基</b>（HBr + 過氧化物）：反馬可尼可夫，因為先加上去的是 Br·，生成較穩定的自由基。</li></ul>
<p>硼氫化–氧化和自由基 HBr 加成是兩個「反馬可尼可夫」的方法，常一起出題比較。下圖選擇起始物與試劑，看產物的位置與立體：換成 1-甲基環己烯時，楔形與虛楔顯示新基團在環的同側或兩側。</p>
<p>要合成「OH 在取代較多的碳、又不能重排」時用羥汞化–脫汞；要順式二醇用 OsO₄，反式二醇用環氧化再酸性開環。臭氧分解則是由產物反推結構的工具：例如得到丙酮與乙醛，原來的烯就是 (CH₃)₂C=CHCH₃（2-甲基-2-丁烯）。</p>` },
    { h: '炔烴可以變成哪些產物？', w: 'alkyne', body: `
<p>參鍵有兩個 π 鍵，可以加成兩次。重點有三個：</p>
<ol><li><b>加成</b>：加 1 當量 HX 或 X₂ 得到烯，加 2 當量得到兩個 X 在同一碳（HX）或四鹵化物（X₂）。用 <b>林德拉觸媒</b>（Lindlar）氫化只加一次，得到<b>順式</b>烯；用 Na/液態 NH₃ 還原得到<b>反式</b>烯。</li>
<li><b>水合</b>：酸與 Hg²⁺ 催化下加水，先生成<b>烯醇</b>（OH 接在雙鍵碳上），烯醇立刻互變成較穩定的<b>酮</b>（酮–烯醇互變異構）。末端炔水合得到甲基酮。</li>
<li><b>酸性</b>：末端炔的 H 在 sp 軌域上（pKa 25），可以被 NaNH₂ 拿走，生成乙炔負離子。它是很好的親核基，可以對一級鹵烷做 SN2，延長碳鏈。這是有機合成中「接碳」的重要方法。</li></ol>` },
    { h: '哪一種烯最穩定？', w: 'hhyd', body: `
<p>同樣氫化成一個烷時，放出的熱（<b>氫化熱</b>）越少，表示起始的烯能量越低、越穩定。點選下圖各個烯比較：雙鍵上的烷基越多越穩定，反式比順式穩定。這個順序解釋了查依采夫規則，也可以用來排比較氫化熱的題目。</p>
<p>三種異構物 2-甲基-1-丁烯、2-甲基-2-丁烯、3-甲基-1-丁烯氫化都得到同一個產物 2-甲基丁烷，所以可以直接比較它們的氫化熱：取代最多的 2-甲基-2-丁烯放熱最少。</p>` },

/* ---------- 後中化學：α-碳化學與羰基縮合 ---------- */
CH.push({
  id: 'alpha', unit: 'o9b', title: 'α-碳與羰基縮合：烯醇離子造出 C–C 鍵',
  lede: '醛酮和羧酸衍生物都有兩副面孔：羰基碳是親電子基，旁邊的 α 碳拿掉 H⁺ 後卻變成親核基。讓一個分子的 α 碳去攻擊另一個分子的羰基碳，就能接出新的 C–C 鍵。這一章把醛醇、克來森、麥可、丙二酸酯合成都看成同一件事：烯醇離子進攻親電子基。',
  sections: [
    { h: '酮和烯醇是共振還是異構物？', body: `
<p>醛和酮會和自己的<b>烯醇</b>（C=C–OH）互相轉換：α-H 移到羰基 O 上，C=O 變成 C=C。這種只差一個 H 位置、快速互換的異構物稱為<b>互變異構</b>，它不是共振：原子真的移動了，兩者是不同的化合物。</p>
<p class="eq">CH₃–CO–CH₃（酮式） ⇌ CH₂=C(OH)–CH₃（烯醇式）</p>
<ul><li>一般的醛酮幾乎全部是酮式（C=O 比 C=C 強），丙酮的烯醇含量不到百萬分之一。</li>
<li>1,3-二羰基化合物（如 2,4-戊二酮）的烯醇可以和另一個羰基共軛，並形成分子內氫鍵，純液體中超過七成是烯醇式。</li>
<li>酸或鹼都能催化互變：酸先讓羰基 O 質子化、再拿走 α-H；鹼先拿走 α-H 形成烯醇離子、再讓 O 質子化。</li></ul>
<p>兩個常考的推論：</p>
<ul><li><b>α 位的掌性中心會消旋</b>：烯醇的 α 碳是平面 sp²，H 回來時從上下兩面機會相等。所以 (R)-3-甲基-2-戊酮在酸或鹼中放久了會變成外消旋混合物。</li>
<li><b>H/D 交換</b>：在 D₂O 和鹼中，<b>所有 α-H</b> 都會換成 D，其他 H 不變。2-甲基環己酮的 α-H 有 C2 上 1 個加 C6 上 2 個，共換入 3 個 D。</li></ul>` },
    { h: '不對稱的酮會在哪一側形成烯醇離子？', w: ['enolsel', 'alphaH'], body: `
<p>α-H 的酸性來自共軛鹼的共振：負電荷可以分到 O 上。羰基越多，酸性越強：第二張圖比較酯（約 25）、酮（約 19）、醛（約 17）與 1,3-二羰基化合物（9–13）。</p>
<p>用哪一種鹼，要比較 pKa（和有機酸鹼一章相同）：</p>
<ul><li><b>NaOH、NaOEt</b>（共軛酸 pKa 約 16）：對一般酮只生成少量烯醇離子，但已經足夠進行醛醇反應；對 1,3-二羰基化合物則幾乎完全去質子。</li>
<li><b>LDA</b>（二異丙基胺鋰，共軛酸 pKa 約 36）：強而龐大、親核性很差，能把酮、酯<b>完全且不可逆地</b>變成烯醇離子，再加鹵烷做烷基化。</li></ul>
<p>不對稱的酮有兩側 α-H，生成哪一種烯醇離子由條件決定：</p>
<ul><li><b>動力學控制</b>（LDA、−78 °C、不可逆）：拿走較不擁擠、H 較多那一側的 H，生成雙鍵取代較少的<b>動力學烯醇離子</b>。</li>
<li><b>熱力學控制</b>（較弱的鹼、室溫、可逆）：兩種烯醇離子達平衡，以雙鍵取代較多、較穩定的<b>熱力學烯醇離子</b>為主。</li></ul>
<p>若分子中有一個 CH 夾在兩個羰基之間，它的 H 比其他 α-H 酸得多，一當量的鹼就只會拿它：2-乙醯環己酮加 LDA（1 當量）和 CH₃I，甲基接在兩個羰基中間的碳上。</p>` },
    { h: 'α-鹵化與碘仿反應怎麼進行？', w: 'iodoform', body: `
<p>烯醇或烯醇離子也會攻擊 Br₂、Cl₂、I₂，把 α-H 換成鹵素：</p>
<ul><li><b>酸催化</b>：經由烯醇，速率決定步驟是形成烯醇，和鹵素濃度無關。接上一個鹵素後，鹵素的拉電子效應使羰基 O 較難質子化，所以<b>停在單取代</b>。</li>
<li><b>鹼性</b>：經由烯醇離子。接上鹵素後，剩下的 α-H 因為鹵素拉電子而<b>更酸</b>，反應越來越快，同一個碳上的 H 會全部被取代。</li></ul>
<p>甲基酮在鹼性中和 I₂ 反應時，CH₃ 變成 CI₃，接著 OH⁻ 攻擊羰基、把 CI₃⁻ 擠出去，生成羧酸根和黃色的<b>碘仿</b>（CHI₃）沉澱，這就是<b>碘仿反應</b>，可用來檢驗 CH₃CO– 結構。I₂ 在鹼中也是氧化劑，能把 CH₃CH(OH)– 氧化成 CH₃CO–，所以乙醇和 2-丙醇也呈陽性。</p>
<p>羧酸本身不易形成烯醇，要先用 PBr₃ 變成醯溴，再 α-溴化（<b>Hell–Volhard–Zelinskii 反應</b>），得到 α-溴羧酸；α-溴羧酸和 NH₃ 反應可以製備胺基酸。</p>` },
    { h: '怎麼在 α 碳上接烷基？', w: 'malonic', body: `
<p>烯醇離子和鹵烷進行 <b>SN2</b>，就在 α 碳上接了一個烷基。限制和 SN2 相同：只能用甲基、一級、烯丙基或苄基鹵烷；三級鹵烷只會脫去。</p>
<p>夾在兩個羰基之間的 CH₂ 最好用：用 NaOEt 就能完全去質子，而且只會在這個位置反應。烷基化之後，用酸水解並加熱：</p>
<ol><li>酯水解成羧酸，得到 <b>β-羰基羧酸</b>（或丙二酸）。</li>
<li>β-羰基羧酸加熱時經過六員環過渡狀態，失去 CO₂，這一步稱為<b>脫羧</b>，先生成烯醇再互變成羰基。</li></ol>
<ul><li><b>丙二酸酯合成</b>：CH₂(COOEt)₂ → R–CH₂–COOH，等於「把 R 接在乙酸上」。</li>
<li><b>乙醯乙酸酯合成</b>：CH₃COCH₂COOEt → R–CH₂–COCH₃，等於「把 R 接在丙酮上」。</li>
<li>烷基化可以做兩次（第二次接另一個 R'），得到 α 位有兩個取代基的產物。用 1,4-二溴丁烷做兩次分子內烷基化，還能接成環。</li></ul>` },
    { h: '醛醇反應怎麼把兩個分子接起來？', w: 'aldolmech', body: `
<p>當親電子基換成另一分子的醛或酮，就是<b>醛醇反應</b>。它就是親核加成（醛與酮一章）：親核基剛好是另一個羰基化合物的烯醇離子。</p>
<ul><li>加成產物是 <b>β-羥基醛或酮</b>（OH 在羰基的 β 碳上）。</li>
<li>加熱後脫去一分子水，生成 <b>α,β-不飽和羰基化合物</b>，稱為<b>醛醇縮合</b>。C=C 和 C=O 共軛，是脫水的驅動力。</li>
<li>反過來，β-羥基羰基在鹼中也能裂成兩個羰基化合物（逆醛醇），醣解作用中果糖-1,6-雙磷酸被醛縮酶切成兩個三碳醣，就是逆醛醇反應。</li></ul>
<p>判斷醛醇產物的方法：把產物 α,β 位置的 C=C（或 Cα–Cβ 鍵）切開，β 碳變回 C=O，α 碳補回兩個 H，就得到原本的兩個羰基化合物。</p>` },
    { h: '還有哪些羰基縮合反應？', w: 'condtab', body: `
<p>只要換掉親核基或親電子基，就得到一系列反應。它們的共同步驟都是「烯醇離子的碳進攻一個缺電子的碳」：</p>
<ul><li><b>交叉醛醇</b>：兩個不同的醛酮都能形成烯醇時，會得到四種產物的混合物。實用的做法是讓其中一方<b>沒有 α-H</b>（苯甲醛、甲醛），只能當親電子基。</li>
<li><b>分子內醛醇</b>：二羰基化合物自己接成環，以五員和六員環為主。</li>
<li><b>克來森縮合</b>：兩分子酯反應，四面體中間物把 EtO⁻ 擠出去（親核醯基取代），得到 <b>β-酮酯</b>。產物的 α-H（pKa 約 11）被鹼拿走，這一步把平衡拉向產物，所以要用一整當量的鹼。</li>
<li><b>迪克曼縮合</b>：分子內的克來森縮合，1,6-二酯生成五員環、1,7-二酯生成六員環。</li>
<li><b>麥可加成</b>：穩定的烯醇離子加到 α,β-不飽和羰基的 β 碳（1,4-共軛加成），得到 1,5-二羰基化合物。</li>
<li><b>羅賓森環化</b>：麥可加成接著分子內醛醇縮合，一次造出一個環己烯酮，常用來合成類固醇。</li>
<li><b>曼尼希反應</b>：烯醇攻擊由甲醛和胺生成的亞胺離子，得到 β-胺基羰基化合物。</li>
<li><b>交叉克來森</b>：用沒有 α-H 的酯當親電子基：甲酸乙酯（接上 –CHO）、碳酸二乙酯（接上 –COOEt）、草酸二乙酯（接上 –COCOOEt）。</li>
<li><b>斯托克烯胺</b>：酮與二級胺（如吡咯啶、Et₂NH）形成烯胺，烯胺的 α 碳是溫和的親核基，可做烷基化或麥可加成，最後水解回酮。</li>
<li><b>不是酯的縮合</b>：安息香縮合（兩分子苯甲醛，CN⁻ 催化）得到 α-羥基酮；醯偶姻縮合則由兩分子酯與 Na 金屬得到 α-羥基酮。</li></ul>
<p>同一個烯醇離子可能有兩種反應競爭：與鹵烷的 α-取代，或與羰基的縮合。要避免縮合、只做 α-取代時，用 LDA 在低溫下一次把羰基化合物完全變成烯醇離子，再加入鹵烷；要做縮合時，則用催化量的鹼，讓烯醇離子與未反應的羰基同時存在。</p>` },
    { h: '體內哪裡用到羰基縮合？', body: `
<ul><li><b>脂肪酸合成</b>：乙醯-CoA 先羧化成丙二醯-CoA，再和另一個醯基進行類似克來森的縮合，同時脫羧，一次接上兩個碳。這就是脂肪酸幾乎都是偶數碳的原因。</li>
<li><b>檸檬酸循環</b>：檸檬酸合成酶讓乙醯-CoA 的 α 碳（烯醇形式）加到草醯乙酸的酮基上，是一種醛醇型反應。</li>
<li><b>醣解與糖質新生</b>：醛縮酶催化的就是醛醇與逆醛醇反應；第一型醛縮酶用離胺酸和受質形成亞胺，再生成烯胺當親核基。</li>
<li><b>酮體</b>：兩分子乙醯-CoA 經硫酯的克來森縮合生成乙醯乙醯-CoA；乙醯乙酸是 β-酮酸，會自發脫羧生成丙酮，所以酮酸中毒的病人呼吸有丙酮味。</li></ul>` },

    { h: '胺的鹼性由什麼決定？', w: 'basic', body: `
<p>胺依 N 上接幾個碳分為一級（RNH₂）、二級（R₂NH）、三級（R₃N）；接四個碳帶正電的是<b>四級銨鹽</b>（R₄N⁺）。N 是 sp³，孤對電子佔一個位置，形狀像氨的三角錐。</p>
<p>胺的鹼性用<b>共軛酸的 pKa</b>（pKaH）表示，越大越鹼。決定因素就是孤對電子「多自由」：</p>
<ul><li>烷基推電子：烷胺（pKaH 約 10–11）比氨（9.25）稍強。在水中二級胺最強（(CH₃)₂NH 10.7）：三級胺推電子最多，但銨離子上只剩一個 N–H，被水溶劑化穩定的程度最差；</li><li>脒、胍（如精胺酸側鏈，pKaH 約 12.5）質子化後正電荷由兩、三個 N 共振分擔，是最強的中性有機鹼；</li><li>孤對電子和苯環共振：苯胺只有 4.6；</li><li>孤對電子和羰基共振：醯胺幾乎不是鹼；</li><li>孤對電子在 sp² 軌域：吡啶 5.2；孤對電子是芳香 π 系統的一部分：吡咯幾乎沒有鹼性。</li></ul>
<p>注意：三個 N 上的基團都不同時，N 理論上是掌性中心，但 N 會經過平面的過渡狀態快速翻轉（每秒數十億次），兩個鏡像異構物無法分離。四級銨鹽沒有孤對電子，才可能分離。</p>` },

<p>胺的質子化平衡也遵守 Henderson–Hasselbalch 方程式（酸鹼一章）：</p>
<p class="eq">pH = pKaH + log([R–NH₂] ÷ [R–NH₃⁺])</p>
<p>pH 比 pKaH 低時，胺大多以帶正電的銨離子存在；比 pKaH 高時大多是中性胺。這解釋了：</p>
<ul><li>胺類藥物常做成<b>鹽酸鹽</b>，以帶電形式增加水溶性、利於製成注射液；</li><li>只有<b>中性形式</b>能穿過脂質細胞膜，所以弱鹼性藥物在胃（強酸）中幾乎不吸收，主要在腸道吸收；</li><li>胺基酸在生理 pH 下同時帶 –NH₃⁺ 與 –COO⁻，是<b>兩性離子</b>（生物分子一章）。</li></ul>
<p>實驗室常用這個性質分離胺：加酸讓胺變成鹽溶入水層，和中性有機物分開，再加鹼把胺放回有機層。</p>` },

<p>胺的化學幾乎都來自兩個身份：</p>
<ul><li><b>親核基</b>：攻擊鹵烷（烷基化）、醯氯（醯胺化）、醛酮（亞胺、還原胺化）。</li><li><b>鹼</b>：接受質子，生成銨鹽。</li></ul>
<p>製備胺的難題是直接用 NH₃ 烷基化會一直加下去（產物比原料更親核），所以常用間接方法：加布瑞爾合成、還原胺化，或先做出醯胺、腈、硝基化合物再還原。</p>
<p>胺類的沸點：一級 > 二級 > 三級（同分子量時），因為 N–H 越多分子間氫鍵越多；三級胺沒有 N–H，沸點和同分子量的烷差不多。N–H 氫鍵比 O–H 弱，所以胺的沸點比醇低。</p>
<p>由醯胺製備<b>少一個碳</b>的胺：霍夫曼重排（RCONH₂ + Br₂ + NaOH）、庫爾提斯重排（醯基疊氮 RCON₃ 加熱）、洛森重排（羥肟酸衍生物），三者都經過<b>異氰酸酯</b> R–N=C=O，水解後放出 CO₂ 得到 RNH₂。沃爾夫重排（α-重氮酮）則經過<b>烯酮</b>，不產生異氰酸酯。</p>

  sections: [
    { h: '哪些環有芳香性？', w: 'huckel', body: `
<p>苯的共振混成讓 π 電子分布在整個環上，額外穩定（氫化熱比三個獨立雙鍵少約 150 kJ/mol）。不是所有環狀共軛分子都有這種穩定性，判斷<b>芳香性</b>要同時符合四個條件：</p>
<ol><li>環狀；</li><li>平面；</li><li>環上每個原子都有 p 軌域（完全共軛）；</li><li>π 電子數為 <b>4n + 2</b>（2、6、10…），稱為<b>休克耳規則</b>。</li></ol>

<p>數 π 電子時要小心雜原子：吡咯的 N 孤對電子在 p 軌域、算進 π 系統；吡啶的 N 孤對電子在 sp² 軌域、不算。這也決定了誰有鹼性。右邊的弗羅斯特圓顯示：4n + 2 時所有成鍵軌域剛好填滿。例如五員環有 5 個 π 分子軌域，其中 3 個成鍵：環戊二烯負離子 6 個電子剛好填滿，陽離子只有 4 個電子，是反芳香性。</p>
<p>苯的六個 C–C 鍵長都相同（139 pm，介於單鍵與雙鍵之間），所有 C–C–C 鍵角 120°、分子為平面：它不是「單雙鍵交替」的環。多環芳香烴如萘（C₁₀H₈）、蒽、菲也是芳香性的；萘有兩種不同的位置（1 號 α 位與 2 號 β 位），所以單取代產物只有 2 種，親電子取代主要在 α 位。</p>` },

/* ---------- 後中化學：原子結構與週期性 ---------- */
CH.push({
  id: 'atom', unit: 'g1', title: '原子結構與週期性',
  lede: '化學性質由電子決定。這一章從原子的組成開始，用光譜看見「能量是一格一格的」，再用量子數描述軌域、把電子一個個填進去，最後解釋半徑、游離能、電負度的週期規律。',
  sections: [
    { h: '原子由什麼組成？', w: ['nuclide', 'isoavg'], body: `
<p>原子中央是帶正電的原子核（質子＋中子），外面是帶負電的電子。三個數字就能算出所有粒子：</p>
<p class="eq">質子數 = 原子序 Z　　中子數 = 質量數 A − Z　　電子數 = Z − 電荷</p>
<p>Z 相同而 A 不同的原子互為<b>同位素</b>。週期表上的原子量是各同位素質量依天然豐度的加權平均：第二張圖的長條高度是豐度，平均值畫在質量軸上。</p>
<p>原子模型的演進：<b>道耳頓</b>的原子說只談「原子」本身（元素由不可分割的原子組成、同元素原子相同、化合物由固定比例的原子組成、反應只是原子重新排列），還沒有電子、質子、中子與同位素的概念；之後湯姆森發現電子，拉塞福用 α 粒子散射發現原子核，查兌克發現中子。</p>` },
    { h: '波長越短，光的能量越大嗎？', w: 'emspec', body: `
<p>光是電磁波。波長 λ 越短，頻率 ν 越高，每個光子的能量越大：</p>
<p class="eq">c = λν　　E = hν = hc/λ　　E（kJ/mol）≈ 119,600 ÷ λ（nm）</p>
<p>拖動滑桿看各區的波長與能量。考試常問兩件事：電磁波譜的排序，以及「打斷一個化學鍵最少需要多長波長的光」（把鍵能 kJ/mol 換成單一光子的能量，再用 λ = hc/E）。</p>
<p>金屬鹽在火焰中加熱時，電子被激發後掉回低能階，<b>放出</b>特定顏色的光（<b>焰色</b>）。煙火的顏色就是這些金屬鹽的放射光：</p>
<p class="flames"><span><i style="background:#D81B60"></i>鋰</span><span><i style="background:#F2C230"></i>鈉</span><span><i style="background:#B28DD6"></i>鉀</span><span><i style="background:#E8742A"></i>鈣</span><span><i style="background:#D3262E"></i>鍶</span><span><i style="background:#9CC63A"></i>鋇</span><span><i style="background:#2BA59A"></i>銅</span></p>` },
    { h: '氫原子的光為什麼是一條一條的？', w: 'hspec', body: `
<p>把氫氣通電，發出的光經過稜鏡不是連續的彩虹，而是幾條特定顏色的線。這代表電子只能待在某些特定能量（能階），從高能階掉到低能階時，放出的光子能量剛好等於能階差。波耳模型對只有一個電子的粒子（H、He⁺、Li²⁺…）給出：</p>
<p class="eq">Eₙ = −13.6 eV × Z²/n²　　rₙ = 0.529 Å × n²/Z　　ΔE = hc/λ</p>
<p>能量越大，波長越短。掉到 n = 2 的幾條線（巴耳末系）落在可見光，其中 3 → 2 是 656 nm 的紅線；掉到 n = 1 的在紫外光。n → ∞ 時能量為 0，代表電子脫離原子，所以基態氫原子的游離能是 13.6 eV（1312 kJ/mol），He⁺ 是它的 Z² = 4 倍。切換粒子看看能量和半徑怎麼隨 Z 改變。</p>` },
    { h: '為什麼電子的能量只能取特定值？', w: 'pbox', body: `
<p>電子有波的性質。把一個粒子關在長度 L 的一維箱子裡，波在兩端必須為 0，只能放進整數個半波長，能量因此只能取特定值：</p>
<p class="eq">Eₙ = n²h² / (8mL²)　　n = 1, 2, 3…</p>
<p>拖動箱子長度、切換躍遷：能階間距和 n² 成正比，最小激發能（1 → 2）是 3h²/(8mL²)；L 越大，能階越密。</p>` },
    { h: '電子的狀態用哪四個量子數描述？', w: 'qn', body: `
<p>主量子數 n（1, 2, 3…）決定殼層與能量；角量子數 ℓ（0 到 n−1，依序稱 s、p、d、f）決定形狀；磁量子數 mℓ（−ℓ 到 +ℓ）決定方向；自旋量子數 ms 為 +½ 或 −½。在圖上依序點選 n、ℓ、mℓ：不符合規則的按鈕會變灰，卡片顯示軌域數、最多電子數與節面數。</p>
<p>由規則直接推出：沒有 1p、2d、3f（ℓ 必須小於 n）；n、ℓ 確定的副層有 2ℓ+1 個軌域、最多 2(2ℓ+1) 個電子；n、ℓ、mℓ 都確定時只剩一個軌域。</p>
<p><b>節點</b>是電子出現機率為 0 的地方：角節面（平面）有 ℓ 個，徑向節點（球面）有 n − ℓ − 1 個，合計 n − 1 個。所以 3s 沒有節面、有 2 個球面節點；4d 有 2 個節面。徑向節點的位置可以由波函數為 0 求出，例如氫原子 2s 的節點在 r = 2a₀（a₀ 為波耳半徑）。</p>` },
    { h: '電子怎麼填進軌域？', w: 'econf', body: `
<p>多電子原子中，同一層的副層能量不同：s &lt; p &lt; d。填電子的順序是 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p → 6s → 4f → 5d → 6p，遵守三個規則：</p>
<ul><li><b>構築原理</b>：先填能量低的軌域。</li><li><b>包立不相容原理</b>：每個軌域最多兩個電子，自旋相反。</li><li><b>洪德定則</b>：同一副層的軌域，先每格各填一個、自旋平行，再成對。</li></ul>
<p>拖動原子序或按下方按鈕，也可以選擇離子的電荷。要記的例外：Cr、Mo 是 d⁵s¹，Cu、Ag、Au 是 d¹⁰s¹，Pd 是 4d¹⁰（半滿、全滿的 d 副層較穩定）。第六週期在 6s 之後先填 4f 再填 5d，例如 W 是 [Xe]4f¹⁴5d⁴6s²。</p>
<p>離子：過渡金屬先失去 n 最大的 s 電子（Fe²⁺ 是 [Ar]3d⁶）；主族元素得失電子後常和鈍氣<b>等電子</b>（F⁻、Ne、Na⁺、Mg²⁺ 都是 1s²2s²2p⁶）。電子沒有填在能量最低的位置稱為<b>激發態</b>，例如 O 的 1s²2s²2p³3s¹。由最後填入的副層可以判斷元素在週期表的哪一區：[Kr]4d¹⁰5s²5p² 屬 p 區第 14 族（錫），是金屬。</p>
<p>未成對電子數決定磁性：有未成對電子的物質會被磁場吸引（順磁性）。</p>` },
    { h: '半徑、游離能、電負度為什麼有週期規律？', w: 'trend', body: `
<p>週期表上的規律都能用<b>有效核電荷</b>解釋（最外層電子實際感受到的原子核吸引力 ≈ 質子數 − 內層電子的遮蔽）。</p>
<ul><li><b>同週期由左到右</b>：質子變多，新增電子在同一層、遮蔽效果差 → 有效核電荷變大 → 半徑變小、游離能變大、電負度變大。</li>
<li><b>同族由上到下</b>：多一層電子，最外層離原子核越來越遠 → 半徑變大、游離能變小、電負度變小。</li></ul>
<p>游離能有兩處凹陷：Be &gt; B、Mg &gt; Al（p 電子比 s 電子容易拿走），N &gt; O、P &gt; S（成對電子互相排斥）。</p>
<p>電負度以 F 最大（3.98），左下角的 Cs、Fr 最小。過渡金屬的電負度大多在 1.5–2.3 之間，大致隨原子序增加；Au 特別高（2.54）。</p>
<p>同族元素性質相似，可以用來預測未知元素：例如原子序 119 的元素應落在第 1 族，是會與水反應放出 H₂ 的鹼金屬，形成 +1 價離子。</p>` },
    { h: '離子比原子大還是小？', w: 'ionrad', body: `
<p>陽離子比原來的原子小（失去電子，常常整層失去），陰離子比原來的原子大（電子變多、互相排斥）。</p>
<p>電子數相同的<b>等電子</b>系列中，只有質子數不同：質子越多，把同樣的電子拉得越緊，半徑越小。O²⁻ &gt; F⁻ &gt; Na⁺ &gt; Mg²⁺ &gt; Al³⁺ 是最常考的排序。</p>` },
    { h: '從連續游離能怎麼看出價電子數？', w: 'succie', body: `
<p>一個一個拿走電子，每次需要的能量 I₁ &lt; I₂ &lt; I₃ …（剩下的電子被越來越少的電子分擔遮蔽、離子帶正電越多）。價電子拿完後，下一個要從內層拿，游離能會突然暴增。找出最大的跳躍，就知道價電子數和族。</p>
<p>游離（X → X⁺ + e⁻）一定吸熱，ΔH &gt; 0，第二游離能更吸熱。<b>電子親和力</b>是原子得到電子的能量變化：多數非金屬得到第一個電子會放熱（O + e⁻ → O⁻，ΔH &lt; 0），但再加第二個電子（O⁻ → O²⁻）要克服負電排斥，是吸熱的。</p>
<p>已經是鈍氣組態的離子（Na⁺、Mg²⁺）再拿電子要從內層拿，所需能量遠大於陰離子（F⁻、Cl⁻）失去電子。</p>` },

CH.push({
  id: 'biomol', unit: 'o12', title: '生物分子與合成策略',
  lede: '醣、蛋白質、脂質、核酸，都是前面學過的官能基與反應在生物體內的應用：半縮醛、醯胺、酯、Henderson–Hasselbalch。最後一節把整門課串起來：怎麼設計一條合成路線。',
  sections: [
    { h: '醣為什麼是環狀的？', w: ['sugar', 'mutarot'], body: `
<p>醣是多羥基醛或多羥基酮。葡萄糖在水中幾乎全部以<b>環狀</b>存在：C5 的 OH 攻擊 C1 的醛基，形成六元環的半縮醛（醛酮一章的親核加成）。</p>
<ul><li><b>D／L</b>：費雪投影中，離羰基最遠的掌性碳（葡萄糖的 C5）OH 在右為 D。天然醣幾乎都是 D 型。</li>
<li><b>α／β 變旋異構物</b>：環化時 C1 變成新的掌性中心。</li>
<li><b>醣苷鍵</b>：半縮醛的 OH 和另一個醇形成縮醛，就是雙醣、多醣之間的連接。縮醛在鹼中穩定、在酸中水解。</li>
<li><b>還原醣</b>：有游離半縮醛（能打開成醛）的醣，能還原多侖試劑或本氏液。蔗糖的兩個變旋碳都用在醣苷鍵上，所以不是還原醣。</li>
<li><b>變旋現象</b>：第二張圖拉動 α／β 的比例，看平衡時的旋光度。</li></ul>
<p>環狀葡萄糖（哌喃糖）有 5 個掌性碳（C1–C5），開鏈形式只有 4 個（C2–C5）。核糖（開鏈）有 3 個掌性碳。醛糖的碳鏈可以加長或縮短：基利亞尼–費雪合成在 C1 加一個碳（得到一對 C2 差向異構物）；佛爾降解移除 C1，所以 D-半乳糖與 D-塔羅糖（C2 差向異構物）降解後都得到 D-來蘇糖。</p>` },
    { h: '胺基酸的電荷怎麼隨 pH 改變？', w: 'aa', body: `
<p>胺基酸有 α-胺基與 α-羧基，在生理 pH 下以<b>兩性離子</b>存在（胺類一章）。側鏈決定胺基酸的性質：非極性、極性、酸性（Asp、Glu）、鹼性（Lys、Arg、His）。</p>
<p>每個可解離基團都是一個酸鹼平衡，整個分子的電荷隨 pH 改變。淨電荷為零的 pH 稱為<b>等電點 pI</b>：</p>
<ul><li>中性胺基酸：pI = (pKa₁ + pKa₂) ÷ 2；</li><li>酸性胺基酸：取兩個羧基 pKa 的平均；鹼性胺基酸：取兩個胺基 pKa 的平均。</li></ul>
<p>胺基酸以<b>醯胺鍵</b>（胜肽鍵）相連成蛋白質。醯胺的共振使胜肽鍵平面且不能旋轉（結構一章），這限制了蛋白質主鏈的形狀，進而決定 α 螺旋、β 摺板等二級結構（由氫鍵穩定）。除了甘胺酸，天然胺基酸的 α 碳都是掌性中心，幾乎都是 L 型（多數為 S 構型；半胱胺酸因含 S 而為 R）。</p>` },
    { h: '雙醣與多醣怎麼區分？', w: ['disac', 'sugarrel'], body: `
<p>醣苷鍵的位置（1→4、1→6）與方向（α、β）決定了醣的性質。第一張圖比較常見的雙醣與多醣；第二張圖比較兩個單醣的費雪投影，判斷它們是鏡像、差向還是其他非鏡像異構物。例如 D-葡萄糖與 D-半乳糖是 C4 差向異構物，D-葡萄糖與 D-甘露糖是 C2 差向異構物。四碳醣只有兩個掌性碳：兩個 OH 在同側的是<b>赤藻糖</b>（erythrose），在兩側的是<b>蘇糖</b>（threose）；再看最下面那個掌性碳的 OH 在右（D）或左（L）。</p>` },
    { h: '細胞怎麼用磷酸化合物儲存能量？', w: 'hiP', body: `
<p>ATP 水解放出約 30.5 kJ/mol 的自由能，是細胞的「能量貨幣」。有些磷酸化合物的水解放出更多能量，可以直接把磷酸基團轉給 ADP，稱為受質層次磷酸化，下圖比較常見的幾種。</p>
<p>生化反應也常考立體：檸檬酸 HOOC–CH₂–C(OH)(COOH)–CH₂–COOH 的中心碳接了兩個相同的 CH₂COOH，分子有鏡面，<b>沒有光學活性</b>；但酵素能分辨這兩個相同的基團（前掌性），所以順烏頭酸酶加水得到的異檸檬酸有兩個掌性中心，<b>只生成一種立體異構物</b>。</p>` },
    { h: '藥物與天然物有哪些常見骨架？', w: ['scaffold', 'drugs'], body: `
<p>中藥與天然物常見<b>苯并含氧雜環</b>：黃酮、異黃酮、色酮、香豆素、橙酮。第一張圖比較它們的差別。第二張圖整理常考的藥物結構特徵。</p>
<p>天然物的反應也常用前面學過的觀念判斷：α,β-不飽和羰基的 β 碳會被親核基進攻（麥可加成）；縮醛在酸中水解成醛和醇，例如聚丙烯透明劑 Millad 是山梨醇與芳香醛形成的縮醛，酸催化水解得到醛及醇。</p>` },
    { h: '胜肽怎麼定序？蛋白質結構靠什麼維持？', body: `
<ul><li><b>寫法</b>：胜肽從 <b>N 端</b>（游離 –NH₃⁺）寫到 <b>C 端</b>（游離 –COO⁻），例如 Gly–Ala–Phe。催產素是含一個雙硫鍵的九胜肽。</li>
<li><b>艾德曼降解</b>：苯基異硫氰酸酯（PITC）只和 N 端的胺基反應，切下第一個胺基酸成為苯基硫乙內醯脲（PTH）衍生物，其餘胜肽不受影響，重複即可逐一定序。</li>
<li><b>胜肽合成</b>：用 DCC 等偶合劑活化羧基形成醯胺鍵，胺基先用 Boc 或 Fmoc 保護。</li>
<li><b>檢驗</b>：茚三酮與 α-胺基酸加熱生成紫色產物（脯胺酸是二級胺，呈黃色）。</li>
<li><b>結構層次</b>：一級結構是胺基酸序列（以胜肽鍵相連）；二級結構（α 螺旋、β 摺板）由主鏈 C=O 與 N–H 之間的<b>氫鍵</b>維持，α 螺旋中每個 C=O 和往後第 4 個胺基酸的 N–H 形成氫鍵；三級結構由側鏈之間的作用維持，其中<b>雙硫鍵</b>是共價鍵，最強；四級結構是多條鏈的組合。</li>
<li>甘胺酸的側鏈是 H，是唯一沒有掌性的胺基酸；脯胺酸的胺基接在環上（二級胺）。</li></ul>` },
    { h: '脂質、萜類與核酸有什麼結構特徵？', w: ['bases', 'dnaseq'], body: `
<p><b>脂質</b>：</p>
<ul><li><b>三酸甘油酯</b>（油脂）是甘油與三個脂肪酸形成的<b>酯</b>。鹼性水解（皂化）得到肥皂（羧酸鈉）與甘油（羧酸衍生物一章）。</li>
<li>飽和脂肪酸的長鏈可以緊密排列，熔點高（動物脂肪在室溫是固體）；不飽和脂肪酸的<b>順式</b>雙鍵讓鏈彎曲，排列鬆散，熔點低（植物油是液體）。部分氫化產生的反式脂肪則又能緊密排列。</li>
<li><b>磷脂</b>有親水的頭（磷酸與胺）和疏水的尾，在水中自動排成雙層膜：細胞膜的基礎。</li>
<li><b>類固醇</b>（膽固醇、性激素、皮質醇）都有相同的四環骨架。</li>
<li><b>萜類</b>由五碳的異戊二烯單元首尾相接：單萜 C₁₀（薄荷醇、樟腦、檸檬烯）、倍半萜 C₁₅（法尼醇，3 個單元）、二萜 C₂₀（視網醇／維生素 A）、三萜 C₃₀（角鯊烯，類固醇的前驅物）。</li>
<li><b>花生四烯酸</b> C₂₀H₃₂O₂ 是前列腺素的前驅物：不飽和度 5，其中 1 個是 C=O，所以有 4 個 C=C。</li></ul>
<p><b>核酸</b>：</p>
<ul><li>核苷酸 = 含氮鹼基 + 五碳醣（DNA 是去氧核糖、RNA 是核糖）+ 磷酸；核苷酸之間以<b>磷酸二酯鍵</b>相連。</li>

<p>第二週期元素（C、N、O）周圍最多 8 個電子（八隅），這是判斷結構對不對的第一道檢查。</p>` },

<p>先數原子周圍的<b>電子區域</b>：每個 σ 鍵算一個（雙鍵、參鍵也只算一個），每對孤對電子算一個。區域數決定混成與形狀：</p>
<ul><li><b>4 個 → sp³</b>：四面體，約 109.5°。</li><li><b>3 個 → sp²</b>：平面三角形，120°，剩一個 p 軌域可以形成 π 鍵。</li><li><b>2 個 → sp</b>：直線，180°，剩兩個 p 軌域形成兩個 π 鍵。</li></ul>
<p>兩個觀念之後一直會用到：</p>
<ol><li><b>π 鍵在 p 軌域上，位於鍵軸的上下</b>，比 σ 鍵弱、離原子核遠，所以 π 電子容易被親電子試劑攻擊（烯烴加成的基礎）。</li>

<p>畫共振結構的規則：</p>
<ol><li><b>只移動電子（π 電子和孤對電子），原子不動</b>。σ 鍵不移動。</li>
<li>用彎箭頭表示電子對從哪裡移到哪裡：從孤對或 π 鍵出發，指向原子之間（形成新鍵）或原子上（變成孤對）。</li>

<p>共振不是分子在幾個結構之間「切換」，而是電子同時分散在這些位置。<b>電荷或電子越能分散，分子越穩定</b>：這一句話會解釋酸性、鹼性、碳陽離子穩定度和芳香性。</p>` },

/* ---------- 後中化學：醛與酮 ---------- */
CH.push({
  id: 'carbonyl', unit: 'o8', title: '醛與酮：羰基的親核加成',
  lede: '羰基 C=O 是有機化學的十字路口：碳帶正電、可以被親核基加成；旁邊的 α-氫有酸性、可以變成親核基。這一章只用這兩個性質，就能推出還原、格里納、縮醛、亞胺、醛醇縮合等反應。',
  sections: [
    { h: '親核基怎麼加到羰基上？', w: 'nucadd', body: `
<p>O 的電負度大，C=O 的電子偏向 O，碳帶部分正電。加上羰基碳是平面的，上下兩面都敞開，親核基很容易靠近。</p>
<p>常見的親核基有 H⁻（來自 NaBH₄）、R⁻（來自格里納試劑 RMgBr）、CN⁻。親核加成的兩步：</p>
<ol><li>親核基攻擊羰基碳，π 電子推到 O 上，生成四面體的烷氧離子（sp² → sp³）；</li><li>O 接上 H⁺，得到醇。</li></ol>
<p>和鹵烷不同：醛、酮的羰基碳上沒有好的離去基（H⁻ 和 R⁻ 是極強的鹼，不會離開），所以反應停在<b>加成</b>，不會變成取代。這一點在下一章的羧酸衍生物（有離去基）會完全不同。</p>
<p>平面的羰基被親核基從上或下進攻，機會相等；如果產物生成新的掌性中心，會得到外消旋混合物。</p>` },
    { h: '為什麼醛比酮活潑？', w: 'hydrate', body: `
<p>同樣的反應，醛通常比酮快、平衡也更偏向加成產物。兩個原因：</p>
<ul><li><b>立體</b>：醛的羰基碳上有一個 H，比烷基小得多。加成後碳變成四面體，四個基團擠在一起，酮擠得更厲害。</li>
<li><b>電子</b>：烷基會推電子，讓羰基碳的正電性變小。酮有兩個烷基，醛只有一個。</li></ul>
<p>反過來，接上拉電子基（例如 CF₃）會讓羰基更活潑。用「加水變成水合物的程度」最能看出差別。</p>` },
    { h: '不同試劑加到羰基上會得到什麼？', w: 'carbmap', body: `
<p>有些親核基加上去之後，四面體中間物還能失去水，形成新的雙鍵或再接一個親核基：</p>
<ul><li><b>醇</b>（酸催化）：先成<b>半縮醛</b>，OH 質子化後以水離開，形成碳陽離子（被 O 的孤對電子共振穩定），再接上第二個醇，得到<b>縮醛</b>。整個過程可逆：去除水就形成縮醛，加大量水就分解。縮醛在鹼性中很穩定，所以常用來暫時「保護」羰基。葡萄糖的環狀結構就是分子內的半縮醛。</li>
<li><b>一級胺</b>：加成後脫去水，形成 <b>C=N</b> 的亞胺（席夫鹼）。體內許多酵素（例如胺基轉移酶的維生素 B₆）都用亞胺來抓住受質。</li></ul>
<p>選擇圖中的試劑，看丙酮變成什麼。判斷可逆與否的原則：加上去的親核基如果也是不錯的離去基（ROH、H₂O、CN⁻），反應就可逆；H⁻、R⁻ 加上去就不會再離開。</p>` },
    { h: '用格里納試劑合成醇要怎麼拆？', w: 'grig', body: `
<p>格里納試劑 RMgBr 由鹵烷與 Mg 在無水乙醚中製得，C–Mg 鍵的碳帶部分負電，相當於 R⁻。它是強鹼，遇到水、醇、羧酸、胺的 H 會立刻被破壞，所以分子中不能有這些基團，反應後才加 H₃O⁺。</p>
<p>由目標醇反推：切開接 OH 的碳和它的一個碳基團，那個基團就來自 RMgBr。下圖切換目標，看有幾種組合。格里納試劑和酯反應兩次、和環氧乙烷反應多接兩個碳、和 CO₂ 反應得到羧酸。</p>
<p>還原劑的強弱也要分清楚：<b>NaBH₄</b> 只還原醛、酮；<b>LiAlH₄</b> 還能還原酯、羧酸、醯胺；<b>DIBAL-H</b> 在 −78 °C 只加一次 H⁻，把酯停在醛。α,β-不飽和酮則有兩個親電子位置：格里納試劑與 LiAlH₄ 進攻羰基碳（1,2-加成），二烷基銅鋰 R₂CuLi（吉爾曼試劑）進攻 β 碳（1,4-加成，共軛加成），得到 β 位多一個烷基的酮。</p>` },
    { h: '怎麼用試劑分辨醛和酮？', w: 'ctest', body: `
<p>醛的羰基碳上有 H，容易被氧化成羧酸，這是分辨醛與酮的關鍵。切換下圖的化合物，看四種試驗的結果。小分子的醛酮（甲醛、乙醛、丙酮）因為 C=O 能和水形成氫鍵，和水互溶；碳數增加後溶解度迅速下降。</p>` },
    { h: 'α-氫為什麼是酸性的？', w: 'alphaH', body: `
<p>和羰基相鄰的碳叫 α 碳，上面的 H 意外地酸（丙酮約 pKa 19，一般 C–H 約 50），因為拿走 H⁺ 後的負電荷可以共振到 O 上，形成<b>烯醇離子</b>。</p>
<p>烯醇離子是很好的親核基（碳那一端進攻）。它攻擊另一分子的羰基碳，就是<b>醛醇加成</b>：兩個醛接成 β-羥基醛，加熱再脫去水，得到 α,β-不飽和醛（<b>醛醇縮合</b>）。這是形成 C–C 鍵的核心反應，也是體內醣解作用中醛縮酶的反應。</p>
<p>另外，醛、酮和它的<b>烯醇</b>形式（C=C–OH）之間存在<b>互變異構</b>平衡，通常強烈偏向酮式。炔烴水合會先得到烯醇，然後立刻變成酮，就是這個原因。</p>` },
  ],

    { q: '丙酮與 CH₃MgBr 反應後再酸處理，產物是？', o: ['2-甲基-2-丙醇（三級醇）', '2-丙醇（二級醇）', '1-丙醇', '丁酮'], a: 0,

CH.push({

  lede: '硫酸銅為什麼是藍的？為什麼有的錯合物有順磁性、有的沒有？答案都在中心金屬的五個 d 軌域裡。這一章的每張圖都可以自己操作，公式中的每一項都對應到圖上的長度或位置。',
  sections: [
    { h: '加 AgNO₃ 會沉澱幾個 Cl⁻？', w: ['ligand', 'cname'], body: `
<p>錯合物由中心金屬離子和周圍的<b>配位基</b>組成：配位基提供孤對電子，和金屬形成配位共價鍵。直接和金屬鍵結的原子數稱為<b>配位數</b>。</p>
<p>化學式中，配位在金屬上的寫在方括號裡；方括號外的是<b>外界離子</b>，只負責平衡電荷，溶於水會解離。所以 AgNO₃ 只會和方括號<b>外面</b>的 Cl⁻ 生成沉澱。</p>
<p>一個配位基用幾個原子同時和金屬鍵結，就稱為幾牙配位基：H₂O、NH₃、Cl⁻、CN⁻、CO 是<b>單牙</b>；en（H₂NCH₂CH₂NH₂）、草酸根 C₂O₄²⁻、乙醯丙酮根 acac⁻ 是<b>雙牙</b>；EDTA⁴⁻ 用 2 個 N 和 4 個 O，是<b>六牙</b>。</p>
<p>第一張圖切換不同的配位基，圈起來的是和金屬鍵結的原子。配位數 = 各配位基的牙數總和，例如 [Cr(C₂O₄)₂(H₂O)₂]⁻ 是 2×2 + 2×1 = 6。</p>
<p>下圖把錯合物畫成結構：方括號框裡是金屬與配位基，框外的虛線圓是外界離子。圖下方的兩行算式對應圖上的兩層：錯離子的電荷由框外決定，再減去配位基的電荷就是金屬的氧化數。再由<b>d 電子數 = 族數 − 氧化數</b>得到 dⁿ，例如 Ni²⁺、Pd²⁺、Pt²⁺ 都是 d⁸，Co³⁺ 是 d⁶，Fe³⁺ 是 d⁵。</p>
<p>用實驗數據推結構時：AgNO₃ 沉澱的莫耳數 = 外界 Cl⁻ 數；導電度或凝固點下降（i 值）= 溶液中的粒子數；金屬的質量百分率可以求出整個化合物的莫耳質量。</p>` },
    { h: '名字怎麼念？', body: `
<p>命名順序：<b>配位基（照英文字母排）→ 金屬 →（氧化數）</b>，方括號外的離子照一般鹽類放前面或後面。</p>
<p>常見配位基名稱：H₂O aqua、NH₃ ammine、CO carbonyl、Cl⁻ chloro、Br⁻ bromo、CN⁻ cyano、OH⁻ hydroxo、C₂O₄²⁻ oxalato、en ethylenediamine（計數用 bis、tris）、NO₂⁻ nitro（N 端）／nitrito（O 端）。結構圖下方的名稱用顏色對應圖上的配位基。</p>
<p>外界離子照一般鹽類命名，<b>不加 di-、tri-</b>：[Co(H₂O)₆]Br₃ 是 hexaaquacobalt(III) bromide，不是 tribromide。</p>
<p>錯離子帶<b>負電</b>時，金屬名字改成 <b>-ate</b>：chromate（Cr）、cobaltate（Co）、ferrate（Fe）、cuprate（Cu）、argentate（Ag）、aurate（Au）、plumbate（Pb）、stannate（Sn）。</p>` },
    { h: 'd 軌域為什麼會分成兩組？', w: 'dsplit', body: `
<p>五個 d 軌域的瓣（lobe）指向不同方向。八面體錯合物的六個配位基位於 ±x、±y、±z 軸上，帶負電（或孤對電子）。</p>
<p>拖動滑桿讓配位基靠近，並切換不同的軌域：<b>瓣沿著軸、正對配位基的軌域（dz²、dx²−y²）受排斥，能量升高</b>；<b>瓣在兩軸之間的軌域（dxy、dxz、dyz）能量降低</b>。前者稱為 eg，後者稱為 t₂g，兩組的能量差就是<b>晶體場分裂能 Δo</b>。</p>
<p>能階圖下方的算式是重心守恆：升高與降低的能量加起來為 0（八面體：3 × (−0.4) + 2 × (+0.6) = 0）。切換<b>四面體、平面四方、直線形</b>，看哪些軌域正對配位基、能階怎麼排列。</p>` },
    { h: '高自旋還是低自旋？', w: ['spin', 'vbbox'], body: `
<p>逐一加入 d 電子。前三個各佔一個 t₂g 軌域；從第四個開始有兩種填法：</p>
<ul><li>進入 eg：每個電子多需要 Δo。</li>
<li>在 t₂g 中成對：每一對多需要<b>成對能 P</b>。</li></ul>
<p>長條圖畫出兩種填法的總能量：(eg 電子數)×Δo + (成對數)×P，實際採取較低的那一種。Δo &lt; P 時為<b>高自旋</b>，Δo &gt; P 時為<b>低自旋</b>。Δo 由配位基決定，CN⁻、CO 最大。</p>
<p>未成對電子數 n 決定磁性：n &gt; 0 為順磁性，n = 0 為反磁性。自旋磁矩 μ = √(n(n+2)) BM，卡片上即時計算。</p>
<p>四面體的 Δt ≈ 4/9 Δo，小於成對能，所以幾乎都是高自旋。平面四方的 d⁸（Ni²⁺ 強場、Pd²⁺、Pt²⁺）讓最高的 dx²−y² 空著，八個電子全部成對，為反磁性。</p>
<p>四配位錯合物的形狀：d⁸ 的 Pd²⁺、Pt²⁺、Au³⁺ 與強場 Ni²⁺（[Ni(CN)₄]²⁻），以及 Cu²⁺（[Cu(NH₃)₄]²⁺）為平面四方；d¹⁰ 的 Zn²⁺ 和弱場的 [NiCl₄]²⁻、[CoCl₄]²⁻ 為四面體。</p>
<p>考題也常用<b>價鍵理論</b>的混成描述同一件事。第二張圖把金屬的軌域畫成格子：配位基的電子對放進哪些空軌域，就是哪一種混成。</p>` },
    { h: '硫酸銅為什麼是藍的？', w: 'colorwheel', body: `
<p>電子從 t₂g 躍遷到 eg（d–d 躍遷）時，吸收能量等於 Δo 的光。白光被吸收一部分後，看到的是色輪上<b>正對面</b>的顏色，稱為<b>互補色</b>。</p>
<p>左圖是 Δo = hc/λ：Δo 越大，點越往左上，吸收的波長越短。右圖是色輪：變暗的一格是被吸收的顏色，中間圓是看到的顏色。切換配位基，它們依 Δo 由小到大排成<b>光譜化學序列</b>：</p>
<p class="eq">I⁻ &lt; Br⁻ &lt; Cl⁻ &lt; F⁻ &lt; OH⁻ &lt; H₂O &lt; NH₃ &lt; en &lt; NO₂⁻ &lt; CN⁻ &lt; CO</p>
<p>硫酸銅溶液中的 [Cu(H₂O)₆]²⁺ 吸收紅橙光，所以呈藍色。d⁰（Sc³⁺、Ti⁴⁺）和 d¹⁰（Zn²⁺、Cu⁺、Ag⁺）沒有 d–d 躍遷，所以無色。</p>` },
    { h: '鏡子裡的錯合物是同一個嗎？', w: ['oct3d', 'isolist'], body: `
<p>同樣的配位基，排的位置不同就是不同的分子。相鄰（夾 90°）叫 <b>cis</b>，相對（夾 180°）叫 <b>trans</b>；三個相同的佔一個三角面叫 <b>fac</b>，排成一條經線叫 <b>mer</b>。這些統稱<b>幾何異構物</b>。</p>
<p>更難的問題是：一個錯合物和它的鏡像，是不是同一個？拖動模型自己轉轉看，再按「疊疊看」讓電腦試遍八面體的 24 種轉法。疊不起來的就是一對<b>鏡像異構物</b>。</p>
<p>結論：<b>cis-[M(en)₂X₂]、[M(en)₃] 與全 cis 的 [MA₂B₂C₂] 為掌性</b>，其他常見組成可以和鏡像重合。第二張圖由電腦列出一個組成的全部異構物：MA₄B₂、MA₃B₃ 各 2 種；MA₂B₂C₂ 有 5 種幾何異構物，其中 1 種有鏡像，共 6 種立體異構物。</p>
<p>任何雙牙配位基（en、ox²⁻、acac⁻）都一樣：cis-[M(AA)₂X₂]、cis-[M(AA)₂XY] 和 [M(AA)₃] 是掌性的。所以 [Co(en)₂(NH₃)Br]²⁺ 同時有幾何異構物（cis、trans）和光學異構物（cis 的一對鏡像）。</p>
<p>平面四方的 MA₂B₂ 也有 cis、trans 兩種（順鉑是 cis），四面體的四個位置彼此都相鄰，沒有幾何異構物。MA₅B 只有一種排法。</p>
<p>取代反應的統計比例：在第二張圖選「[MA₅B]」，和 B 相鄰的 A 有 4 個、相對的有 1 個，隨機取代一個 A 時 cis : trans = 4 : 1。</p>` },
    { h: '錯合物在身體裡做什麼？', w: ['cobar', 'e18'], body: `

<li><b>順鉑</b>：cis-[Pt(NH₃)₂Cl₂] 的兩個 Cl⁻ 被水換掉後，Pt 同時和 DNA 上相鄰的兩個鳥嘌呤 N7 配位，使 DNA 彎折而無法複製。只有 cis 的兩個空位相鄰，能同時配位兩個鹼基。</li>
<li><b>螯合效應</b>：一個 en 換掉兩個 NH₃，溶液裡的自由粒子變多、熵增加，所以多牙配位基形成的錯合物特別穩定。EDTA 是六牙配位基，臨床上用來治療鉛中毒。</li>
<li><b>金屬羰基</b>：CO 用碳的孤對電子給金屬，金屬再把 d 電子回送到 CO 的 π* 軌域（<b>π 逆授</b>），C≡O 被削弱，IR 頻率下降；錯合物負電越多，逆授越強，ν(CO)：[Mn(CO)₆]⁺ &gt; Cr(CO)₆ &gt; [V(CO)₆]⁻。</li>
<li><b>18 電子規則</b>：穩定的有機金屬錯合物，金屬的價電子（以零價金屬計算 = 族數）加上配位基提供的電子，總數常為 18。CO、NH₃、PR₃ 各提供 2 個，環戊二烯基 C₅H₅ 提供 5 個。例：Cr(CO)₆ = 6 + 6×2；Fe(CO)₅ = 8 + 5×2；二茂鐵 Fe(C₅H₅)₂ = 8 + 2×5；Ni(CO)₄ = 10 + 4×2，都是 18。</li></ul>` },

CH.push({
  id: 'electro', unit: 'g10', title: '電化學：電池、電位與電解',
  lede: '氧化還原反應就是電子的轉移。讓電子不直接交手、而是經過導線，就得到電池；反過來用電力推動不自發的反應，就是電解。這一章用標準還原電位預測一切。',
  sections: [
    { h: '氧化數怎麼算？', w: 'oxnum', body: `
<p>氧化是失去電子（氧化數上升），還原是得到電子（氧化數下降），兩者一定同時發生。使別人氧化、自己被還原的是<b>氧化劑</b>；使別人還原、自己被氧化的是<b>還原劑</b>。</p>
<p>圖上每個點是一種原子的氧化數，下方算式就是「總和等於電荷」。同一元素可以有很多氧化數：N 從 −3（K₃N）到 +5（NO₃⁻），所以處於中間氧化數的物種（H₂O₂、SO₃²⁻、Fe²⁺）既可當氧化劑也可當還原劑；處於最低氧化數的 S²⁻、I⁻ 只能當還原劑。有機化學中，醇 → 醛 → 羧酸是氧化（C 的氧化數上升），NaBH₄ 把酮變成醇是還原。</p>` },
    { h: '氧化還原方程式怎麼平衡？', w: 'balance', body: `
<p>用<b>半反應法</b>：分開寫氧化與還原兩個半反應，各自平衡原子（酸性溶液用 H₂O 補 O、H⁺ 補 H），再用電子平衡電荷；兩邊電子數取最小公倍數後相加。鹼性溶液先照酸性平衡，最後兩邊加 OH⁻ 把 H⁺ 中和成水。一步一步按下一步。</p>` },
    { h: '誰能氧化誰？', w: 'eladder', body: `
<p>把半反應都寫成還原式，依標準還原電位 E° 由大到小排列：左欄越上面的氧化劑越強，右欄越下面的還原劑越強。左上的氧化劑可以和右下的還原劑自發反應。由「A + B²⁺ → A²⁺ + B 會發生、C 和 B²⁺ 不反應」這類實驗結果，也能排出還原力的順序。</p>` },
    { h: '電池的電壓從哪裡來？', w: 'galv', body: `
<p>把氧化與還原分在兩個杯子，電子只能經過導線流動，就能做功：</p>
<ul><li><b>陽極</b>：發生氧化，電子從這裡流出（電池的負極）。</li><li><b>陰極</b>：發生還原，電子流入（正極）。</li><li><b>鹽橋</b>：讓離子移動，維持兩杯電中性。</li></ul>
<p>每個半反應寫成還原式，有一個<b>標準還原電位 E°</b>（以標準氫電極為 0 V）。E° 越大越容易被還原（是越強的氧化劑）；E° 越小越容易被氧化（是越強的還原劑）。</p>
<p class="eq">E°電池 = E°陰極 − E°陽極　　ΔG° = −nFE°　　E° = (0.0592/n) log K（25 °C）</p>
<p>E° &gt; 0、ΔG° &lt; 0、K &gt; 1 三件事是同一件事的三種說法。</p>
<p>常見電池：乾電池（Zn 陽極、MnO₂ 陰極，約 1.5 V）；鉛蓄電池放電時 Pb 是陽極、PbO₂ 是陰極，可充電；燃料電池直接把燃料（H₂、乙醇）的燃燒反應變成電能，最大電功 = −ΔG = nFE。</p>` },
    { h: '濃度怎麼改變電壓？', w: 'nernst', body: `
<p>非標準狀態（濃度不是 1 M）時的電壓由<b>能斯特方程式</b>計算：</p>
<p class="eq">E = E° − (0.0592 ÷ n) log Q　（25 °C）</p>
<p>這就是 ΔG = ΔG° + RT ln Q 除以 −nF。電池放電時 Q 變大、電壓下降，直到 E = 0、Q = K 時「沒電」。</p>
<p>同一種電極、只有濃度不同也能形成電池（<b>濃差電池</b>）。神經細胞的膜電位就是這個原理：細胞內外 K⁺、Na⁺ 濃度不同，產生約 −70 mV 的電位。</p>
<p>E° 也能算出其他平衡常數：把 AgI(s) + e⁻ → Ag + I⁻（−0.15 V）減去 Ag⁺ + e⁻ → Ag（+0.80 V），得到 AgI(s) ⇌ Ag⁺ + I⁻ 的 E° = −0.95 V，Ksp = 10^(−0.95/0.0592) ≈ 9 × 10⁻¹⁷。氧化還原滴定中（例如 Ce⁴⁺ 滴定 Fe²⁺），當量點前的電位由 E = E°(Fe³⁺/Fe²⁺) − 0.0592 log([Fe²⁺]/[Fe³⁺]) 決定。</p>` },
    { h: '電解時會產生多少物質？', w: 'faraday', body: `
<p>電解時外加電源推動不自發的反應（ΔG &gt; 0），例如電解熔融 NaCl 得到 Na 和 Cl₂、電鍍、精煉銅、電解水。</p>
<p>通過的電量決定反應了多少物質（<b>法拉第定律</b>）：</p>
<p class="eq">電子莫耳數 = I × t ÷ F　　F = 96485 C/mol</p>
<p>再依半反應的電子數換算成物質的莫耳數。例如 Cu²⁺ + 2e⁻ → Cu，每 2 mol 電子析出 1 mol 銅。</p>
<p>電解水溶液時要比較競爭的反應：陰極可能還原金屬離子或水（生成 H₂），陽極可能氧化陰離子或水（生成 O₂）。活性很大的金屬（Na、K、Al）無法從水溶液電解得到，因為水會先被還原。</p>
<p>例：用 Pt 電極電解 Na₂SO₄ 水溶液（加酚酞）。陰極 2H₂O + 2e⁻ → H₂ + 2OH⁻，附近變紅；陽極 2H₂O → O₂ + 4H⁺ + 4e⁻，附近仍無色；Na⁺ 與 SO₄²⁻ 不參加反應，只負責導電。</p>` },

CH.push({
  id: 'equilibrium', unit: 'g7', title: '化學平衡：K、Q 與勒沙特列原理',
  lede: '反應不一定會「做完」。這一章看懂平衡為什麼停在某個比例、怎麼預測反應往哪邊走，以及外界改變時系統如何調整。後面的酸鹼、溶解度、電化學，全部建立在這一章上。',
  sections: [
    { h: '反應停下來了嗎？', w: 'eqdyn', body: `
<p>A ⇌ B 的反應同時往兩個方向進行。正反應速率 = k<sub>f</sub>[A]，逆反應速率 = k<sub>r</sub>[B]。剛開始只有 A，正反應很快、逆反應是 0；隨著 A 變少、B 變多，正反應變慢、逆反應變快，直到兩者<b>一樣快</b>。</p>
<p>這時濃度不再改變，稱為<b>化學平衡</b>。注意：反應並沒有停止，只是每秒有多少 A 變成 B，就有多少 B 變回 A。</p>
<p>平衡時 k<sub>f</sub>[A] = k<sub>r</sub>[B]，整理得到：</p>
<p class="eq">[B] ÷ [A] = k<sub>f</sub> ÷ k<sub>r</sub> = K（平衡常數）</p>
<p>改從純 B 開始試試：最後到達的比例完全一樣。<b>平衡組成只由 K 決定，和從哪一邊出發無關。</b></p>` },
    { h: '平衡常數 K 怎麼寫、怎麼運算？', w: ['kalgebra', 'kpkc'], body: `
<p>對一般反應 aA + bB ⇌ cC + dD，平衡常數是「產物濃度的係數次方相乘」除以「反應物濃度的係數次方相乘」：</p>
<p class="eq">K = [C]<sup>c</sup>[D]<sup>d</sup> ÷ ([A]<sup>a</sup>[B]<sup>b</sup>)</p>
<ul><li><b>純固體與純液體不寫進 K</b>（例如水當溶劑時），因為它們的「濃度」不會改變。</li>
<li><b>K 很大（≫ 1）</b>：平衡時幾乎都是產物，反應「幾乎完全」。例如上一章的 HA + OH⁻ → A⁻ + H₂O，K ≈ 1.8 × 10⁹。</li>
<li><b>K 很小（≪ 1）</b>：平衡時幾乎都是反應物。例如醋酸的解離 Ka = 1.8 × 10⁻⁵，所以醋酸溶液裡大部分還是 HA。</li>
</ul>
<p>對方程式的操作會變成對 K 的操作（第一張圖）；氣體反應用分壓寫成 Kp，和 Kc 差 (RT)^Δn（第二張圖）。固體分解產生兩種氣體時（例如 NH₄NO₃(s) → N₂O + 2H₂O），兩種氣體的分壓比等於係數比，由總壓就能求出 Kp。</p>
<p>K 只和<b>溫度</b>有關：改變濃度、壓力或加入催化劑，K 都不變。</p>` },
    { h: '還沒平衡時，反應往哪邊走？', w: 'qk', body: `
<p>把「目前」的濃度代入 K 的式子，得到的值叫<b>反應商 Q</b>。比較 Q 和 K 就知道反應往哪個方向走：</p>
<ul><li><b>Q &lt; K</b>：產物不夠，反應<b>向右</b>。</li><li><b>Q &gt; K</b>：產物太多，反應<b>向左</b>。</li><li><b>Q = K</b>：已經平衡。</li></ul>
<p>要算平衡濃度，用 <b>ICE 表</b>：I（Initial）起始濃度、C（Change）變化量、E（Equilibrium）平衡濃度。變化量依係數比例寫成 −x、+2x，把平衡濃度代入 K 的式子解出 x。</p>
<p>以 N₂O₄ ⇌ 2NO₂ 為例，調整起始濃度：有時 Q 比 K 小、有時比 K 大，x 的正負代表反應的方向。</p>` },
    { h: '平衡被干擾之後會怎樣？', w: 'lechat', body: `
<p>勒沙特列原理說：平衡受到干擾時，系統會往<b>部分抵銷干擾</b>的方向移動。但與其背口訣，不如每次都用 Q 和 K 判斷，永遠不會錯：</p>
<ul><li>加入或移走反應物、產物：Q 改變、K 不變，往消耗加入物的方向移動。加入純固體或純液體不影響。</li>
<li>壓縮體積：往氣體分子數較少的一側移動；<b>定容下加入惰性氣體</b>，各氣體的分壓不變，平衡不移動。</li>
<li>改變溫度：Q 不變、<b>K 改變</b>，升溫往吸熱方向移動。這是唯一會改變 K 的因素。</li>
<li>催化劑：平衡不移動，只是更快到達。</li></ul>
<p>錯離子的顏色也是例子：Co(H₂O)₆²⁺（粉紅）+ 4Cl⁻ ⇌ CoCl₄²⁻（藍）+ 6H₂O。加入 AgNO₃ 會把 Cl⁻ 沉澱成 AgCl，平衡往左，溶液變粉紅。</p>
<p>N₂O₄（無色）⇌ 2NO₂（紅棕色）的正反應吸熱。試試各種干擾：先看干擾後 Q 和 K 的關係，再讓系統回到平衡。注意加壓時顏色先變深（濃度加倍）、再稍微變淡（反應向左），這是經典的課堂示範。</p>` },
    { h: 'K 由什麼決定？', w: 'kdg', body: `
<p>平衡常數和標準自由能變化有一條直接的關係：</p>
<p class="eq">ΔG° = −RT ln K　　⇔　　K = e<sup>−ΔG°/RT</sup></p>
<ul><li>ΔG° &lt; 0 → K &gt; 1，產物有利；ΔG° &gt; 0 → K &lt; 1，反應物有利。</li>
<li>這是<b>指數</b>關係：25 °C 時 ΔG° 每差 5.7 kJ/mol，K 就差 10 倍。所以 ΔG° 只要幾十 kJ/mol，平衡就幾乎完全偏向一邊。</li>
<li>溫度改變 K 的方向由 ΔH° 決定（van 't Hoff 方程式）：吸熱反應升溫 K 變大，放熱反應升溫 K 變小。這正是上一節加熱、冷卻的結果。</li></ul>

/* ---------- 後中化學：溶解度與錯合物平衡 ---------- */
CH.push({
  id: 'ksp', unit: 'g9', title: '溶解度與錯合物平衡',
  lede: '「難溶」的鹽其實還是會溶一點點，而溶多少也是一個平衡。這一章用 Ksp 計算溶解度、判斷會不會沉澱，再看同離子、pH 和錯合物如何把溶解度推高或壓低。',
  sections: [
    { h: '難溶的鹽到底溶了多少？', w: 'ksp', body: `
<p>難溶鹽在飽和溶液中，固體和離子之間達成平衡。平衡常數叫<b>溶度積 Ksp</b>（固體不寫入）：</p>
<p class="eq">AₓBᵧ(s) ⇌ x A + y B　　Ksp = [A]ˣ[B]ʸ</p>
<p>用 ICE 的方式設溶解度為 s，代入就能互相換算。兩個常見陷阱：</p>
<ul><li>係數要變成次方，濃度也要乘上係數：CaF₂ 的 [F⁻] = 2s，Ksp = s(2s)² = 4s³。</li>
<li><b>只有同類型（1:1 比 1:1）的鹽，才能直接用 Ksp 大小比較溶解度</b>。</li></ul>` },
    { h: '溶液裡已經有同樣的離子時呢？', w: 'commonion', body: `
<p>溶液裡如果已經有其中一種離子（同離子），難溶鹽的溶解度會大幅下降，稱為<b>同離子效應</b>。這是勒沙特列原理：多出來的離子把平衡推回固體那一側。</p>
<p>計算時，若外加離子濃度 c 遠大於溶解度 s，可以近似 [同離子] ≈ c，直接得到 s ≈ Ksp ÷ c（1:1 型）。</p>
<p>醫學上的例子：鋇餐（BaSO₄）攝影時，Ba²⁺ 有毒，但 BaSO₄ 的 Ksp 很小，而且腸胃中有硫酸根，溶解的 Ba²⁺ 極少。</p>` },
    { h: '會不會沉澱？誰先沉澱？', w: ['precip', 'selprec'], body: `
<p>和化學平衡一章一樣，把目前的離子濃度代入得到<b>離子積 Q</b>：</p>
<ul><li>Q &lt; Ksp：未飽和，不沉澱（還能再溶）。</li><li>Q = Ksp：飽和。</li><li>Q &gt; Ksp：過飽和，<b>沉澱</b>直到 Q 降回 Ksp。</li></ul>
<p>兩杯溶液混合時，別忘了體積變大、各自的濃度要先稀釋再相乘。</p>
<p><b>選擇性沉澱</b>：溶液中有兩種離子時慢慢加入沉澱劑，先算出各自「開始沉澱所需的濃度」，最小的先沉澱（第二張圖）。</p>` },
    { h: '加酸為什麼能溶解某些沉澱？', w: 'phsol', body: `
<p>只要把其中一種離子「拿走」，溶解平衡就往右移動。陰離子是<b>弱酸的共軛鹼</b>時（OH⁻、CO₃²⁻、S²⁻、F⁻、PO₄³⁻、CH₃COO⁻），加酸會把它們變成弱酸，溶解度大增：CaCO₃（石灰岩、牙齒的羥磷灰石）遇酸溶解，蛀牙就是口腔細菌產生的酸溶解了牙釉質。Cl⁻ 是強酸的共軛鹼，AgCl 的溶解度不受 pH 影響。</p>
<p>圖上是氫氧化物在緩衝溶液中的溶解度：s = Ksp ÷ [OH⁻]ⁿ，log s 對 pH 是斜率 −n 的直線。</p>` },
    { h: '錯合物為什麼能溶解沉澱？', w: 'complexsol', body: `
<p>金屬離子和配位基（NH₃、CN⁻，或六牙的螯合劑 EDTA）形成錯離子，生成常數 Kf 通常很大，大量消耗游離的金屬離子。總反應是溶解與錯合兩式相加：</p>
<p class="eq">AgCl(s) + 2NH₃ ⇌ Ag(NH₃)₂⁺ + Cl⁻　　K = Ksp × Kf</p>
<p>拖動配位基濃度、換不同的鹽：AgCl 溶於氨水，AgBr 只溶一點，AgI 幾乎不溶，要用 Kf 更大的 CN⁻ 才能溶解。氨水滴入 Cu²⁺ 溶液時，先生成 Cu(OH)₂ 沉澱（氨水提供 OH⁻），過量後沉澱溶解成深藍色的 [Cu(NH₃)₄]²⁺。</p>
<p>錯合物的結構、命名與顏色在<a href="#coord">配位化學</a>一章詳細介紹。</p>` },
  ],

<ul><li><b>相加（同號）</b>：兩核之間的波互相加強，電子集中在兩核之間，能量降低，稱為<b>成鍵軌域</b>（σ、π）。</li>
<li><b>相減（異號）</b>：兩核之間互相抵消，出現節面，能量升高，稱為<b>反鍵軌域</b>（σ*、π*）。</li></ul>

<p>能階順序有兩種：總電子數 ≤ 14（B₂、C₂、N₂，以及和 N₂ 等電子的 CO、CN⁻、NO⁺、C₂²⁻）時 <b>π2p 在 σ2p 下方</b>；O₂、F₂ 以後 σ2p 在 π2p 下方。點選不同的分子或離子，圖下方會寫出分子軌域組態，卡片算出鍵級與磁性：</p>

CH.push({
  id: 'naming', unit: 'o1b', title: '有機命名',
  lede: '每一份考卷都有「這個結構叫什麼」或「這個名字是哪個結構」的題目。IUPAC 命名其實只有幾個步驟：選主鏈、編號、排序，再加上官能基的字尾與立體組態。這一章把步驟一個個拆開，用圖檢查每一步。',
  sections: [
    { h: '烷類的名字怎麼組成？', w: 'namealk', body: `
<p>名稱由三部分組成：<b>取代基</b>（字首）+ <b>主鏈</b>的字根 + 官能基字尾。碳數的字根是 meth-（1）、eth-（2）、prop-（3）、but-（4）、pent-（5）、hex-（6）、hept-（7）、oct-（8）、non-（9）、dec-（10），中文依序是甲、乙、丙、丁、戊、己、庚、辛、壬、癸。</p>
<p>下圖切換編號方向，比較兩個方向的位置數組。命名步驟：</p>
<ol><li><b>選主鏈</b>：最長的連續碳鏈。有兩條一樣長時，選取代基較多的那條。主鏈不一定畫成一直線，要沿著轉折去數。</li>
<li><b>編號</b>：從靠近取代基的一端開始。兩個方向逐一比較位置數字，第一個不同的數字較小的方向正確（2,2,4 勝過 2,4,4）。若兩個方向完全相同，讓英文字母排在前面的取代基拿較小的號碼（3-ethyl-4-methylhexane）。</li>
<li><b>排序</b>：取代基依英文字母順序寫，數字和名稱之間用連字號，數字之間用逗號。相同的取代基合併成 di-、tri-、tetra-，這些倍數字首<b>不算進字母排序</b>（ethyl 排在 dimethyl 前面）。</li></ol>
<p>鹵素和烷基一樣是字首（fluoro、chloro、bromo、iodo），一起參加編號與排序：2-chloro-3-methylpentane。</p>` },
    { h: '取代基的名字有哪些？', w: 'alkyl', body: `
<p>取代基是主鏈上的分支，把烷的字尾 -ane 換成 -yl：CH₃– 是 methyl，CH₃CH₂– 是 ethyl。三個碳以上的取代基，連接點不同就有不同的名字，切換下圖看連接碳的位置。</p>
<p>連接碳是幾級碳，決定了 sec-、tert- 字首：<b>二級碳</b>連接的丁基是 sec-butyl，<b>三級碳</b>連接的是 tert-butyl。iso- 指末端有 (CH₃)₂CH– 的分支。</p>
<p>如果分支本身還有分支，就把分支當成一條小鏈，從連接碳編為 1 號，整個名稱放進括號：–C(CH₃)₂CH₂CH(CH₃)₂ 的最長鏈是 4 個碳，1 號碳上有兩個甲基、3 號碳上有一個，名稱是 (1,1,3-trimethylbutyl)。</p>` },
    { h: '環狀化合物怎麼命名？', w: 'bicyclo', body: `
<p><b>單環</b>：在字根前加 cyclo-，例如 cyclohexane。環上只有一個取代基時不必編號（methylcyclohexane）；有兩個以上時，讓位置數組最小，若平手則字母較前的取代基為 1 號：1-ethyl-3-methylcyclohexane。環與鏈相連時，碳數較多的當主體：環己烷接辛基叫 cyclohexyloctane（1-cyclohexyloctane），接丁基則叫 butylcyclohexane。</p>
<p><b>環烯</b>：雙鍵的兩個碳一定是 1、2 號，再讓取代基拿最小的號碼：異丙基接在雙鍵旁的飽和碳上，名稱是 3-isopropylcyclopentene。兩個雙鍵隔一個單鍵的六員環是 1,3-cyclohexadiene，隔兩個的是 1,4-cyclohexadiene。</p>
<p><b>雙環</b>：兩個環共用的碳稱為<b>橋頭碳</b>，下圖切換幾個例子。名稱是 bicyclo[a.b.c]＋總碳數的字根，a、b、c 是三條橋上的碳數，由大到小排列。</p>
<p>要數一個分子有<b>幾個環</b>，看骨架上的鍵數與原子數：環數 = 鍵數 − 原子數 + 1（只算構成骨架的鍵和原子，不算 H）。降冰片烷有 7 個碳、8 個 C–C 鍵，所以是 2 個環；金剛烷 10 個碳、12 個 C–C 鍵，是 3 個環。</p>` },
    { h: '有好幾個官能基時，誰當字尾？', w: 'suffix', body: `
<p>點選下圖的官能基，看它當字尾與當字首時的寫法。規則是：</p>
<ol><li>優先順序最高的官能基當<b>字尾</b>，主鏈必須包含它，並且給它最小的編號。</li>
<li>其他官能基改成字首，和烷基一起排字母順序：HOCH₂CH₂CHO 是 3-hydroxypropanal。</li>
<li>字尾前要寫出位置：CH₃CH(OH)CH₃ 是 propan-2-ol（舊寫法 2-propanol）。(CH₃)₂CHCH₂CH₂OH 先讓 OH 拿 1 號，名稱是 3-methylbutan-1-ol（舊寫法 3-methyl-1-butanol），俗名 isopentyl alcohol。</li></ol>
<p><b>烯與炔</b>：雙鍵用 -ene、參鍵用 -yne，主鏈要盡量包含多重鍵。同時有兩者時，讓多重鍵整組拿最小的編號；若兩個方向一樣，雙鍵優先拿小號。所以 CH₃CH=CH–C≡CH 從參鍵端編號（1、3）勝過從另一端（2、4），名稱是 pent-3-en-1-yne；CH₂=CH–CH₂–C≡CH 兩端都是（1、4），雙鍵拿 1 號：pent-1-en-4-yne。</p>
<p><b>酯</b>的名稱分兩段：先寫接在 O 上的烷基，再寫酸的部分（-ic acid 改成 -ate）。CH₃COOCH(CH₃)₂ 是 isopropyl acetate（乙酸異丙酯），HCOOCH₂CH₃ 是 ethyl formate（甲酸乙酯），CH₃CH₂COOCH₂CH₃ 是 ethyl propanoate。中文剛好相反：先講酸，再講醇的部分。</p>` },
    { h: '雙鍵的 E 和 Z 怎麼判斷？', w: 'ez', body: `
<p>雙鍵不能旋轉，所以兩端的基團可以在同側或對側。選擇下圖四個位置的基團，看組態怎麼變。判斷步驟：</p>
<ol><li>在雙鍵的每一個碳上，用 <b>CIP 規則</b>比出兩個基團中優先的一個：先比直接相連原子的原子序（Br &gt; Cl &gt; O &gt; C &gt; H）；相同時，往外一層列出各自接的三個原子，由大到小逐一比較，第一個不同的就決定勝負（–CH₂OH 的 (O,H,H) 勝過 –CH(CH₃)₂ 的 (C,C,H)）。雙鍵視為接了兩個相同原子。</li>
<li>兩個優先基團在同側為 <b>Z</b>，在對側為 <b>E</b>。</li></ol>
<p>cis/trans 只適用於兩端各有一個相同基團（通常是 H）的情形；E/Z 適用於所有雙鍵。兩者不一定對應：(Z)-2-bromobut-2-ene 的兩個甲基是 trans。</p>
<p>分子有兩個雙鍵時，每一個都要標出組態和位置，寫在名稱最前面，例如 (3E,5Z)-octa-3,5-diene。立體中心的 R/S 也一樣寫在前面並加上位置：(4R)-2,2,4-trimethylhexane。R/S 的判斷在「構形與立體化學」一章。</p>` },
    { h: '苯的衍生物與常見俗名', body: `
<p>苯環上的取代基有許多保留的俗名，IUPAC 也接受，考題常直接使用：</p>
<ul><li><b>母體名稱</b>：toluene（甲苯，C₆H₅CH₃）、phenol（酚，C₆H₅OH）、aniline（苯胺，C₆H₅NH₂）、anisole（苯甲醚，C₆H₅OCH₃）、benzaldehyde（苯甲醛，C₆H₅CHO）、benzoic acid（苯甲酸）、acetophenone（苯乙酮，C₆H₅COCH₃）。</li>
<li>苯環當取代基時叫 <b>phenyl</b>（C₆H₅–），C₆H₅CH₂– 叫 benzyl。(C₆H₅)₂NH 是 diphenylamine，C₆H₅CH₂NH₂ 是 benzylamine。</li>
<li>二取代苯用 <b>ortho-（o-，1,2）、meta-（m-，1,3）、para-（p-，1,4）</b>。三個以上取代基時改用數字：以母體的官能基碳為 1 號，其他取代基拿最小號碼、依字母排序。例如 4-chloro-3-methylbenzaldehyde：CHO 所在的碳是 1 號。</li>
<li><b>戴奧辛</b>（2,3,7,8-tetrachlorodibenzo-p-dioxin）：中間的六員環含兩個互為對位（1,4）的 O，兩側各接一個苯環，四個 Cl 分別在兩側苯環上離 O 最遠的位置。</li></ul>
<p>常見俗名與結構：acetone（丙酮）、acetic acid（乙酸）、formic acid（甲酸）、formaldehyde（甲醛）、diethyl ether（乙醚，CH₃CH₂OCH₂CH₃）、methyl acetate（乙酸甲酯，CH₃COOCH₃）。</p>
<p>含氮官能基的名稱：R₂C=N–R 是亞胺（imine），R₂C=N–OH 是肟（oxime），R₂C=N–NH₂ 是腙（hydrazone），R₂C=N₂ 是重氮化合物（diazo），R–N=N–R 是偶氮化合物（azo）。</p>
<p>試劑常用縮寫：LiAlH₄（lithium aluminum hydride，LAH）、DIBAL-H（diisobutylaluminum hydride）、NaBH₄（sodium borohydride）、L-Selectride（lithium tri-sec-butylborohydride）、LDA（lithium diisopropylamide）、PCC（pyridinium chlorochromate）、mCPBA（meta-chloroperoxybenzoic acid）、NBS（N-bromosuccinimide），溶劑 THF（tetrahydrofuran）、DMSO（dimethyl sulfoxide）、DMF（N,N-dimethylformamide）。</p>` },

<p class="eq">K = 10<sup>(pKa of HB − pKa of HA)</sup></p>
<p>pKa 每差 1，平衡常數差 10 倍。所以只要查兩個 pKa，就知道一個鹼能不能拿走某個 H⁺。這就是為什麼：</p>

    { h: '什麼讓酸變強？', w: 'ario', body: `
<p>酸性強弱取決於<b>共軛鹼有多穩定</b>：拿走 H⁺ 後留下的負電荷越穩定，酸就越強。判斷負電荷穩定度依序看四個因素（重要性大致由高到低）：</p>
<ol><li><b>原子</b>：負電荷在哪個原子上。同一族看大小（越大越穩定，HI 最強）；同一週期看電負度（越大越穩定，HF > H₂O > NH₃ > CH₄）。</li>
<li><b>共振</b>：負電荷能不能分散到其他原子上（羧酸 > 酚 > 醇）。</li>
<li><b>誘導</b>：附近有沒有拉電子基（例如 Cl、F、NO₂）幫忙分攤負電荷；越多越強、越近越強。</li>
<li><b>軌域</b>：負電荷所在軌域的 s 性質（sp > sp² > sp³）。</li></ol>

<p>酚氧離子的負電荷會共振到鄰、對位的碳上，所以 NO₂ 放在這兩個位置可以直接接手負電荷，酸性大增；OCH₃ 放在這兩個位置則把電子推進來，酸性變弱。苯甲酸的負電荷在 COO⁻ 上、不進入苯環，取代基的影響比酚小，但方向相同；另外苯甲酸有<b>鄰位效應</b>：鄰位取代基把 COOH 擠出苯環平面，幾乎都讓酸性變強。苯胺看的是共軛酸的 pKa：拉電子基讓 N 的孤對電子更不容易接 H⁺，苯胺的鹼性變弱。</p>` },

<p>有機鋰、格里納試劑還能接上金屬鹽變成其他試劑：加 CuI 得吉爾曼試劑、加硼酸酯得到鈴木偶合用的芳基硼酸。</p>` },
    { h: '過渡金屬催化與卡賓有哪些常考的？', w: 'tmcat', body: `
<p>現代合成接碳最常用的是<b>鈀催化偶合</b>，考題常考「哪一個反應配哪一種試劑」。四種偶合共同的循環：Pd(0) 插入 C–X 鍵（<b>氧化加成</b>）→ 另一個碳基團從 B、Sn 或 Cu 轉移到 Pd 上（<b>轉金屬化</b>；赫克反應則是烯插入）→ 兩個碳基團一起離開 Pd 並連接（<b>還原脫去</b>），Pd(0) 再生。</p>
<p>另外兩類：<b>烯烴複分解</b>（格拉布斯的 Ru 卡賓錯合物讓兩個 C=C 交換夥伴，閉環時放出乙烯）與<b>均相氫化</b>（威爾金森催化劑 RhCl(PPh₃)₃）。最後一個選項是不靠金屬的<b>卡賓</b>：只有 6 個價電子的中性碳，加到雙鍵上形成環丙烷。另外，雷尼鎳（Raney Ni，多孔的鎳）是常用的非均相氫化觸媒，也能把硫縮醛的 C–S 鍵還原成 C–H。</p>` },

<p><b>有機電化學合成</b>用電子當作氧化劑或還原劑：反應物從溶液擴散到電極表面，在電極／溶液界面得到或失去電子、斷鍵或成鍵，產物再從電極表面擴散回溶液中。反應發生在電極表面附近，而不是遠離電極的溶液本體。</p>` },
    { h: '官能基之間怎麼互換？', w: 'fgmap', body: `

CH.push({
    id: 'sn-e', unit: 'o4', title: '取代與脫去：SN2、SN1、E2、E1',
    lede: '鹵烷遇到親核基或鹼，會走四條路之一。不用背表格：只要看懂「誰的電子去攻擊誰」和「有什麼擋在路上」，就能推出答案。',
    sections: [
      { h: '碳–鹵鍵為什麼會被攻擊？', w: 'leaving', body: `
<p>鹵素的電負度比碳大，C–X 鍵的電子偏向 X，碳帶部分正電（δ+）。帶負電或有孤對電子的分子（<b>親核基</b>，Nu:）就會被這個 δ+ 的碳吸引，用自己的電子對去和它成鍵。</p>
<p>但碳已經有四個鍵，新鍵要形成，就得有一個舊鍵斷掉：X 必須<b>帶著那一對電子離開</b>，變成 X⁻。離開後的 X⁻ 越穩定，它就越願意離開，我們說它是越好的<b>離去基</b>。</p>
<p>怎麼判斷 X⁻ 穩不穩定？用酸鹼章學過的關係：<b>酸越強，它的共軛鹼越穩定</b>。所以只要看 HX 的 pKa：</p>
<p class="eq">HI（−10）> HBr（−9）> HCl（−7）≫ HF（3.2）　⇒　離去能力 I⁻ > Br⁻ > Cl⁻ ≫ F⁻</p>
<p>同一個道理解釋了醇：直接離開的會是 OH⁻（H₂O 的 pKa 15.7，非常差的離去基），所以醇不會直接被取代；先加酸把 –OH 質子化成 –OH₂⁺，離開的就變成中性的 H₂O（H₃O⁺ 的 pKa −1.7），立刻成為好離去基。</p>` },
      { h: 'SN2：親核基為什麼從背面進攻？', w: 'sn2', body: `
<p>親核基的孤對電子從 C–X 鍵的<b>正對面（背面）</b>進攻：這個方向正好對準 C–X 反鍵結軌域，也離帶負電的 X 最遠。新鍵形成和舊鍵斷裂<b>同時發生</b>，整個反應只有一個過渡狀態。</p>
<p>按「下一步」看動畫，注意兩件事：</p>
<ol><li>過渡狀態時，碳上另外三個基團被推到同一平面，Nu 與 X 分別在平面兩側，各自和碳部分成鍵。</li>
<li>產物的三個基團翻到另一邊：<b>構型反轉</b>（華爾頓反轉）。(R)-2-溴丁烷經 SN2 生成 (S)-2-丁醇。</li></ol>
<p>因為過渡狀態同時包含鹵烷和親核基，速率和兩者都成正比：</p>
<p class="eq">rate = k [RX] [Nu⁻]　（二級反應，SN2 的「2」就是這個意思）</p>
<p>切換基質看看：碳上的基團越大，背面越擠，親核基越難靠近。甲基最快，一級次之，二級慢很多，<b>三級幾乎不反應</b>。極性非質子性溶劑（丙酮、DMSO、DMF）不會用氫鍵包住親核基，讓它更「赤裸」、更有攻擊力，所以有利 SN2。</p>` },
      { h: '哪個親核基最強？和溶劑有關嗎？', w: 'nucsolv', body: `
<p><b>親核性</b>是「攻擊碳的速度」，鹼性是「搶 H⁺ 的平衡傾向」，兩者常常一致，但溶劑會改變鹵素離子的順序。切換兩類溶劑看看：</p>
<ul><li><b>極性質子性溶劑</b>（水、醇）有 O–H，會用氫鍵包住小的陰離子，親核性 I⁻ > Br⁻ > Cl⁻ > F⁻。</li>
<li><b>極性非質子性溶劑</b>（DMSO、DMF、丙酮、乙腈）不能形成氫鍵，陰離子沒有被包住，順序和鹼性一致：F⁻ > Cl⁻ > Br⁻ > I⁻。</li></ul>
<p>不論哪種溶劑：帶負電的比中性的強（HO⁻ > H₂O），同一週期由左到右變弱（NH₂⁻ > HO⁻ > F⁻），體積大的變弱（t-BuO⁻ 是強鹼但親核性差）。基質方面，C–F 鍵最強、F⁻ 是最差的離去基，所以 CH₃I 比 CH₃Cl、CH₃CH₂F 反應快得多。</p>` },
      { h: 'SN1：先斷鍵再進攻，什麼基質走這條路？', w: 'sn1', body: `
<p>三級鹵烷的背面被擋住，走不了 SN2，但它有另一條路：C–X 鍵<b>先自己斷開</b>，生成帶正電的<b>碳陽離子</b>；之後親核基（常常就是溶劑，例如水或醇）再很快地加上去。</p>
<p>第一步（斷鍵）最慢，而且只有鹵烷參與，所以速率只和鹵烷有關，和親核基的濃度、強弱都無關：</p>
<p class="eq">rate = k [RX]　（一級反應）</p>
<p>第一步快不快，取決於碳陽離子穩不穩定：<b>三級 > 二級 > 一級 > 甲基</b>。原因是相鄰的 C–H 鍵電子可以分攤正電荷（<b>超共軛</b>），三級碳旁邊有 9 個 C–H 能幫忙，甲基一個都沒有。極性質子性溶劑（水、醇）能用氫鍵和偶極包住生成的離子，降低第一步的能量，所以有利 SN1。</p>
<p>碳陽離子是<b>平面形</b>（sp²），空的 p 軌域上下兩瓣都能接受電子，親核基從左右兩面進攻的機會差不多。分別選「從左邊進攻」和「從右邊進攻」播放：一個得到構型反轉、一個得到構型保留，兩者是鏡像異構物，所以產物接近<b>外消旋</b>（常略多一點反轉產物，因為剛離開的 X⁻ 會暫時擋住同一側）。</p>
<p>能形成更穩定碳陽離子的基質，SN1 更快：正電荷能共振到 π 系統上的<b>烯丙基</b>與<b>苄基</b>（C₆H₅CH₂⁺）大約和三級碳陽離子相當，二苯甲基、三苯甲基（Ph₃C⁺）更穩定，所以 Ph₃CBr 在甲醇中取代最快。乙烯基和苯基鹵化物（X 直接接在 sp² 碳上）兩種取代都不會發生。</p>
<p>碳陽離子一生成，如果相鄰碳上的 H 或 CH₃ 移過來能得到更穩定的碳陽離子，就會發生<b>重排</b>（1,2-氫轉移或甲基轉移），所以 SN1／E1 的產物骨架可能和起始物不同；SN2、E2 沒有碳陽離子，不會重排。</p>` },
      { h: '速率式怎麼告訴我們機構？', w: 'ratelaw', body: `
<p>改變下圖中兩種反應物的濃度，看速率怎麼變。速率式反映的是<b>速率決定步驟</b>裡有哪些分子：SN2 一步完成，速率和兩者都成正比；SN1 最慢的是碳陽離子的生成，速率只和鹵烷有關。E2 和 E1 也一樣：E2 的 rate = k[RX][B⁻]，E1 的 rate = k[RX]，而且 E1 和 SN1 一樣可能發生重排。</p>
<p>能量圖的形狀也不同：SN2 只有一個峰（過渡狀態）；SN1 有兩個峰，中間的谷是碳陽離子中間體，第一個峰較高。</p>` },
      { h: 'E2：鹼拿走哪一個 β-氫？', w: ['e2', 'newman', 'zaitsev'], body: `
<p>如果進攻的是<b>強鹼</b>，它可以不碰碳，改拿走旁邊那個碳（β 碳）上的氫。三件事同時發生：</p>
<ol><li>鹼的孤對電子和 β-H 成鍵；</li><li>原本 C–H 鍵的電子轉過去形成 C=C 的 π 鍵；</li><li>X 帶著電子對離開。</li></ol>
<p>速率和鹵烷、鹼都有關：rate = k [RX] [B⁻]。</p>
<p>為了讓 C–H 的電子能順利「推」進 C–X 的反鍵結軌域，<b>H 和 X 必須在相反兩側、同一平面上</b>，稱為<b>反式共平面</b>（anti-periplanar）。下面第二個圖用紐曼投影式沿著 C–C 鍵看過去，轉動後面的碳，找出 E2 可以發生的角度。</p>
<p>如果不只一種 β-氫可以拿，通常得到<b>雙鍵上取代基較多</b>、較穩定的烯，這叫<b>查依采夫（Zaitsev）規則</b>。但體積很大的鹼（例如 t-BuO⁻）擠不進裡面，只能拿外側甲基上的氫，結果反而以取代較少的烯為主，稱為<b>霍夫曼（Hofmann）產物</b>。第三個圖可以切換兩種鹼比較。</p>
<p>E2 在速率決定步驟中就打斷 C–H 鍵，所以把 β-H 換成氘（C–D 鍵較強），速率明顯變慢（<b>動力學同位素效應</b>，約 3–7 倍）；E1 的 C–H 在快速的第二步才斷，看不到這個效應。</p>
<p>因為 H 和 X 必須反式，E2 有<b>立體專一性</b>：一個特定的立體異構物只生成一種 E 或 Z 烯。從費雪投影式判斷時，先轉到 H 與 X 反式，再看兩個碳上剩下的基團在哪一側。鄰位或同碳的二鹵化物與 2 當量強鹼（NaNH₂）連續脫去兩次，生成炔。</p>`},
    { h: '環上的 E2 為什麼有時很慢？', w: 'chaire2', body: `
<p>在環己烷上，反式共平面只出現在 H 與離去基<b>都在直立鍵</b>（一個朝上、一個朝下）的時候。所以要先找出離去基直立的那個椅式，再看相鄰碳上哪些 H 也是直立的。切換兩個異構物比較：如果離去基直立的椅式很不穩定（大基團也被迫直立），反應就慢；能拿的 H 位置也決定了產物是不是查依采夫烯。</p>` },
      { h: 'E1 和 SN1 有什麼關係？', w: 'e1', body: `
<p>E1 的第一步和 SN1 完全一樣：鹵烷先解離成碳陽離子。接下來碳陽離子有兩個選擇：</p>
<ul><li>被親核基加上去 → SN1；</li><li>被弱鹼（通常就是溶劑）拿走 β-氫，形成雙鍵 → E1。</li></ul>
<p>所以 SN1 和 E1 幾乎總是一起出現，速率都只和鹵烷有關（rate = k[RX]）。E1 沒有反式共平面的限制（碳陽離子是平面形，β-H 隨時都對得上空的 p 軌域），產物通常以較穩定、取代較多的烯為主。</p>
<p><b>加熱會偏向脫去</b>：脫去反應把一個分子變成三個（烯、H–B、X⁻），熵增加（ΔS > 0）。依 ΔG = ΔH − TΔS，溫度越高，−TΔS 越負，對脫去越有利。</p>` },
      { h: '四條路怎麼判斷？', w: 'decide', body: `
<p>判斷時依序問三個問題，每個問題都對應前面看過的原因：</p>
<ol><li><b>基質是甲基、一級、二級還是三級？</b>決定背面擠不擠（SN2）、碳陽離子穩不穩（SN1／E1），以及有沒有 β-氫（甲基沒有，不能脫去）。</li>
<li><b>試劑是強鹼嗎？是好的親核基嗎？體積大嗎？</b>強鹼偏向 E2；強親核弱鹼（I⁻、Br⁻、RS⁻、N₃⁻、CN⁻）偏向 SN2；體積大的強鹼幾乎只做 E2；弱親核弱鹼（H₂O、ROH）只能等碳陽離子生成，走 SN1／E1。</li>
<li><b>溶劑和溫度？</b>極性非質子性溶劑幫 SN2；極性質子性溶劑幫 SN1／E1；加熱幫脫去。</li></ol>
<p>合成時常利用 SN2 的構型反轉：(R)-2-丁醇先和 TsCl 反應成甲苯磺酸酯（O–H 變成 O–Ts，C–O 鍵沒斷，構型保留，OTs⁻ 是極好的離去基），再用 NaCN／DMSO 做 SN2，得到構型反轉的 (S)-2-甲基丁腈。一級基質如果 β 碳很擠（新戊基 (CH₃)₃CCH₂Br），背面被擋住，SN2 也非常慢。</p>
<p>選好條件，看推理過程。試著自己先想答案，再對照。</p>` },
    ],

        why: 'SN2 只有一步，過渡狀態同時包含鹵烷和親核基，所以速率和兩者都成正比。', show: { w: 'sn2', set: { sub: 'secondary', step: 1 } } },

CH.push({
  id: 'stereo', unit: 'o3', title: '構形與立體化學',
  lede: '分子式相同、原子連接方式也相同，只差在空間中的排列，性質卻可能天差地遠：一個是藥、一個沒有藥效甚至有毒。這一章看懂分子的「左右手」和「姿勢」，SN2 的構型反轉、E2 的反式共平面都建立在這裡。',
  sections: [
    { h: '分子為什麼會有左右手？', w: 'chiral', body: `
<p>你的左手和右手互為鏡像，但不管怎麼轉都疊不起來。分子也一樣：如果一個分子和它的鏡像無法重疊，就稱為<b>掌性分子</b>（chiral），它和鏡像是一對<b>鏡像異構物</b>（enantiomers）。</p>
<p>最常見的原因是<b>掌性中心</b>：一個 sp³ 碳連著<b>四個不同</b>的基團。立體式的畫法：</p>
<ul><li>實線：在紙面上；<b>楔形</b>（實心三角形）：朝向你；<b>虛楔</b>（斜線）：遠離你。</li></ul>
<p>比較 2-丁醇（四個基團都不同）和 2-丙醇（有兩個 CH₃）。把鏡像轉過來疊到原分子上：2-丙醇疊得起來，因為它有一個穿過分子的鏡面；2-丁醇疊不起來。</p>
<p>鏡像異構物的熔點、沸點、溶解度完全相同，差別只在<b>使平面偏極光旋轉的方向相反</b>，以及和其他掌性分子（例如體內的酵素、受體）的作用不同。等量的一對鏡像異構物混合物稱為<b>外消旋</b>混合物，旋光互相抵消。</p>` },
    { h: '怎麼判斷 R 還是 S？', w: 'rs', body: `
<p>用 Cahn–Ingold–Prelog（CIP）規則命名掌性中心，三個步驟：</p>
<ol><li><b>排優先順序</b>：看直接連在掌性中心上的原子，<b>原子序大的優先</b>。相同時往下一層，把各自連著的三個原子由大到小排好，從第一個開始比，第一個不同處決定勝負。雙鍵把相連的原子算兩次。</li>
<li><b>把最低優先（通常是 H）放到遠離你的位置</b>（虛楔）。</li>
<li>看 1 → 2 → 3 的方向：<b>順時針 = R</b>（rectus，右），<b>逆時針 = S</b>（sinister，左）。</li></ol>
<p>實用技巧：如果 H 在楔形（朝向你），直接看方向再把答案<b>反過來</b>；任意交換兩個基團，構型就反轉一次。</p>
<p>注意：R/S 只是命名，和旋光方向（+／−）沒有固定關係，必須用實驗量測。</p>
<p>胺基酸與醣類常用 <b>D/L</b>：費雪投影式中，最下面的掌性中心（胺基酸的 α-碳）上 OH 或 NH₂ 在左為 L、在右為 D。天然胺基酸都是 L 型，除了半胱胺酸（CH₂SH 的 S 原子序大，使優先順序改變，是 R）以外都是 S。異白胺酸和蘇胺酸有兩個掌性中心。</p>
<p>數大分子（膽固醇、前列腺素、藥物）的掌性中心：逐一檢查每個 sp³ 碳，跳過 CH₂、CH₃ 和雙鍵碳；環上的碳只要兩側的環路徑不同就算不同基團。膽固醇有 8 個掌性中心。</p>` },
    { h: '兩個掌性中心會有幾種異構物？', w: 'fischer', body: `
<p>有 n 個掌性中心，最多有 2ⁿ 個立體異構物。兩個中心時有四種組合：(R,R)、(S,S)、(R,S)、(S,R)。</p>
<ul><li>構型<b>全部相反</b>：鏡像異構物，例如 (R,R) 和 (S,S)。</li>
<li>只有<b>部分相反</b>：<b>非鏡像異構物</b>（diastereomers），例如 (R,R) 和 (R,S)。它們不是鏡像，物理性質不同，可以用一般方法分離。</li>
<li>如果分子兩半結構相同，(R,S) 可能和自己的鏡像相同：分子內有鏡面，稱為<b>內消旋</b>（meso）化合物，雖然有掌性中心卻沒有光學活性。</li></ul>
<p>這裡用<b>費雪投影式</b>表示：碳鏈直放，<b>橫線朝向你、直線遠離你</b>。費雪投影式只能在紙面上轉 180°，不能轉 90° 或翻面，否則構型會變。</p>
<p>切換酒石酸和 2-溴-3-氯丁烷，比較為什麼前者只有 3 個立體異構物、後者有 4 個。</p>
<p>兩個常考的判斷：</p>
<ul><li>「有掌性中心就一定是掌性分子」是<b>錯的</b>：內消旋化合物就是反例。判斷分子有沒有掌性，要看它有沒有<b>鏡面或對稱中心</b>；有任一個就不是掌性分子。</li>
<li>沒有掌性中心也可能是掌性分子：兩端各接兩個不同基團的丙二烯（R₂C=C=CR₂）。丙二烯兩端的 CH₂ 互相垂直，四個 H 不在同一平面。</li></ul>` },
    { h: '單鍵轉動時，哪個姿勢最穩？', w: 'butane', body: `
<p>C–C 單鍵可以自由旋轉，旋轉造成的不同空間排列稱為<b>構形</b>（conformation）。構形之間轉換很快，不能分離，這點和需要斷鍵才能互換的<b>構型</b>（configuration，如 R/S）不同。</p>
<p>用<b>紐曼投影式</b>沿著 C–C 鍵看過去：前面的碳是中心點，後面的碳是圓。</p>
<ul><li><b>交錯式</b>：前後的鍵錯開，能量低。</li><li><b>重疊式</b>：前後的鍵正對，電子互斥（扭轉張力），能量高。</li></ul>
<p>丁烷還要考慮兩個甲基的距離：<b>反式</b>（180°）最穩定；<b>間扭式</b>（60°）兩個甲基相鄰，高 3.8 kJ/mol；兩個甲基重疊時最高。上一章 E2 需要 H 和離去基「反式共平面」，指的就是這種 180° 的交錯構形。</p>
<p>例外：FCH₂CH₂F 最穩定的是<b>間扭式</b>（gauche effect），FCH₂CH₂OH 也是間扭式，因為 OH 和 F 靠近時可以形成分子內氫鍵。</p>` },
    { h: '環己烷的取代基為什麼偏好平伏鍵？', w: 'chair', body: `
<p>環己烷不是平的，而是折成<b>椅式</b>：所有鍵角接近 109.5°，而且每個 C–C 鍵都是交錯式，沒有角張力也沒有扭轉張力。</p>
<p>每個碳有兩個位置：</p>
<ul><li><b>直立鍵</b>（axial）：和環的軸平行，上下交替。</li><li><b>平伏鍵</b>（equatorial）：大致沿著環的外圍向外伸。</li></ul>
<p>椅式可以<b>環翻轉</b>，翻轉後所有直立鍵變成平伏鍵、平伏鍵變成直立鍵。取代基在直立鍵時，會和同一側、隔一個碳的兩個直立 H 擠在一起（<b>1,3-雙直立作用</b>），所以大的取代基偏好<b>平伏鍵</b>。基團越大，偏好越明顯：第三丁基幾乎 100% 待在平伏鍵。</p>` },
    { h: '雙取代環己烷：哪個椅式最穩？有沒有掌性？', w: 'disub', body: `
<p>兩個取代基時，先決定每個取代基在各個椅式中是直立還是平伏，再比較兩個椅式的能量。切換位置、順反和取代基看看。</p>
<p>順式（cis）表示兩個取代基在環的同一面，反式（trans）是不同面。由於直立鍵在相鄰碳上上下交替，同一面的兩個鍵在相鄰碳（1,2）上是一個直立一個平伏，在隔一個碳（1,3）上是兩個都直立或兩個都平伏。</p>
<p>兩個環共用一個邊的<b>十氫萘</b>也一樣：反式十氫萘的兩個環以平伏鍵相接，比順式穩定，而且不能環翻轉；順式十氫萘可以翻轉，但一定有一個鍵是直立的。</p>
<p>椅式和扭船式的平衡：室溫下 99.99% 是椅式；加熱到 800 °C 時扭船式約 30%，K = 30 ÷ 70 ≈ 0.43。</p>` },
    { h: '旋光度怎麼量？外消旋混合物怎麼分開？', w: 'ee', body: `
<p>鏡像異構物唯一的物理差別是旋光方向。旋光計由起偏鏡、樣品管和檢偏鏡組成，量到的旋光度 α 和樣品管長度、濃度成正比，換算成<b>比旋光度</b>：</p>
<p class="eq">[α] = α ÷ (l × c)　（l 單位 dm，c 單位 g/mL）</p>
<p>比旋光度還和溫度、光的波長（常用鈉 D 線 589 nm）與溶劑有關。拉動下圖的比例，看混合物的旋光度怎麼變：<b>光學純度 = 觀測比旋光度 ÷ 純物質的比旋光度</b>，等於鏡像過量（ee）。</p>
<p><b>為什麼會得到外消旋？</b>非掌性的反應物經過平面的中間體（C=O、C=C、碳陽離子）時，試劑從平面兩側（Re 面與 Si 面）進攻的機率相同，得到等量的 R 與 S。例如 NaBH₄ 還原苯乙酮或 H₂ 加成，產物是外消旋混合物。只有掌性的試劑或酵素會偏向一側。</p>
<p><b>分離（光學離析）</b>：鏡像異構物的沸點、溶解度都一樣，不能直接蒸餾或結晶分離。讓外消旋的酸和一個純的掌性鹼反應，生成兩種<b>非鏡像異構</b>的鹽，它們的溶解度不同，可以結晶分開，再加酸還原回來。非鏡像異構物之間可以用蒸餾、結晶、層析分離。</p>` },

<p>單位換算：1 kg = 10³ g、1 g = 10² cg = 10³ mg = 10⁶ μg = 10⁹ ng。稀薄水溶液中 1 ppm ≈ 1 mg/L，1 ppb ≈ 1 μg/L。</p>` },

<p><b>產率</b> = 實際產量 ÷ 理論產量 × 100%。<b>原子經濟</b> = 想要的產物質量 ÷ 所有反應物質量 × 100%，副產物越少越接近 100%（綠色化學）。混合物的問題（例如 CaCO₃ 與 SiO₂ 的混合物加酸，只有 CaCO₃ 產生 CO₂）也一樣：先找出是哪一個成分在反應。</p>` },

<p>咖啡杯卡計在<b>定壓</b>下測量，量到的熱是 ΔH；彈卡計是<b>定容</b>的密閉容器，量到的是內能變化 ΔE：q = C卡計 × ΔT。兩者相差氣體做的功：ΔH = ΔE + Δn(氣體)·RT。單位：1 cal = 4.184 J；功率 1 W = 1 J/s。</p>` },

<p>理想氣體的內能只和溫度有關，所以等溫過程 ΔE = 0。q、w 和路徑有關；ΔE、ΔH、ΔS、ΔG 只和起點終點有關，稱為<b>狀態函數</b>。ΔE = nCᵥΔT 對所有理想氣體成立，但 Cᵥ = 3/2 R 只適用單原子氣體；Cₚ − Cᵥ = R。</p>` },
    { h: '為什麼反應熱可以相加？', w: ['hess', 'bornhaber'], body: `

<ul><li><b>生成焓</b>：ΔH°反應 = Σ n ΔH°f(產物) − Σ n ΔH°f(反應物)。元素在標準狀態（O₂(g)、N₂(g)、Br₂(l)、C(石墨)…）的 ΔH°f = 0；O₃(g)、C(鑽石) 不是最穩定形式，ΔH°f ≠ 0。</li>

<li><b>鍵能</b>（估算）：ΔH ≈ Σ 斷開的鍵能 − Σ 生成的鍵能。</li></ul>
<p>第二張圖是離子晶體的<b>波恩–哈柏循環</b>：用昇華熱、鍵能、游離能、電子親和力與生成焓反推晶格能。</p>` },

<p>熵 S 量度能量和粒子能以多少種方式分散。拖動分子數：分子越多，「全部擠在一邊」的機率越小，自然變化往排法數多的方向走。ΔS &gt; 0 的常見情況：固 → 液 → 氣、氣體分子數增加、溶解與混合、升溫。少數溶解反而 ΔS &lt; 0：小而高電荷的離子（Ca²⁺、SO₄²⁻）使周圍水分子排列得很有秩序。</p>
<p>計算公式：相變化 ΔS = ΔH/T；理想氣體等溫膨脹 ΔS = nR ln(V₂/V₁)；定壓加熱 ΔS = nCₚ ln(T₂/T₁)。系統放熱時環境的熵增加：ΔS環境 = −ΔH/T。自發過程使宇宙的總熵增加（熱力學第二定律）。</p>` },

<p>由此可以判斷：ΔH &lt; 0、ΔS &gt; 0 任何溫度都自發；ΔH &gt; 0、ΔS &lt; 0 永不自發；兩者同號時，放熱的（如結冰、原子結合成分子）低溫自發，吸熱的（如熔化、蛋白質變性）高溫自發。熔點、沸點正是 ΔG = 0 的溫度：T = ΔH/ΔS。「自發」不代表快，快慢是動力學的問題。</p>` },

<p>任意狀態 ΔG = ΔG° + RT ln Q；Q = K 時 ΔG = 0。兩個反應相加時 ΔG° 相加（K 相乘），不自發的反應可以和強烈自發的反應偶合：例如 ZnS → Zn + S 不自發，但和 S + H₂ → H₂S 相加後總 ΔG 仍可判斷；生物體用 ATP 水解（約 −30.5 kJ/mol）推動合成反應。電化學中 ΔG° = −nFE°。</p>` },

    { h: '兩個原子為什麼會結合成鍵？', w: 'potcurve', body: `
<p>兩個原子靠近時，原子核會吸引對方的電子，位能下降；靠得太近，兩個原子核又互相排斥，位能急遽升高。位能最低的距離就是<b>鍵長</b>，谷底的深度就是<b>鍵能</b>（拆開一莫耳鍵所需的能量）。</p>
<p>拖動距離，並切換不同的鍵比較：鍵越強，谷越深；原子越大，谷底越往右。</p>` },
    { h: '是離子鍵還是共價鍵？', w: ['bondtype', 'lattice'], body: `
<p>兩個原子的<b>電負度</b>差 ΔEN 決定電子怎麼分配：差很小時平均共用（非極性共價鍵），差中等時偏向一方（極性共價鍵，δ+ 與 δ−），差很大時電子幾乎完全轉移（離子鍵）。由電子組態也能推出化學式：1s²2s²2p⁵ 的 F 得一個電子、1s²2s²2p¹ 的 B 給出三個，形成 BF₃（YX₃）。</p>
<p>離子晶體的強度用<b>晶格能</b>表示。第二張圖的橫軸是電荷乘積除以離子間距：電荷越大、離子越小，晶格能越大，熔點也越高（NaF &gt; NaCl &gt; NaBr &gt; NaI；MgO 遠大於 NaCl）。</p>` },

<p>畫路易斯結構：數總價電子數（陰離子加、陽離子減），先用單鍵連起來，剩下的電子補成八隅體，不夠時改成雙鍵或參鍵。第三週期以後的原子（P、S、Cl、Xe…）體積較大，中心原子可以超過八個電子（<b>擴展八隅體</b>），例如 PCl₅、SF₆、XeF₄。</p>
<p>同一個粒子可以畫出好幾種結構時，用<b>形式電荷</b>比較：形式電荷 = 價電子數 − 未共用電子數 − 鍵數。最好的結構形式電荷越接近 0 越好，負的形式電荷放在電負度大的原子上。形式電荷和氧化數不同：氧化數是假設共用電子全部給電負度大的一方，例如 NCO⁻ 中 N 的氧化數是 −3。</p>
<p>原子排列相同、只有電子位置不同的幾個結構稱為<b>共振結構</b>，真實的分子是它們的混成，鍵級取平均（第二張圖）。數鍵的種類：單鍵 = 1 個 σ；雙鍵 = 1 σ + 1 π；參鍵 = 1 σ + 2 π。例如 C₆₀ 的 60 個 C 各接 3 個鍵，共 90 個鍵，即 90 個 σ 鍵（另有 30 個 π 鍵）。</p>` },
    { h: '分子是什麼形狀？', w: 'vsepr', body: `
<p>價殼層電子對互斥理論（VSEPR）：中心原子周圍的電子區域（每個單、雙、參鍵各算一個，每對孤對電子算一個）互相排斥、盡量遠離。先數電子區域決定排列，再看其中幾個是孤對電子決定分子形狀。切換電子區域數與孤對數，卡片會顯示形狀、鍵角、中心原子的混成與極性。</p>
<p>孤對電子只被一個原子核拉住，佔的空間較大：排斥力 孤對–孤對 &gt; 孤對–鍵結 &gt; 鍵結–鍵結，所以鍵角 CH₄ 109.5° &gt; NH₃ 107° &gt; H₂O 104.5°。第三週期以後的氫化物鍵角更小，接近 90°（H₂S 約 92°）。三角雙錐的孤對電子放在赤道位置；八面體的兩對孤對電子放在相對位置。</p>
<p>所有原子都在同一平面的分子：直線形與平面三角形（CO₂、BeCl₂、BF₃、H₂CO、C₂H₄），以及只有三個原子的 OF₂。不共平面：NH₃、CH₄、H₂O₂（兩個 O–H 不在同一平面），以及丙二烯 H₂C=C=CH₂（兩端的 CH₂ 互相垂直）。</p>` },

<p>第二張圖比較幾組常考的沸點。分子要和水形成氫鍵，需要能<b>提供</b>（N–H、O–H、F–H）或<b>接受</b>（N、O、F 上的孤對電子）氫鍵：醚、F⁻、HCOOH 都可以，CH₄ 不行；Na⁺ 和水之間是離子–偶極力。所以小分子的醇、羧酸易溶於水，碳鏈越長溶解度越低（相似相溶）。</p>

/* ---------- 後中化學：互動圖 ----------
   W.名稱(el) 在 el 裡畫出互動圖，回傳 { set(狀態) } 給練習題的「在圖上看」使用。 */
const W = {};
const seg = (id, opts, cur) => `<div class="seg" id="${id}" role="group">${opts.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${t}</button>`).join('')}</div>`;
const bindSeg = (el, id, f) => $$(`#${id} button`, el).forEach(b => { b.onclick = () => f(b.dataset.v); });
const pressSeg = (el, id, v) => $$(`#${id} button`, el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
const card = (k, lab, val, sub = '') => `<div class="card" data-k="${k}"><span>${lab}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
let UID = 0;

/* ===== 1. 滴定：燒杯（粒子）＋滴定曲線 ===== */
W.titration = (el, opt = {}) => {
  const id = 't' + (++UID), st = { acid: 'weak', v: 0, ind: opt.ind || 'none' }, Va = 25, Ca0 = 0.1, Cb = 0.1;
  el.innerHTML = `<div class="w-row">${seg(id + 'a', [['weak', '醋酸（弱酸）'], ['strong', '鹽酸（強酸）']], st.acid)}<label class="sel">指示劑 <select id="${id}i">${Object.entries(IND).map(([k, d]) => `<option value="${k}"${k === st.ind ? ' selected' : ''}>${d.name}${d.txt ? `（${d.lo}–${d.hi}，${d.txt}）` : ''}</option>`).join('')}</select></label></div>
<div class="tgrid"><div class="beaker" id="${id}b"></div><div class="tcurve" id="${id}c"></div></div>
<div class="w-row"><label class="rng">加入 NaOH <input type="range" id="${id}v" min="0" max="50" step="0.1" value="0"><output id="${id}o" class="mono"></output></label></div>
<div class="w-row">${[[-1, '−1 mL'], [-0.1, '−0.1'], [0.1, '+0.1'], [1, '+1 mL']].map(([d, t]) => `<button class="btn sm" type="button" data-d="${d}">${t}</button>`).join('')}<span class="sp"></span>${[[0, '起點'], [12.5, '半當量點'], [25, '當量點'], [30, '鹼過量']].map(([v, t]) => `<button class="btn sm ghost" type="button" data-j="${v}">${t}</button>`).join('')}</div>
<div class="cards" id="${id}k"></div><p class="note" id="${id}n" aria-live="polite"></p>`;
  const curve = strong => { const xs = []; for (let v = 0; v <= 50.001; v += (Math.abs(v - 25) < 1.2 ? 0.02 : 0.25)) xs.push(v); return xs.map(v => [v, titr({ Va, Ca0, Cb, Vb: v, strong, pKa: ACID[strong ? 'strong' : 'weak'].pKa }).pH]); };
  const CUR = { weak: curve(false), strong: curve(true) };
  function beaker(r) {
    const W0 = 250, H0 = 270, x0 = 30, x1 = 180, yb = 250, top = 70, lv = yb - (r.V / 80) * (yb - top) - 4;
    const strong = st.acid === 'strong', icons = [];
    const push = (n, cls, t) => { for (let i = 0; i < Math.round(n / 0.1); i++) icons.push([cls, t]); };
    if (strong) push(r.nH, 'ih', 'H⁺'); else push(r.nHA, 'iha', 'HA');
    if (!strong) push(r.nA, 'ia', 'A⁻');
    if (r.nOH > 0.05) push(r.nOH, 'ioh', 'OH⁻');
    const cols = 8, cw = (x1 - x0 - 12) / cols, rowH = 15;
    const g = icons.slice(0, 64).map(([c, t], i) => { const cx = x0 + 6 + cw * (i % cols + 0.5), cy = yb - 10 - rowH * Math.floor(i / cols); return `<g class="${c}"><circle cx="${cx}" cy="${cy}" r="7"/><text x="${cx}" y="${cy + 3}" text-anchor="middle">${t}</text></g>`; }).join('');
    const drops = st.v > 0 ? `<line class="burette" x1="115" y1="6" x2="115" y2="40"/><circle class="drop" cx="115" cy="52" r="3"/>` : `<line class="burette" x1="115" y1="6" x2="115" y2="40"/>`;
    return `<svg viewBox="0 0 ${W0} ${H0}" class="bk" role="img" aria-label="燒杯中的粒子">${drops}<path class="liq" d="M${x0 + 2} ${lv}L${x1 - 2} ${lv}L${x1 - 2} ${yb - 2}L${x0 + 2} ${yb - 2}Z" style="fill:${indColor(st.ind, r.pH)}"/><path class="glass" d="M${x0} ${top - 10}L${x0} ${yb}L${x1} ${yb}L${x1} ${top - 10}"/>${g}<text class="phm" x="${x1 + 4}" y="${top + 4}">pH</text><text class="phv" x="${x1 + 4}" y="${top + 26}">${fx(r.pH)}</text><text class="tk" x="${(x0 + x1) / 2}" y="${H0 - 4}" text-anchor="middle">${strong ? '每個圓 = 0.1 mmol（Na⁺、Cl⁻ 不畫）' : '每個圓 = 0.1 mmol（Na⁺ 不畫）'}</text></svg>`;
  }
  function narrate(r) {
    const strong = st.acid === 'strong', v = st.v, nOH = Cb * v, n0 = Ca0 * Va, eq = Math.abs(v - 25) < 0.05;
    if (strong) {
      if (v === 0) return `HCl 是強酸，在水中<b>完全解離</b>：[H⁺] = 0.100 M，pH = 1.00。燒杯裡的「酸」就是 2.50 mmol 的 H⁺。`;
      if (eq) return `加入的 OH⁻ 剛好中和所有 H⁺。燒杯裡只剩 Na⁺、Cl⁻ 和水，兩者都不和水反應，所以 <b>pH = 7.00</b>。`;
      if (v < 25) return `加入 ${fx(nOH, 2)} mmol OH⁻，中和等量的 H⁺，剩 ${fx(n0 - nOH, 2)} mmol H⁺ 在 ${fx(r.V, 1)} mL 中 → [H⁺] = ${sci((n0 - nOH) / r.V)} M，pH = ${fx(r.pH)}。沒有弱酸可以「接住」變化，所以沒有緩衝區。`;
      return `H⁺ 已中和完，多出 ${fx(nOH - n0, 2)} mmol OH⁻，pH 由過量的強鹼決定：${fx(r.pH)}。`;
    }
    if (v === 0) return `還沒加鹼。燒杯裡幾乎都是 HA，只有約 ${fx(100 * r.nH / n0, 1)}% 解離：[H⁺] ≈ √(Ka·C) → pH = ${fx(r.pH)}。只有一點點 A⁻，所以剛開始加鹼時比例變化很大，pH 爬得快。`;
    if (Math.abs(v - 12.5) < 0.05) return `<b>半當量點</b>：一半的 HA 變成 A⁻，HA = A⁻ = ${fx(r.nA, 2)} mmol。比例 1：1，所以 <b>pH = pKa = ${fx(r.pH)}</b>。這也是緩衝能力最強的位置。`;
    if (eq) return `<b>當量點</b>：HA 全部變成 A⁻（${fx(r.nA, 2)} mmol）。A⁻ 是弱鹼，A⁻ + H₂O ⇌ HA + OH⁻，所以溶液偏鹼，<b>pH = ${fx(r.pH)}</b>，不是 7。`;
    if (v < 23.5) return `加入 ${fx(nOH, 2)} mmol OH⁻ → 生成 ${fx(nOH, 2)} mmol A⁻，剩 ${fx(n0 - nOH, 2)} mmol HA。HA 和 A⁻ 都很多，是<b>緩衝溶液</b>：pH ≈ pKa + log(${fx(nOH, 2)} ÷ ${fx(n0 - nOH, 2)}) = ${fx(r.pH)}。`;
    if (v < 25) return `只剩 ${fx(n0 - nOH, 2)} mmol HA 了。HA 越少，每一滴鹼讓 A⁻/HA 比例改變得越劇烈，pH 開始<b>暴衝</b>。`;
    return `HA 已用完，多出 ${fx(nOH - n0, 2)} mmol OH⁻。過量強鹼產生的 OH⁻ 遠多於 A⁻ 水解產生的，pH 由過量 OH⁻ 決定：${fx(r.pH)}。這之後的曲線和強酸完全重合。`;
  }
  function draw() {
    const strong = st.acid === 'strong', r = titr({ Va, Ca0, Cb, Vb: st.v, strong, pKa: ACID[st.acid].pKa }), d = IND[st.ind];
    $('#' + id + 'b', el).innerHTML = beaker(r);
    $('#' + id + 'c', el).innerHTML = chart({ x: [0, 50], y: [0, 14], xt: [0, 10, 20, 25, 30, 40, 50], yt: [0, 2, 4, 6, 7, 8, 10, 12, 14], xlab: '加入 NaOH（mL）', ylab: 'pH', h: 290, label: '滴定曲線' }, (X, Y) =>
      (d.lo ? `<rect class="indband" x="${X(0)}" y="${Y(d.hi)}" width="${X(50) - X(0)}" height="${Y(d.lo) - Y(d.hi)}" style="fill:${indColor(st.ind, (d.lo + d.hi) / 2)}"/><text class="tk" x="${X(49)}" y="${Y(d.hi) - 4}" text-anchor="end">${d.name}變色範圍</text>` : '') +
      (strong ? '' : `<rect class="buf" data-k="buf" x="${X(25 / 11)}" y="${Y(14)}" width="${X(250 / 11) - X(25 / 11)}" height="${Y(0) - Y(14)}"/><text class="tk" x="${X(12.5)}" y="${Y(13)}" text-anchor="middle">緩衝區（pKa ± 1）</text><line class="mk" x1="${X(12.5)}" x2="${X(12.5)}" y1="${Y(0)}" y2="${Y(4.74)}"/><line class="mk" x1="${X(0)}" x2="${X(12.5)}" y1="${Y(4.74)}" y2="${Y(4.74)}"/><text class="tk" x="${X(13)}" y="${Y(4.74) + 14}">半當量點 pH = pKa</text>`) +
      `<line class="mk" x1="${X(25)}" x2="${X(25)}" y1="${Y(0)}" y2="${Y(14)}"/><text class="tk" x="${X(25.6)}" y="${Y(1)}">當量點</text>` +
      `<path class="tline" d="${path(CUR[st.acid].map(([v, p]) => [X(v), Y(p)]))}"/>${strong ? '' : `<path class="tline2" d="${path(CUR.strong.map(([v, p]) => [X(v), Y(p)]))}"/>`}<circle class="dot" cx="${X(st.v)}" cy="${Y(r.pH)}" r="7"/>`);
    $('#' + id + 'o', el).textContent = `${fx(st.v, 1)} mL`;
    $('#' + id + 'v', el).value = st.v;
    $('#' + id + 'k', el).innerHTML = card('ph', 'pH', fx(r.pH)) + (strong ? card('h', 'H⁺', `${fx(r.nH, 2)} mmol`) : card('ha', 'HA', `${fx(r.nHA, 2)} mmol`) + card('a', 'A⁻', `${fx(r.nA, 2)} mmol`)) + card('oh', '過量 OH⁻', `${fx(Math.max(0, Cb * st.v - Ca0 * Va), 2)} mmol`) + card('vt', '總體積', `${fx(r.V, 1)} mL`);
    $('#' + id + 'n', el).innerHTML = narrate(r) + (d.lo ? ` 此時${d.name}呈 <span class="sw" style="background:${indColor(st.ind, r.pH)}"></span>${r.pH < d.lo ? '酸色' : r.pH > d.hi ? '鹼色' : '過渡色'}。` : '');
    pressSeg(el, id + 'a', st.acid);
  }
  const setV = v => { st.v = Math.round(clamp(v, 0, 50) * 10) / 10; draw(); };
  bindSeg(el, id + 'a', v => { st.acid = v; draw(); });
  $('#' + id + 'v', el).oninput = e => setV(+e.target.value);
  $('#' + id + 'i', el).onchange = e => { st.ind = e.target.value; draw(); };
  $$('[data-d]', el).forEach(b => { b.onclick = () => setV(st.v + +b.dataset.d); });
  $$('[data-j]', el).forEach(b => { b.onclick = () => setV(+b.dataset.j); });
  draw();
  return { set(s) { Object.assign(st, s); if (s.ind) $('#' + id + 'i', el).value = s.ind; draw(); } };
};
W.indicator = el => W.titration(el, { ind: 'pp' });

/* ===== 2. 緩衝溶液 vs 純水 ===== */
W.buffer = el => {
  const st = { C: 0.1, net: 0 }, V = 100, step = 1;
  el.innerHTML = `<div class="w-row"><button class="btn sm" type="button" data-a="H">＋ 1 mmol HCl</button><button class="btn sm" type="button" data-a="OH">＋ 1 mmol NaOH</button><button class="btn sm ghost" type="button" data-a="0">⟲ 重來</button></div>
<div class="w-row"><label class="rng">緩衝溶液濃度（HA 與 A⁻ 各）<input type="range" id="bc" min="0.01" max="0.3" step="0.01" value="0.1"><output class="mono" id="bco"></output></label></div>
<div class="bgrid"><div id="bcards" class="cards"></div><div id="bbars"></div></div><div id="bch"></div><p class="note" id="bn" aria-live="polite"></p>`;
  const calc = net => ({ b: buffer({ C: st.C, V, addH: Math.max(0, net), addOH: Math.max(0, -net) }), w: water({ V, addH: Math.max(0, net), addOH: Math.max(0, -net) }) });
  function draw() {
    const r = calc(st.net), r0 = calc(0), cap = st.C * V;
    $('#bco', el).textContent = `${fx(st.C, 2)} M（各 ${fx(cap, 1)} mmol）`;
    const added = st.net === 0 ? '還沒加任何東西' : st.net > 0 ? `已加入 ${st.net} mmol HCl` : `已加入 ${-st.net} mmol NaOH`;
    $('#bcards', el).innerHTML = `<p class="small mut" style="width:100%;margin:0">${added}（100 mL）</p>` + card('bw', '純水 pH', fx(r.w.pH), `變化 ${(r.w.pH - r0.w.pH >= 0 ? '+' : '')}${fx(r.w.pH - r0.w.pH)}`) + card('bb', '緩衝溶液 pH', fx(r.b.pH), `變化 ${(r.b.pH - r0.b.pH >= 0 ? '+' : '')}${fx(r.b.pH - r0.b.pH)}`);
    const mx = 2 * cap;
    $('#bbars', el).innerHTML = `<div class="bars"><div><span>HA</span><i style="width:${100 * r.b.nHA / mx}%" class="bha"></i><b class="mono">${fx(r.b.nHA, 2)}</b></div><div><span>A⁻</span><i style="width:${100 * r.b.nA / mx}%" class="ba"></i><b class="mono">${fx(r.b.nA, 2)}</b></div></div><p class="small mut">緩衝溶液中 HA 與 A⁻ 的量（mmol）</p>`;
    const lim = 15, xs = Array.from({ length: 121 }, (_, i) => -lim + i * 2 * lim / 120);
    $('#bch', el).innerHTML = chart({ x: [-lim, lim], y: [0, 14], xt: [-15, -10, -5, 0, 5, 10, 15], yt: [0, 2, 4, 6, 7, 8, 10, 12, 14], xlab: '← 加入 NaOH（mmol）　　　加入 HCl（mmol）→', ylab: 'pH', h: 250, label: '加酸加鹼後的 pH' }, (X, Y) =>

      `<path class="sha" d="${path(xs.map(x => [X(x), Y(1 - 1 / (1 + 10 ** (pKa - x)))]))}"/><path class="sa" d="${path(xs.map(x => [X(x), Y(1 / (1 + 10 ** (pKa - x)))]))}"/>` +
      `<line class="mk" x1="${X(pKa)}" x2="${X(pKa)}" y1="${Y(0)}" y2="${Y(0.5)}"/><text class="tk" x="${X(pKa) + 4}" y="${Y(0.04)}">pKa</text>` +
      `<line class="cur" x1="${X(pH)}" x2="${X(pH)}" y1="${Y(0)}" y2="${Y(1)}"/><circle class="dot" cx="${X(pH)}" cy="${Y(fA)}" r="6"/><circle class="dot2" cx="${X(pH)}" cy="${Y(1 - fA)}" r="6"/>` +
      `<text class="tk lha" x="${X(0.3)}" y="${Y(0.93)}">HA</text><text class="tk la" x="${X(13.7)}" y="${Y(0.93)}" text-anchor="end">A⁻</text>`);
    const nA = Math.round(100 * fA);

    const ratio = 10 ** (pH - pKa);

/* ===== 4. 滴定曲線關鍵點的計算 ===== */
W.calc = el => {
  const Va = 25, C0 = 0.1, Cb = 0.1, pKa = 4.74, Ka = 10 ** -pKa, n0 = C0 * Va;
  const PTS = [['0', 0, '起點'], ['10', 10, '緩衝區（10.0 mL）'], ['12.5', 12.5, '半當量點'], ['25', 25, '當量點'], ['30', 30, '鹼過量（30.0 mL）']];
  let cur = '0';
  el.innerHTML = `${seg('cp', PTS.map(p => [p[0], p[2]]), cur)}<div class="calc" id="cbox"></div><div id="cmini"></div>`;
  function steps(v) {
    const nOH = Cb * v, V = Va + v, ex = titr({ Va, Ca0: C0, Cb, Vb: v, pKa });
    let main, s = [], approx;
    if (v === 0) {
      main = '只有弱酸 HA（還沒加鹼）';
      const h = Math.sqrt(Ka * C0); approx = -Math.log10(h);
      s = [`Ka = 10<sup>−${pKa}</sup> = ${sci(Ka)}`, `HA 只解離一小部分：[H⁺] ≈ √(Ka × C) = √(${sci(Ka)} × ${fx(C0, 3)})`, `= ${sci(h)} M`, `pH = −log(${sci(h)}) = <b>${fx(approx)}</b>`];
    } else if (v < 25) {
      main = 'HA 和 A⁻ 並存 → 緩衝溶液';
      const nA = nOH, nHA = n0 - nOH; approx = pKa + Math.log10(nA / nHA);
      s = [`加入 OH⁻：${fx(Cb, 3)} M × ${fx(v, 1)} mL = ${fx(nOH, 2)} mmol`, `HA + OH⁻ → A⁻ + H₂O（完全反應）`, `剩 HA = ${fx(n0, 2)} − ${fx(nOH, 2)} = ${fx(nHA, 2)} mmol；生成 A⁻ = ${fx(nA, 2)} mmol`, `pH = pKa + log(A⁻ ÷ HA) = ${pKa} + log(${fx(nA, 2)} ÷ ${fx(nHA, 2)})`, `= ${pKa} + (${fx(Math.log10(nA / nHA))}) = <b>${fx(approx)}</b>`];
      if (v === 12.5) s.push('A⁻ = HA，log 1 = 0，所以 pH 正好等於 pKa。');
    } else if (v === 25) {
      main = '只剩共軛鹼 A⁻ → 弱鹼水解';
      const C = n0 / V, Kb = 1e-14 / Ka, oh = Math.sqrt(Kb * C); approx = 14 + Math.log10(oh);
      s = [`HA 全部變成 A⁻：${fx(n0, 2)} mmol，總體積 ${fx(V, 1)} mL → [A⁻] = ${fx(C, 4)} M`, `A⁻ + H₂O ⇌ HA + OH⁻，Kb = Kw ÷ Ka = 10⁻¹⁴ ÷ ${sci(Ka)} = ${sci(Kb)}`, `[OH⁻] ≈ √(Kb × C) = √(${sci(Kb)} × ${fx(C, 4)}) = ${sci(oh)} M`, `pOH = ${fx(-Math.log10(oh))}，pH = 14 − pOH = <b>${fx(approx)}</b>`];
    } else {
      main = 'OH⁻ 過量 → 由強鹼決定';
      const exOH = nOH - n0, c = exOH / V; approx = 14 + Math.log10(c);
      s = [`加入 OH⁻ ${fx(nOH, 2)} mmol，中和 HA ${fx(n0, 2)} mmol 後多出 ${fx(exOH, 2)} mmol`, `[OH⁻] = ${fx(exOH, 2)} ÷ ${fx(V, 1)} mL = ${sci(c)} M（A⁻ 水解的貢獻小到可以忽略）`, `pOH = ${fx(-Math.log10(c))}，pH = 14 − pOH = <b>${fx(approx)}</b>`];
    }
    return { main, s, approx, exact: ex.pH, v };
  }
  function draw() {
    const v = +cur, r = steps(v);
    $('#cbox', el).innerHTML = `<p class="cq">① 燒杯裡主要是什麼？　<b>${r.main}</b></p><p class="cq">② 計算</p><ol class="cs">${r.s.map(x => `<li>${x}</li>`).join('')}</ol><p class="cq">③ 對照精確解（解電荷平衡）：pH = ${fx(r.exact)}　${Math.abs(r.exact - r.approx) < 0.03 ? '<span class="ok">✓ 近似成立</span>' : `<span class="warn">差 ${fx(Math.abs(r.exact - r.approx))}</span>`}</p>`;
    const pts = []; for (let x = 0; x <= 40.001; x += Math.abs(x - 25) < 1 ? 0.05 : 0.25) pts.push([x, titr({ Va, Ca0: C0, Cb, Vb: x, pKa }).pH]);
    $('#cmini', el).innerHTML = chart({ x: [0, 40], y: [0, 14], xt: [0, 10, 12.5, 25, 30, 40], yt: [0, 7, 14], xlab: '加入 NaOH（mL）', ylab: 'pH', h: 170, w: 560 }, (X, Y) => `<path class="tline" d="${path(pts.map(([a, b]) => [X(a), Y(b)]))}"/>${PTS.map(p => `<circle class="${p[0] === cur ? 'dot' : 'dot3'}" cx="${X(p[1])}" cy="${Y(titr({ Va, Ca0: C0, Cb, Vb: p[1], pKa }).pH)}" r="${p[0] === cur ? 7 : 4}"/>`).join('')}`);
    pressSeg(el, 'cp', cur);
  }
  bindSeg(el, 'cp', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = String(s.v ?? 0); draw(); } };
};

    const T = { atoms: { O: { x: -2.05, y: 0, t: 'HO', c: 'δ−', lp: [90, 270] }, C: { x: 0, y: 0, t: 'C' }, Br: { x: 2.1, y: 0, t: 'Br', c: 'δ−', lp: [0, 90, 270] }, ...subAtoms(lb, SLOT.T) },

/* ===== 7. SN1 機構（可選擇進攻方向）＋碳陽離子穩定度 ===== */

      arrows: [{ f: { lp: ['O2', side === 'L' ? -31 : -149] }, t: { a: 'Ha' }, bend: side === 'L' ? -0.3 : 0.3 }, { f: { b: ['O', 'Ha'] }, t: { a: 'O' }, bend: side === 'L' ? 0.6 : -0.6 }] };

      notes: [{ x: 0, y: -2.1, t: side === 'L' ? '構型反轉的產物' : '構型保留的產物' }] };
    return [
      { sc: F0, at: 0, cap: '<b>第一步（慢）</b>：C–Br 鍵自己斷開，兩個電子都跟著 Br 走。這一步只有鹵烷參與，決定整個反應的速率：rate = k[RX]。' },
      { sc: F1, at: 0.45, cap: '生成<b>碳陽離子</b>：中心碳只剩三個基團，攤成平面（sp²）。空的 p 軌域兩瓣朝左右，兩邊都可以接受電子。' },
      { sc: F2, at: 0.45, cap: `<b>第二步（快）</b>：水的孤對電子攻擊帶正電的碳，這次從${side === 'L' ? '左' : '右'}邊。切換上面的按鈕可以改從另一邊。` },
